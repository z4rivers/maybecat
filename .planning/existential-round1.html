// State
let decisions = {};
let activeIndex = 0;
let firstDecisionMade = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch (e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

function getKey(item) {
  return 'L' + item.line;
}

function renderCards() {
  const container = document.getElementById('card-container');
  container.innerHTML = '';
  DATA.forEach((item, i) => {
    const key = getKey(item);
    const decision = decisions[key];
    const decClass = decision ? 'decided-' + decision.action : '';
    const isActive = i === activeIndex ? 'active' : '';
    const badgeText = decision ? (decision.action === 'edit' ? 'EDIT' : decision.action.toUpperCase()) : '';

    const card = document.createElement('div');
    card.className = `card ${decClass} ${isActive}`;
    card.id = 'card-' + i;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-index">#${i + 1} of ${DATA.length}</span>
        <span class="decision-badge">${badgeText}</span>
        <span class="card-line">line ${item.line}</span>
      </div>
      <div class="response-text">${escapeHtml(decision && decision.action === 'edit' && decision.edited ? decision.edited : item.original)}</div>
      <div class="btn-row">
        <button class="btn btn-keep ${decision && decision.action === 'keep' ? 'active' : ''}" onclick="decide(${i}, 'keep')">Keep</button>
        <button class="btn btn-edit ${decision && decision.action === 'edit' ? 'active' : ''}" onclick="toggleEdit(${i})">Edit</button>
        <button class="btn btn-cut ${decision && decision.action === 'cut' ? 'active' : ''}" onclick="decide(${i}, 'cut')">Cut</button>
      </div>
      <div class="edit-area" id="edit-area-${i}" ${decision && decision.action === 'edit' ? 'style="display:block"' : ''}>
        <textarea id="edit-text-${i}">${escapeHtml(decision && decision.edited ? decision.edited : item.original)}</textarea>
        <button class="edit-save" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function decide(index, action) {
  const item = DATA[index];
  const key = getKey(item);
  const isFirstDecision = !firstDecisionMade[index];

  if (action === 'keep') {
    decisions[key] = { action: 'keep' };
  } else if (action === 'cut') {
    decisions[key] = { action: 'cut' };
  }

  saveState();
  renderCards();
  updateStats();

  // Auto-advance on first decision only
  if (isFirstDecision && index < DATA.length - 1) {
    firstDecisionMade[index] = true;
    activeIndex = index + 1;
    scrollToActive();
    renderCards();
  }
}

function toggleEdit(index) {
  const editArea = document.getElementById('edit-area-' + index);
  if (editArea) {
    editArea.style.display = editArea.style.display === 'block' ? 'none' : 'block';
    if (editArea.style.display === 'block') {
      const textarea = document.getElementById('edit-text-' + index);
      textarea.focus();
    }
  }
}

function saveEdit(index) {
  const item = DATA[index];
  const key = getKey(item);
  const textarea = document.getElementById('edit-text-' + index);
  const editedText = textarea.value.trim();
  const isFirstDecision = !firstDecisionMade[index];

  decisions[key] = { action: 'edit', edited: editedText };
  saveState();
  renderCards();
  updateStats();

  if (isFirstDecision && index < DATA.length - 1) {
    firstDecisionMade[index] = true;
    activeIndex = index + 1;
    scrollToActive();
    renderCards();
  }
}

function undo(index) {
  const item = DATA[index];
  const key = getKey(item);
  delete decisions[key];
  delete firstDecisionMade[index];
  saveState();
  renderCards();
  updateStats();
}

function scrollToActive() {
  const card = document.getElementById('card-' + activeIndex);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function updateStats() {
  let keeps = 0, edits = 0, cuts = 0;
  DATA.forEach(item => {
    const key = getKey(item);
    const d = decisions[key];
    if (d) {
      if (d.action === 'keep') keeps++;
      else if (d.action === 'edit') edits++;
      else if (d.action === 'cut') cuts++;
    }
  });
  const total = DATA.length;
  const remaining = total - keeps - edits - cuts;
  const decided = keeps + edits + cuts;

  document.getElementById('stat-total').textContent = total + ' total';
  document.getElementById('stat-keep').textContent = keeps + ' keep';
  document.getElementById('stat-edit').textContent = edits + ' edit';
  document.getElementById('stat-cut').textContent = cuts + ' cut';
  document.getElementById('stat-remaining').textContent = remaining + ' remaining';

  const bar = document.getElementById('progress-bar');
  if (decided === 0) {
    bar.innerHTML = '';
  } else {
    bar.innerHTML = `
      <div class="progress-keep" style="width:${(keeps/total)*100}%"></div>
      <div class="progress-edit" style="width:${(edits/total)*100}%"></div>
      <div class="progress-cut" style="width:${(cuts/total)*100}%"></div>
    `;
  }
}

function exportChanges() {
  const changes = [];
  DATA.forEach(item => {
    const key = getKey(item);
    const d = decisions[key];
    if (!d || d.action === 'keep') return; // skip kept items
    if (d.action === 'cut') {
      changes.push({ action: 'cut', line: item.line, original: item.original });
    } else if (d.action === 'edit') {
      changes.push({ action: 'edit', line: item.line, original: item.original, edited: d.edited, entry: { text: d.edited, category: 'existential' } });
    }
  });

  const output = document.getElementById('export-output');
  output.style.display = 'block';
  output.textContent = JSON.stringify(changes, null, 2);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  // Don't interfere with textarea
  if (e.target.tagName === 'TEXTAREA') return;

  switch (e.key.toLowerCase()) {
    case 'j':
      if (activeIndex < DATA.length - 1) {
        activeIndex++;
        scrollToActive();
        renderCards();
      }
      break;
    case 'k':
      if (activeIndex > 0) {
        activeIndex--;
        scrollToActive();
        renderCards();
      }
      break;
    case 'o':
      decide(activeIndex, 'keep');
      break;
    case 'e':
      toggleEdit(activeIndex);
      renderCards();
      break;
    case 'x':
      decide(activeIndex, 'cut');
      break;
    case 'u':
      undo(activeIndex);
      break;
  }
});

// Init
loadState();
renderCards();
updateStats();
</script>
</body>
</html>
