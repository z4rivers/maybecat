// State
let decisions = {};
let activeIndex = 0;
let firstDecisionMade = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

function getDecision(idx) {
  return decisions[idx] || null;
}

function setDecision(idx, type, editedText) {
  decisions[idx] = { type, editedText: editedText || null, original: items[idx].original, line: items[idx].line };
  saveState();
  renderCard(idx);
  updateStats();
  updateExport();

  // Auto-advance on first decision only
  if (!firstDecisionMade[idx]) {
    firstDecisionMade[idx] = true;
    if (idx < items.length - 1) {
      setTimeout(() => setActive(idx + 1), 150);
    }
  }
}

function undoDecision(idx) {
  delete decisions[idx];
  firstDecisionMade[idx] = false;
  saveState();
  renderCard(idx);
  updateStats();
  updateExport();
}

function setActive(idx) {
  if (idx < 0 || idx >= items.length) return;
  const prev = document.querySelector('.card.active');
  if (prev) prev.classList.remove('active');
  activeIndex = idx;
  const card = document.getElementById('card-' + idx);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function jumpNext() {
  setActive(Math.min(activeIndex + 1, items.length - 1));
}

function jumpPrev() {
  setActive(Math.max(activeIndex - 1, 0));
}

function renderCard(idx) {
  const card = document.getElementById('card-' + idx);
  if (!card) return;
  const item = items[idx];
  const dec = getDecision(idx);

  let decClass = '';
  let badgeHTML = '';
  if (dec) {
    decClass = 'decided-' + dec.type;
    const badgeCls = 'badge-' + dec.type;
    const label = dec.type === 'edit' ? 'EDITED' : dec.type.toUpperCase();
    badgeHTML = '<span class="decision-badge ' + badgeCls + '">' + label + '</span> ';
  }

  card.className = 'card' + (idx === activeIndex ? ' active' : '') + (decClass ? ' ' + decClass : '');

  const displayText = (dec && dec.type === 'edit' && dec.editedText) ? dec.editedText : item.original;

  card.innerHTML = `
    <div class="card-meta">#${idx + 1} of ${items.length} &mdash; Line ${item.line}</div>
    ${badgeHTML}
    <div class="response-text">"${escapeHTML(displayText)}"</div>
    <div class="btn-row">
      <button class="btn btn-keep" onclick="setDecision(${idx}, 'keep')">Keep (O)</button>
      <button class="btn btn-edit" onclick="toggleEdit(${idx})">Edit (E)</button>
      <button class="btn btn-cut" onclick="setDecision(${idx}, 'cut')">Cut (X)</button>
      ${dec ? '<button class="btn btn-undo" onclick="undoDecision(' + idx + ')">Undo (U)</button>' : ''}
    </div>
    <div class="edit-area" id="edit-area-${idx}">
      <textarea class="edit-textarea" id="edit-text-${idx}">${escapeHTML(item.original)}</textarea>
      <button class="edit-save" onclick="saveEdit(${idx})">Save Edit</button>
      <button class="edit-cancel" onclick="cancelEdit(${idx})">Cancel</button>
    </div>
  `;
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleEdit(idx) {
  setActive(idx);
  const area = document.getElementById('edit-area-' + idx);
  if (!area) return;
  const isVisible = area.classList.contains('visible');
  // Close all others
  document.querySelectorAll('.edit-area.visible').forEach(el => el.classList.remove('visible'));
  if (!isVisible) {
    area.classList.add('visible');
    const ta = document.getElementById('edit-text-' + idx);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

function cancelEdit(idx) {
  const area = document.getElementById('edit-area-' + idx);
  if (area) area.classList.remove('visible');
}

function saveEdit(idx) {
  const ta = document.getElementById('edit-text-' + idx);
  if (!ta) return;
  const text = ta.value.trim();
  if (text && text !== items[idx].original) {
    setDecision(idx, 'edit', text);
  }
  cancelEdit(idx);
}

function updateStats() {
  let keep = 0, edit = 0, cut = 0;
  for (const k in decisions) {
    if (decisions[k].type === 'keep') keep++;
    else if (decisions[k].type === 'edit') edit++;
    else if (decisions[k].type === 'cut') cut++;
  }
  const remaining = items.length - keep - edit - cut;
  document.getElementById('statKeep').textContent = 'Keep: ' + keep;
  document.getElementById('statEdit').textContent = 'Edit: ' + edit;
  document.getElementById('statCut').textContent = 'Cut: ' + cut;
  document.getElementById('statRemaining').textContent = 'Remaining: ' + remaining;
  const pct = ((keep + edit + cut) / items.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateExport() {
  const changes = [];
  for (let i = 0; i < items.length; i++) {
    const dec = decisions[i];
    if (!dec) continue;
    if (dec.type === 'keep') continue; // skip kept items
    if (dec.type === 'cut') {
      changes.push({ action: 'cut', line: items[i].line, original: items[i].original });
    } else if (dec.type === 'edit') {
      changes.push({ action: 'edit', line: items[i].line, original: items[i].original, edited: dec.editedText });
    }
  }
  document.getElementById('exportBlock').textContent = JSON.stringify(changes, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportBlock').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  // Don't capture if in textarea
  if (e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') {
      cancelEdit(activeIndex);
      e.preventDefault();
    }
    return;
  }

  switch(e.key.toLowerCase()) {
    case 'j': jumpNext(); e.preventDefault(); break;
    case 'k': jumpPrev(); e.preventDefault(); break;
    case 'o': setDecision(activeIndex, 'keep'); e.preventDefault(); break;
    case 'e': toggleEdit(activeIndex); e.preventDefault(); break;
    case 'x': setDecision(activeIndex, 'cut'); e.preventDefault(); break;
    case 'u': undoDecision(activeIndex); e.preventDefault(); break;
  }
});

// Click to set active
document.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) {
    const idx = parseInt(card.id.replace('card-', ''));
    if (!isNaN(idx) && idx !== activeIndex) {
      setActive(idx);
    }
  }
});

// Init
function init() {
  loadState();
  const container = document.getElementById('cardsContainer');
  for (let i = 0; i < items.length; i++) {
    const div = document.createElement('div');
    div.id = 'card-' + i;
    div.className = 'card' + (i === 0 ? ' active' : '');
    container.appendChild(div);
    renderCard(i);
  }
  updateStats();
  updateExport();
  // Restore active from first undecided
  for (let i = 0; i < items.length; i++) {
    if (!decisions[i]) { setActive(i); break; }
  }
}

init();
</script>
