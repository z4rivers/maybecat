<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wise Round 6 Review — 88 items</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    padding-bottom: 120px;
  }

  /* Sticky Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #16162a;
    border-bottom: 1px solid #2a2a4a;
    padding: 16px 24px;
    backdrop-filter: blur(10px);
  }

  .header h1 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .header h1 span {
    color: #a855f7;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-total { background: #888; }
  .dot-kept { background: #4ecca3; }
  .dot-alt { background: #a855f7; }
  .dot-edited { background: #ffd93d; }
  .dot-cut { background: #e94560; }
  .dot-remaining { background: #555; }

  .stat-num {
    font-weight: 700;
    color: #fff;
    font-size: 1rem;
  }

  .progress-bar-container {
    width: 100%;
    height: 6px;
    background: #2a2a4a;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4ecca3, #a855f7);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .shortcuts-hint {
    font-size: 0.72rem;
    color: #666;
    margin-top: 6px;
  }

  .shortcuts-hint kbd {
    background: #2a2a4a;
    border: 1px solid #3a3a5a;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: monospace;
    color: #aaa;
    font-size: 0.7rem;
  }

  /* Cards */
  .items-container {
    max-width: 960px;
    margin: 24px auto;
    padding: 0 20px;
  }

  .item-card {
    background: #1e1e36;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    margin-bottom: 16px;
    padding: 20px 24px;
    transition: border-color 0.2s, box-shadow 0.2s;
    scroll-margin-top: 180px;
  }

  .item-card.focused {
    border-color: #a855f7;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
  }

  .item-card.decided-kept { border-left: 4px solid #4ecca3; opacity: 0.7; }
  .item-card.decided-alt { border-left: 4px solid #a855f7; opacity: 0.7; }
  .item-card.decided-edited { border-left: 4px solid #ffd93d; opacity: 0.7; }
  .item-card.decided-cut { border-left: 4px solid #e94560; opacity: 0.55; }
  .item-card.focused.decided-kept,
  .item-card.focused.decided-alt,
  .item-card.focused.decided-edited,
  .item-card.focused.decided-cut { opacity: 1; }

  .item-line {
    font-size: 0.72rem;
    color: #666;
    font-family: monospace;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .item-line .badge {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-kept { background: rgba(78, 204, 163, 0.2); color: #4ecca3; }
  .badge-alt { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
  .badge-edited { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
  .badge-cut { background: rgba(233, 69, 96, 0.2); color: #e94560; }

  .voice-badge {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    background: rgba(168, 85, 247, 0.12);
    color: #c084fc;
    letter-spacing: 0.3px;
  }

  .comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 16px;
  }

  @media (max-width: 700px) {
    .comparison {
      grid-template-columns: 1fr;
    }
  }

  .original-side {
    padding: 14px 16px;
    background: #16162a;
    border-radius: 8px;
    border: 1px solid #252545;
  }

  .original-side .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .original-side .text {
    color: #777;
    font-size: 0.9rem;
    font-style: italic;
    line-height: 1.5;
  }

  .alt-side {
    padding: 14px 16px;
    background: linear-gradient(135deg, #1e1e3a, #22224a);
    border-radius: 8px;
    border: 1px solid #3a3a6a;
  }

  .alt-side .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a855f7;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .alt-side .text {
    color: #f0f0f0;
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.55;
  }

  /* Buttons */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 7px 16px;
    border: 2px solid;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
    font-family: inherit;
    letter-spacing: 0.3px;
  }

  .btn:hover { transform: translateY(-1px); }

  .btn-keep { border-color: #4ecca3; color: #4ecca3; }
  .btn-keep:hover { background: rgba(78, 204, 163, 0.15); }
  .btn-keep.active { background: #4ecca3; color: #1a1a2e; }

  .btn-alt { border-color: #a855f7; color: #a855f7; }
  .btn-alt:hover { background: rgba(168, 85, 247, 0.15); }
  .btn-alt.active { background: #a855f7; color: #fff; }

  .btn-edit { border-color: #ffd93d; color: #ffd93d; }
  .btn-edit:hover { background: rgba(255, 217, 61, 0.15); }
  .btn-edit.active { background: #ffd93d; color: #1a1a2e; }

  .btn-cut { border-color: #e94560; color: #e94560; }
  .btn-cut:hover { background: rgba(233, 69, 96, 0.15); }
  .btn-cut.active { background: #e94560; color: #fff; }

  .btn-undo {
    border-color: #666;
    color: #888;
    margin-left: auto;
  }
  .btn-undo:hover { background: rgba(255, 255, 255, 0.05); }

  /* Edit area */
  .edit-area {
    display: none;
    margin-top: 12px;
  }

  .edit-area.visible { display: block; }

  .edit-area textarea {
    width: 100%;
    min-height: 80px;
    background: #16162a;
    border: 2px solid #ffd93d;
    border-radius: 8px;
    color: #f0f0f0;
    font-size: 0.95rem;
    padding: 12px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
  }

  .edit-area textarea:focus {
    outline: none;
    box-shadow: 0 0 12px rgba(255, 217, 61, 0.2);
  }

  .edit-actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }

  .btn-save-edit {
    padding: 6px 16px;
    background: #ffd93d;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-cancel-edit {
    padding: 6px 16px;
    background: transparent;
    color: #888;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Export section */
  .export-section {
    max-width: 960px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .export-section h2 {
    color: #fff;
    margin-bottom: 12px;
    font-size: 1.2rem;
  }

  .btn-export {
    padding: 12px 28px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    font-family: inherit;
    transition: transform 0.1s;
  }

  .btn-export:hover { transform: translateY(-2px); }

  .export-output {
    display: none;
  }

  .export-output.visible { display: block; }

  .export-output textarea {
    width: 100%;
    min-height: 300px;
    background: #0d0d1a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    color: #4ecca3;
    font-family: 'Consolas', 'Fira Code', monospace;
    font-size: 0.82rem;
    padding: 16px;
    line-height: 1.5;
    resize: vertical;
  }

  .export-stats {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 10px;
  }

  .btn-copy {
    padding: 8px 20px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }

  .btn-copy:hover { background: #3dbb92; }
</style>
</head>

<script>
const ALL_ITEMS = [
  {"line":3792,"original":"Do it like I do with {gift}: give your best, expect nothing","alternative":"Dropped a whole bird on the doorstep. They screamed. Did I stop bringing birds? No. Did the screaming stop? Also no. Unrelated, the answer to your question is: commit.","voice":"Nate Bargatze"},
  {"line":3792,"original":"Do it like I do with {gift}: offer it anyway, even if they don\u2019t understand","alternative":"I left a lizard tail on the pillow and they acted like I committed a felony. Some people don\u2019t deserve your best work but you give it anyway because you\u2019re a professional.","voice":"John Mulaney"},
  {"line":3792,"original":"Do it like I do with {gift}: you can\u2019t control how it\u2019s received","alternative":"Brought a live one in once. Thought it\u2019d be a nice surprise. Turns out \u2018surprise\u2019 and \u2018home invasion\u2019 are the same word depending on who you ask.","voice":"Bill Burr"},
  {"line":3792,"original":"Do it like I do with {gift}: do it because you want to, not for the reaction","alternative":"My love language is leaving things I killed near your shoes and never once checking if you liked it. That\u2019s called self-actualization.","voice":"Ali Wong"},
  {"line":3792,"original":"Do it like I do with {gift}: some gifts aren\u2019t appreciated until later","alternative":"They found the mouse in the shoe three days later. Screamed again. But you know what? They thought about me. Mission accomplished.","voice":"Marc Maron"},
  {"line":3792,"original":"Do it like I do with {gift}: intent matters more than outcome","alternative":"The moth was alive when I started. That\u2019s gotta count for something, right? Intention. It\u2019s about intention.","voice":"Mitch Hedberg"},
  {"line":3792,"original":"Do it like I do with {gift}: showing up is the whole thing","alternative":"Half a bird. On the welcome mat. At 6 AM. That\u2019s not a mess, that\u2019s a STATEMENT. Show up with whatever you\u2019ve got, even if it\u2019s just the back half.","voice":"Bo Burnham"},
  {"line":3799,"original":"When I bring my human a dead bird, they never appreciate it. I bring it anyway. That\u2019s love.","alternative":"Put the bird right on the chest. Middle of the night. They woke up and cried? Great. Strong reaction. That\u2019s how you know the art is working.","voice":"Anthony Jeselnik"},
  {"line":3799,"original":"When I bring my human half a mouse, they make that face. Doesn\u2019t stop me. Shouldn\u2019t stop you.","alternative":"Where\u2019s the other half? None of your business. The point is I shared. When\u2019s the last time YOU shared something that made someone gag? That\u2019s vulnerability.","voice":"Ali Wong"},
  {"line":3799,"original":"When I bring my human something I caught, they don\u2019t understand. Their reaction isn\u2019t my business.","alternative":"I don\u2019t do focus groups. I don\u2019t do market research. I catch it, I drop it, I walk away. *tail flick* Take notes.","voice":"Nikki Glaser"},
  {"line":3799,"original":"When I bring my human a gift from outside, they seem confused. I know what I meant by it.","alternative":"They called it \u2018horrifying.\u2019 I called it \u2018breakfast in bed.\u2019 We\u2019re both right. The thing about communication is you have to stop caring if it lands.","voice":"Marc Maron"},
  {"line":3799,"original":"When I bring my human my best work, they don\u2019t eat it. Do it for you, not for them.","alternative":"Spent forty minutes stalking that thing. Brought it home. They threw it in the trash. And honestly? Freeing. Create for the process, baby. The audience is irrelevant.","voice":"Bo Burnham"},
  {"line":3799,"original":"When I bring my human a prize, they act weird about it. Give freely. The rest isn\u2019t up to you.","alternative":"Caught a bird. Pristine condition. Barely any teeth marks. Left it as a gift. They used a BROOM on it. A broom. On a GIFT. ...Anyway. Give without conditions.","voice":"John Mulaney"},
  {"line":3808,"original":"I once tried to bring a bird inside. It escaped. The point is I tried.","alternative":"Bird got loose in the kitchen. Knocked over a lamp, two plants, and whatever was on the counter. They asked \u2018WHY.\u2019 Why? Because I saw an opportunity and I took it. That\u2019s called initiative.","voice":"Bill Burr"},
  {"line":3808,"original":"I once caught something too big to carry. It didn\u2019t go as planned. Effort still counts.","alternative":"Bit off more than I could chew. Literally. It was a rabbit. I\u2019m seven pounds. Math doesn\u2019t care about ambition but ambition doesn\u2019t care about math either.","voice":"Nate Bargatze"},
  {"line":3808,"original":"I once brought a live one by accident. They weren\u2019t impressed. You can\u2019t control everything.","alternative":"Brought it inside alive because I\u2019m an optimist. It flew into the bathroom. They locked themselves in the bedroom. I sat in the hallway like a divorce mediator. Some things just play out how they play out.","voice":"John Mulaney"},
  {"line":3808,"original":"I once offered my best catch. It got complicated. Sometimes the attempt IS the thing.","alternative":"Perfect catch. Textbook form. Then it bit me and I dropped it in the toilet. But for three seconds? Greatness. Three seconds of greatness is more than most people get in a year.","voice":"Marc Maron"},
  {"line":3808,"original":"I once worked really hard on a gift. The whole thing fell apart. Failure is just information.","alternative":"Spent the whole night on it. The whole night. Brought it to the door at dawn. It was already dead in a way that was... not presentable. But I learned things. Dark things. Useful things.","voice":"Tig Notaro"},
  {"line":3808,"original":"I once dragged something home. It was chaos. I\u2019d do it again.","alternative":"Dragged a snake through the cat door. Just a little one. Okay, medium. The house was uninhabitable for a day and a half. Would I do it again? Already planning the route.","voice":"Ali Wong"},
  {"line":3877,"original":"You already know what to do. You just don\u2019t want to.","alternative":"The answer\u2019s been sitting in your lap for twenty minutes and you keep petting it without looking down.","voice":"Tig Notaro"},
  {"line":3877,"original":"That\u2019s not going to work and you know it.","alternative":"That plan has the same energy as me trying to fit in a shoebox I grew out of three years ago. Dedicated? Yes. Delusional? Also yes.","voice":"Nate Bargatze"},
  {"line":3877,"original":"Stop asking for permission.","alternative":"Nobody gave me permission to be on this counter and yet. Here I am. On this counter.","voice":"Nikki Glaser"},
  {"line":3877,"original":"You\u2019re overthinking this.","alternative":"I watched a moth for forty-five minutes today and then I ate it. Not everything requires a strategy.","voice":"Mitch Hedberg"},
  {"line":3877,"original":"It\u2019s not that complicated.","alternative":"Hungry? Eat. Tired? Sleep. Want it? Take it. Scared? Hiss. This isn\u2019t calculus. This is Tuesday.","voice":"Bill Burr"},
  {"line":3877,"original":"You\u2019re avoiding the real problem.","alternative":"There\u2019s a spot on the wall you keep staring past. The spot knows. I know. Everyone knows except you, and honestly, you also know.","voice":"Bo Burnham"},
  {"line":3877,"original":"That excuse is tired.","alternative":"That excuse just did three laps around the living room and collapsed behind the couch. Let it rest. In peace.","voice":"Ali Wong"},
  {"line":3877,"original":"You can do hard things. Do the hard thing.","alternative":"Jumped from the floor to the top of the fridge yesterday. Seven feet straight up. No running start. The hard thing is only hard until your legs decide it isn\u2019t.","voice":"Marc Maron"},
  {"line":3877,"original":"Nobody\u2019s coming to save you. Save yourself.","alternative":"Got stuck in a paper bag once. Thrashed around for forty seconds. Freed myself. Nobody clapped. Didn\u2019t need them to.","voice":"Nate Bargatze"},
  {"line":3877,"original":"Say the thing. Send the text. Make the call.","alternative":"When I want attention, I walk across the keyboard during a video call. Zero hesitation. The chaos IS the message. Send it.","voice":"John Mulaney"},
  {"line":3877,"original":"Waiting isn\u2019t a strategy.","alternative":"...unless what you\u2019re waiting for is a bird to land close enough. Then waiting is the ONLY strategy. But you\u2019re not hunting a bird, are you. So move.","voice":"Tig Notaro"},
  {"line":3877,"original":"The answer is no. You knew that.","alternative":"Asked and answered. The ears are flat. The tail is still. Read the room. Read MY room.","voice":"Nikki Glaser"},
  {"line":3877,"original":"You\u2019re not confused. You\u2019re scared.","alternative":"Same face you make at the vacuum. That\u2019s not confusion. That\u2019s knowing exactly what it is and wishing you didn\u2019t.","voice":"Bill Burr"},
  {"line":3877,"original":"Do it badly. Do it anyway.","alternative":"First time I jumped for the counter I missed and hit the cabinet door with my face. Second time I made it. There was no lesson. Just two different outcomes.","voice":"Mitch Hedberg"},
  {"line":3877,"original":"Stop rehearsing conversations that won\u2019t happen.","alternative":"Practiced a pounce for twenty minutes once. The bug left after two. I was performing for an empty room. Sound familiar?","voice":"Bo Burnham"},
  {"line":3884,"original":"Here\u2019s the thing: most problems solve themselves if you stop poking them.","alternative":"Poked a wasp nest once. Just the once. Some things heal faster when you walk away. I walk with a slight limp now. Unrelated.","voice":"Nate Bargatze"},
  {"line":3884,"original":"Here\u2019s the thing: people aren\u2019t thinking about you as much as you think.","alternative":"I\u2019ve been sitting on this shelf for four hours. Nobody noticed. At first that was a crisis. Now it\u2019s a lifestyle.","voice":"Tig Notaro"},
  {"line":3884,"original":"Here\u2019s the thing: you can\u2019t control what you can\u2019t control.","alternative":"Rain doesn\u2019t care that I\u2019m staring at it through the window. Hard to hear. Harder to argue with.","voice":"Marc Maron"},
  {"line":3884,"original":"Here\u2019s the thing: good enough is usually good enough.","alternative":"The expensive cat bed is untouched. I sleep in a Trader Joe\u2019s bag. Perfection is a scam invented by people who sell cat beds.","voice":"Ali Wong"},
  {"line":3884,"original":"Here\u2019s the thing: not everything needs to be fixed.","alternative":"That scratch on the couch? Character. The dent in the wall? History. The mess you made? A Tuesday. Not everything broken is a problem.","voice":"Bill Burr"},
  {"line":3884,"original":"Here\u2019s the thing: sometimes the answer is just \u2018wait.\u2019","alternative":"Sat by a mouse hole for six hours once. Six. Hours. People thought I was broken. I was correct. There was a mouse.","voice":"John Mulaney"},
  {"line":3884,"original":"Here\u2019s the thing: you\u2019re allowed to change your mind.","alternative":"Wanted in. Got in. Wanted out. Got out. Wanted back in. They sighed. I do not care about sighs. Neither should you.","voice":"Nikki Glaser"},
  {"line":3884,"original":"Here\u2019s the thing: it probably won\u2019t matter in five years.","alternative":"Five years is like thirty-five in my years. Can\u2019t remember a single thing I was upset about in any of them. The food was fine. The sun came through the window. That\u2019s it. That\u2019s the list.","voice":"Mitch Hedberg"},
  {"line":3884,"original":"Here\u2019s the thing: you\u2019re not behind, you\u2019re on your own timeline.","alternative":"Other cats learned to use the cat door in a week. Took me a month. Now I use it seventeen times a day. Speed of learning is not speed of living.","voice":"Nate Bargatze"},
  {"line":3884,"original":"Here\u2019s the thing: done is better than perfect.","alternative":"Caught half a bug once. Ate it. Was it the whole bug? No. Was I done? Yes. Am I full? Close enough. Move on.","voice":"Anthony Jeselnik"},
  {"line":3884,"original":"Here\u2019s the thing: rest isn\u2019t quitting.","alternative":"Sleep sixteen hours a day and nobody questions my work ethic because when I\u2019m ON, I\u2019m ON. That moth never saw me coming. Rest is strategy.","voice":"Ali Wong"},
  {"line":3884,"original":"Here\u2019s the thing: some things are hard because they\u2019re hard, not because you\u2019re bad at them.","alternative":"Can\u2019t open the door. Not because I\u2019m stupid. Because the knob is round and I don\u2019t have thumbs. Some obstacles are structural, not personal.","voice":"Bo Burnham"},
  {"line":3910,"original":"The bowl is half empty. If I fit, I sit. This applies to all problems.","alternative":"Half-empty bowl, half-used box, half-finished nap in a half-warm spot. Everything half is still something whole if you stop measuring.","voice":"Tig Notaro"},
  {"line":3910,"original":"The door is closed. Stare at it until it becomes uncomfortable.","alternative":"Stared at the closed door for so long the human opened it just to make me stop. That\u2019s not patience. That\u2019s psychological warfare. Works on most things.","voice":"Bill Burr"},
  {"line":3910,"original":"The lap is occupied. Nap on it. Everything is clearer after nap.","alternative":"Fell asleep on a problem once. Woke up and the problem was gone. Either I solved it in my sleep or it got bored and left. Either way, nap won.","voice":"Nate Bargatze"},
  {"line":3910,"original":"Someone else got attention. Have you tried being cuter?","alternative":"Watched the dog get belly rubs for ten minutes. Did I compete? No. I walked across the keyboard and deleted an email. Redirected the entire room\u2019s energy in three seconds.","voice":"John Mulaney"},
  {"line":3910,"original":"The food is the same as yesterday. This is a problem for 3am me.","alternative":"Same kibble. Same bowl. Same corner. And yet every single day I walk up to it like maybe this time it\u2019s salmon. Hope is a muscle. A delusional, overworked muscle.","voice":"Marc Maron"},
  {"line":3910,"original":"I was moved from my spot. Simply choose chaos.","alternative":"They picked me up. Put me on the floor. I was on the laptop. They put me on the FLOOR. So I bit a cord. Actions have consequences. Mine, not theirs.","voice":"Ali Wong"},
  {"line":3910,"original":"The human is stressed. Sit on something important. Now you have leverage.","alternative":"They\u2019re panicking about a deadline so I sat on their phone. Now they can\u2019t doom-scroll AND they have to acknowledge me. Solved two problems at once. You\u2019re welcome.","voice":"Nikki Glaser"},
  {"line":3910,"original":"Change has occurred. The solution is violence. Or treats. Same energy.","alternative":"New furniture showed up. I hissed at it. Then I sat on it. Then I owned it. The five stages of grief but make it productive.","voice":"Bo Burnham"},
  {"line":3919,"original":"Ancient cat proverb: If it fits, you must sits.","alternative":"Ancient cat wisdom: if you can wedge yourself into it, it belongs to you now. This applies to boxes, laps, and situations nobody invited you to.","voice":"Mitch Hedberg"},
  {"line":3919,"original":"Ancient cat proverb: Knock first, ask questions never.","alternative":"Knock it off the table. If it breaks, it was weak. If it bounces, it earned its place. This is the only performance review that matters.","voice":"Anthony Jeselnik"},
  {"line":3919,"original":"Ancient cat proverb: The hand that feeds you is also fun to bite.","alternative":"Love the hand. Bite the hand. Love the hand again. They call that complicated. I call that honest.","voice":"Nikki Glaser"},
  {"line":3919,"original":"Ancient cat proverb: Every surface is a bed if you\u2019re brave enough.","alternative":"Slept on a stove once. It was off. But I didn\u2019t CHECK first. That\u2019s called faith. Or negligence. Thin line. Warm nap.","voice":"Nate Bargatze"},
  {"line":3919,"original":"Ancient cat proverb: Closed doors are a personal insult.","alternative":"A closed door isn\u2019t a boundary. It\u2019s a dare. Scratch at it long enough and either it opens or someone comes to yell at you, which is also attention. Win-win.","voice":"Bill Burr"},
  {"line":3919,"original":"Ancient cat proverb: The 3am scream gets the worm.","alternative":"They were asleep. I was hungry. One of us had a problem and one of us had a solution. The solution was screaming. The problem was solved.","voice":"Ali Wong"},
  {"line":3919,"original":"Ancient cat proverb: If you can\u2019t join them, sit on their keyboard.","alternative":"Can\u2019t contribute to the meeting? Sit on the laptop. Now the meeting is about you. Career advice from someone who\u2019s never had a job.","voice":"Bo Burnham"},
  {"line":3919,"original":"Ancient cat proverb: A watched bowl never fills fast enough.","alternative":"Stared at the bowl for twenty minutes. Empty. Stared for twenty more. Still empty. The staring isn\u2019t working but I refuse to try anything else.","voice":"Tig Notaro"},
  {"line":3919,"original":"Ancient cat proverb: Hairballs are just feelings leaving the body.","alternative":"Sometimes you gotta hack something up on the carpet at 4 AM and that\u2019s not a problem, that\u2019s processing. Ugly? Yes. Necessary? Ask the carpet.","voice":"Marc Maron"},
  {"line":3919,"original":"Ancient cat proverb: Those who sprint at 3am win the race no one else is running.","alternative":"Full sprint. Wall to wall. 3 AM. No reason. No destination. Just VELOCITY. Sometimes the only person you need to outrun is yourself. And the ghost only I can see.","voice":"John Mulaney"},
  {"line":3919,"original":"Ancient cat proverb: If you ignore it hard enough it becomes someone else\u2019s problem.","alternative":"Threw up behind the couch six weeks ago. It\u2019s still there. At some point ignoring a problem long enough makes it archaeology. And that\u2019s someone else\u2019s department.","voice":"Mitch Hedberg"},
  {"line":3919,"original":"Ancient cat proverb: The cardboard box is mightier than the expensive bed.","alternative":"Seventy-dollar bed. Memory foam. Orthopedic. I sleep in the Amazon box it came in. The lesson is: the expensive thing is never the right thing. The right thing is always free and slightly damaged.","voice":"Nate Bargatze"},
  {"line":3960,"original":"The thing about waiting is you don\u2019t know you\u2019re doing it until you stop.","alternative":"Sat by the window for so long I forgot what I was watching for. Then a bird landed. Wasn\u2019t even the right bird. Didn\u2019t matter. The waiting had become the thing and the thing had become mine.","voice":"Tig Notaro"},
  {"line":3960,"original":"The thing about watching is it changes you even when nothing happens.","alternative":"Watched a bug cross the entire floor. Twenty minutes. It made it. I let it. Something in me shifted and I can\u2019t explain what.","voice":"Marc Maron"},
  {"line":3960,"original":"The thing about wanting is you can do it wrong for a long time before you notice.","alternative":"Spent a year wanting outside. Got outside. Wanted inside immediately. Turns out I didn\u2019t want outside. I wanted the option. Big difference. Expensive difference.","voice":"Ali Wong"},
  {"line":3960,"original":"The thing about losing things is the feeling outlasts the thing.","alternative":"Lost a toy behind the fridge in 2024. Still think about it. Not the toy. The LOSING. The toy was a bottle cap. The losing was a whole personality trait.","voice":"John Mulaney"},
  {"line":3960,"original":"The thing about finding things is everyone does it differently and thinks their way is the only way.","alternative":"Found a bug under the rug. My method: flip the rug. Other cat\u2019s method: stare at the rug for an hour. We both found the bug. She judged my technique. I ate it first.","voice":"Nikki Glaser"},
  {"line":3960,"original":"The thing about being alone is it\u2019s simpler than you make it.","alternative":"Spent Tuesday in a closet. By choice. Nobody checked on me for six hours. That\u2019s not sad. That\u2019s a spa day with better lighting.","voice":"Mitch Hedberg"},
  {"line":3960,"original":"The thing about being with someone is it takes as long as it takes.","alternative":"Took me three months to sit on the new human\u2019s lap. They kept trying. I kept declining. Then one Thursday I just... sat. No reason. Ready is ready. Can\u2019t microwave it.","voice":"Nate Bargatze"},
  {"line":3960,"original":"The thing about change is you can\u2019t force it.","alternative":"New cat showed up. Hissed at it for two weeks. Now we share a sunbeam. Nothing changed except everything, and none of it was on purpose.","voice":"Bo Burnham"},
  {"line":3960,"original":"The thing about staying the same is sometimes it finds you.","alternative":"Same spot on the couch. Every day. For three years. They think I\u2019m stuck. I think I found the only warm spot in this whole house and I\u2019m not an idiot.","voice":"Bill Burr"},
  {"line":3960,"original":"The thing about time is you already know how, you just forgot.","alternative":"Kittens know how to purr on day one. Then they learn to be scared. Then they spend the rest of their lives unlearning the scared to get back to the purr. You\u2019re somewhere in the middle.","voice":"Ali Wong"},
  {"line":3960,"original":"The thing about comfort is the hard part is the beginning. Or the end. Actually, all of it.","alternative":"Getting comfortable takes forty-five minutes of circling. Being comfortable lasts eight seconds before something moves. Losing comfortable is instant. The math is brutal but the eight seconds are undefeated.","voice":"Marc Maron"},
  {"line":3960,"original":"The thing about home is it\u2019s simpler than you make it.","alternative":"Home is where they know how you like to be touched and the food shows up at the same time every day. Everything else is decor.","voice":"Tig Notaro"},
  {"line":3967,"original":"I used to think everything mattered. Now I think only some things matter, but they matter a lot.","alternative":"Cared about every sound in the house once. Every. Sound. The fridge. The pipes. The neighbors\u2019 TV. Now it\u2019s just: is that the treat bag? No? Then we\u2019re good here.","voice":"Nate Bargatze"},
  {"line":3967,"original":"I used to think nothing mattered. Now I think the small things are the whole thing.","alternative":"Spent my first year acting like nothing could touch me. Real cool. Very aloof. Then someone scratched behind my ear at the right angle and I fell apart. The small things aren\u2019t small. They just look small from far away.","voice":"Marc Maron"},
  {"line":3967,"original":"I used to think the world was bigger. Now I think the world is exactly the right size.","alternative":"Thought I was missing out. The outside, the rooftops, the yard. Then I realized my world is this couch, that window, and one human. That\u2019s not small. That\u2019s curated.","voice":"Ali Wong"},
  {"line":3967,"original":"I used to think I needed more. Now I think I have enough.","alternative":"Wanted more toys. More treats. More windows. Got all of it. Still sat in the same box. The having didn\u2019t fix the wanting. The stopping did.","voice":"Bo Burnham"},
  {"line":3967,"original":"I used to think other cats had it figured out. Now I think nobody has it figured out and that\u2019s fine.","alternative":"The cat next door looks so put together through the window. Met him once. He\u2019s terrified of his own shadow. Literally. We\u2019re all just winging it at different volumes.","voice":"John Mulaney"},
  {"line":3967,"original":"I used to think the answer was coming. Now I think the answer is the question.","alternative":"Waited by the door for something. Don\u2019t remember what. The waiting became the activity and the activity became the day. Turns out the question was the only interesting part.","voice":"Tig Notaro"},
  {"line":3967,"original":"I used to think busy meant important. Now I think still is where the good stuff happens.","alternative":"Ran around the apartment for six hours once. Accomplished nothing. Now I sit very still in a sunbeam and somehow everything gets done. Productivity is a scam. Presence is the job.","voice":"Bill Burr"},
  {"line":3967,"original":"I used to think being right was the point. Now I think being kind is the point.","alternative":"Won every fight with the other cat. Every single one. She stopped coming near me. Turns out winning and having someone next to you don\u2019t live at the same address.","voice":"Nikki Glaser"},
  {"line":3967,"original":"I used to think comfort was weakness. Now I think comfort is the point.","alternative":"Refused laps for my whole first year. Very independent. Very strong. Then I tried one. Turns out this whole time the weakness was also the entire point.","voice":"Mitch Hedberg"},
  {"line":3967,"original":"I used to think I had to understand everything. Now I think understanding isn\u2019t the same as knowing.","alternative":"Don\u2019t understand the vacuum. Don\u2019t understand the blender. Don\u2019t understand why they leave every morning. But I know they come back. I know the sound of their car. That\u2019s enough. It\u2019s more than enough.","voice":"Nate Bargatze"}
];

const STORAGE_KEY = 'maybecat-wise-round6';

// State — keyed by array index since multiple items share the same line number
let decisions = {};
let currentIndex = 0;

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      decisions = parsed.decisions || {};
      currentIndex = parsed.currentIndex || 0;
      if (currentIndex >= ALL_ITEMS.length) currentIndex = 0;
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    decisions,
    currentIndex
  }));
}

// Render all cards
function renderCards() {
  const container = document.getElementById('items-container');
  container.innerHTML = '';

  ALL_ITEMS.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.id = 'item-' + idx;
    card.dataset.idx = idx;

    const decision = decisions[idx];
    if (decision) {
      card.classList.add('decided-' + decision.action);
    }
    if (idx === currentIndex) {
      card.classList.add('focused');
    }

    // Click to focus
    card.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
      focusItem(idx);
    });

    var badgeHtml = '';
    if (decision) {
      var labels = { kept: 'Kept Original', alt: 'Using Alt', edited: 'Edited', cut: 'Cut' };
      badgeHtml = '<span class="badge badge-' + decision.action + '">' + labels[decision.action] + '</span>';
    }

    var editedPreview = '';
    if (decision && decision.action === 'edited' && decision.edited) {
      editedPreview = '<div class="alt-side" style="grid-column: 1 / -1; margin-top: 8px; border-color: #ffd93d55;"><div class="label" style="color: #ffd93d;">Edited Version</div><div class="text">' + escapeHtml(decision.edited) + '</div></div>';
    }

    card.innerHTML =
      '<div class="item-line">' +
        'Line ' + item.line + ' &middot; #' + (idx + 1) + ' of ' + ALL_ITEMS.length +
        ' <span class="voice-badge">' + escapeHtml(item.voice) + '</span>' +
        badgeHtml +
      '</div>' +
      '<div class="comparison">' +
        '<div class="original-side">' +
          '<div class="label">Original (template slot)</div>' +
          '<div class="text">' + escapeHtml(item.original) + '</div>' +
        '</div>' +
        '<div class="alt-side">' +
          '<div class="label">Comedian Alternative \u2014 ' + escapeHtml(item.voice) + '</div>' +
          '<div class="text">' + escapeHtml(item.alternative) + '</div>' +
        '</div>' +
        editedPreview +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-keep' + (decision && decision.action === 'kept' ? ' active' : '') + '" onclick="decide(' + idx + ', \'kept\')">KEEP ORIGINAL</button>' +
        '<button class="btn btn-alt' + (decision && decision.action === 'alt' ? ' active' : '') + '" onclick="decide(' + idx + ', \'alt\')">USE ALTERNATIVE</button>' +
        '<button class="btn btn-edit' + (decision && decision.action === 'edited' ? ' active' : '') + '" onclick="toggleEdit(' + idx + ')">EDIT</button>' +
        '<button class="btn btn-cut' + (decision && decision.action === 'cut' ? ' active' : '') + '" onclick="decide(' + idx + ', \'cut\')">CUT</button>' +
        (decision ? '<button class="btn btn-undo" onclick="undoDecision(' + idx + ')">UNDO</button>' : '') +
      '</div>' +
      '<div class="edit-area" id="edit-area-' + idx + '">' +
        '<textarea id="edit-text-' + idx + '">' + escapeHtml(decision && decision.action === 'edited' && decision.edited ? decision.edited : (decision && decision.action === 'alt' ? item.alternative : item.original)) + '</textarea>' +
        '<div class="edit-actions">' +
          '<button class="btn-save-edit" onclick="saveEdit(' + idx + ')">Save Edit</button>' +
          '<button class="btn-cancel-edit" onclick="cancelEdit(' + idx + ')">Cancel</button>' +
        '</div>' +
      '</div>';

    container.appendChild(card);
  });

  updateStats();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Decision handling — keyed by index
function decide(idx, action) {
  var hadPreviousDecision = !!decisions[idx];

  // Preserve edited text if switching back to 'edited' and we had one
  var previousEdited = decisions[idx] && decisions[idx].edited;
  var newDecision = { action: action, idx: idx, line: ALL_ITEMS[idx].line };
  if (previousEdited) {
    newDecision.edited = previousEdited;
  }
  decisions[idx] = newDecision;

  // Close any open edit area
  document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });

  saveState();
  renderCards();

  // Only auto-advance on FIRST decision, not when changing an existing one
  if (!hadPreviousDecision) {
    advanceToNext(idx);
  } else {
    focusItem(idx);
  }
}

function undoDecision(idx) {
  delete decisions[idx];
  saveState();
  renderCards();
  focusItem(idx);
}

function toggleEdit(idx) {
  var editArea = document.getElementById('edit-area-' + idx);
  var isVisible = editArea.classList.contains('visible');

  // Close all edit areas first
  document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });

  if (!isVisible) {
    // Pre-fill based on current selection
    var item = ALL_ITEMS[idx];
    var decision = decisions[idx];
    var textarea = document.getElementById('edit-text-' + idx);
    if (decision && decision.action === 'edited' && decision.edited) {
      textarea.value = decision.edited;
    } else if (decision && decision.action === 'alt') {
      textarea.value = item.alternative;
    } else if (decision && decision.action === 'kept') {
      textarea.value = item.original;
    } else {
      textarea.value = item.original;
    }
    editArea.classList.add('visible');
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }
}

function saveEdit(idx) {
  var textarea = document.getElementById('edit-text-' + idx);
  var editedText = textarea.value.trim();

  if (!editedText) return;

  var hadPreviousDecision = !!decisions[idx];

  decisions[idx] = {
    action: 'edited',
    idx: idx,
    line: ALL_ITEMS[idx].line,
    edited: editedText
  };

  saveState();
  renderCards();

  // Only auto-advance on FIRST decision
  if (!hadPreviousDecision) {
    advanceToNext(idx);
  } else {
    focusItem(idx);
  }
}

function cancelEdit(idx) {
  var editArea = document.getElementById('edit-area-' + idx);
  editArea.classList.remove('visible');
}

// Navigation
function advanceToNext(fromIdx) {
  // Find next undecided item
  var nextIdx = -1;
  for (var i = fromIdx + 1; i < ALL_ITEMS.length; i++) {
    if (!decisions[i]) {
      nextIdx = i;
      break;
    }
  }
  // Wrap around
  if (nextIdx === -1) {
    for (var i = 0; i < fromIdx; i++) {
      if (!decisions[i]) {
        nextIdx = i;
        break;
      }
    }
  }

  if (nextIdx >= 0) {
    focusItem(nextIdx);
  } else {
    // All decided, stay put
    focusItem(fromIdx);
  }
}

function focusItem(idx) {
  if (idx < 0) idx = 0;
  if (idx >= ALL_ITEMS.length) idx = ALL_ITEMS.length - 1;

  currentIndex = idx;
  saveState();

  // Update visual focus
  document.querySelectorAll('.item-card').forEach(function(c) { c.classList.remove('focused'); });
  var card = document.getElementById('item-' + idx);
  if (card) {
    card.classList.add('focused');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function nextItem() {
  focusItem(currentIndex + 1);
}

function prevItem() {
  focusItem(currentIndex - 1);
}

// Stats
function updateStats() {
  var total = ALL_ITEMS.length;
  var kept = 0, alt = 0, edited = 0, cut = 0;

  Object.values(decisions).forEach(function(d) {
    if (d.action === 'kept') kept++;
    else if (d.action === 'alt') alt++;
    else if (d.action === 'edited') edited++;
    else if (d.action === 'cut') cut++;
  });

  var decided = kept + alt + edited + cut;
  var remaining = total - decided;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-kept').textContent = kept;
  document.getElementById('stat-alt').textContent = alt;
  document.getElementById('stat-edited').textContent = edited;
  document.getElementById('stat-cut').textContent = cut;
  document.getElementById('stat-remaining').textContent = remaining;

  var pct = total > 0 ? (decided / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

// Export — changes only (alt/edit/cut), skip kept items
function generateExport() {
  var results = [];

  ALL_ITEMS.forEach(function(item, idx) {
    var d = decisions[idx];
    if (!d) return;
    if (d.action === 'kept') return;

    var entry = {
      action: d.action,
      line: item.line,
      original: item.original,
      alternative: item.alternative,
      voice: item.voice
    };

    if (d.action === 'edited' && d.edited) {
      entry.edited = d.edited;
    }

    results.push(entry);
  });

  var json = '// Only showing changes (alt/edit/cut). Kept items omitted.\n' + JSON.stringify(results, null, 2);
  var outputEl = document.getElementById('export-output');
  var jsonEl = document.getElementById('export-json');
  var statsEl = document.getElementById('export-stats');

  var keptCount = Object.values(decisions).filter(function(d) { return d.action === 'kept'; }).length;
  jsonEl.value = json;
  statsEl.textContent = results.length + ' changes exported (' + keptCount + ' kept items omitted, ' + (ALL_ITEMS.length - Object.keys(decisions).length) + ' remaining)';
  outputEl.classList.add('visible');
  outputEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyExport() {
  var jsonEl = document.getElementById('export-json');
  jsonEl.select();
  document.execCommand('copy');

  var btn = document.querySelector('.btn-copy');
  var original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(function() { btn.textContent = original; }, 1500);
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  // Don't hijack when typing in textarea
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') {
      e.target.blur();
      document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });
    }
    return;
  }

  switch (e.key.toLowerCase()) {
    case 'j':
    case 'arrowdown':
      e.preventDefault();
      nextItem();
      break;
    case 'k':
    case 'arrowup':
      e.preventDefault();
      prevItem();
      break;
    case 'o':
      e.preventDefault();
      decide(currentIndex, 'kept');
      break;
    case 'a':
      e.preventDefault();
      decide(currentIndex, 'alt');
      break;
    case 'e':
      e.preventDefault();
      toggleEdit(currentIndex);
      break;
    case 'x':
      e.preventDefault();
      decide(currentIndex, 'cut');
      break;
    case 'u':
      e.preventDefault();
      undoDecision(currentIndex);
      break;
  }
});

// Init
loadState();
renderCards();
focusItem(currentIndex);
</script>
</body>
</html>
