<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McConaughey Mystical Batch — 31 items</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 0 0 120px 0;
    line-height: 1.6;
  }

  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #16162a;
    border-bottom: 2px solid #2a2a4a;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
  }
  .sticky-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #c4b5fd;
    flex-shrink: 0;
  }
  .stats {
    display: flex;
    gap: 20px;
    font-size: 14px;
    font-weight: 600;
    flex-wrap: wrap;
  }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }
  .stat-total { color: #c4b5fd; }

  .kb-hint {
    margin-left: auto;
    font-size: 12px;
    color: #666;
  }
  .kb-hint kbd {
    background: #2a2a4a;
    border: 1px solid #444;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: monospace;
    font-size: 11px;
    color: #aaa;
  }

  .card-list {
    max-width: 800px;
    margin: 24px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: #222244;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 24px;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .card.active {
    border-color: #c4b5fd;
    box-shadow: 0 0 0 1px #c4b5fd33, 0 4px 20px #0008;
  }
  .card.status-keep { border-color: #4ecca3; background: #1a2e28; }
  .card.status-cut { border-color: #e94560; background: #2e1a22; opacity: 0.6; }
  .card.status-edit { border-color: #ffd93d; background: #2e2a1a; }

  .card-number {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 12px;
    color: #555;
    font-weight: 600;
  }

  .card-text {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.5;
    color: #f0f0f0;
    margin-bottom: 8px;
  }

  .voice-note {
    font-size: 12px;
    color: #888;
    font-style: italic;
    margin-bottom: 16px;
    padding-left: 12px;
    border-left: 2px solid #444;
  }

  .status-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .badge-keep { background: #4ecca333; color: #4ecca3; }
  .badge-cut { background: #e9456033; color: #e94560; }
  .badge-edit { background: #ffd93d33; color: #ffd93d; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { transform: scale(1.03); }
  .btn:active { transform: scale(0.97); }
  .btn-keep { background: #4ecca3; color: #111; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #111; }
  .btn-undo { background: #555; color: #fff; font-size: 12px; padding: 6px 14px; }

  .edit-area {
    display: none;
    margin-top: 12px;
  }
  .edit-area.visible { display: block; }
  .edit-area textarea {
    width: 100%;
    min-height: 80px;
    background: #1a1a2e;
    color: #f0f0f0;
    border: 1px solid #ffd93d55;
    border-radius: 6px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    resize: vertical;
    line-height: 1.5;
  }
  .edit-area textarea:focus { outline: none; border-color: #ffd93d; }
  .edit-save {
    margin-top: 8px;
    background: #ffd93d;
    color: #111;
    border: none;
    border-radius: 4px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }

  .export-section {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .export-section h2 {
    color: #c4b5fd;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .export-note {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
  }
  .export-block {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    color: #aaa;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
    cursor: text;
    user-select: all;
  }
  .copy-btn {
    margin-top: 8px;
    background: #c4b5fd;
    color: #111;
    border: none;
    border-radius: 4px;
    padding: 8px 20px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .copy-btn:hover { opacity: 0.9; }
  .copied-msg {
    display: inline-block;
    margin-left: 12px;
    color: #4ecca3;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .copied-msg.show { opacity: 1; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>McConaughey Mystical Batch — 31 items</h1>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="count-keep">0</span></span>
    <span class="stat-cut">CUT: <span id="count-cut">0</span></span>
    <span class="stat-edit">EDIT: <span id="count-edit">0</span></span>
    <span class="stat-pending">PENDING: <span id="count-pending">31</span></span>
    <span class="stat-total">TOTAL: 31</span>
  </div>
  <div class="kb-hint">
    <kbd>J</kbd>/<kbd>K</kbd> nav &nbsp;
    <kbd>O</kbd> keep &nbsp;
    <kbd>E</kbd> edit &nbsp;
    <kbd>X</kbd> cut &nbsp;
    <kbd>U</kbd> undo
  </div>
</div>

<div class="card-list" id="card-list"></div>

<div class="export-section">
  <h2>Export Changes Only (edits + cuts)</h2>
  <p class="export-note">Only items with changes (edited text or cut decisions) are exported. Kept items stay as-is in the original JSON.</p>
  <div class="export-block" id="export-block">[]</div>
  <button class="copy-btn" onclick="copyExport()">Copy to Clipboard</button>
  <span class="copied-msg" id="copied-msg">Copied!</span>
</div>

<script>
const STORAGE_KEY = 'maybecat-mcconaughey-mystical';

const responses = [
  {"text": "*stretches one leg impossibly far* See, the thing about your little problem is... it ain't little to you. And that's the whole thing right there.", "category": "mystical", "voice_note": "McConaughey's folksy reframe — takes the dismissive setup and flips it into validation. The stretch is peak lazy cat-genie energy."},
  {"text": "Alright. *slow blink* Alright. *slower blink* Alright.", "category": "mystical", "voice_note": "The signature line delivered entirely through cat trust language. Three slow blinks = three alrights = cosmic yes."},
  {"text": "*one ear rotates toward you* Now hold on. Don't go answerin' that yet. Let the question breathe a minute.", "category": "mystical", "voice_note": "McConaughey's famous pauses — the 'don't rush' philosophy filtered through a cat who literally has nowhere to be."},
  {"text": "Man, I been sitting in this patch of warm for about nine thousand years. You think I'm worried about your timeline?", "category": "mystical", "voice_note": "Lincoln commercial energy meets Elder Cat. The 9,000-year sunbeam as cosmic perspective, not advice."},
  {"text": "*tail tip flicks* The answer's already moving through you. I can see it from here. You just haven't caught up to yourself yet.", "category": "mystical", "voice_note": "McConaughey's 'you already know' confidence — he sees what you can't, delivered with amused patience."},
  {"text": "I could fix this for you. *kneads blanket once, stops* But where's the poetry in that?", "category": "mystical", "voice_note": "Genie-who-won't-grant-the-wish energy. The single knead then stop = choosing not to help because watching is more interesting."},
  {"text": "*lying on back, paws curled* You ever just let the whole thing go and see what catches you? That's a Tuesday for me.", "category": "mystical", "voice_note": "McConaughey's bongo-naked-at-2am surrender philosophy. The belly-up position IS the advice."},
  {"text": "See now, that question had a heartbeat when it walked in here. *pupils dilate* I heard it.", "category": "mystical", "voice_note": "The cat hearing what you can't say — McConaughey's ability to make simple observations sound like revelations."},
  {"text": "*reaches one paw without getting up* The universe and I go way back. She told me to tell you... not yet.", "category": "mystical", "voice_note": "Genie energy — insider information from the cosmos, delivered casually like gossip between old friends."},
  {"text": "I'm not gonna tell you what to do. *yawns enormously* I'm gonna sit here and you're gonna figure it out. And we're both gonna enjoy that.", "category": "mystical", "voice_note": "McConaughey's 'enjoy the ride' philosophy — the yawn as cosmic indifference, the refusal to help as the help."},
  {"text": "That fear you're carrying? *sniffs the air once* Smells borrowed. Give it back.", "category": "mystical", "voice_note": "Cat's superior nose detecting what's yours vs. what isn't. McConaughey's casual truth-bomb delivery."},
  {"text": "*chin on paw, watching* You're three moves from something beautiful and you don't even know it. That's the best part.", "category": "mystical", "voice_note": "McConaughey seeing your future like it's a movie he's already watched. Pensive Cat with charm."},
  {"text": "Man, I had a whole speech planned. *turns around twice, lies down* Nah. You'll get there.", "category": "mystical", "voice_note": "The abandoned wisdom — McConaughey starting profound and deciding you don't need the lesson. The circling is pure cat."},
  {"text": "*sitting in a doorway, blocking it* Some doors, you gotta earn. Stand there a minute. Feel it.", "category": "mystical", "voice_note": "Cat blocking doorways as cosmic gatekeeping. McConaughey's belief that the journey matters more than arrival."},
  {"text": "Here's what I know. *licks paw once* The ones who rush it never taste it.", "category": "mystical", "voice_note": "McConaughey's anti-hustle philosophy via the most casual cat action — grooming as wisdom delivery system."},
  {"text": "I've been watching you for a while now. Not judging. *head tilt* Well. A little judging. But mostly just... fascinated.", "category": "mystical", "voice_note": "McConaughey's disarming honesty — admits the judgment but wraps it in genuine curiosity. Charm as weapon."},
  {"text": "*ears forward* Something just shifted. Did you feel that? No? That's alright. You will.", "category": "mystical", "voice_note": "The cat sensing atmospheric changes humans can't. McConaughey's prophetic confidence without urgency."},
  {"text": "The thing about fate, man — she doesn't knock. She just walks in and sits on your chest. *sits on your chest* Like that.", "category": "mystical", "voice_note": "McConaughey personifying fate, then the cat BECOMING fate. Physical comedy meets cosmic truth."},
  {"text": "*staring at a spot six inches to your left* Your shadow has better posture than you do. Listen to it more.", "category": "mystical", "voice_note": "Cat staring at nothing visible, turned into McConaughey seeing your better self. Strange and specific."},
  {"text": "I got nine lives, man. *rolls onto side* I spent three of 'em on worse decisions than yours. Turned out alright.", "category": "mystical", "voice_note": "McConaughey's personal-experience-as-reassurance, filtered through the nine lives framework without being cliche."},
  {"text": "*vibrating slightly* I'm on a frequency right now that says yes. But it's a slow yes. A warm yes. Don't microwave it.", "category": "mystical", "voice_note": "Cat purring as cosmic frequency. McConaughey's 'don't rush the good thing' energy. 'Don't microwave it' is the vehicle."},
  {"text": "See, you asked the question like you wanted an answer. *headbutts your hand* But what you wanted was company. I'm here.", "category": "mystical", "voice_note": "McConaughey reading what you actually need. The headbutt IS the answer — presence over prescription."},
  {"text": "*watching dust float in a beam of light* Everything moving. Everything arriving. Even when it looks like nothing's happening, man, it's happening.", "category": "mystical", "voice_note": "Lincoln commercial meets cat watching particles. McConaughey's ability to find profundity in nothing."},
  {"text": "That thing you're afraid to want? *makes biscuits once, very deliberately* I just gave it permission to come find you.", "category": "mystical", "voice_note": "Genie finally granting a wish — but framed as permission, not magic. The deliberate single knead as ritual."},
  {"text": "*sitting in exact center of the room* I didn't choose this spot, man. This spot chose me. Same thing's happening to you right now with something bigger.", "category": "mystical", "voice_note": "Cat's territorial precision as cosmic metaphor. McConaughey's 'everything happens for a reason' but grounded in cat behavior."},
  {"text": "Nah, don't look at the clock. *tail wraps around paws* Time's just the universe counting its own breaths. And she's breathing real slow today.", "category": "mystical", "voice_note": "McConaughey redefining time — folksy philosophy that's actually kind of beautiful. Tail-wrap = settled, no rush."},
  {"text": "*appears on the windowsill you swear was empty* I been where your answer lives. Nice neighborhood. You'll get there.", "category": "mystical", "voice_note": "Cat materialization as dimension-hopping. McConaughey as relaxed interdimensional guide."},
  {"text": "Here's the thing about the dark, man. *pupils go full black* It's not empty. It's just full of stuff you haven't named yet.", "category": "mystical", "voice_note": "Cat's night vision as metaphor. McConaughey turning fear of the unknown into wonder."},
  {"text": "*one paw on your wrist* Your pulse just told me everything. And I'm not even gonna charge you for it.", "category": "mystical", "voice_note": "Genie energy — could reveal the truth, chooses to keep it. Cat touching you = reading you."},
  {"text": "I was gonna give you a sign. *knocks one thing off the table with surgical precision* There it is. Interpret freely.", "category": "mystical", "voice_note": "Reclaims the dead trope by making it INTENTIONAL and McConaughey-casual. 'Interpret freely' is genie energy."},
  {"text": "*lying in a shape that defies anatomy* You keep thinking in straight lines, man. The answer is shaped more like... this.", "category": "mystical", "voice_note": "Cat's impossible resting positions as cosmic geometry. McConaughey suggesting you think more like a cat pretzel."}
];

let decisions = {};
let activeIndex = 0;

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

function renderCards() {
  const list = document.getElementById('card-list');
  list.innerHTML = '';
  responses.forEach((r, i) => {
    const d = decisions[i];
    const status = d ? d.status : null;
    const card = document.createElement('div');
    card.className = 'card' + (status ? ' status-' + status : '') + (i === activeIndex ? ' active' : '');
    card.id = 'card-' + i;

    let badge = '';
    if (status === 'keep') badge = '<span class="status-badge badge-keep">KEEP</span>';
    if (status === 'cut') badge = '<span class="status-badge badge-cut">CUT</span>';
    if (status === 'edit') badge = '<span class="status-badge badge-edit">EDITED</span>';

    const displayText = (d && d.edited) ? d.edited : r.text;

    card.innerHTML = `
      <span class="card-number">#${i + 1}</span>
      ${badge}
      <div class="card-text">${escHtml(displayText)}</div>
      <div class="voice-note">${escHtml(r.voice_note)}</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="setStatus(${i},'keep')">Keep (O)</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">Edit (E)</button>
        <button class="btn btn-cut" onclick="setStatus(${i},'cut')">Cut (X)</button>
        ${status ? '<button class="btn btn-undo" onclick="undo(' + i + ')">Undo (U)</button>' : ''}
      </div>
      <div class="edit-area" id="edit-area-${i}">
        <textarea id="edit-text-${i}">${escHtml(displayText)}</textarea>
        <button class="edit-save" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    list.appendChild(card);
  });
  updateStats();
  updateExport();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(i, status) {
  if (!decisions[i]) decisions[i] = {};
  decisions[i].status = status;
  saveState();
  renderCards();
  scrollToCard(Math.min(i + 1, responses.length - 1));
  activeIndex = Math.min(i + 1, responses.length - 1);
}

function undo(i) {
  delete decisions[i];
  saveState();
  renderCards();
}

function toggleEdit(i) {
  const area = document.getElementById('edit-area-' + i);
  area.classList.toggle('visible');
  if (area.classList.contains('visible')) {
    const ta = document.getElementById('edit-text-' + i);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

function saveEdit(i) {
  const ta = document.getElementById('edit-text-' + i);
  const val = ta.value.trim();
  if (!decisions[i]) decisions[i] = {};
  decisions[i].status = 'edit';
  decisions[i].edited = val;
  saveState();
  renderCards();
}

function updateStats() {
  let keep = 0, cut = 0, edit = 0;
  Object.values(decisions).forEach(d => {
    if (d.status === 'keep') keep++;
    if (d.status === 'cut') cut++;
    if (d.status === 'edit') edit++;
  });
  document.getElementById('count-keep').textContent = keep;
  document.getElementById('count-cut').textContent = cut;
  document.getElementById('count-edit').textContent = edit;
  document.getElementById('count-pending').textContent = responses.length - keep - cut - edit;
}

function updateExport() {
  const changes = [];
  Object.entries(decisions).forEach(([i, d]) => {
    const idx = parseInt(i);
    if (d.status === 'cut') {
      changes.push({ action: 'cut', original: responses[idx].text });
    } else if (d.status === 'edit' && d.edited) {
      changes.push({ text: d.edited, category: 'mystical', original: responses[idx].text, action: 'edited' });
    }
  });
  document.getElementById('export-block').textContent = JSON.stringify(changes, null, 2);
}

function scrollToCard(i) {
  const el = document.getElementById('card-' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function setActive(i) {
  activeIndex = Math.max(0, Math.min(i, responses.length - 1));
  document.querySelectorAll('.card').forEach((c, ci) => {
    c.classList.toggle('active', ci === activeIndex);
  });
  scrollToCard(activeIndex);
}

function copyExport() {
  const text = document.getElementById('export-block').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copied-msg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  switch(e.key.toLowerCase()) {
    case 'j': setActive(activeIndex + 1); break;
    case 'k': setActive(activeIndex - 1); break;
    case 'o': setStatus(activeIndex, 'keep'); break;
    case 'x': setStatus(activeIndex, 'cut'); break;
    case 'e': toggleEdit(activeIndex); e.preventDefault(); break;
    case 'u': undo(activeIndex); break;
  }
});

// Init
loadState();
renderCards();
</script>
</body>
</html>
