// State
let decisions = {};
let activeIndex = 0;

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

// Render all cards
function renderCards() {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  items.forEach((item, i) => {
    const key = String(item.line);
    const d = decisions[key];
    const card = document.createElement('div');
    card.className = 'card' + (i === activeIndex ? ' active' : '') + (d ? ` decided-${d.action}` : '');
    card.id = `card-${i}`;
    card.onclick = () => { activeIndex = i; updateActive(); };

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.textContent = `#${i + 1} of ${items.length}  |  Line ${item.line}`;
    card.appendChild(meta);

    const text = document.createElement('div');
    text.className = 'card-text';
    text.textContent = d && d.action === 'edit' && d.edited ? d.edited : item.original;
    card.appendChild(text);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    if (!d) {
      const keepBtn = document.createElement('button');
      keepBtn.className = 'btn btn-keep';
      keepBtn.textContent = 'KEEP';
      keepBtn.onclick = (e) => { e.stopPropagation(); decide(i, 'keep'); };
      actions.appendChild(keepBtn);

      const editBtn = document.createElement('button');
      editBtn.className = 'btn btn-edit';
      editBtn.textContent = 'EDIT';
      editBtn.onclick = (e) => { e.stopPropagation(); openEdit(i); };
      actions.appendChild(editBtn);

      const cutBtn = document.createElement('button');
      cutBtn.className = 'btn btn-cut';
      cutBtn.textContent = 'CUT';
      cutBtn.onclick = (e) => { e.stopPropagation(); decide(i, 'cut'); };
      actions.appendChild(cutBtn);
    } else {
      const badge = document.createElement('span');
      badge.className = `decision-badge badge-${d.action}`;
      badge.textContent = d.action.toUpperCase() + (d.action === 'edit' ? 'ED' : d.action === 'cut' ? '' : '');
      actions.appendChild(badge);

      const undoBtn = document.createElement('button');
      undoBtn.className = 'btn btn-undo';
      undoBtn.textContent = 'Undo';
      undoBtn.onclick = (e) => { e.stopPropagation(); undo(i); };
      actions.appendChild(undoBtn);
    }
    card.appendChild(actions);

    // Edit area
    const editArea = document.createElement('div');
    editArea.className = 'edit-area';
    editArea.id = `edit-area-${i}`;

    const textarea = document.createElement('textarea');
    textarea.id = `edit-text-${i}`;
    textarea.value = item.original;
    editArea.appendChild(textarea);

    const saveRow = document.createElement('div');
    saveRow.className = 'edit-save-row';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-save-edit';
    saveBtn.textContent = 'Save Edit';
    saveBtn.onclick = (e) => { e.stopPropagation(); saveEdit(i); };
    saveRow.appendChild(saveBtn);
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel-edit';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = (e) => { e.stopPropagation(); closeEdit(i); };
    saveRow.appendChild(cancelBtn);
    editArea.appendChild(saveRow);

    card.appendChild(editArea);
    list.appendChild(card);
  });
}

function decide(index, action, edited) {
  const key = String(items[index].line);
  decisions[key] = { action };
  if (action === 'edit' && edited) decisions[key].edited = edited;
  saveState();

  // Auto-advance on first decision only
  const isFirstDecision = Object.keys(decisions).length === 1 || !decisions[key];
  if (action !== 'edit') {
    advanceToNext(index);
  }
  renderCards();
  updateStats();
  updateExport();
}

function advanceToNext(fromIndex) {
  // Find next undecided
  for (let i = fromIndex + 1; i < items.length; i++) {
    if (!decisions[String(items[i].line)]) {
      activeIndex = i;
      scrollToCard(i);
      return;
    }
  }
  // If none found after, look before
  for (let i = 0; i < fromIndex; i++) {
    if (!decisions[String(items[i].line)]) {
      activeIndex = i;
      scrollToCard(i);
      return;
    }
  }
}

function undo(index) {
  const key = String(items[index].line);
  delete decisions[key];
  activeIndex = index;
  saveState();
  renderCards();
  updateStats();
  updateExport();
}

function openEdit(index) {
  activeIndex = index;
  updateActive();
  const area = document.getElementById(`edit-area-${index}`);
  area.classList.add('visible');
  const ta = document.getElementById(`edit-text-${index}`);
  ta.value = items[index].original;
  ta.focus();
}

function closeEdit(index) {
  const area = document.getElementById(`edit-area-${index}`);
  area.classList.remove('visible');
}

function saveEdit(index) {
  const ta = document.getElementById(`edit-text-${index}`);
  const edited = ta.value.trim();
  if (edited && edited !== items[index].original) {
    decide(index, 'edit', edited);
  } else {
    decide(index, 'keep');
  }
  closeEdit(index);
  advanceToNext(index);
  renderCards();
}

function updateActive() {
  document.querySelectorAll('.card').forEach((c, i) => {
    c.classList.toggle('active', i === activeIndex);
  });
}

function scrollToCard(index) {
  const card = document.getElementById(`card-${index}`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function updateStats() {
  let keep = 0, edit = 0, cut = 0;
  Object.values(decisions).forEach(d => {
    if (d.action === 'keep') keep++;
    else if (d.action === 'edit') edit++;
    else if (d.action === 'cut') cut++;
  });
  const remaining = items.length - keep - edit - cut;
  const pct = Math.round(((keep + edit + cut) / items.length) * 100);

  document.getElementById('countKeep').textContent = keep;
  document.getElementById('countEdit').textContent = edit;
  document.getElementById('countCut').textContent = cut;
  document.getElementById('countRemaining').textContent = remaining;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

function updateExport() {
  const changes = [];
  items.forEach(item => {
    const key = String(item.line);
    const d = decisions[key];
    if (!d || d.action === 'keep') return;
    if (d.action === 'cut') {
      changes.push({ line: item.line, action: 'cut', original: item.original });
    } else if (d.action === 'edit') {
      changes.push({ line: item.line, action: 'edit', original: item.original, edited: d.edited, category: 'heartfelt' });
    }
  });
  document.getElementById('exportBox').textContent = JSON.stringify(changes, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportBox').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy JSON'; }, 2000);
  });
}

function resetAll() {
  if (confirm('Reset all decisions? This cannot be undone.')) {
    decisions = {};
    activeIndex = 0;
    saveState();
    renderCards();
    updateStats();
    updateExport();
    scrollToCard(0);
  }
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  // Skip if typing in textarea
  if (e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') {
      closeEdit(activeIndex);
      e.preventDefault();
    }
    return;
  }

  switch(e.key.toLowerCase()) {
    case 'j':
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      updateActive();
      scrollToCard(activeIndex);
      break;
    case 'k':
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      updateActive();
      scrollToCard(activeIndex);
      break;
    case 'o':
      e.preventDefault();
      if (!decisions[String(items[activeIndex].line)]) decide(activeIndex, 'keep');
      break;
    case 'e':
      e.preventDefault();
      if (!decisions[String(items[activeIndex].line)]) openEdit(activeIndex);
      break;
    case 'x':
      e.preventDefault();
      if (!decisions[String(items[activeIndex].line)]) decide(activeIndex, 'cut');
      break;
    case 'u':
      e.preventDefault();
      undo(activeIndex);
      break;
  }
});

// Init
loadState();
renderCards();
updateStats();
updateExport();
</script>
</body>
</html>
