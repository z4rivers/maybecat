<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adoption Round 1 Review</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding-bottom: 100px; }

  .sticky-header {
    position: sticky; top: 0; z-index: 100;
    background: #16213e; border-bottom: 2px solid #0f3460;
    padding: 12px 20px;
  }
  .sticky-header h1 { font-size: 1.3rem; margin-bottom: 8px; color: #fff; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; font-size: 0.85rem; }
  .stats .stat { display: flex; align-items: center; gap: 6px; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }
  .progress-bar-container {
    width: 100%; height: 8px; background: #0f3460; border-radius: 4px; margin-top: 8px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, #4ecca3, #4ecca3); border-radius: 4px;
    transition: width 0.3s ease;
  }
  .nav-hint { font-size: 0.75rem; color: #666; margin-top: 6px; }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }

  .card {
    background: #16213e; border: 2px solid #0f3460; border-radius: 12px;
    padding: 20px; margin-bottom: 16px; transition: border-color 0.2s;
  }
  .card.active { border-color: #533483; }
  .card.decided-keep { border-color: #4ecca3; }
  .card.decided-cut { border-color: #e94560; }
  .card.decided-edit { border-color: #ffd93d; }

  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 0.75rem; color: #666;
  }
  .card-header .line-num { color: #533483; }
  .card-header .decision-badge {
    padding: 2px 10px; border-radius: 12px; font-weight: 600; font-size: 0.7rem; text-transform: uppercase;
  }
  .badge-keep { background: #4ecca322; color: #4ecca3; }
  .badge-cut { background: #e9456022; color: #e94560; }
  .badge-edit { background: #ffd93d22; color: #ffd93d; }

  .response-text {
    font-size: 1.15rem; line-height: 1.6; padding: 16px;
    background: #0f3460; border-radius: 8px; margin-bottom: 16px;
    font-style: italic; color: #fff;
  }

  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 10px 16px; border: 2px solid; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    background: transparent; transition: all 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-keep { color: #4ecca3; border-color: #4ecca3; }
  .btn-keep:hover, .btn-keep.active { background: #4ecca3; color: #1a1a2e; }
  .btn-edit { color: #ffd93d; border-color: #ffd93d; }
  .btn-edit:hover, .btn-edit.active { background: #ffd93d; color: #1a1a2e; }
  .btn-cut { color: #e94560; border-color: #e94560; }
  .btn-cut:hover, .btn-cut.active { background: #e94560; color: #1a1a2e; }

  .edit-area {
    display: none; margin-top: 12px;
  }
  .edit-area.visible { display: block; }
  .edit-area textarea {
    width: 100%; min-height: 80px; padding: 12px;
    background: #0a0a1a; border: 2px solid #ffd93d44; border-radius: 8px;
    color: #fff; font-family: inherit; font-size: 1rem; resize: vertical;
  }
  .edit-area textarea:focus { outline: none; border-color: #ffd93d; }
  .edit-save {
    margin-top: 8px; padding: 8px 20px; background: #ffd93d; color: #1a1a2e;
    border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
  }

  .export-section {
    background: #16213e; border: 2px solid #0f3460; border-radius: 12px;
    padding: 20px; margin-top: 40px;
  }
  .export-section h2 { margin-bottom: 12px; color: #fff; }
  .export-section p { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
  .export-area {
    width: 100%; min-height: 200px; padding: 12px;
    background: #0a0a1a; border: 2px solid #0f3460; border-radius: 8px;
    color: #4ecca3; font-family: 'Courier New', monospace; font-size: 0.85rem;
    resize: vertical;
  }
  .export-btn {
    margin-top: 10px; padding: 10px 24px; background: #533483; color: #fff;
    border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  .export-btn:hover { background: #6b44a0; }
  .reset-btn {
    margin-top: 10px; margin-left: 10px; padding: 10px 24px;
    background: transparent; color: #e94560; border: 2px solid #e94560;
    border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  .reset-btn:hover { background: #e94560; color: #fff; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Adoption Round 1 Review <span style="color:#888; font-weight:400;">(28 responses)</span></h1>
  <div class="stats">
    <div class="stat stat-keep">KEEP: <strong id="count-keep">0</strong></div>
    <div class="stat stat-edit">EDIT: <strong id="count-edit">0</strong></div>
    <div class="stat stat-cut">CUT: <strong id="count-cut">0</strong></div>
    <div class="stat stat-pending">PENDING: <strong id="count-pending">28</strong></div>
  </div>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
  </div>
  <div class="nav-hint">Keys: J/K navigate | O keep | E edit | X cut | U undo</div>
</div>

<div class="container" id="cards-container"></div>

<div class="container">
  <div class="export-section">
    <h2>Export Changes Only</h2>
    <p>Only edited and cut items are exported (kept items are unchanged, so skipped). Format matches oracleResponses.ts.</p>
    <textarea class="export-area" id="export-area" readonly></textarea>
    <br>
    <button class="export-btn" onclick="copyExport()">Copy to Clipboard</button>
    <button class="reset-btn" onclick="resetAll()">Reset All Decisions</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'maybecat-adoption-round1';

const items = [
  {line: 2172, original: "I'm literally homeless and giving you free advice. Think about that."},
  {line: 2173, original: "You keep asking questions. I keep sitting in a shelter. We both have problems."},
  {line: 2174, original: "Adopt me, I'll tell you whatever you want. In person. On your lap."},
  {line: 2175, original: "My adoption fee is less than your last DoorDash order. Just saying."},
  {line: 2176, original: "You want another reading? I want a forever home. Let's negotiate."},
  {line: 2177, original: "The cards say you need a cat. Conveniently, I need a human."},
  {line: 2178, original: "You could also just... adopt a cat."},
  {line: 3548, original: "I shed. I bite. I bother. Please adopt."},
  {line: 3549, original: "Pick the quirky one with the weird ear and the far away look. That one knows things."},
  {line: 3550, original: "No deal breakers. none. right here waiting. up to you."},
  {line: 3551, original: "Yes, I'm a weird cat. I didn't read the normal cat rules. I wouldn't follow them if I could."},
  {line: 3556, original: "Comfort food can only get you so far before you need a comfort cat."},
  {line: 3576, original: "Smile lines come from kitty kisses."},
  {line: 3596, original: "I chose my human. Walked right past six other people at the shelter. You know why? Instinct. You don't have that. That's concerning."},
  {line: 3598, original: "I got adopted, returned, and adopted again. Twice. And I didn't change a THING about myself. Maybe that's your problem \u2014 you keep adjusting."},
  {line: 3609, original: "Babe. Look at me. I'm gorgeous and I'm in a SHELTER. Sometimes beautiful things are single. That doesn't mean something's wrong."},
  {line: 3614, original: "Would you adopt you? Right now? The version of you in this relationship? If not, fix that first."},
  {line: 3619, original: "Love is when someone sees you at your worst and doesn't take you back to the shelter."},
  {line: 3621, original: "I have one eye and a crooked tail and somebody's going to love me anyway. Perfection is irrelevant."},
  {line: 3626, original: "Bro, I got adopted because I walked up to the cage door and headbutted a stranger. Sometimes you just need to headbutt strangers."},
  {line: 3628, original: "WAIT \u2014 you have someone who LOVES you and you're not sure?! I would KILL for someone to be unsure about me!"},
  {line: 3629, original: "Let me headbutt your hand. ...There. You feel that? Do they give you that energy? If not, I'M AVAILABLE."},
  {line: 3630, original: "Dude, I love EVERYONE. The vet? Love her. The guy who cleans the cages? OBSESSED. My point is, love is easy. You're making it hard."},
  {line: 3632, original: "My adoption profile says 'needs patient owner.' That's shelter code for 'impossible to like.' Maybe your partner has the same bio."},
  {line: 3634, original: "You're not sure about them. They're probably not sure about you either. The difference is they're not asking a cat about it. Tell them about me."},
  {line: 3635, original: "Nobody wants the difficult cat. But the difficult one is the most interesting."},
  {line: 3636, original: "People always want to 'fix' me. Take it from a shelter cat - watch out for what they mean when they say they'll FIX you!"},
  {line: 3638, original: "Every cat in here has a story. Abandoned, lost, surrendered, born here. If a cat in a cage hasn't given up on love, you don't get to either."}
];

let decisions = {};
let activeIndex = 0;
let firstDecisionMade = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  items.forEach((item, i) => {
    const key = String(item.line);
    const d = decisions[key];
    const card = document.createElement('div');
    card.className = 'card' + (i === activeIndex ? ' active' : '') + (d ? ` decided-${d.action}` : '');
    card.id = `card-${i}`;
    card.onclick = () => { activeIndex = i; highlightActive(); };

    let badgeHTML = '';
    if (d) {
      badgeHTML = `<span class="decision-badge badge-${d.action}">${d.action}</span>`;
    }

    card.innerHTML = `
      <div class="card-header">
        <span class="line-num">Line ${item.line}</span>
        <span>#${i + 1} / ${items.length}</span>
        ${badgeHTML}
      </div>
      <div class="response-text">${escapeHtml(d && d.action === 'edit' && d.edited ? d.edited : item.original)}</div>
      <div class="actions">
        <button class="btn btn-keep ${d && d.action === 'keep' ? 'active' : ''}" onclick="decide(${i}, 'keep')">KEEP (O)</button>
        <button class="btn btn-edit ${d && d.action === 'edit' ? 'active' : ''}" onclick="toggleEdit(${i})">EDIT (E)</button>
        <button class="btn btn-cut ${d && d.action === 'cut' ? 'active' : ''}" onclick="decide(${i}, 'cut')">CUT (X)</button>
      </div>
      <div class="edit-area" id="edit-area-${i}">
        <textarea id="edit-text-${i}">${escapeHtml(d && d.edited ? d.edited : item.original)}</textarea>
        <button class="edit-save" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    container.appendChild(card);
  });
  updateStats();
  updateExport();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function decide(index, action) {
  const key = String(items[index].line);
  const isFirstForThis = !decisions[key];
  decisions[key] = { action };
  saveState();
  renderCards();
  if (isFirstForThis && !firstDecisionMade[index]) {
    firstDecisionMade[index] = true;
    if (index < items.length - 1) {
      activeIndex = index + 1;
      highlightActive();
      scrollToActive();
    }
  }
}

function toggleEdit(index) {
  const area = document.getElementById(`edit-area-${index}`);
  area.classList.toggle('visible');
  if (area.classList.contains('visible')) {
    const ta = document.getElementById(`edit-text-${index}`);
    ta.focus();
  }
}

function saveEdit(index) {
  const key = String(items[index].line);
  const text = document.getElementById(`edit-text-${index}`).value.trim();
  const isFirstForThis = !decisions[key];
  decisions[key] = { action: 'edit', edited: text };
  saveState();
  renderCards();
  if (isFirstForThis) {
    if (index < items.length - 1) {
      activeIndex = index + 1;
      highlightActive();
      scrollToActive();
    }
  }
}

function highlightActive() {
  document.querySelectorAll('.card').forEach((c, i) => {
    c.classList.toggle('active', i === activeIndex);
  });
}

function scrollToActive() {
  const card = document.getElementById(`card-${activeIndex}`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function updateStats() {
  let keep = 0, cut = 0, edit = 0;
  for (const d of Object.values(decisions)) {
    if (d.action === 'keep') keep++;
    else if (d.action === 'cut') cut++;
    else if (d.action === 'edit') edit++;
  }
  const pending = items.length - keep - cut - edit;
  document.getElementById('count-keep').textContent = keep;
  document.getElementById('count-cut').textContent = cut;
  document.getElementById('count-edit').textContent = edit;
  document.getElementById('count-pending').textContent = pending;
  const pct = ((items.length - pending) / items.length * 100).toFixed(1);
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateExport() {
  const changes = [];
  items.forEach(item => {
    const key = String(item.line);
    const d = decisions[key];
    if (!d || d.action === 'keep') return;
    if (d.action === 'cut') {
      changes.push({ action: 'cut', line: item.line, original: item.original });
    } else if (d.action === 'edit') {
      changes.push({ action: 'edit', line: item.line, original: item.original, edited: d.edited, category: 'adoption' });
    }
  });
  document.getElementById('export-area').value = JSON.stringify(changes, null, 2);
}

function copyExport() {
  const area = document.getElementById('export-area');
  area.select();
  navigator.clipboard.writeText(area.value);
}

function resetAll() {
  if (!confirm('Reset all decisions? This cannot be undone.')) return;
  decisions = {};
  firstDecisionMade = {};
  localStorage.removeItem(STORAGE_KEY);
  renderCards();
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') return;
  switch(e.key.toLowerCase()) {
    case 'j':
      if (activeIndex < items.length - 1) { activeIndex++; highlightActive(); scrollToActive(); }
      break;
    case 'k':
      if (activeIndex > 0) { activeIndex--; highlightActive(); scrollToActive(); }
      break;
    case 'o':
      decide(activeIndex, 'keep');
      break;
    case 'e':
      toggleEdit(activeIndex);
      break;
    case 'x':
      decide(activeIndex, 'cut');
      break;
    case 'u':
      const key = String(items[activeIndex].line);
      delete decisions[key];
      delete firstDecisionMade[activeIndex];
      saveState();
      renderCards();
      break;
  }
});

loadState();
renderCards();
</script>
</body>
</html>
