// State
let decisions = {};
let activeIndex = 0;
let autoAdvanceUsed = new Set();

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      decisions = parsed.decisions || {};
      activeIndex = parsed.activeIndex || 0;
      autoAdvanceUsed = new Set(parsed.autoAdvanceUsed || []);
    }
  } catch(e) { console.error('Failed to load state', e); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      decisions,
      activeIndex,
      autoAdvanceUsed: [...autoAdvanceUsed]
    }));
  } catch(e) { console.error('Failed to save state', e); }
}

// Render
function renderCards() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';

  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === activeIndex ? ' active' : '');
    card.id = 'card-' + i;

    const decision = decisions[i];
    if (decision) {
      card.classList.add('decided-' + decision.type);
    }

    const isTemplate = item.isTemplate;

    card.innerHTML = `
      <div class="card-meta">
        <span class="card-index">#${i + 1} of ${items.length}</span>
        <span class="card-line">L${item.line}</span>
        ${decision ? `<span class="card-decision ${decision.type}">${decision.type}${decision.type === 'edit' ? 'ed' : decision.type === 'cut' ? '' : ''}</span>` : ''}
      </div>
      ${isTemplate ? '<span class="template-badge">TEMPLATE</span>' : ''}
      <div class="response-text">${escapeHtml(isTemplate ? item.original : item.original)}</div>
      <div class="btn-group">
        <button class="btn btn-keep ${decision && decision.type === 'keep' ? 'selected' : ''}" onclick="decide(${i}, 'keep')">Keep</button>
        <button class="btn btn-edit ${decision && decision.type === 'edit' ? 'selected' : ''}" onclick="startEdit(${i})">Edit</button>
        <button class="btn btn-cut ${decision && decision.type === 'cut' ? 'selected' : ''}" onclick="decide(${i}, 'cut')">Cut</button>
        ${decision ? `<button class="btn btn-undo" onclick="undo(${i})">Undo</button>` : ''}
      </div>
      <div class="edit-area" id="edit-area-${i}">
        <textarea id="edit-text-${i}">${escapeHtml(decision && decision.type === 'edit' && decision.edited ? decision.edited : item.original)}</textarea>
        <button class="edit-save" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;

    // Show edit area if currently editing
    if (decision && decision.type === 'edit') {
      setTimeout(() => {
        const ea = document.getElementById('edit-area-' + i);
        if (ea) ea.classList.add('visible');
      }, 0);
    }

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
      setActive(i);
    });

    container.appendChild(card);
  });

  updateStats();
  updateExport();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function setActive(i) {
  if (i < 0 || i >= items.length) return;
  activeIndex = i;
  document.querySelectorAll('.card').forEach((c, idx) => {
    c.classList.toggle('active', idx === i);
  });
  document.getElementById('card-' + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
  saveState();
}

function decide(i, type) {
  const isFirstDecision = !decisions[i];
  decisions[i] = { type };
  saveState();
  renderCards();

  // Auto-advance on first decision only
  if (isFirstDecision && !autoAdvanceUsed.has(i)) {
    autoAdvanceUsed.add(i);
    // Find next undecided
    let next = i + 1;
    while (next < items.length && decisions[next]) next++;
    if (next < items.length) {
      setTimeout(() => setActive(next), 150);
    }
  }
}

function startEdit(i) {
  const existing = decisions[i];
  if (!existing || existing.type !== 'edit') {
    decisions[i] = { type: 'edit', edited: items[i].original };
  }
  saveState();
  renderCards();
  setTimeout(() => {
    const ea = document.getElementById('edit-area-' + i);
    if (ea) {
      ea.classList.add('visible');
      const ta = document.getElementById('edit-text-' + i);
      if (ta) ta.focus();
    }
  }, 50);
}

function saveEdit(i) {
  const ta = document.getElementById('edit-text-' + i);
  if (!ta) return;
  const isFirstDecision = !decisions[i] || decisions[i].type !== 'edit';
  decisions[i] = { type: 'edit', edited: ta.value };
  saveState();
  renderCards();

  if (isFirstDecision && !autoAdvanceUsed.has(i)) {
    autoAdvanceUsed.add(i);
    let next = i + 1;
    while (next < items.length && decisions[next]) next++;
    if (next < items.length) {
      setTimeout(() => setActive(next), 150);
    }
  }
}

function undo(i) {
  delete decisions[i];
  autoAdvanceUsed.delete(i);
  saveState();
  renderCards();
  setActive(i);
}

function updateStats() {
  let keep = 0, edit = 0, cut = 0;
  for (const k in decisions) {
    if (decisions[k].type === 'keep') keep++;
    else if (decisions[k].type === 'edit') edit++;
    else if (decisions[k].type === 'cut') cut++;
  }
  const remaining = items.length - keep - edit - cut;
  document.getElementById('keepCount').textContent = keep;
  document.getElementById('editCount').textContent = edit;
  document.getElementById('cutCount').textContent = cut;
  document.getElementById('remainingCount').textContent = remaining;

  const pct = ((keep + edit + cut) / items.length * 100).toFixed(1);
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateExport() {
  // Export changes only: edits and cuts (skip keeps)
  const changes = [];
  for (let i = 0; i < items.length; i++) {
    const d = decisions[i];
    if (!d) continue;
    if (d.type === 'cut') {
      changes.push({
        action: 'cut',
        line: items[i].line,
        text: items[i].original
      });
    } else if (d.type === 'edit') {
      changes.push({
        action: 'edit',
        line: items[i].line,
        original: items[i].original,
        edited: d.edited || items[i].original
      });
    }
  }
  document.getElementById('exportBox').textContent = JSON.stringify(changes, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportBox').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  // Don't capture when typing in textarea
  if (e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') {
      e.target.blur();
    }
    return;
  }

  switch(e.key.toLowerCase()) {
    case 'j':
      e.preventDefault();
      setActive(Math.min(activeIndex + 1, items.length - 1));
      break;
    case 'k':
      e.preventDefault();
      setActive(Math.max(activeIndex - 1, 0));
      break;
    case 'o':
      e.preventDefault();
      decide(activeIndex, 'keep');
      break;
    case 'e':
      e.preventDefault();
      startEdit(activeIndex);
      break;
    case 'x':
      e.preventDefault();
      decide(activeIndex, 'cut');
      break;
    case 'u':
      e.preventDefault();
      undo(activeIndex);
      break;
  }
});

// Init
loadState();
renderCards();
if (activeIndex > 0) {
  setTimeout(() => {
    document.getElementById('card-' + activeIndex)?.scrollIntoView({ block: 'center' });
  }, 100);
}
</script>
