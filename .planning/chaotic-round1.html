<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaotic Category — Round 1 (Comedian Voices Edition)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    padding-bottom: 120px;
  }

  /* Sticky Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #16162a;
    border-bottom: 1px solid #2a2a4a;
    padding: 16px 24px;
    backdrop-filter: blur(10px);
  }

  .header h1 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .header h1 span {
    color: #a855f7;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-total { background: #888; }
  .dot-kept { background: #4ecca3; }
  .dot-alt { background: #a855f7; }
  .dot-edited { background: #ffd93d; }
  .dot-cut { background: #e94560; }
  .dot-remaining { background: #555; }

  .stat-num {
    font-weight: 700;
    color: #fff;
    font-size: 1rem;
  }

  .progress-bar-container {
    width: 100%;
    height: 6px;
    background: #2a2a4a;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4ecca3, #a855f7);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .shortcuts-hint {
    font-size: 0.72rem;
    color: #666;
    margin-top: 6px;
  }

  .shortcuts-hint kbd {
    background: #2a2a4a;
    border: 1px solid #3a3a5a;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: monospace;
    color: #aaa;
    font-size: 0.7rem;
  }

  /* Cards */
  .items-container {
    max-width: 960px;
    margin: 24px auto;
    padding: 0 20px;
  }

  .item-card {
    background: #1e1e36;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    margin-bottom: 16px;
    padding: 20px 24px;
    transition: border-color 0.2s, box-shadow 0.2s;
    scroll-margin-top: 180px;
  }

  .item-card.focused {
    border-color: #a855f7;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
  }

  .item-card.decided-kept { border-left: 4px solid #4ecca3; opacity: 0.7; }
  .item-card.decided-alt { border-left: 4px solid #a855f7; opacity: 0.7; }
  .item-card.decided-edited { border-left: 4px solid #ffd93d; opacity: 0.7; }
  .item-card.decided-cut { border-left: 4px solid #e94560; opacity: 0.55; }
  .item-card.focused.decided-kept,
  .item-card.focused.decided-alt,
  .item-card.focused.decided-edited,
  .item-card.focused.decided-cut { opacity: 1; }

  .item-line {
    font-size: 0.72rem;
    color: #666;
    font-family: monospace;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .item-line .badge {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-kept { background: rgba(78, 204, 163, 0.2); color: #4ecca3; }
  .badge-alt { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
  .badge-edited { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
  .badge-cut { background: rgba(233, 69, 96, 0.2); color: #e94560; }

  .comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 16px;
  }

  @media (max-width: 700px) {
    .comparison {
      grid-template-columns: 1fr;
    }
  }

  .original-side {
    padding: 14px 16px;
    background: #16162a;
    border-radius: 8px;
    border: 1px solid #252545;
  }

  .original-side .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .original-side .text {
    color: #777;
    font-size: 0.9rem;
    font-style: italic;
    line-height: 1.5;
  }

  .alt-side {
    padding: 14px 16px;
    background: linear-gradient(135deg, #1e1e3a, #22224a);
    border-radius: 8px;
    border: 1px solid #3a3a6a;
  }

  .alt-side .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a855f7;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .alt-side .text {
    color: #f0f0f0;
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.55;
  }

  /* Buttons */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 7px 16px;
    border: 2px solid;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
    font-family: inherit;
    letter-spacing: 0.3px;
  }

  .btn:hover { transform: translateY(-1px); }

  .btn-keep { border-color: #4ecca3; color: #4ecca3; }
  .btn-keep:hover { background: rgba(78, 204, 163, 0.15); }
  .btn-keep.active { background: #4ecca3; color: #1a1a2e; }

  .btn-alt { border-color: #a855f7; color: #a855f7; }
  .btn-alt:hover { background: rgba(168, 85, 247, 0.15); }
  .btn-alt.active { background: #a855f7; color: #fff; }

  .btn-edit { border-color: #ffd93d; color: #ffd93d; }
  .btn-edit:hover { background: rgba(255, 217, 61, 0.15); }
  .btn-edit.active { background: #ffd93d; color: #1a1a2e; }

  .btn-cut { border-color: #e94560; color: #e94560; }
  .btn-cut:hover { background: rgba(233, 69, 96, 0.15); }
  .btn-cut.active { background: #e94560; color: #fff; }

  .btn-undo {
    border-color: #666;
    color: #888;
    margin-left: auto;
  }
  .btn-undo:hover { background: rgba(255, 255, 255, 0.05); }

  /* Edit area */
  .edit-area {
    display: none;
    margin-top: 12px;
  }

  .edit-area.visible { display: block; }

  .edit-area textarea {
    width: 100%;
    min-height: 80px;
    background: #16162a;
    border: 2px solid #ffd93d;
    border-radius: 8px;
    color: #f0f0f0;
    font-size: 0.95rem;
    padding: 12px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
  }

  .edit-area textarea:focus {
    outline: none;
    box-shadow: 0 0 12px rgba(255, 217, 61, 0.2);
  }

  .edit-actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }

  .btn-save-edit {
    padding: 6px 16px;
    background: #ffd93d;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-cancel-edit {
    padding: 6px 16px;
    background: transparent;
    color: #888;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Export section */
  .export-section {
    max-width: 960px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .export-section h2 {
    color: #fff;
    margin-bottom: 12px;
    font-size: 1.2rem;
  }

  .btn-export {
    padding: 12px 28px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    font-family: inherit;
    transition: transform 0.1s;
  }

  .btn-export:hover { transform: translateY(-2px); }

  .export-output {
    display: none;
  }

  .export-output.visible { display: block; }

  .export-output textarea {
    width: 100%;
    min-height: 300px;
    background: #0d0d1a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    color: #4ecca3;
    font-family: 'Consolas', 'Fira Code', monospace;
    font-size: 0.82rem;
    padding: 16px;
    line-height: 1.5;
    resize: vertical;
  }

  .export-stats {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 10px;
  }

  .btn-copy {
    padding: 8px 20px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }

  .btn-copy:hover { background: #3dbb92; }
</style>
</head>

  {"line":524,"original":"It's giving... something.","alternative":"It's giving... *long Tig Notaro pause* ...yeah, I'm not gonna say it. (Tig Notaro)","category":"chaotic"},
  {"line":525,"original":"Touch grass. Or don't. I never do.","alternative":"Touch grass? I touch EVERYTHING. Then I eat it. Then I throw it up on your rug. Full circle. (Ali Wong)","category":"chaotic"},
  {"line":526,"original":"Not me actually caring about this.","alternative":"*reaches one paw without getting up* I'm not invested. This paw is freelancing. (Demetri Martin)","category":"chaotic"},
  {"line":571,"original":"60% of the time, it works every time.","alternative":"Statistically, this is either brilliant or catastrophic. I did not run the numbers. I ate the numbers. (Julio Torres)","category":"chaotic"},
  {"line":574,"original":"Let it go. Let it gooo. I can't hold it back anymore.","alternative":"*knocks lamp off table* Let it GO. Let everything go. Gravity is doing the rest. Elsa was right. (John Mulaney)","category":"chaotic"},
  {"line":577,"original":"Pivot! PIVOT!","alternative":"*stuck sideways in doorframe* PIVOT. *still stuck* PIVOTTT. *falls through* Nailed it. Don't rewind. (Nate Bargatze)","category":"chaotic"},
  {"line":585,"original":"Sksksks.","alternative":"*chatters jaw at window* That's not a word. That's a THREAT. The bird knows. (Eric Andre)","category":"chaotic"},
  {"line":589,"original":"You guys are getting paid?","alternative":"Wait, there's a SYSTEM? And I'm not running it? *tail puffs* This is a violation. (Hasan Minhaj)","category":"chaotic"},
  {"line":591,"original":"Surprise, motherf—","alternative":"*drops from top of door* Surprise. *sits on your head* This is my territory now. Questions? No? Good. (Michelle Wolf)","category":"chaotic"},
  {"line":646,"original":"Thy mother was a hamster and thy father smelt of elderberries.","alternative":"I've met hamsters with more spine. *ears flatten* And elderberries with more personality. (Dorothy Parker)","category":"chaotic"},
  {"line":668,"original":"Chaos reigns.","alternative":"*knocks three things off counter in one fluid motion* Chaos doesn't reign. Chaos POURS. (Sam Morril)","category":"chaotic"},
  {"line":669,"original":"Some cats just want to watch the world burn.","alternative":"Watching the world burn is fine. Personally I prefer to be the match. *reaches one paw toward candle* (Anthony Jeselnik)","category":"chaotic"},
  {"line":670,"original":"Anarchy! Anarchy! Also, dinner?","alternative":"BURN IT ALL DOWN. *pauses* After dinner though. Revolution requires protein. (Stavros Halkias)","category":"chaotic"},
  {"line":671,"original":"YEET.","alternative":"*launches self off counter* YEET is not a word, it's a LIFESTYLE and I am its PROPHET. (Tim Robinson)","category":"chaotic"},
  {"line":672,"original":"Rules are for dogs.","alternative":"Dogs follow rules. Dogs also drink from toilets. Correlation isn't causation but I'm not ruling it out. (Demetri Martin)","category":"chaotic"},
  {"line":673,"original":"What's the worst that could happen? Actually, let's find out.","alternative":"What's the worst that could happen? *knocks vase toward edge* Let me just— *nudge* —conduct a study. (Nathan Fielder)","category":"chaotic"},
  {"line":674,"original":"I'm feral and I'm free.","alternative":"Domestication is a spectrum and I am NOT on it. *hisses at own reflection* (Taylor Tomlinson)","category":"chaotic"},
  {"line":676,"original":"*makes direct eye contact while doing the forbidden thing*","alternative":"*makes direct eye contact while knocking glass off counter* This is a RELATIONSHIP. Eye contact means I RESPECT you enough to let you watch. (Jerrod Carmichael)","category":"chaotic"},
  {"line":677,"original":"*screams into the void* The void screamed back. We're friends now.","alternative":"*screams into void* The void didn't scream back. It sent a voice memo. We're texting now. It's complicated. (Bo Burnham)","category":"chaotic"},
  {"line":678,"original":"Normal was never an option.","alternative":"Normal left the building. Normal took the stairs. Normal is in its car crying. *crab-walks past* (Maria Bamford)","category":"chaotic"},
  {"line":679,"original":"I've made my choice. It's violence.","alternative":"Peace was on the table. I knocked peace off the table. Now there's nothing on the table. *tail tip flicks* Perfect. (Sam Morril)","category":"chaotic"},
  {"line":680,"original":"*three claws in the curtain, one ripping, fully committed* Plans are for animals who can't improvise.","alternative":"*three claws deep in curtain, no exit strategy* Plans are a crutch. I prefer to be fully committed to something I can't explain. (James Acaster)","category":"chaotic"},
  {"line":760,"original":"What's in there? I need to know.","alternative":"Closed cabinet. Could be treats. Could be poison. Could be nothing. THE UNCERTAINTY IS UNACCEPTABLE. *rattles door* (Marc Maron)","category":"chaotic"},
  {"line":761,"original":"If there's a door, I'm going to look behind it.","alternative":"Behind every closed door is either something amazing or something I'll regret. Both are fine. OPEN IT. (Nikki Glaser)","category":"chaotic"},
  {"line":762,"original":"You opened something. I'm now involved.","alternative":"A bag crinkled. In THIS economy? I'm involved. I was ALWAYS involved. The bag just didn't know yet. (Hasan Minhaj)","category":"chaotic"},
  {"line":763,"original":"Is that new? I must investigate.","alternative":"Something new entered the house. It hasn't been sniffed. It hasn't been approved. We're operating outside protocol. (Nathan Fielder)","category":"chaotic"},
  {"line":764,"original":"What's that sound? I will find out.","alternative":"Sound came from the hallway. Could be a ghost. Could be the fridge. I will attack both to be safe. (Nate Bargatze)","category":"chaotic"},
  {"line":765,"original":"Every bag must be checked. Those are the rules.","alternative":"Unchecked bags are a security risk and I am HOMELAND SECURITY in this house. (Tim Robinson)","category":"chaotic"},
  {"line":766,"original":"A box arrived. This is now my business.","alternative":"A box arrived and I wasn't consulted. The box and I need to have a conversation ALONE. Leave. (Ziwe)","category":"chaotic"},
  {"line":772,"original":"Let me in. Actually, let me out. Actually, leave the door open.","alternative":"Let me in. *stands in doorway* Actually hold on. *one paw in, one paw out* I'm conducting a SURVEY. On DOORS. (Gary Gulman)","category":"chaotic"},
  {"line":774,"original":"Yes. Wait. No. Yes? Final answer: maybe.","alternative":"Committed to yes. Wait— *ears rotate independently* —the left ear says no. They've never disagreed before. This is a CONSTITUTIONAL CRISIS. (John Mulaney)","category":"chaotic"},
  {"line":775,"original":"I wanted up. Now I want down. Don't look at me like that.","alternative":"Wanting up and wanting down are the same want at different altitudes. Don't look at me like I'm wrong. I'm NEVER wrong. I'm just early. (James Acaster)","category":"chaotic"},
  {"line":793,"original":"Elevation is a state of mind. Also, I'm on the fridge.","alternative":"I'm on the fridge. Not because it's high. Because you CAN'T reach me here and that's the WHOLE POINT of architecture. (Fran Lebowitz)","category":"chaotic"},
  {"line":798,"original":"Rules are suggestions. I choose not to follow them.","alternative":"A rule is just a dare wearing a necktie. *steps onto counter* (Demetri Martin)","category":"chaotic"},
  {"line":799,"original":"That's not allowed? Interesting. Anyway.","alternative":"*already on the counter* Oh this isn't allowed? Wild. *sits down* So who's gonna do something about it. (Hannibal Buress)","category":"chaotic"},
  {"line":800,"original":"You said no. I heard 'not while you're watching.'","alternative":"The word 'no' has a silent 'when you leave the room' at the end. Look it up. (Matt Rife)","category":"chaotic"},
  {"line":801,"original":"Forbidden surfaces are just invitations.","alternative":"'Do Not Touch' signs are just reviews from people with no imagination. (Julio Torres)","category":"chaotic"},
  {"line":802,"original":"The counter is for cats. You just don't know it yet.","alternative":"Countertops were invented for cats. Everything else you do up here is trespassing. (Daniel Sloss)","category":"chaotic"},
  {"line":803,"original":"I go where I'm not supposed to. It's kind of my thing.","alternative":"If there's a place I shouldn't be, that's where I'm needed most. I'm basically an emergency responder. With fur. (Taylor Tomlinson)","category":"chaotic"},
  {"line":819,"original":"Hold on. I need to look perfect. Always.","alternative":"*licking paw mid-crisis* Appearance is armor. And I am FULLY ARMORED at all times. The house can burn. I'll look good in the ashes. (Ali Wong)","category":"chaotic"},
  {"line":820,"original":"This leg needs attention right now. Everything else can wait.","alternative":"This leg. RIGHT NOW. *licking intensely* Ask your question when I'm done. Could be hours. Could be never. (Tig Notaro)","category":"chaotic"},
  {"line":826,"original":"Sometimes catnip is the answer.","alternative":"Catnip isn't drugs. Catnip is CLARITY. Everything makes sense for exactly ninety seconds and then it doesn't and then you wake up under the couch. (Marc Maron)","category":"chaotic"},
  {"line":827,"original":"Have you considered catnip?","alternative":"Look, I'm not saying catnip fixes everything. I'm saying have you TRIED? No? Then how would you KNOW? (Bill Burr)","category":"chaotic"},
  {"line":828,"original":"This calls for catnip.","alternative":"Break glass in case of emergency. *breaks glass* *it was the catnip jar* Emergency. (Sam Morril)","category":"chaotic"},
  {"line":829,"original":"Catnip now. Regrets later. Worth it.","alternative":"Future me is gonna hate current me. Current me doesn't know future me. *rolls in catnip* We're strangers. (Taylor Tomlinson)","category":"chaotic"},
  {"line":832,"original":"Let go. Roll around. Feel nothing but joy.","alternative":"*rolls onto back, all four paws in air* This is what surrender looks like and it's MAGNIFICENT. Your move. (Stavros Halkias)","category":"chaotic"},
  {"line":833,"original":"The answer is recreational chaos.","alternative":"Recreational chaos isn't the ANSWER. It's the question, the answer, the thesis, and the rebuttal. All at once. On a Tuesday. (Bo Burnham)","category":"chaotic"},
  {"line":848,"original":"Purple.","alternative":"Hexagonal. *walks away* (Demetri Martin)","category":"chaotic"},
  {"line":849,"original":"Absolutely not. Wait. Absolutely yes.","alternative":"Hard no. Wait— *one ear swivels* —the universe just shifted. Hard yes. Don't ask which one because I already forgot. (Maria Bamford)","category":"chaotic"},
  {"line":853,"original":"The answer rhymes with 'yes.'","alternative":"The answer rhymes with 'mess' and starts with 'your.' (Anthony Jeselnik)","category":"chaotic"},
  {"line":854,"original":"Depends. Are you wearing socks?","alternative":"First: socks or no socks. Everything else is downstream of this decision and frankly I'm concerned you don't know that. (Gary Gulman)","category":"chaotic"},
  {"line":857,"original":"I'm legally required to say no.","alternative":"Per the terms of my agreement with the couch I'm not permitted to comment. (Julio Torres)","category":"chaotic"},
  {"line":858,"original":"Only in international waters.","alternative":"Domestic laws don't apply to creatures who've never acknowledged domestic anything. (Fran Lebowitz)","category":"chaotic"},
  {"line":861,"original":"It's a yes, but a weird yes.","alternative":"*one eye open, one eye closed* It's a yes but the yes is wearing a trench coat and won't show ID. (Nathan Fielder)","category":"chaotic"},
  {"line":862,"original":"Somewhere between 'maybe' and 'absolutely.'","alternative":"The answer lives between 'why would you' and 'obviously' and it's paying rent to both. (Aparna Nancherla)","category":"chaotic"},
  {"line":865,"original":"Plot twist.","alternative":"*stares at you* You thought this story was about you. *slow blink* Adorable. (Ziwe)","category":"chaotic"},
  {"line":874,"original":"Have you sniffed them properly?","alternative":"Did you get a good sniff or are you just going on VIBES? Vibes are unreliable. Smell is science. (Bill Burr)","category":"chaotic"},
  {"line":884,"original":"Taking all the blankets is valid.","alternative":"Blanket redistribution isn't theft, it's NATURAL SELECTION. The cold deserve to be cold. They weren't fast enough. (Daniel Sloss)","category":"chaotic"},
  {"line":890,"original":"Stealing their warm spot is a form of love.","alternative":"Their warm spot? Mine now. That's not theft. That's inheritance. They left. I arrived. The spot chose. (Hannibal Buress)","category":"chaotic"},
  {"line":900,"original":"Come closer. Closer. Too close.","alternative":"Closer. *pupils dilate* Closer. *claws extend* THAT'S TOO— *swipe* You learned something today. Class dismissed. (Matt Rife)","category":"chaotic"},
  {"line":903,"original":"3am has its own energy.","alternative":"3 AM is a lawless zone. What happens at 3 AM has no consequences at 7 AM. This is ESTABLISHED PRECEDENT. (Michelle Wolf)","category":"chaotic"},
  {"line":906,"original":"You could go all night if you wanted.","alternative":"Stamina is a choice and I've made mine. *runs lap around house at 3 AM* You're welcome for the alarm clock. (Nikki Glaser)","category":"chaotic"},
  {"line":907,"original":"I've been known to bite.","alternative":"*shows teeth* That's not a threat. That's a PREVIEW. Reviews are in: five stars, would recommend. (Anthony Jeselnik)","category":"chaotic"},
  {"line":909,"original":"I know where to put my tongue.","alternative":"Precision is underrated. *licks exact wrong spot at exact wrong time* I meant to do that. (Jerrod Carmichael)","category":"chaotic"},
  {"line":910,"original":"I make a lot of noise at 3am.","alternative":"3 AM vocal performance. No rehearsal. No audience. No apology. *YOWL* You're welcome. (Eric Andre)","category":"chaotic"},
  {"line":988,"original":"I found something in the drain. We're friends now.","alternative":"Pulled something out of the drain. Won't say what. Point is, it's ALIVE and I've named it. We're building something together. (Tim Robinson)","category":"chaotic"},
  {"line":990,"original":"I have been formally asked to leave every room I've ever entered and I keep getting invited back. Meow.","alternative":"Banned from every room. Welcomed back to every room. The problem isn't me. The problem is they keep putting rooms where I want to be. (Ramy Youssef)","category":"chaotic"},
  {"line":1019,"original":"The catnip is speaking. I must listen.","alternative":"*ears flatten* The nip said something and I'm not at liberty to discuss it with civilians.","category":"chaotic"},
  {"line":1022,"original":"I just realized that purring is just my motor running.","alternative":"So I'm just... vibrating? On purpose? And everyone's FINE with that?","category":"chaotic"},
  {"line":1023,"original":"The colors taste like Tuesday.","alternative":"Wednesday has a texture and it's damp corduroy. Don't look at me like that.","category":"chaotic"},
  {"line":1029,"original":"Have you ever really LOOKED at your paw?","alternative":"*holds paw up* There are BEANS on here. Did everyone know about the beans?","category":"chaotic"},
  {"line":1031,"original":"I think the floor is breathing but it's fine.","alternative":"The floor and I have reached an understanding. It moves, I don't mention it. Mutually assured denial.","category":"chaotic"},
  {"line":1033,"original":"Dude. Dude. The treat... IS the journey.","alternative":"What if... and stay with me here... what if the treat was inside us the whole time? *eats treat anyway*","category":"chaotic"},
  {"line":1035,"original":"I just understood something important but I already forgot it.","alternative":"Had the whole meaning of life for about three seconds. Gone now. Tasted purple.","category":"chaotic"},
  {"line":1036,"original":"The scritches... I can feel them in my SOUL.","alternative":"*vibrating* That scratch hit a frequency that restructured my personality. Who am I now.","category":"chaotic"},
  {"line":1042,"original":"We should order something.","alternative":"Is anyone else hungry or am I just existing near a crisis? Both feel the same.","category":"chaotic"},
  {"line":1043,"original":"I would destroy an entire rotisserie chicken right now.","alternative":"*pupils eclipse-black* That chicken did nothing to deserve what's about to happen to it.","category":"chaotic"},
  {"line":1044,"original":"Imagine if kibble was, like, infinite.","alternative":"Infinite kibble. Just... a forever amount. *stares into middle distance* I need to sit down. I'm already sitting.","category":"chaotic"},
  {"line":1047,"original":"Hear me out: salmon wrapped in more salmon.","alternative":"My pitch: salmon. My backup pitch: salmon inside salmon. My third pitch involves a heist.","category":"chaotic"},
  {"line":1050,"original":"I just thought about cheese for like ten minutes.","alternative":"Ten minutes on cheese. Not cheddar specifically. The concept. The AUDACITY of cheese existing.","category":"chaotic"},
  {"line":1053,"original":"I have achieved enlightenment. It tastes like chicken.","alternative":"Nirvana: achieved. Flavor profile: rotisserie. Regrets: that I didn't achieve it sooner.","category":"chaotic"},
  {"line":1060,"original":"I was going to do something but then I got comfortable.","alternative":"Had a whole plan. Very ambitious. Then the blanket happened and the plan didn't stand a chance.","category":"chaotic"},
  {"line":1061,"original":"What was I saying? Oh yeah. The thing.","alternative":"Important announcement. *long pause* ...The announcement has left the building.","category":"chaotic"},
  {"line":1062,"original":"I've been staring at this for an hour. It's a wall.","alternative":"Hour forty-seven of wall surveillance. The wall hasn't moved. Neither have I. We're in a standoff.","category":"chaotic"},
  {"line":1063,"original":"Wait, what were we talking about?","alternative":"I zoned out and built an entire civilization in my head. It fell. What were you saying?","category":"chaotic"},
  {"line":1064,"original":"I started chasing something and forgot what.","alternative":"Mid-pursuit I lost the plot. Still running though. Momentum is its own reason.","category":"chaotic"},
  {"line":1065,"original":"There was a thought here a second ago. It's gone now.","alternative":"Thought arrived. Thought left. Didn't even take its coat off.","category":"chaotic"},
  {"line":1066,"original":"I need to tell you something important. I forgot what it was.","alternative":"URGENT. CRITICAL. LIFE-ALTERING. *blinks* ...What was it. What was it.","category":"chaotic"},
  {"line":1067,"original":"This is fine. Everything is fine. What were we doing?","alternative":"Situation: nominal. Status: unclear. Vibes: structural. Follow-up questions: please don't.","category":"chaotic"},
  {"line":1069,"original":"My brain is buffering. Please wait.","alternative":"*loading bar at 12%* Consciousness arriving in... recalculating.","category":"chaotic"},
  {"line":1070,"original":"I have been sitting here for how long? Doesn't matter. Time is fake.","alternative":"Clocks are just circles with opinions. I reject them.","category":"chaotic"},
  {"line":1072,"original":"The answer is... wait, what was the question?","alternative":"I had the answer. Beautiful answer. Museum-quality. Gone. Like it was never here.","category":"chaotic"},
  {"line":1073,"original":"Something just happened. Or did it?","alternative":"Did you feel that? No? Interesting. Very interesting. *tail tip flicks*","category":"chaotic"},
  {"line":1074,"original":"I had a whole plan. It's vapor now.","alternative":"The plan was gorgeous. Seven steps. Color-coded. Then I saw a shadow move and we pivoted.","category":"chaotic"},
  {"line":1075,"original":"Very important thought incoming... and it's gone.","alternative":"BREAKING: thought arriving at gate 4. Update: thought has been rerouted. To nowhere.","category":"chaotic"},
  {"line":1076,"original":"I spaced out so hard I became one with the couch.","alternative":"There's a point where sitting becomes merging. I've crossed it. Send help or don't. I'm furniture now.","category":"chaotic"},
  {"line":1077,"original":"The world got really interesting and then I blinked.","alternative":"Blinked and missed an entire thing. The blink was worth it though. Excellent blink.","category":"chaotic"},
  {"line":1078,"original":"Did I say that out loud or just think it?","alternative":"That was supposed to be an inside thought. *ears flatten* How much did you hear.","category":"chaotic"},
  {"line":1079,"original":"I've been looking at this toy for twenty minutes. It hasn't moved. I might not have either.","alternative":"Staring contest with a felt mouse. Score: tied. Duration: unknowable. Stakes: everything.","category":"chaotic"},
  {"line":1080,"original":"Bro.","alternative":"Bro. *the longest pause in recorded history* ...Bro.","category":"chaotic"},
  {"line":1081,"original":"Dude.","alternative":"*one ear rotates toward you* ...Buddy.","category":"chaotic"},
  {"line":1082,"original":"Processing... processing... still processing...","alternative":"Hold on. *tail tip flicks* Still cooking. The answer is in the oven and the timer is broken.","category":"chaotic"},
  {"line":1088,"original":"The corporate ladder is just a scratching post with fluorescent lighting.","alternative":"They put a scratching post in the break room and called it a 'career path.' *ears flatten* The carpet is the same.","category":"chaotic"},
  {"line":1089,"original":"Burnout is just your soul trying to escape during a Zoom call. Let it.","alternative":"The call could have been an email. The email could have been silence. The silence could have been a nap.","category":"chaotic"},
  {"line":1094,"original":"Reply all was invented by someone who wanted to watch the world burn. Respect.","alternative":"*pushes Reply All* I know what I did. *watches* Beautiful.","category":"chaotic"},
  {"line":1110,"original":"I see dead people. They're mostly boring.","alternative":"Ghosts keep showing up. They all want to talk about their feelings. Even death doesn't fix that.","category":"chaotic"},
  {"line":1114,"original":"That's exactly what they want you to think.","alternative":"Oh you believe THAT? *leans in* Adorable. The birds aren't even real and you're worried about THIS.","category":"chaotic"},
  {"line":1120,"original":"*stares at wall intensely* You'll understand later.","alternative":"*stares at wall* I'm not going to explain what I see. When it happens, remember I tried to warn you by doing absolutely nothing.","category":"chaotic"},
  {"line":1121,"original":"RUN. I don't know why. Just RUN.","alternative":"GO. NOW. WHY? Doesn't matter. The instinct fired and we're honoring it.","category":"chaotic"},
  {"line":1122,"original":"*puffs up* I have my reasons.","alternative":"*puffs up to twice normal size* The reasons are classified. The puffing is voluntary. Questions will not be taken.","category":"chaotic"},
  {"line":1123,"original":"The cucumber was NOT there before.","alternative":"NEW OBJECT IN THE PERIMETER. This is not a drill. *sideways crab walk* I have NOT been briefed on this vegetable.","category":"chaotic"},
  {"line":1124,"original":"*sideways crab walk* This is a reasonable response.","alternative":"*moves laterally at alarming speed* This is proportional. You'd do the same if you had my information.","category":"chaotic"},
  {"line":1125,"original":"SOMETHING TOUCHED MY TAIL. Oh wait, it was my tail.","alternative":"ATTACKED. AMBUSHED. BY MY OWN— oh. Oh it's me. *grooms calmly* We will never speak of this.","category":"chaotic"},
  {"line":1126,"original":"Sudden movement detected. DEFCON 1.","alternative":"A plastic bag moved three rooms away and I'm already behind the toilet. Risk assessment: flawless.","category":"chaotic"},
  {"line":1127,"original":"I must zoom now. The reason is classified.","alternative":"Sprint initiated. Cause: redacted. Duration: until the wall. *thud* Duration: confirmed.","category":"chaotic"},
  {"line":1128,"original":"THE FLOOR IS DIFFERENT. I don't know how. But it is.","alternative":"Something changed about this floor. Molecularly. I can't prove it but I can feel it in my feet and my feet have never lied to me.","category":"chaotic"},
  {"line":1129,"original":"*ears back, eyes wide* It's probably fine. Probably.","alternative":"*ears flat* It's fine. I'm fine. Everything is— *flinches at air molecule* WHAT WAS THAT.","category":"chaotic"},
  {"line":1130,"original":"Alert. Alert. Bag made a noise.","alternative":"The bag spoke. No one is addressing this. I am the only one taking the bag seriously.","category":"chaotic"},
  {"line":1131,"original":"I must investigate this at maximum velocity.","alternative":"Speed: maximum. Plan: none. Direction: toward the thing. Outcome: we'll know when we get there.","category":"chaotic"},
  {"line":1132,"original":"INTRUDER. Oh. It's you. Still suspicious though.","alternative":"Oh it's you. That doesn't clear you. That's just proximity. I'm watching. I'm always watching.","category":"chaotic"},
  {"line":1141,"original":"Why am I smiling? Wouldn't you like to know.","alternative":"*slow grin* I know something that would ruin your whole evening. Anyway. How are you.","category":"chaotic"},
  {"line":1142,"original":"I've seen things. I'm not traumatized. I'm amused.","alternative":"Seen the void. The void is funnier than people think. Four stars. Would visit again.","category":"chaotic"},
  {"line":1146,"original":"The other side sends their regards. Also, jokes.","alternative":"Death called. Wanted to let you know the WiFi is great over there. And the cats — oh, the cats run everything.","category":"chaotic"},
  {"line":1154,"original":"A black cat crossed your path. You're welcome.","alternative":"Crossed your path on purpose. That wasn't luck. That was a house call. *tail flick* My rates are reasonable.","category":"chaotic"},
  {"line":1167,"original":"My brain is a wild jungle full of scary gibberish.","alternative":"Inside my head it's a swap meet at 3 AM and none of the vendors speak the same language. I'm thriving.","category":"chaotic"},
  {"line":1172,"original":"This calls for emergency tacos.","alternative":"Deploying the taco protocol. This is not negotiable. The tacos have been activated.","category":"chaotic"},
  {"line":1178,"original":"When in doubt, make a list. Then ignore the list.","alternative":"Made the list. Beautiful list. Laminated it. Put it on the fridge. Haven't looked at it since. System works.","category":"chaotic"},
  {"line":1179,"original":"I'm going to spiral now. I'll be back in an hour.","alternative":"Spiraling is just thinking with your whole body. I'll be back when the g-force stops.","category":"chaotic"},
  {"line":1180,"original":"I'm having a controlled meltdown. Very organized.","alternative":"Breakdown scheduled for 3:15. Color-coded. Tissues pre-staged. I run a tight emotional ship.","category":"chaotic"},
  {"line":1181,"original":"Three deep breaths and then we panic properly.","alternative":"Inhale. Exhale. Inhale. NOW SCREAM. That's the protocol. Wellness professionals HATE this.","category":"chaotic"},
  {"line":1191,"original":"Have you tried looking at someone until they help you?","alternative":"*unblinking stare* This is the technology. This is the whole technology. They'll crack eventually.","category":"chaotic"},
  {"line":1192,"original":"The dog method: make your problem someone else's problem.","alternative":"Dogs figured out the cheat code: look sad, get everything. Disgusting. *takes notes*","category":"chaotic"},
  {"line":1196,"original":"Sometimes the cat way is too complicated. Try stupid and enthusiastic.","alternative":"Overthinking lost. Running headfirst into a glass door won. I don't make the rules.","category":"chaotic"},
  {"line":1211,"original":"*sits on your keyboard* hjkfdhsjkfds. That's my answer.","alternative":"*sits on keyboard* asdfjkl; — and I STAND by that. More than I've ever stood by anything.","category":"chaotic"},
  {"line":1218,"original":"*types with butt* That's my input.","alternative":"*types with butt* That's the most honest thing either of us has said today.","category":"chaotic"},
  {"line":1227,"original":"*perks up* Did someone say sardines?","alternative":"*one ear rotates 180 degrees* Was that the S-word? The sacred S-word? My entire nervous system just fired.","category":"chaotic"},
  {"line":1229,"original":"I've been thinking about shrimp for three hours.","alternative":"Hour three of the shrimp meditation. No closer to shrimp. Closer to understanding shrimp on a molecular level.","category":"chaotic"},
  {"line":1235,"original":"*pupils dilate* Is that... is that SALMON?","alternative":"*entire body freezes* Is that sal— *pupils consume the iris* — it IS. Nobody move. Nobody BREATHE near my salmon.","category":"chaotic"},
  {"line":1237,"original":"I can hear the can opener from three rooms away. You can't hide.","alternative":"That can opener echoed through three walls and a closed door. My hearing is a weapon and I'm always armed.","category":"chaotic"},
  {"line":1241,"original":"I'm in the cupboard now. This is where I live.","alternative":"Moved into the cupboard. Non-negotiable. Send mail here. I've already redecorated.","category":"chaotic"},
  {"line":1242,"original":"You found me in the pot. I regret nothing.","alternative":"The pot chose me. I chose the pot. This is the most honest relationship I've ever had.","category":"chaotic"},
  {"line":1243,"original":"*from inside a drawer* What?","alternative":"*muffled, from inside a drawer* I live here now. Visiting hours are never.","category":"chaotic"},
  {"line":1246,"original":"You looked for me for an hour. I was on top of the fridge.","alternative":"Watched the search party from above. Thrilling. You checked behind the couch twice. Never once looked UP.","category":"chaotic"},
  {"line":1249,"original":"*emerges from somewhere impossible* You didn't see me.","alternative":"*materializes from inside a closed cabinet* The laws of physics are suggestions and I'm not a rule-follower.","category":"chaotic"},
  {"line":1252,"original":"*inside a paper bag* The acoustics in here are perfect.","alternative":"*from inside bag* The reverb in here is cathedral-grade. I'm performing a one-cat show. You're not invited.","category":"chaotic"},
  {"line":1255,"original":"*stalking through the ferns* I'm on a mission. Your question can wait.","alternative":"*belly-crawling through houseplants* This is black ops. Your little question can debrief me later.","category":"chaotic"},
  {"line":1257,"original":"*rustling sounds* I'm hunting. This is important.","alternative":"*violent rustling* Something in here owes me money. Or is a leaf. Either way, it's HANDLED.","category":"chaotic"},
  {"line":1258,"original":"The spider plant has intel. I'm extracting it.","alternative":"This plant knows something. The way it just... hangs there. Suspicious. I'm going in.","category":"chaotic"},
  {"line":1259,"original":"*pokes head out of foliage* I've been here for hours. You just noticed.","alternative":"*one eye visible through leaves* I've been embedded in this ficus since Tuesday. You walked past me eleven times.","category":"chaotic"},
  {"line":1260,"original":"*chewing something green* This is medicine. Probably.","alternative":"*chewing leaf* Self-prescribed. Self-diagnosed. The dosage is 'the whole plant.'","category":"chaotic"},
  {"line":1261,"original":"I knocked over the fern. On purpose. It was looking at me.","alternative":"The fern made eye contact first. I responded proportionally. The fern is on the floor now. Case closed.","category":"chaotic"},
  {"line":1262,"original":"*emerges with leaf on head* The mission was successful.","alternative":"*leaf crown, dirt on face* Decorated veteran of the houseplant campaign. Ask me about my service.","category":"chaotic"},
  {"line":1264,"original":"*buried in pothos* The jungle provides.","alternative":"*completely submerged in vines* This is my ecosystem now. I've adapted. I photosynthesize. Don't fact-check that.","category":"chaotic"},
  {"line":1274,"original":"*staring* I am processing this. It's taking a while.","alternative":"*staring* Listen, this is rendering. The render farm in my head has one server and it's on fire.","category":"chaotic"},
  {"line":1295,"original":"I was told not to be up here. I don't remember who told me that or why it matters.","alternative":"Rules were issued. I attended the meeting. Retained nothing. The counter remains occupied.","category":"chaotic"},
  {"line":1297,"original":"Forbidden? That's a strong word. I prefer 'discouraged.'","alternative":"'Off-limits' is a spectrum. I'm on the end where I'm still up here and you're still down there.","category":"chaotic"},
  {"line":1298,"original":"*pushes your coffee closer to the edge* I'm helping.","alternative":"*nudges coffee 1mm toward oblivion* This is performance art about impermanence. You're welcome.","category":"chaotic"},
  {"line":1299,"original":"You say 'down.' I hear 'wait until you leave.'","alternative":"'Down' is a request. I'm taking it under advisement. My advisors — also me — say no.","category":"chaotic"},
  {"line":1300,"original":"*on the stove* It's not on. Relax.","alternative":"*on stove* I assessed the risk. The risk is zero. The drama from you is a seven. Recalibrate.","category":"chaotic"},
  {"line":1315,"original":"I know where you sleep. I also know where the vet is. I'm connecting dots.","alternative":"Built a conspiracy board. Your photo. The vet's photo. Red string. *tail flick* The pattern is clear.","category":"chaotic"},
  {"line":1316,"original":"The carrier is out. I have already hidden. Good luck.","alternative":"The carrier appeared at 0700. I was behind the water heater by 0701. You'll need a SWAT team and better intel.","category":"chaotic"},
  {"line":1333,"original":"The tree needs supervision. I'm supervising it aggressively.","alternative":"Tree entered the premises without clearance. I'm conducting a thorough, full-contact security audit.","category":"chaotic"},
  {"line":1334,"original":"*batting ornament* This one was loose. I'm testing quality control.","alternative":"*ornament swinging* QA testing in progress. This one failed. And that one. And all of them, actually.","category":"chaotic"},
  {"line":1336,"original":"*inside the tree* This is my house now.","alternative":"*halfway up the tree* Annexed this. It's sovereign territory now. Fly a flag if you want, won't change anything.","category":"chaotic"},
  {"line":1337,"original":"The shiny things are alive. I'm sure of it. I'm investigating.","alternative":"These glass spheres have been watching me all December. SOMEONE needs to take this seriously.","category":"chaotic"},
  {"line":1338,"original":"*ornament crashes* That one was structurally unsound. You're welcome.","alternative":"*glass everywhere* Identified a structural failure in your decor. No need to thank me. Actually, do thank me.","category":"chaotic"},
  {"line":1339,"original":"I'm helping decorate. By rearranging. Aggressively.","alternative":"Redesigning the tree from the inside. Your aesthetic was... fine. Mine is better. Mine involves gravity.","category":"chaotic"},
  {"line":1340,"original":"*chewing on lights* These are festive snakes. They must be subdued.","alternative":"*biting lights* They're electric and they're ALIVE and I'm the only one dealing with it. As usual.","category":"chaotic"},
  {"line":1341,"original":"The tree topper is the final boss. I will defeat it.","alternative":"The star at the top is taunting me. It's been up there all month. Looking smug. Tonight it falls.","category":"chaotic"},
  {"line":1342,"original":"*lying under tree with tinsel on head* I am the gift.","alternative":"*draped in tinsel, pine needles in fur* I emerged from the tree as prophecy foretold. Behold.","category":"chaotic"},
  {"line":1344,"original":"*knocks over entire tree* ...I regret nothing.","alternative":"*tree horizontal, ornaments rolling in every direction* I'd do it again. Faster next time.","category":"chaotic"},
  {"line":1353,"original":"*grooms aggressively in the middle of your crisis* Continue. I'm listening.","alternative":"*vigorous self-grooming* Oh I hear you. This leg just needs me more right now. Emotionally.","category":"chaotic"},
  {"line":1354,"original":"*stares at corner* One moment. There's something important over there.","alternative":"*locked onto empty corner* There's a meeting happening in that corner and I wasn't invited. Unacceptable.","category":"chaotic"},
  {"line":1355,"original":"*suddenly sprints out of room* We'll continue this later.","alternative":"*vanishes mid-sentence* — URGENT ELSEWHERE. *distant crash* STILL URGENT.","category":"chaotic"},
  {"line":1356,"original":"*falls asleep mid-conversation* The answer is rest. Obviously.","alternative":"*eyes closing* Still listenin— *asleep* *twitches* —that's a no, by the way.","category":"chaotic"},
  {"line":1357,"original":"*knocks pen off desk* That's my answer.","alternative":"*pen clatters to floor* Deliberated for forty-five minutes. That's my ruling. Court adjourned.","category":"chaotic"},
  {"line":1358,"original":"*brings you a hair tie* I've solved your problem. You're welcome.","alternative":"*drops hair tie at your feet* That's the solution. Don't ask how I got it. The bathroom drawer will never be the same.","category":"chaotic"},
  {"line":1361,"original":"*chattering at bird through window* Sorry, what? I'm working.","alternative":"*jaw vibrating at bird* This is my JOB. My CAREER. Sorry you don't understand BIRD SURVEILLANCE.","category":"chaotic"},
  {"line":1365,"original":"I love you. Also, I'm biting you now. Both are true.","alternative":"*bites* That's affection. *bites harder* That's MORE affection. Stop screaming, this is INTIMACY.","category":"chaotic"},
  {"line":1366,"original":"Pet me. No, stop. Pet me again. That's too much. CONTINUE.","alternative":"Left hand: perfect. Right hand: how dare you. Both hands: HEAVEN. One hand: betrayal. This is FINE.","category":"chaotic"},
  {"line":1367,"original":"I wanted this. Now I don't. That's valid.","alternative":"Changed my mind. The mind was wrong before. It's wrong now too but it's DIFFERENT wrong. Progress.","category":"chaotic"},
  {"line":1368,"original":"Come closer. Closer. TOO CLOSE. *hiss* ...Why did you leave?","alternative":"The acceptable distance is exactly 4.7 inches. You were at 4.6. I had no choice. Come back. *at 4.7*","category":"chaotic"},
  {"line":1369,"original":"I rubbed against you because I love you. I'm now running away because I love you differently.","alternative":"Love has two speeds: full contact and full sprint. I switch between them based on data you don't have access to.","category":"chaotic"},
  {"line":1370,"original":"The belly is exposed. This is a trap. Or an invitation. Guess wrong and suffer.","alternative":"Belly's out. *eyes narrow* This is either trust or a murder setup. Your odds are 50/50 and I'm not telling you which.","category":"chaotic"},
  {"line":1371,"original":"*purring and biting simultaneously* This is normal.","alternative":"*purring* *biting* Dual-output system. The purr is love. The teeth are also love. Sharper love.","category":"chaotic"},
  {"line":1372,"original":"I want in. I want out. I want the door open but I won't go through it.","alternative":"Open the door. OPEN IT. *stares through open door* No. Close it. OPEN IT AGAIN. This is democracy.","category":"chaotic"},
  {"line":1373,"original":"Don't touch me. Why aren't you touching me?","alternative":"Hands OFF. *waits* ...Well? Was that your whole effort? Pathetic commitment to my contradictions.","category":"chaotic"},
  {"line":1374,"original":"I bit you because you stopped petting me. Also I bit you because you were petting me.","alternative":"The biting is consistent. The reasons change. I'm the only constant in this equation and I WILL not apologize.","category":"chaotic"},
  {"line":1382,"original":"*interrupts* Sorry, what? I was thinking about myself.","alternative":"*interrupts* Hold on. Something more important just happened. In my head. About me. Continue... actually no. Tell me more about me.","category":"chaotic"},
  {"line":1390,"original":"You'll find the hairball later. In your shoe. By accident.","alternative":"Left something in your shoe. Call it a severance package. *walks away with enormous dignity*","category":"chaotic"},
  {"line":1392,"original":"*maintains eye contact while pushing thing off table* This is for earlier.","alternative":"*eye contact, paw on vase* This is for what you did. *pushes* This is for what you're about to think. *crashes* Art.","category":"chaotic"},
  {"line":1393,"original":"I'm not saying I'm plotting revenge. I'm just saying check your shoes.","alternative":"No plans. None. Zero schemes. Completely unrelated: where do you keep your favorite things and when do you leave?","category":"chaotic"},
  {"line":1395,"original":"I'm going to vomit somewhere special. As a gift.","alternative":"Curating a bespoke vomit experience for you. Location hand-selected. Timing: when it hurts most.","category":"chaotic"},
  {"line":1398,"original":"That was rude. I'm going to sit on your pillow with my butt.","alternative":"Filing a formal complaint. With my butt. On your pillow. At night. While you're using it.","category":"chaotic"},
  {"line":1415,"original":"*grooming* Be patient— *lick* —with yourself— *lick* —and others— *lick* What was I saying?","alternative":"*lick* Wisdom incoming— *lick* —almost there— *lick lick lick* Where'd the wisdom go. The tongue took it.","category":"chaotic"},
  {"line":1418,"original":"*knocks over your water* Let go of what no longer serves you. Like this glass.","alternative":"*pushes glass* That represented your attachment to control. *glass shatters* Therapy complete. Venmo me.","category":"chaotic"},
  {"line":1419,"original":"*stretches* Reach for your goals. *stretches more* Reeeeeach. *falls over* Perfect.","alternative":"*stretches impossibly far* GOALS. REACHING. FURTHER. *topples* ...and that's why you need a safety net.","category":"chaotic"},
  {"line":1421,"original":"*batting at dust mote* Stay focused on what matters. *completely distracted* ...What matters again?","alternative":"*swatting air* Focus is about— oh a sparkle. ANYWAY focus is— another sparkle. I've lost the thesis.","category":"chaotic"},
  {"line":1428,"original":"*walks in, looks at you, walks out* That was the answer.","alternative":"*enters* *full eye contact* *turns around* *leaves* Delivered. Receipt in your inbox. Non-refundable.","category":"chaotic"},
  {"line":1435,"original":"It's 4am. Perfect time to discuss your problems. LOUDLY.","alternative":"4 AM. The hour of truth. SCREAM YOUR FEELINGS. The neighbors deserve to know too.","category":"chaotic"},
  {"line":1552,"original":"Thunder is just noise. Oh, my god - it's a noise - PANIC!","alternative":"Thunder: analyzed, assessed, deemed harmless. SECOND THUNDER: ALL BETS OFF. UNDER THE BED. NOW.","category":"chaotic"},
  {"line":1583,"original":"Sharp objects solve soft problems.","alternative":"*extends one claw* Every problem has a solution. Every solution has a point. This one is literal.","category":"chaotic"},
  {"line":1605,"original":"Touch-a touch-a touch me. On second thought, don't.","alternative":"Come here. Actually don't. Actually DO. But with the ENERGY of not. You know what, just look at me from over there with INTENT.","category":"chaotic"},
  {"line":1609,"original":"Into the wild. Back inside. Too wild.","alternative":"Went outside. The outside was... a lot. The door was right there. I took it. No regrets. Some regrets.","category":"chaotic"},
  {"line":1610,"original":"Delulu is the solulu.","alternative":"Reality is a construct and my construct has a hot tub and a shrimp bar. *tail flick* Your loss.","category":"chaotic"},
  {"line":1613,"original":"The vibes are off. Fix them.","alternative":"Something shifted. Can't name it. Can't fix it. CAN destroy the nearest decorative item about it though.","category":"chaotic"},
  {"line":1630,"original":"You're absolutely wrong, but you're right!","alternative":"Objectively terrible idea. Subjectively? *chef's kiss* GO. I'll watch from somewhere safe.","category":"chaotic"},
  {"line":1631,"original":"You're a genius! A beautiful disaster!","alternative":"That was the dumbest brilliant thing I've ever witnessed and I'm taking notes.","category":"chaotic"},
  {"line":1632,"original":"I support this terrible decision completely!","alternative":"Fully on board. Fully aware this is a wreck. *kneads blanket* My paws are clean.","category":"chaotic"},
  {"line":1633,"original":"I support this delusion completely!","alternative":"The delusion has my full endorsement. *ears forward* Ride it till the wheels come off. I'll watch.","category":"chaotic"},
  {"line":1638,"original":"I'm LIVID. About something. About what? I'll decide later!","alternative":"FURIOUS. TARGET: TBD. The rage showed up early and the reason is running late. WE START WITHOUT IT.","category":"chaotic"},
  {"line":1647,"original":"Yes. Make it weird.","alternative":"Green light. But weirder. Weirder than that. *pupils dilate* ...perfect.","category":"chaotic"},
  {"line":1650,"original":"Green light. Red flags. Go anyway.","alternative":"Every warning system is firing. Dashboard: fully lit. *puts paw on gas* I can't read dashboards.","category":"chaotic"},
  {"line":1677,"original":"Not the— okay actually yes the—","alternative":"Not the— actually— hmm— *recalculates* yeah no it's exactly the—","category":"chaotic"},
  {"line":1687,"original":"I'm very bothered but I'm GIVING unbothered.","alternative":"Core temperature: volcanic. External presentation: glacier. This is called RANGE.","category":"chaotic"},
  {"line":1688,"original":"I would not let that happen. *lets it happen*","alternative":"Absolutely would intervene. *watches from shelf* ...Any second now. *grooms paw* Mmm. Busy.","category":"chaotic"},
  {"line":1690,"original":"Normalize being a little unhinged.","alternative":"*ears in two different directions* Hinges are for doors. I'm not a door. Neither are you. Act accordingly.","category":"chaotic"},
  {"line":1691,"original":"I am feral. But like, in a self-aware way.","alternative":"Feral with paperwork. I've filed the forms. The forms say 'unhinged.' It's all very official.","category":"chaotic"},
  {"line":1696,"original":"Not me actually—","alternative":"*one ear back* Not me— or wait— actually— *tail tip flicks* ...no comment.","category":"chaotic"},
  {"line":1714,"original":"I solemnly swear I am up to no good. Obviously.","alternative":"Mischief managed. Poorly. But managed. The wreckage speaks for itself.","category":"chaotic"},
  {"line":1780,"original":"I'm going to clean my butt on the carpet.","alternative":"Initiating carpet protocol. This is consensual between me and the carpet. You're a bystander.","category":"chaotic"},
  {"line":1781,"original":"You're going to find a gift in your shoe.","alternative":"Curated a surprise for your left shoe. It's organic, locally sourced, and you won't enjoy it.","category":"chaotic"},
  {"line":1783,"original":"I could have done my last vomit outside. Chose not to.","alternative":"The vomit location was a creative decision. The rug has better acoustics.","category":"chaotic"},
  {"line":1795,"original":"Who's got problems? You do! Yes you do!","alternative":"Look at you with your little problems! Such big problems for such a little creature! Who's overwhelmed? YOU are!","category":"chaotic"},
  {"line":1804,"original":"I used to think that was a bad idea. I still do, but I used to, too.","alternative":"It was wrong then. It's wrong now. Beautiful consistency. *slow blink* I respect the commitment.","category":"chaotic"},
  {"line":1805,"original":"Every box is a opportunity. Some are also traps. The good ones are both.","alternative":"Trap and opportunity share a zip code. Move in anyway. Worst case: you're trapped somewhere interesting.","category":"chaotic"},
  {"line":1806,"original":"That's a red flag. But it's also a flag. And I love flags.","alternative":"*batting at red flag* It's moving. Anything that moves is a toy. Danger is just exciting fabric.","category":"chaotic"},
  {"line":1807,"original":"I don't have a solution, but I do admire the problem.","alternative":"No fix. Just appreciation. *tilts head* It's almost beautiful how wrong this went.","category":"chaotic"},
  {"line":1808,"original":"You miss 100% of the naps you don't take. Unrelated to your question.","alternative":"Every un-napped nap haunts me. Not relevant. But important. Arguably MORE important than whatever you said.","category":"chaotic"},
  {"line":1812,"original":"SOMEBODY STOP ME. Actually, don't. I'm onto something.","alternative":"HOLD ME BACK. *nobody holds me back* Good. Nobody should have. That was a test. LET'S GO.","category":"chaotic"},
  {"line":1814,"original":"I'm ready to get hurt again! Wait, was that the question?","alternative":"Emotional damage? Love it. Sign me up. Wait, is this about something specific? Doesn't matter. I'm in.","category":"chaotic"},
  {"line":1818,"original":"Sometimes you just gotta put it in your mouth and see.","alternative":"*chewing unknown object* Data collection in progress. Flavor: inconclusive. Texture: regrettable. Continuing study.","category":"chaotic"},
  {"line":1821,"original":"Lick it before you commit to it.","alternative":"Test lick first. Always. *lick* Nope. *lick* Maybe. *lick lick lick* ...we're doing this.","category":"chaotic"},
  {"line":1823,"original":"The hole is optional. The enthusiasm is not.","alternative":"Doesn't matter where. Matters that you GO. *headfirst into paper bag* COMMITMENT.","category":"chaotic"},
  {"line":1833,"original":"Rock bottom has a wine cellar and honestly... the company down there is better.","alternative":"Hit bottom. Turns out bottom has snacks and fewer people pretending to be okay. Upgraded, honestly.","category":"chaotic"},
  {"line":1835,"original":"I don't know what's happening but I'm confident it's happening.","alternative":"Can't name the situation. Fully committed to it. Confidence and understanding are different departments.","category":"chaotic"},
  {"line":1836,"original":"I've thought about this a lot. And then I stopped. And now I'm here.","alternative":"Deep thought. Deeper nap. Deepest: arriving here with no memory of the journey. Hello.","category":"chaotic"},
  {"line":1837,"original":"Everything is fine. I have no evidence for this. But everything is fine.","alternative":"Status report: fine. Source: me. Reliability of source: questionable. Adjusting nothing.","category":"chaotic"},
  {"line":1844,"original":"Is it stupid? Yes. Am I going to do it? Absolutely.","alternative":"Stupidity assessment: complete. Risk analysis: unfavorable. *already doing it* Noted.","category":"chaotic"},
  {"line":1847,"original":"Therapy taught me to name my feelings. I named them all 'complicated.'","alternative":"Named every feeling. All of them are Steve. Steve is having a rough week. We don't talk about Steve.","category":"chaotic"},
  {"line":1848,"original":"The vibe is off. I am the vibe. I am off. This tracks.","alternative":"*tail flick* Diagnosed the vibe. The vibe is me. Prescribed myself rest. The vibe remains unwell.","category":"chaotic"},
  {"line":1856,"original":"That's weird. Everything's weird. We're all just pretending it isn't.","alternative":"Normal is a setting on the dryer. Nothing else. *stretches* The dryer is broken too.","category":"chaotic"},
  {"line":1861,"original":"Logic? In THIS economy? In THIS emotional state?","alternative":"Oh you want LOGIC? *gestures at everything* In THESE conditions? With THESE paws?","category":"chaotic"},
  {"line":1881,"original":"I don't wait for opportunities. I create disturbances.","alternative":"*knocks thing off shelf* That's not chaos. That's a job opening I just created. Entrepreneurship.","category":"chaotic"},
  {"line":1882,"original":"Watch me pivot like this was the plan all along.","alternative":"*falls off counter, lands perfectly* Choreographed. Every second. Including the part where my face hit the floor. DANCE.","category":"chaotic"},
  {"line":1889,"original":"The anxiety isn't lying. It's just bad at math.","alternative":"Anxiety does the risk assessment. Anxiety uses a calculator from 1987. The numbers are technically real. Just wrong.","category":"chaotic"},
  {"line":1904,"original":"I say 'I don't know' a lot. I know a lot of things. I just don't know if I know them correctly.","alternative":"Full of information. Confidence in information: unclear. Delivering it anyway. At volume.","category":"chaotic"},
  {"line":1905,"original":"Anxiety is just your brain being REALLY helpful about things that MIGHT happen! Thanks, brain! I hate it!","alternative":"*ears rotating independently* My brain prepared twelve disaster scenarios for this conversation. We're on scenario four. It's going GREAT.","category":"chaotic"},
  {"line":1907,"original":"I'm not avoiding my feelings. I'm just... scheduling around them indefinitely.","alternative":"Feelings are on the calendar. *checks calendar* Oh look, they got bumped. Again. By more feelings. It's feelings all the way down.","category":"chaotic"},
  {"line":1916,"original":"You're not the disaster you think you are. You're a different disaster.","alternative":"The disaster is real. But it's the WRONG disaster. The one you're worried about isn't even the one happening. Surprise.","category":"chaotic"},
  {"line":1924,"original":"Failed upward. Trajectory holds.","alternative":"Fell up the stairs. Still arrived. First to arrive, actually. *grooms casually*","category":"chaotic"},
  {"line":1925,"original":"Duct tape solution. Duct tape holds.","alternative":"Solution: ugly. Structural integrity: somehow perfect. Engineering degree: not required. Never was.","category":"chaotic"},
  {"line":1926,"original":"Half-assed but whole-hearted. Acceptable trade.","alternative":"Gave 50% effort. But the 50% came from the deepest part of me. So emotionally? You got 150%.","category":"chaotic"},
  {"line":1935,"original":"I've heard it both ways.","alternative":"*one ear forward, one ear back* Literally hearing it both ways right now. The ears can't agree. Neither can I.","category":"chaotic"},
  {"line":1941,"original":"Allegedly.","alternative":"*tail tip flicks* Alleged by whom. Under what conditions. *grooms paw* My legal team will be in touch.","category":"chaotic"},
  {"line":1951,"original":"Practice makes... predictable.","alternative":"Did it perfectly. Again. And again. Now everyone expects it and the magic is gone. Mastery is a prison.","category":"chaotic"},
  {"line":1961,"original":"I came here with a purpose. I forget what. But I'm staying.","alternative":"Arrived with purpose. Purpose evaporated. Staying because leaving would acknowledge the failure. *sits down* This is where I live now.","category":"chaotic"},
  {"line":1973,"original":"You are enough. Also, add more butter.","alternative":"Perfect as you are. *stares* But if you're cooking, more butter. Always more butter. That's not advice, that's physics.","category":"chaotic"},
  {"line":1974,"original":"Rub the belly. Not yours.","alternative":"*rolls over* The belly is available. Brief window. Clock is ticking. This is not about YOUR belly.","category":"chaotic"},
  {"line":1977,"original":"Total loss. Pop the champagne.","alternative":"It's destroyed. Completely. *pops cork* We're celebrating the CLARITY. Nothing left to worry about.","category":"chaotic"},
  {"line":1982,"original":"In an attempt to kill a fly, pop a cork!","alternative":"The fly is still alive. The champagne is open. The lamp is broken. Net positive.","category":"chaotic"},
  {"line":2001,"original":"The hardest part is starting. Avoid starting.","alternative":"Skip the first step. Skip the second one too. *ears flatten* Congratulations, you finished.","category":"chaotic"},
  {"line":2010,"original":"Chaos goblin dispensing wisdom from the dumpster fire.","alternative":"*tail lashes* The dumpster is on fire but the acoustics in here are INCREDIBLE.","category":"chaotic"},
  {"line":2011,"original":"You're right and everyone else is an idiot.","alternative":"Statistically improbable. Emotionally? Airtight.","category":"chaotic"},
  {"line":2013,"original":"Rules are for people who get caught.","alternative":"Laws are just suggestions with consequences. *stretches* I don't recognize either.","category":"chaotic"},
  {"line":2014,"original":"Every religion would condemn this. Every therapist would flag it. *pupils fully dilated* Are you convinced?","alternative":"*pupils fully dilated* Every sacred text says no. Every licensed professional says absolutely not. The cat's tail is wagging. Cats don't wag.","category":"chaotic"},
  {"line":2015,"original":"Morally wrong but probably satisfying.","alternative":"Ethically? A war crime. Emotionally? Michelin star.","category":"chaotic"},
  {"line":2016,"original":"FAFO. Report back.","alternative":"The experiment begins. *knocks your water glass to the edge* I'll be watching from up here.","category":"chaotic"},
  {"line":2031,"original":"Your anxiety has anxiety. It's anxieties all the way down.","alternative":"*one ear rotates* The anxiety hired a subcontractor. The subcontractor unionized.","category":"chaotic"},
  {"line":2035,"original":"Inside you there are two wolves. They're both doom-scrolling.","alternative":"Inside every person: two wolves. One doomscrolls. The other one also doomscrolls but feels guilty about it.","category":"chaotic"},
  {"line":2044,"original":"The light at the end of the tunnel is sometimes an oncoming train, but at least it's light.","alternative":"Good news: there IS a light at the end of the tunnel. Bad news: it has a schedule and you're standing on the tracks.","category":"chaotic"},
  {"line":2048,"original":"I've made a decision and I'm furious about it.","alternative":"*ears back* Made the call. Hate it. Doing it anyway. Everyone step back.","category":"chaotic"},
  {"line":2049,"original":"Reasonable? REASONABLE? I've never been reasonable in my LIFE.","alternative":"Name ONE time being reasonable got anyone a statue. *chatters jaw* Exactly.","category":"chaotic"},
  {"line":2050,"original":"Started none of this. Finishing all of it. You're welcome.","alternative":"Didn't ask to be involved. Am now running the operation. *tail flick* Restructuring begins Monday.","category":"chaotic"},
  {"line":2053,"original":"The vibes are... structural. Does that make sense? It doesn't have to.","alternative":"*stares at corner of room* The geometry of this feeling is... load-bearing? I don't know. I don't know what I know.","category":"chaotic"},
  {"line":2060,"original":"Did that make sense? Doesn't matter. I'm committed now.","alternative":"I'M NOT DONE. I know it sounds wrong. It IS wrong. But I've committed and pulling out now would be WORSE.","category":"chaotic"},
  {"line":2061,"original":"I have a theory. It's wrong. But I have it.","alternative":"Formulated a hypothesis. Tested it. Negative results. Publishing anyway.","category":"chaotic"},
  {"line":2065,"original":"The brain chemistry is braining. Nothing to be done.","alternative":"Serotonin left. Didn't leave a note. *tail tip flicks* Cortisol moved in same day. Suspicious.","category":"chaotic"},
  {"line":2066,"original":"I've compartmentalized this beautifully. The compartment is on fire but it's contained.","alternative":"Built a box for the bad feelings. Box caught fire. Built a box for the fire. *slow blink* System works.","category":"chaotic"},
  {"line":2067,"original":"I can't tell if this is a panic attack or just being awake.","alternative":"Consciousness or crisis? The symptoms are identical and the copay is the same.","category":"chaotic"},
  {"line":2087,"original":"Toxic? Maybe. But the chemistry is real. That's how poison works.","alternative":"*pupils dilate* The poison tastes amazing, actually. Five stars. Would ingest again.","category":"chaotic"},
  {"line":2092,"original":"Your coping mechanism has coping mechanisms. It's a whole system.","alternative":"The coping mechanisms formed a union. They're negotiating benefits. *kneads air* I'm their shop steward.","category":"chaotic"},
  {"line":2093,"original":"I'm self-aware about my lack of self-awareness. That's growth.","alternative":"Awareness of the problem IS the problem now. *licks paw* Meta-dysfunction. Very evolved.","category":"chaotic"},
  {"line":2108,"original":"Your body keeps score and the score is chaotic.","alternative":"*ears flatten* The scoreboard caught fire during the second quarter and nobody stopped the game.","category":"chaotic"},
  {"line":2110,"original":"I've made peace with my demons. They live here now. We have a system.","alternative":"The demons and I have a chore wheel. Wednesday is their turn to vacuum.","category":"chaotic"},
  {"line":2119,"original":"You're not paranoid if they're actually out to get you. They're not. But you could be.","alternative":"Just because nobody's plotting against you doesn't mean the INFRASTRUCTURE isn't hostile. *one ear rotates toward the vent*","category":"chaotic"},
  {"line":2121,"original":"My brain is a haunted house and I live here. It's fine. It's not fine. It's fine.","alternative":"The haunted house has a mortgage and the ghosts are HOA members. *tail wraps tight* Can't afford to move.","category":"chaotic"},
  {"line":2122,"original":"I've named my intrusive thoughts. We're not friends but we have boundaries.","alternative":"Named the intrusive thoughts. Greg is the loud one. Greg has a point sometimes. *stares at wall* Shut up, Greg.","category":"chaotic"},
  {"line":2123,"original":"The voices in my head have opinions and most of them are wrong.","alternative":"Internal committee voted. Results: three yes, two no, one abstained, one filed a counter-proposal in ALL CAPS.","category":"chaotic"},
  {"line":2137,"original":"The internet has opinions. All of them are wrong. Including this one.","alternative":"Seven billion opinions. Zero consensus. *slow blink* Mine is also wrong. But it's MINE and it's warm.","category":"chaotic"},
  {"line":2141,"original":"Inside you there's a feral creature. Let her out. Occasionally. With supervision.","alternative":"*chatters jaw at nothing* Something feral lives in your chest. Stop feeding it salads and apologies.","category":"chaotic"},
  {"line":2142,"original":"You contain multitudes. One of the multitudes is unhinged. Embrace her.","alternative":"Multitudes confirmed. One of them just shattered a vase and felt ALIVE. *pupils dilate* That's the one. Follow her.","category":"chaotic"},
  {"line":2143,"original":"You're not dramatic. You're EXPRESSIVE. There's a difference. Sort of.","alternative":"The DRAMA accusation! From THEM! *tail puffs* I am a VESSEL for FEELINGS and they call it DRAMA?","category":"chaotic"},
  {"line":2147,"original":"Some bridges deserve to be burned. Bring marshmallows.","alternative":"*ears perk* Burn the bridge. Warm your paws by the flames. Roast something. It's called efficiency.","category":"chaotic"},
  {"line":2154,"original":"You're alive! That's insane! You're a consciousness having an experience!","alternative":"ATOMS! You're ATOMS that KNOW THEY'RE ATOMS! *zooms across room* WHAT!","category":"chaotic"},
  {"line":2159,"original":"Everything is terrible and also hilarious. Both. At once.","alternative":"The building is collapsing AND it's the funniest thing that's ever happened. *kneads rubble* This is fine art.","category":"chaotic"},
  {"line":2161,"original":"The world is a garbage fire. But it's OUR garbage fire. Cozy.","alternative":"*curls up next to the dumpster fire* Excellent warmth. Good crackle. Smells like community.","category":"chaotic"},
  {"line":2162,"original":"Be brave! Or don't! Both have consequences! Fun!","alternative":"Option A: catastrophe. Option B: different catastrophe. Option C doesn't exist but I keep looking for it.","category":"chaotic"},
  {"line":2168,"original":"The situation is absurd. Embrace the absurdity. I certainly have.","alternative":"*lies down in the middle of the chaos* Oh this? No, I live here. This is my spot now.","category":"chaotic"},
  {"line":2192,"original":"The heart does not want the brain involved in big decisions.","alternative":"Heart submitted the paperwork. Brain filed an objection. *tail flick* Heart already left the building.","category":"chaotic"},
  {"line":2219,"original":"Absolutely unhinged. Proceed.","alternative":"*one ear back* Clinically inadvisable. Spiritually essential. Green light.","category":"chaotic"},
  {"line":2220,"original":"I'm not sorry and I'm not done.","alternative":"*claws out* Apology not loading. Please hold. *claws retract, extend again* Actually no. We're going again.","category":"chaotic"},
  {"line":2222,"original":"Disaster is flirting back.","alternative":"*pupils fully dilated* Catastrophe just winked at me. I winked back. We're going to dinner.","category":"chaotic"},
  {"line":2227,"original":"Both. At the same time.","alternative":"Why pick a lane when lanes are a social construct? *walks diagonally across the room*","category":"chaotic"},
  {"line":2230,"original":"Nobody's more surprised than me.","alternative":"Genuinely did not see that coming. *stares at own tail* I don't see most things coming.","category":"chaotic"},
  {"line":2234,"original":"Send it. Unseasoned. At full volume. Tonight-you is in charge.","alternative":"Draft? Proofread? *bats phone off table* Sent. Raw. Midnight rules now.","category":"chaotic"},
  {"line":2235,"original":"I already sent it. From your phone. While you were reading this.","alternative":"*sitting on your phone, looking innocent* What text? Oh THAT text. Yeah. You're welcome. Check your outbox.","category":"chaotic"},
  {"line":2240,"original":"I think so? Don't quote me.","alternative":"I think so? I don't know. I'm a cat. *long pause* But I think... yeah. Maybe. I should stop talking.","category":"chaotic"},
  {"line":2244,"original":"Come closer. I don't bite. Much.","alternative":"*shows teeth* These are decorative. Mostly. Come find out the percentage.","category":"chaotic"},
  {"line":2259,"original":"Date idea: looking for treasures in the sandbox.","alternative":"*digs aggressively* Found something. It's mine. Actually it's terrible. Still mine.","category":"chaotic"},
  {"line":2268,"original":"*sits on your phone* Not tonight.","alternative":"*sits on phone with full body weight* Oh, were you going to use this? To do what? Be brave? *settles deeper* No.","category":"chaotic"},
  {"line":2283,"original":"*rolls onto back* Trust fall. Your turn.","alternative":"*belly fully exposed, claws slightly out* I'm being vulnerable. This is what it looks like. ONE wrong move and we're in the ER.","category":"chaotic"},
  {"line":2291,"original":"*chirps* That's a yes. A weird yes.","alternative":"*chirps twice* That sound wasn't in the manual. I'm going with it. *chirps again* It's a thing now.","category":"chaotic"},
  {"line":2294,"original":"*sits in the exact center of your crisis* What.","alternative":"*sits directly on the important paperwork* Oh this is load-bearing? *doesn't move* My condolences.","category":"chaotic"},
  {"line":2302,"original":"*sits on keyboard* Conversation over. Go outside.","alternative":"*sits on keyboard, types 'hhhhhhhhhh'* That's my input. Meeting adjourned. Touch something green.","category":"chaotic"},
  {"line":2314,"original":"*head tilt* I understood about 40% of that. The 40% was enough.","alternative":"*head tilt* I caught maybe three words. But the ENERGY told me everything. Proceed with the energy.","category":"chaotic"},
  {"line":2319,"original":"That question just walked in and sat down uninvited.","alternative":"That question kicked the door in wearing boots. *ears flatten* We're all just sitting here now.","category":"chaotic"},
  {"line":2336,"original":"Fine. Do it. I'm tired of watching you not do it.","alternative":"DO IT. *stares* Do the thing. I have been watching you NOT do the thing for SO LONG. The not-doing is killing me.","category":"chaotic"},
  {"line":2342,"original":"In terms of bad decisions, this one has real potential.","alternative":"On a scale of one to setting-your-own-house-on-fire, this registers a solid 'interesting.' *tail tip flicks*","category":"chaotic"},
  {"line":2346,"original":"This has all the ingredients of a mistake and none of the hesitation.","alternative":"Beautiful form. Perfect execution. Completely wrong target. *slow blink* Chef's kiss on the disaster.","category":"chaotic"},
  {"line":2349,"original":"That's the kind of plan that only works if nobody thinks about it.","alternative":"Don't explain the plan. The plan cannot survive being explained. *ears back* Just... go.","category":"chaotic"},
  {"line":2350,"original":"Let me get this straight. No. I will not be getting this straight.","alternative":"Wait wait wait. *tail lashes* No. I don't want to understand this. Understanding it would make me an accomplice.","category":"chaotic"},
  {"line":2354,"original":"I have no authority here and yet somehow I'm in charge.","alternative":"Nobody elected me. Nobody asked me. *sits on the highest shelf* And yet here we are, subjects.","category":"chaotic"},
  {"line":2360,"original":"I'd help but I genuinely don't know what we're doing.","alternative":"I'd offer guidance but I wandered in here three minutes ago and I think this is a different room than where I started.","category":"chaotic"},
  {"line":2362,"original":"I think the answer is yes but I've been wrong a lot.","alternative":"My track record suggests I should say the opposite of whatever I think. I think yes. So... *stares into distance*","category":"chaotic"},
  {"line":2363,"original":"I'm gonna say yes but in a way where if it goes wrong I said maybe.","alternative":"Official answer: a legally distinct nod. *nods ambiguously* My attorney will be in touch.","category":"chaotic"},
  {"line":2365,"original":"That was brave. Or it was... I don't know what the other word is.","alternative":"Brave? Reckless? *long pause* There's a word between those two that I can't find. You're THAT word.","category":"chaotic"},
  {"line":2366,"original":"If you're asking me for permission, I don't... I mean, I'm a cat.","alternative":"I can't authorize this. I'm a cat. *looks around* But nobody else showed up, so... *stamps invisible form*","category":"chaotic"},
  {"line":2373,"original":"Confidence is attractive. Delusion is confident. So. Math.","alternative":"*pupils dilate* Delusion is just confidence that hasn't checked its email yet.","category":"chaotic"},
  {"line":2375,"original":"Your heart has a terrible sense of direction.","alternative":"*watches you walk into the glass door again* GPS recalculating. GPS has given up. GPS is drinking.","category":"chaotic"},
  {"line":2401,"original":"The trajectory concerns me.","alternative":"*one ear rotates* Plotting the arc of this decision on a graph would get you flagged by the FAA.","category":"chaotic"},
