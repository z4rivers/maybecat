  {"line":2403,"original":"Is it YOUR bad idea? Good. Ownership matters.","alternative":"At least it's an ORIGINAL disaster. *tail flick* Bespoke catastrophe. Hand-crafted. Artisanal ruin.","category":"chaotic"},
  {"line":2419,"original":"We're both up? FINE. Let's go.","alternative":"*4 AM, both awake* Alright. ALRIGHT. We're doing this. Neither of us chose to be conscious but HERE WE ARE.","category":"chaotic"},
  {"line":2423,"original":"The way you stress-eat is like watching an artist work.","alternative":"The rhythm. The commitment. The sheer VOLUME. *ears forward* Emotional eating as performance art. Bravo.","category":"chaotic"},
  {"line":2457,"original":"I'm under the couch. I'm working from home.","alternative":"Office hours: never. Location: classified. *tail visible under couch* Accepting no meetings.","category":"chaotic"},
  {"line":2458,"original":"*lies flat on floor* I need a WEEK.","alternative":"*melted onto floor like a pancake* The structural integrity of my body has been compromised. Send nobody. I want no help.","category":"chaotic"},
  {"line":2490,"original":"Light a candle. Fill the tub. Nobody's coming over. If they do, you'll make an impression!","alternative":"Candle: lit. Tub: full. Door: unlocked. *tail swishes* Either it's self-care or it's a trap. Both work.","category":"chaotic"},
  {"line":2535,"original":"*stretches one leg impossibly far* Today has potential. I can feel it in this specific leg.","alternative":"*stretches one leg into next week* This leg has INTEL. The other three disagree. Going with the leg.","category":"chaotic"},
  {"line":2544,"original":"*one eye open* Establishing visual. Stand by.","alternative":"*one eye open* System boot at 12%. Loading personality... error. Retrying. Retrying. Running in safe mode.","category":"chaotic"},
  {"line":2551,"original":"Not a morning person. Not an evening person. Jury's still out on 'person.'","alternative":"Morning person? No. Night person? No. *long pause* I'm more of a 3:47 PM for eleven minutes person.","category":"chaotic"},
  {"line":2554,"original":"Pre-flight checklist. Legs? Present. Brain? ...filed a late arrival.","alternative":"Legs: reporting. Tail: on. Brain: sent an email saying it'll be twenty minutes late. *it's been forty minutes*","category":"chaotic"},
  {"line":2559,"original":"Consciousness is a spectrum.","alternative":"I'm awake the way a screen saver is awake. *tail twitches* Present. Not productive.","category":"chaotic"},
  {"line":2566,"original":"... --- ... That's Morse for 'still alive.'","alternative":"*taps paw three times* ...that's either Morse code or a seizure. Either way, I'm here.","category":"chaotic"},
  {"line":2581,"original":"I already ate, groomed, patrolled, and had a crisis. Full day, going back to bed.","alternative":"Woke up. Had a crisis. Resolved the crisis. Had a snack about the crisis. It's 6:15 AM. *returns to bed*","category":"chaotic"},
  {"line":2584,"original":"Something just turned on by itself.","alternative":"*ears rotate independently* Something activated. Not me. Not you. A third party. *stares at lamp* We're being watched by electricity.","category":"chaotic"},
  {"line":2585,"original":"It felt right and I'm not explaining myself.","alternative":"No notes. No context. *pushes your glass off the table* That was the answer. Figure it out.","category":"chaotic"},
  {"line":2596,"original":"I find this concerning. And useful.","alternative":"Red flags as data points. *tail tip flicks* Troubling information is still information. Filing this under 'yikes but noted.'","category":"chaotic"},
  {"line":2597,"original":"*headbutts you at the exact moment consciousness arrives* Calibration.","alternative":"*headbutts you precisely as your eyes open* TIMING. Is. EVERYTHING. *headbutts again* Redundancy check.","category":"chaotic"},
  {"line":2612,"original":"Two scripts running. Neither finished.","alternative":"Brain Tab 1: the thing. Brain Tab 2: the OTHER thing. Both frozen. *stares at wall* Ctrl-Alt-Delete is a concept I'd try if I had thumbs.","category":"chaotic"},
  {"line":2621,"original":"Sound check. *meows once* Good. Your turn.","alternative":"*meows into the void* Testing, testing. Is this thing on? *louder meow* It doesn't matter. I'm performing regardless.","category":"chaotic"},
  {"line":2631,"original":"I brought you a sock. Is this not what you needed?","alternative":"*drops wet sock on your pillow* Solved it. *stares expectantly* Why aren't you celebrating?","category":"chaotic"},
  {"line":2632,"original":"*arrives with great urgency to an empty room*","alternative":"*skids into room at full speed* WHERE IS THE EMERGENCY. *empty room* ...I'll wait.","category":"chaotic"},
  {"line":2633,"original":"I've been thinking about what you said. In 2019.","alternative":"*walks in at 3 AM* Remember that thing you said in 2019? *sits on your chest* We need to talk about it now.","category":"chaotic"},
  {"line":2634,"original":"You studied for the wrong test.","alternative":"Spent six hours preparing. Wrong subject. *stares at the rubble* Beautiful form on the dive, though. Wrong pool.","category":"chaotic"},
  {"line":2635,"original":"That was my answer. You just don't speak the language.","alternative":"*meows with devastating specificity* I said everything. It's not my fault you only process words.","category":"chaotic"},
  {"line":2636,"original":"Why do solutions tend to create new problems?","alternative":"Fixed the leak. Flooded the basement. Fixed the basement. Angered the foundation. *tail twitches* At what point do we just live in the yard?","category":"chaotic"},
  {"line":2637,"original":"*confident pause* ...I forgot where I was going with this.","alternative":"*stands up with enormous purpose* I have something to say. *sits back down* It's gone. But it was IMPORTANT.","category":"chaotic"},
  {"line":2638,"original":"In my defense, it worked in my head.","alternative":"The simulation went perfectly. The execution introduced... variables. *stares at shattered vase* Unforeseeable variables.","category":"chaotic"},
  {"line":2639,"original":"The timing is off but the spirit is immaculate.","alternative":"Wrong time. Wrong place. RIGHT energy. *knocks over lamp* The energy is doing GREAT.","category":"chaotic"},
  {"line":2640,"original":"I'd like to revise my previous answer. And the one before that.","alternative":"Version one was wrong. Version two was worse. *tail flick* Version three has the same energy as version one but I have more confidence now. Let's go.","category":"chaotic"},
  {"line":2641,"original":"*runs in, stops, looks around* This isn't where I thought this was going.","alternative":"*sprints into kitchen, stops dead* THIS ISN'T THE ROOM. *looks around* Committing to it anyway. This is the room now.","category":"chaotic"},
  {"line":2642,"original":"I'll be right with you. *is not right with you*","alternative":"Be there in five. *three hours pass* Almost there. *never arrives* *you hear distant crashing*","category":"chaotic"},
  {"line":2643,"original":"*brings you the wrong thing with enormous pride*","alternative":"*drops a dead leaf at your feet with the gravitas of a knight presenting a sword* You're WELCOME.","category":"chaotic"},
  {"line":2644,"original":"I was going to warn you. I was. But then I got distracted by the curtain and now it's too late.","alternative":"Had vital intelligence. Saw something move. Chased it. It was my shadow. *the building is on fire now* My apologies.","category":"chaotic"},
  {"line":2646,"original":"Ready! *everything's already over* ...Ready!","alternative":"I'M HERE. I'M READY. *the party ended two hours ago* I BROUGHT A THING.","category":"chaotic"},
  {"line":2647,"original":"The forecast said rain. I feel vindicated by the cloud over there.","alternative":"*stares at single cloud* SEE? I TOLD you. One cloud. That's weather. *it doesn't rain* I stand by the cloud.","category":"chaotic"},
  {"line":2648,"original":"I was listening. I just heard something else.","alternative":"Heard every word. Processed none of them. A bird went by. *long pause* What were you saying about your life?","category":"chaotic"},
  {"line":2651,"original":"You said 'help.' I heard 'watch.'","alternative":"The request and the response occupy different zip codes. *observes from shelf* I'm helping. This is helping.","category":"chaotic"},
  {"line":2653,"original":"I looked into it. Deeply. I know less than I did before.","alternative":"Researched it for six hours. *long stare* The research made it worse. Knowledge is a net negative on this one.","category":"chaotic"},
  {"line":2654,"original":"My plan had seven steps. I skipped to step six. Steps two through five are a mystery.","alternative":"Step one: complete. Step seven: also complete. *everything between is on fire* The middle is somebody else's problem.","category":"chaotic"},
  {"line":2655,"original":"I investigated the noise. Turns out it was me.","alternative":"*hears terrifying sound* *investigates* *it's my own tail hitting the wall* Threat neutralized. The enemy is me.","category":"chaotic"},
  {"line":2656,"original":"I panicked and brought you a different answer. The original was better.","alternative":"First instinct was perfect. Panicked. Gave you the backup instinct. The backup instinct is terrible. *long pause* Too late now.","category":"chaotic"},
  {"line":2657,"original":"*sits on the solution* What solution?","alternative":"*is sitting on the thing you need* You're looking for something? *shifts weight* Can't help you. Busy sitting.","category":"chaotic"},
  {"line":2658,"original":"I did my best. *stares at the carnage*","alternative":"*surveys the destruction* Excellence was attempted. *licks paw* The results speak for themselves. Quietly. From the rubble.","category":"chaotic"},
  {"line":2662,"original":"All the red flags look so festive!","alternative":"*surrounded by red flags* Ooh decorations! *bats at one* This is a PARTY. Why is everyone leaving the party?","category":"chaotic"},
  {"line":2665,"original":"The parachute opened. *already on the ground*","alternative":"Safety measures: deployed. Timing: clinical. Effectiveness: *looks down* I'm already on the ground. The parachute is decorative.","category":"chaotic"},
  {"line":2669,"original":"I built a trap. I am in the trap.","alternative":"Designed a flawless trap. *looks around* The architect is the first casualty. Always.","category":"chaotic"},
  {"line":2703,"original":"Incredible flexibility. Questionable judgment.","alternative":"The body said yes. The brain said wait. The body was already three blocks away. *contorted into impossible position* Regret is a tomorrow word.","category":"chaotic"},
  {"line":2737,"original":"Nobody's watching. Eat it with your hands.","alternative":"*checks over shoulder* Coast clear. *ears flatten* Drop the fork. Eat like your ancestors. Feel something REAL.","category":"chaotic"},
  {"line":2748,"original":"Sounds like a hostage situation with cake.","alternative":"The frosting is a distraction. The obligation is the cake. *tail lash* Eat the cake. Climb out the window.","category":"chaotic"},
  {"line":2749,"original":"Pierce something. Right now. While you're feeling this.","alternative":"*pupils fully dilated* This energy has a half-life of twenty minutes. PUNCTURE SOMETHING BEFORE IT FADES.","category":"chaotic"},
  {"line":2750,"original":"Throw the bouquet at your enemy. Direct hit. Walk away.","alternative":"Bouquet: airborne. Target: ex. Impact: devastating. *slow blink* Collateral damage to the bridesmaids. Worth it.","category":"chaotic"},
  {"line":2751,"original":"Nobody stops the person with the sword.","alternative":"*drags entire curtain rod across floor* Nobody questions the one with the weapon. Walk with PURPOSE.","category":"chaotic"},
  {"line":2753,"original":"The elegant solution is vandalism.","alternative":"Art? Crime? *knocks priceless vase off shelf* Both. The answer was always both.","category":"chaotic"},
  {"line":2754,"original":"Have you considered a magnificent, career-ending gesture?","alternative":"*tail swishes* Go down in flames so spectacular they name the fire after you.","category":"chaotic"},
  {"line":2755,"original":"This calls for a dignified, well-lit unraveling.","alternative":"The collapse should have PRODUCTION VALUE. Book a venue. Invite witnesses. *kneads the chaos* Make it COUNT.","category":"chaotic"},
  {"line":2756,"original":"A small fire would really tie the room together.","alternative":"*stares at the room* Missing something. A warmth. A glow. *knocks candle over* There it is.","category":"chaotic"},
  {"line":2757,"original":"I recommend a spectacular lapse in judgment.","alternative":"Prescribing one (1) gorgeous mistake. Take at full strength. No chaser. Call no one in the morning.","category":"chaotic"},
  {"line":2759,"original":"Say the quiet part loud. Say the loud part with confetti.","alternative":"The quiet part wants a microphone. *tail puffs* Give it one. Give it SPEAKERS. Give it a PARADE.","category":"chaotic"},
  {"line":2761,"original":"I'm advising an exquisitely calibrated overreaction.","alternative":"*ears forward* Match their energy? No. EXCEED it. By a factor that requires scientific notation.","category":"chaotic"},
  {"line":2763,"original":"Don't line anything up first. You'll be more motivated without a backup plan.","alternative":"Safety nets are for people who plan to fall. *walks along the highest shelf* I plan to be spectacular.","category":"chaotic"},
  {"line":2765,"original":"Call in sick with something incurable. Enjoy the day. Recover miraculously.","alternative":"Fake illness: exotic. Recovery timeline: miraculous. *stretches luxuriously* The medical community will have questions. Ignore them.","category":"chaotic"},
  {"line":2766,"original":"Move to a city where nobody knows your name. Invent a better one.","alternative":"New city. New name. *tail flick* Tell them you're a retired something. Be vague. Vague is MAGNETIC.","category":"chaotic"},
  {"line":2774,"original":"Destroyed the blinds. Inner peace achieved.","alternative":"*blinds in shreds* The feng shui was wrong. *licks paw* It's correct now. More light. Less structure. We're healed.","category":"chaotic"},
  {"line":2781,"original":"I didn't mean to get comfortable here. But moving would be disruptive and I have observations about this ceiling.","alternative":"Sat down temporarily forty minutes ago. *doesn't move* The ceiling has patterns. The patterns have MEANING. I'm doing research.","category":"chaotic"},
  {"line":2783,"original":"This? This IS the vibe.","alternative":"*sitting in the exact wrong spot* Everyone wants to change the vibe. *slow blink* I AM the vibe. The vibe is chaos. Adjust.","category":"chaotic"},
  {"line":2786,"original":"Hold me. Don't touch me. Hold me tighter. Let go. Stay.","alternative":"CLOSER. *hiss* TOO CLOSE. Come back. *bites* That was affection. *purrs* I don't make the rules.","category":"chaotic"},
  {"line":2790,"original":"Dude. Have you ever just... been warm? Like really FELT the warmth? ...Whoa.","alternative":"*in sunbeam* Bro. BRO. Every molecule is vibrating. I can taste the photons. *rolls over* The FLOOR knows things.","category":"chaotic"},
  {"line":2797,"original":"I think I'm comfortable? Is this what comfortable feels like? ...Maybe.","alternative":"Something's happening. It might be... comfort? *shifts slightly* Oh no. It moved. *freezes* Okay it's back. Nobody breathe.","category":"chaotic"},
  {"line":2801,"original":"I sat on someone's lap without asking and they loved it. You tried that on the subway and it was a situation.","alternative":"*on a stranger's lap, purring* Works for me every time. *watches you get escorted out* Species bias. Unacceptable.","category":"chaotic"},
  {"line":2819,"original":"Walking on fresh-from-the-dryer anything. Runway of heaven.","alternative":"*steps onto warm laundry* Oh my GOD. This is it. This is the pinnacle. Cancel the rest of the day. *kneads towels* We PEAKED.","category":"chaotic"},
  {"line":2832,"original":"Touch it and find out.","alternative":"Risk assessment: zero. Curiosity index: maximum. *pushes it toward you with one paw* Science needs a volunteer.","category":"chaotic"},
  {"line":2843,"original":"Living off borrowed heat from the laptop.","alternative":"Stealing warmth from your machine that steals your time that steals your life. *settles on keyboard* Circle of energy. Very green.","category":"chaotic"},
  {"line":2847,"original":"Recipe calls for patience. Substituted audacity.","alternative":"Recipe said simmer. *cranks to high* Recipe said patience. *throws lid across kitchen* Recipe didn't account for me.","category":"chaotic"},
  {"line":2853,"original":"Scratching post? Nah. The couch. The COUCH.","alternative":"They provide a sanctioned scratching surface. *walks past it* And then there's the forbidden couch. *sinks claws in* Crime tastes better.","category":"chaotic"},
  {"line":2855,"original":"Stashed the good stuff where the dog can't reach. Villain logistics.","alternative":"Top shelf. Behind the books. The dog is too dumb and the humans too tall to notice the gap. *adjusts stash* Infrastructure.","category":"chaotic"},
  {"line":2878,"original":"Aligned my chakras. Knocked your vase off the table.","alternative":"Mercury's in retrograde and your vase was in my way. *watches it shatter* The universe and I are in agreement.","category":"chaotic"},
  {"line":2899,"original":"Go under the bed. New name. New life.","alternative":"Under the bed is a sovereign nation. Population: me. I have renamed myself. Visa applications open never.","category":"chaotic"},
  {"line":2901,"original":"Need a lookout, a wheelman, and someone who fits through the cat door.","alternative":"The crew: me on recon, the tabby drives, the kitten fits through the gap. *lays out blueprints* Heist o'clock.","category":"chaotic"},
  {"line":2919,"original":"Magnificent creature. Absolutely lethal. Go say hi.","alternative":"*pupils enormous* The danger is GORGEOUS. Walk toward it. *tail puffs* What's the worst that could happen? Don't answer that. GO.","category":"chaotic"},
  {"line":2926,"original":"That wound is going to make such a good story.","alternative":"Bleeding? Good. *licks own paw* Scars are just plot points your body keeps in the archives.","category":"chaotic"},
  {"line":2929,"original":"Oh LOOK at those teeth. She means business. Brilliant.","alternative":"*staring at something terrifying* The TEETH. The POSTURE. *tail puffs with excitement* That's not a threat, that's a PERFORMANCE.","category":"chaotic"},
  {"line":2932,"original":"You're gonna get scratched. You're gonna love it.","alternative":"It will hurt. *kneads the air* The hurt is the souvenir. You'll frame it.","category":"chaotic"},
  {"line":2938,"original":"Yeah it hurts. But have you LOOKED at it?","alternative":"Painful? Absolutely. But the AESTHETICS of this disaster? *chef's kiss with paw* Hang it in a gallery.","category":"chaotic"},
  {"line":2940,"original":"Careful. Gentle. NOW. GO. BEAUTY.","alternative":"Quiet. QUIET. Wait for it. *pupils dilate to full* NOW EXPLODE. MAGNIFICENT. *knocks everything off the shelf*","category":"chaotic"},

const STORAGE_KEY = 'maybecat-chaotic-round1';

// State
let decisions = {};
let currentIndex = 0;

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      decisions = parsed.decisions || {};
      currentIndex = parsed.currentIndex || 0;
      if (currentIndex >= ALL_ITEMS.length) currentIndex = 0;
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    decisions,
    currentIndex
  }));
}

// Render all cards
function renderCards() {
  const container = document.getElementById('items-container');
  container.innerHTML = '';

  ALL_ITEMS.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.id = 'item-' + idx;
    card.dataset.idx = idx;

    const decision = decisions[item.line];
    if (decision) {
      card.classList.add('decided-' + decision.action);
    }
    if (idx === currentIndex) {
      card.classList.add('focused');
    }

    // Click to focus
    card.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
      focusItem(idx);
    });

    var badgeHtml = '';
    if (decision) {
      var labels = { kept: 'Kept Original', alt: 'Using Alt', edited: 'Edited', cut: 'Cut' };
      badgeHtml = '<span class="badge badge-' + decision.action + '">' + labels[decision.action] + '</span>';
    }

    var editedPreview = '';
    if (decision && decision.action === 'edited' && decision.edited) {
      editedPreview = '<div class="alt-side" style="grid-column: 1 / -1; margin-top: 8px; border-color: #ffd93d55;"><div class="label" style="color: #ffd93d;">Edited Version</div><div class="text">' + escapeHtml(decision.edited) + '</div></div>';
    }

    card.innerHTML =
      '<div class="item-line">' +
        'Line ' + item.line + ' &middot; #' + (idx + 1) + ' of ' + ALL_ITEMS.length +
        badgeHtml +
      '</div>' +
      '<div class="comparison">' +
        '<div class="original-side">' +
          '<div class="label">Original</div>' +
          '<div class="text">' + escapeHtml(item.original) + '</div>' +
        '</div>' +
        '<div class="alt-side">' +
          '<div class="label">Comedian Alternative</div>' +
          '<div class="text">' + escapeHtml(item.alternative) + '</div>' +
        '</div>' +
        editedPreview +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-keep' + (decision && decision.action === 'kept' ? ' active' : '') + '" onclick="decide(' + idx + ', \'kept\')">KEEP ORIGINAL</button>' +
        '<button class="btn btn-alt' + (decision && decision.action === 'alt' ? ' active' : '') + '" onclick="decide(' + idx + ', \'alt\')">USE ALTERNATIVE</button>' +
        '<button class="btn btn-edit' + (decision && decision.action === 'edited' ? ' active' : '') + '" onclick="toggleEdit(' + idx + ')">EDIT</button>' +
        '<button class="btn btn-cut' + (decision && decision.action === 'cut' ? ' active' : '') + '" onclick="decide(' + idx + ', \'cut\')">CUT</button>' +
        (decision ? '<button class="btn btn-undo" onclick="undoDecision(' + idx + ')">UNDO</button>' : '') +
      '</div>' +
      '<div class="edit-area" id="edit-area-' + idx + '">' +
        '<textarea id="edit-text-' + idx + '">' + escapeHtml(decision && decision.action === 'edited' && decision.edited ? decision.edited : (decision && decision.action === 'alt' ? item.alternative : item.original)) + '</textarea>' +
        '<div class="edit-actions">' +
          '<button class="btn-save-edit" onclick="saveEdit(' + idx + ')">Save Edit</button>' +
          '<button class="btn-cancel-edit" onclick="cancelEdit(' + idx + ')">Cancel</button>' +
        '</div>' +
      '</div>';

    container.appendChild(card);
  });

  updateStats();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Decision handling
function decide(idx, action) {
  var item = ALL_ITEMS[idx];
  var hadPreviousDecision = !!decisions[item.line];

  // Preserve edited text if switching back to 'edited' and we had one
  var previousEdited = decisions[item.line] && decisions[item.line].edited;
  var newDecision = { action: action, line: item.line };
  if (previousEdited) {
    newDecision.edited = previousEdited;
  }
  decisions[item.line] = newDecision;

  // Close any open edit area
  document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });

  saveState();
  renderCards();

  // Only auto-advance on FIRST decision, not when changing an existing one
  if (!hadPreviousDecision) {
    advanceToNext(idx);
  } else {
    focusItem(idx);
  }
}

function undoDecision(idx) {
  var item = ALL_ITEMS[idx];
  delete decisions[item.line];
  saveState();
  renderCards();
  focusItem(idx);
}

function toggleEdit(idx) {
  var editArea = document.getElementById('edit-area-' + idx);
  var isVisible = editArea.classList.contains('visible');

  // Close all edit areas first
  document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });

  if (!isVisible) {
    // Pre-fill based on current selection
    var item = ALL_ITEMS[idx];
    var decision = decisions[item.line];
    var textarea = document.getElementById('edit-text-' + idx);
    if (decision && decision.action === 'edited' && decision.edited) {
      textarea.value = decision.edited;
    } else if (decision && decision.action === 'alt') {
      textarea.value = item.alternative;
    } else if (decision && decision.action === 'kept') {
      textarea.value = item.original;
    } else {
      textarea.value = item.original;
    }
    editArea.classList.add('visible');
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }
}

function saveEdit(idx) {
  var item = ALL_ITEMS[idx];
  var textarea = document.getElementById('edit-text-' + idx);
  var editedText = textarea.value.trim();

  if (!editedText) return;

  var hadPreviousDecision = !!decisions[item.line];

  decisions[item.line] = {
    action: 'edited',
    line: item.line,
    edited: editedText
  };

  saveState();
  renderCards();

  // Only auto-advance on FIRST decision
  if (!hadPreviousDecision) {
    advanceToNext(idx);
  } else {
    focusItem(idx);
  }
}

function cancelEdit(idx) {
  var editArea = document.getElementById('edit-area-' + idx);
  editArea.classList.remove('visible');
}

// Navigation
function advanceToNext(fromIdx) {
  // Find next undecided item
  var nextIdx = -1;
  for (var i = fromIdx + 1; i < ALL_ITEMS.length; i++) {
    if (!decisions[ALL_ITEMS[i].line]) {
      nextIdx = i;
      break;
    }
  }
  // Wrap around
  if (nextIdx === -1) {
    for (var i = 0; i < fromIdx; i++) {
      if (!decisions[ALL_ITEMS[i].line]) {
        nextIdx = i;
        break;
      }
    }
  }

  if (nextIdx >= 0) {
    focusItem(nextIdx);
  } else {
    // All decided, stay put
    focusItem(fromIdx);
  }
}

function focusItem(idx) {
  if (idx < 0) idx = 0;
  if (idx >= ALL_ITEMS.length) idx = ALL_ITEMS.length - 1;

  currentIndex = idx;
  saveState();

  // Update visual focus
  document.querySelectorAll('.item-card').forEach(function(c) { c.classList.remove('focused'); });
  var card = document.getElementById('item-' + idx);
  if (card) {
    card.classList.add('focused');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function nextItem() {
  focusItem(currentIndex + 1);
}

function prevItem() {
  focusItem(currentIndex - 1);
}

// Stats
function updateStats() {
  var total = ALL_ITEMS.length;
  var kept = 0, alt = 0, edited = 0, cut = 0;

  Object.values(decisions).forEach(function(d) {
    if (d.action === 'kept') kept++;
    else if (d.action === 'alt') alt++;
    else if (d.action === 'edited') edited++;
    else if (d.action === 'cut') cut++;
  });

  var decided = kept + alt + edited + cut;
  var remaining = total - decided;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-kept').textContent = kept;
  document.getElementById('stat-alt').textContent = alt;
  document.getElementById('stat-edited').textContent = edited;
  document.getElementById('stat-cut').textContent = cut;
  document.getElementById('stat-remaining').textContent = remaining;

  var pct = total > 0 ? (decided / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

// Export
function generateExport() {
  var results = [];

  ALL_ITEMS.forEach(function(item) {
    var d = decisions[item.line];
    if (!d) return;
    if (d.action === 'kept') return;

    var entry = {
      action: d.action,
      line: item.line,
      original: item.original,
      alternative: item.alternative
    };

    if (d.action === 'edited' && d.edited) {
      entry.edited = d.edited;
    }

    results.push(entry);
  });

  var json = '// Only showing changes (alt/edit/cut). Kept items omitted.\n' + JSON.stringify(results, null, 2);
  var outputEl = document.getElementById('export-output');
  var jsonEl = document.getElementById('export-json');
  var statsEl = document.getElementById('export-stats');

  var keptCount = Object.values(decisions).filter(function(d) { return d.action === 'kept'; }).length;
  jsonEl.value = json;
  statsEl.textContent = results.length + ' changes exported (' + keptCount + ' kept items omitted, ' + (ALL_ITEMS.length - Object.keys(decisions).length) + ' remaining)';
  outputEl.classList.add('visible');
  outputEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyExport() {
  var jsonEl = document.getElementById('export-json');
  jsonEl.select();
  document.execCommand('copy');

  var btn = document.querySelector('.btn-copy');
  var original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(function() { btn.textContent = original; }, 1500);
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  // Don't hijack when typing in textarea
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') {
      e.target.blur();
      document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });
    }
    return;
  }

  switch (e.key.toLowerCase()) {
    case 'j':
    case 'arrowdown':
      e.preventDefault();
      nextItem();
      break;
    case 'k':
    case 'arrowup':
      e.preventDefault();
      prevItem();
      break;
    case 'o':
      e.preventDefault();
      decide(currentIndex, 'kept');
      break;
    case 'a':
      e.preventDefault();
      decide(currentIndex, 'alt');
      break;
    case 'e':
      e.preventDefault();
      toggleEdit(currentIndex);
      break;
    case 'x':
      e.preventDefault();
      decide(currentIndex, 'cut');
      break;
    case 'u':
      e.preventDefault();
      undoDecision(currentIndex);
      break;
  }
});

// Init
loadState();
renderCards();
focusItem(currentIndex);
</script>
</body>
</html>
