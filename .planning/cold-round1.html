<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    line-height: 1.6;
    padding-bottom: 120px;
  }

  /* Sticky Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #16162a;
    border-bottom: 1px solid #2a2a4a;
    padding: 16px 24px;
    backdrop-filter: blur(10px);
  }

  .header h1 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .header h1 span {
    color: #60a5fa;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-total { background: #888; }
  .dot-kept { background: #4ecca3; }
  .dot-edited { background: #ffd93d; }
  .dot-cut { background: #e94560; }
  .dot-remaining { background: #555; }

  .stat-num {
    font-weight: 700;
    color: #fff;
    font-size: 1rem;
  }

  .progress-bar-container {
    width: 100%;
    height: 6px;
    background: #2a2a4a;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4ecca3, #60a5fa);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .shortcuts-hint {
    font-size: 0.72rem;
    color: #666;
    margin-top: 6px;
  }

  .shortcuts-hint kbd {
    background: #2a2a4a;
    border: 1px solid #3a3a5a;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: monospace;
    color: #aaa;
    font-size: 0.7rem;
  }

  /* Cards */
  .items-container {
    max-width: 720px;
    margin: 24px auto;
    padding: 0 20px;
  }

  .item-card {
    background: #1e1e36;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    margin-bottom: 16px;
    padding: 20px 24px;
    transition: border-color 0.2s, box-shadow 0.2s;
    scroll-margin-top: 180px;
  }

  .item-card.focused {
    border-color: #60a5fa;
    box-shadow: 0 0 20px rgba(96, 165, 250, 0.15);
  }

  .item-card.decided-kept { border-left: 4px solid #4ecca3; opacity: 0.7; }
  .item-card.decided-edited { border-left: 4px solid #ffd93d; opacity: 0.7; }
  .item-card.decided-cut { border-left: 4px solid #e94560; opacity: 0.55; }
  .item-card.focused.decided-kept,
  .item-card.focused.decided-edited,
  .item-card.focused.decided-cut { opacity: 1; }

  .item-line {
    font-size: 0.72rem;
    color: #666;
    font-family: monospace;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .item-line .badge {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-kept { background: rgba(78, 204, 163, 0.2); color: #4ecca3; }
  .badge-edited { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
  .badge-cut { background: rgba(233, 69, 96, 0.2); color: #e94560; }

  .response-text {
    padding: 16px 18px;
    background: #16162a;
    border-radius: 8px;
    border: 1px solid #252545;
    margin-bottom: 16px;
    color: #f0f0f0;
    font-size: 1.1rem;
    font-weight: 500;
    line-height: 1.6;
  }

  .edited-preview {
    padding: 14px 16px;
    background: linear-gradient(135deg, #1e1e3a, #22224a);
    border-radius: 8px;
    border: 1px solid rgba(255, 217, 61, 0.3);
    margin-bottom: 16px;
  }

  .edited-preview .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ffd93d;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .edited-preview .text {
    color: #f0f0f0;
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.55;
  }

  /* Buttons */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 7px 16px;
    border: 2px solid;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
    font-family: inherit;
    letter-spacing: 0.3px;
  }

  .btn:hover { transform: translateY(-1px); }

  .btn-keep { border-color: #4ecca3; color: #4ecca3; }
  .btn-keep:hover { background: rgba(78, 204, 163, 0.15); }
  .btn-keep.active { background: #4ecca3; color: #1a1a2e; }

  .btn-edit { border-color: #ffd93d; color: #ffd93d; }
  .btn-edit:hover { background: rgba(255, 217, 61, 0.15); }
  .btn-edit.active { background: #ffd93d; color: #1a1a2e; }

  .btn-cut { border-color: #e94560; color: #e94560; }
  .btn-cut:hover { background: rgba(233, 69, 96, 0.15); }
  .btn-cut.active { background: #e94560; color: #fff; }

  .btn-undo {
    border-color: #666;
    color: #888;
    margin-left: auto;
  }
  .btn-undo:hover { background: rgba(255, 255, 255, 0.05); }

  /* Edit area */
  .edit-area {
    display: none;
    margin-top: 12px;
  }

  .edit-area.visible { display: block; }

  .edit-area textarea {
    width: 100%;
    min-height: 80px;
    background: #16162a;
    border: 2px solid #ffd93d;
    border-radius: 8px;
    color: #f0f0f0;
    font-size: 0.95rem;
    padding: 12px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
  }

  .edit-area textarea:focus {
    outline: none;
    box-shadow: 0 0 12px rgba(255, 217, 61, 0.2);
  }

  .edit-actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }

  .btn-save-edit {
    padding: 6px 16px;
    background: #ffd93d;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-cancel-edit {
    padding: 6px 16px;
    background: transparent;
    color: #888;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Export section */
  .export-section {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .export-section h2 {
    color: #fff;
    margin-bottom: 12px;
    font-size: 1.2rem;
  }

  .btn-export {
    padding: 12px 28px;
    background: linear-gradient(135deg, #60a5fa, #3b82f6);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    font-family: inherit;
    transition: transform 0.1s;
  }

  .btn-export:hover { transform: translateY(-2px); }

  .export-output {
    display: none;
  }

  .export-output.visible { display: block; }

  .export-output textarea {
    width: 100%;
    min-height: 300px;
    background: #0d0d1a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    color: #4ecca3;
    font-family: 'Consolas', 'Fira Code', monospace;
    font-size: 0.82rem;
    padding: 16px;
    line-height: 1.5;

  .export-stats {

    color: #888;
    margin-bottom: 10px;

  .btn-copy {
    padding: 8px 20px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }

  .btn-copy:hover { background: #3dbb92; }
</style>
</head>

const STORAGE_KEY = 'maybecat-cold-round1';

// State
let decisions = {};
let currentIndex = 0;

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      decisions = parsed.decisions || {};
      currentIndex = parsed.currentIndex || 0;
      if (currentIndex >= ALL_ITEMS.length) currentIndex = 0;
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    decisions,
    currentIndex
  }));
}

// Render all cards
function renderCards() {
  const container = document.getElementById('items-container');
  container.innerHTML = '';

  ALL_ITEMS.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.id = 'item-' + idx;
    card.dataset.idx = idx;

    const decision = decisions[item.line];
    if (decision) {
      card.classList.add('decided-' + decision.action);
    }
    if (idx === currentIndex) {
      card.classList.add('focused');
    }

    // Click to focus
    card.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
      focusItem(idx);
    });

    var badgeHtml = '';
    if (decision) {
      var labels = { kept: 'Keep', edited: 'Edited', cut: 'Cut' };
      badgeHtml = '<span class="badge badge-' + decision.action + '">' + labels[decision.action] + '</span>';
    }

    var editedPreview = '';
    if (decision && decision.action === 'edited' && decision.edited) {
      editedPreview = '<div class="edited-preview"><div class="label">Edited Version</div><div class="text">' + escapeHtml(decision.edited) + '</div></div>';
    }

    card.innerHTML =
      '<div class="item-line">' +
        'Line ' + item.line + ' &middot; #' + (idx + 1) + ' of ' + ALL_ITEMS.length +
        badgeHtml +
      '</div>' +
      '<div class="response-text">' + escapeHtml(item.original) + '</div>' +
      editedPreview +
      '<div class="actions">' +
        '<button class="btn btn-keep' + (decision && decision.action === 'kept' ? ' active' : '') + '" onclick="decide(' + idx + ', \'kept\')">KEEP</button>' +
        '<button class="btn btn-edit' + (decision && decision.action === 'edited' ? ' active' : '') + '" onclick="toggleEdit(' + idx + ')">EDIT</button>' +
        '<button class="btn btn-cut' + (decision && decision.action === 'cut' ? ' active' : '') + '" onclick="decide(' + idx + ', \'cut\')">CUT</button>' +
        (decision ? '<button class="btn btn-undo" onclick="undoDecision(' + idx + ')">UNDO</button>' : '') +
      '</div>' +
      '<div class="edit-area" id="edit-area-' + idx + '">' +
        '<textarea id="edit-text-' + idx + '">' + escapeHtml(decision && decision.action === 'edited' && decision.edited ? decision.edited : item.original) + '</textarea>' +
        '<div class="edit-actions">' +
          '<button class="btn-save-edit" onclick="saveEdit(' + idx + ')">Save Edit</button>' +
          '<button class="btn-cancel-edit" onclick="cancelEdit(' + idx + ')">Cancel</button>' +
        '</div>' +
      '</div>';

    container.appendChild(card);
  });

  updateStats();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Decision handling
function decide(idx, action) {
  var item = ALL_ITEMS[idx];
  var hadPreviousDecision = !!decisions[item.line];

  var previousEdited = decisions[item.line] && decisions[item.line].edited;
  var newDecision = { action: action, line: item.line };
  if (previousEdited) {
    newDecision.edited = previousEdited;
  }
  decisions[item.line] = newDecision;

  // Close any open edit area
  document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });

  saveState();
  renderCards();

  if (!hadPreviousDecision) {
    advanceToNext(idx);
  } else {
    focusItem(idx);
  }
}

function undoDecision(idx) {
  var item = ALL_ITEMS[idx];
  delete decisions[item.line];
  saveState();
  renderCards();
  focusItem(idx);
}

function toggleEdit(idx) {
  var editArea = document.getElementById('edit-area-' + idx);
  var isVisible = editArea.classList.contains('visible');

  // Close all edit areas first
  document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });

  if (!isVisible) {
    var item = ALL_ITEMS[idx];
    var decision = decisions[item.line];
    var textarea = document.getElementById('edit-text-' + idx);
    if (decision && decision.action === 'edited' && decision.edited) {
      textarea.value = decision.edited;
    } else {
      textarea.value = item.original;
    }
    editArea.classList.add('visible');
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }
}

function saveEdit(idx) {
  var item = ALL_ITEMS[idx];
  var textarea = document.getElementById('edit-text-' + idx);
  var editedText = textarea.value.trim();

  if (!editedText) return;

  var hadPreviousDecision = !!decisions[item.line];

  decisions[item.line] = {
    action: 'edited',
    line: item.line,
    edited: editedText
  };

  saveState();
  renderCards();

  if (!hadPreviousDecision) {
    advanceToNext(idx);
  } else {
    focusItem(idx);
  }
}

function cancelEdit(idx) {
  var editArea = document.getElementById('edit-area-' + idx);
  editArea.classList.remove('visible');
}

// Navigation
function advanceToNext(fromIdx) {
  var nextIdx = -1;
  for (var i = fromIdx + 1; i < ALL_ITEMS.length; i++) {
    if (!decisions[ALL_ITEMS[i].line]) {
      nextIdx = i;
      break;
    }
  }
  if (nextIdx === -1) {
    for (var i = 0; i < fromIdx; i++) {
      if (!decisions[ALL_ITEMS[i].line]) {
        nextIdx = i;
        break;
      }
    }
  }

  if (nextIdx >= 0) {
    focusItem(nextIdx);
  } else {
    focusItem(fromIdx);
  }
}

function focusItem(idx) {
  if (idx < 0) idx = 0;
  if (idx >= ALL_ITEMS.length) idx = ALL_ITEMS.length - 1;

  currentIndex = idx;
  saveState();

  document.querySelectorAll('.item-card').forEach(function(c) { c.classList.remove('focused'); });
  var card = document.getElementById('item-' + idx);
  if (card) {
    card.classList.add('focused');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function nextItem() {
  focusItem(currentIndex + 1);
}

function prevItem() {
  focusItem(currentIndex - 1);
}

// Stats
function updateStats() {
  var total = ALL_ITEMS.length;
  var kept = 0, edited = 0, cut = 0;

  Object.values(decisions).forEach(function(d) {
    if (d.action === 'kept') kept++;
    else if (d.action === 'edited') edited++;
    else if (d.action === 'cut') cut++;
  });

  var decided = kept + edited + cut;
  var remaining = total - decided;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-kept').textContent = kept;
  document.getElementById('stat-edited').textContent = edited;
  document.getElementById('stat-cut').textContent = cut;
  document.getElementById('stat-remaining').textContent = remaining;

  var pct = total > 0 ? (decided / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

// Export — changes only (edit/cut), skip kept items
function generateExport() {
  var results = [];

  ALL_ITEMS.forEach(function(item) {
    var d = decisions[item.line];
    if (!d) return;
    if (d.action === 'kept') return;

    var entry = {
      action: d.action,
      line: item.line,
      original: item.original
    };

    if (d.action === 'edited' && d.edited) {
      entry.edited = d.edited;
    }

    results.push(entry);
  });

  var json = '// Only showing changes (edit/cut). Kept items omitted.\n' + JSON.stringify(results, null, 2);
  var outputEl = document.getElementById('export-output');
  var jsonEl = document.getElementById('export-json');
  var statsEl = document.getElementById('export-stats');

  var keptCount = Object.values(decisions).filter(function(d) { return d.action === 'kept'; }).length;
  jsonEl.value = json;
  statsEl.textContent = results.length + ' changes exported (' + keptCount + ' kept items omitted, ' + (ALL_ITEMS.length - Object.keys(decisions).length) + ' remaining)';
  outputEl.classList.add('visible');
  outputEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyExport() {
  var jsonEl = document.getElementById('export-json');
  jsonEl.select();
  document.execCommand('copy');

  var btn = document.querySelector('.btn-copy');
  var original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(function() { btn.textContent = original; }, 1500);
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') {
      e.target.blur();
      document.querySelectorAll('.edit-area').forEach(function(ea) { ea.classList.remove('visible'); });
    }
    return;
  }

  switch (e.key.toLowerCase()) {
    case 'j':
    case 'arrowdown':
      e.preventDefault();
      nextItem();
      break;
    case 'k':
    case 'arrowup':
      e.preventDefault();
      prevItem();
      break;
    case 'o':
      e.preventDefault();
      decide(currentIndex, 'kept');
      break;
    case 'e':
      e.preventDefault();
      toggleEdit(currentIndex);
      break;
    case 'x':
      e.preventDefault();
      decide(currentIndex, 'cut');
      break;
    case 'u':
      e.preventDefault();
      undoDecision(currentIndex);
      break;
  }
});

// Init
loadState();
renderCards();
focusItem(currentIndex);
</script>
