<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Fridges Review — MaybeCat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: Georgia, serif; padding: 20px; max-width: 800px; margin: 0 auto; }

  .sticky-header { position: sticky; top: 0; background: #1a1a2e; padding: 15px 0; border-bottom: 2px solid #333; z-index: 100; margin-bottom: 20px; }
  .sticky-header h1 { font-size: 1.4em; color: #FBBF24; margin-bottom: 4px; }
  .sticky-header .subtitle { font-size: 0.8em; color: #888; margin-bottom: 8px; }
  .stats { display: flex; gap: 20px; font-size: 0.9em; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }

  .section-header { color: #EC4899; font-size: 1.1em; margin: 30px 0 15px; padding-bottom: 8px; border-bottom: 1px solid #333; }
  .section-desc { font-size: 0.8em; color: #888; margin-bottom: 15px; }

  .item { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 12px; border-left: 3px solid #444; transition: border-color 0.2s; }
  .item.kept { border-left-color: #4ecca3; }
  .item.cut { border-left-color: #e94560; opacity: 0.5; }
  .item.edited { border-left-color: #ffd93d; }

  .item-text { font-size: 1.15em; line-height: 1.4; margin-bottom: 4px; color: #FEF3C7; }
  .item-source { font-size: 0.75em; color: #888; margin-bottom: 10px; }
  .item-warning { font-size: 0.7em; color: #e94560; margin-bottom: 6px; }

  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif; font-size: 0.85em; transition: all 0.15s; }
  .btn-keep { background: #1a3a2a; color: #4ecca3; border: 1px solid #4ecca3; }
  .btn-keep:hover { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #3a1a1a; color: #e94560; border: 1px solid #e94560; }
  .btn-cut:hover { background: #e94560; color: #1a1a2e; }
  .btn-edit { background: #3a3a1a; color: #ffd93d; border: 1px solid #ffd93d; }
  .btn-edit:hover { background: #ffd93d; color: #1a1a2e; }

  .edit-area { display: none; margin-top: 10px; }
  .edit-area textarea { width: 100%; background: #0f1629; color: #FEF3C7; border: 1px solid #ffd93d; border-radius: 4px; padding: 8px; font-family: Georgia, serif; font-size: 1em; resize: vertical; min-height: 60px; }
  .edit-area .btn-save { margin-top: 6px; background: #ffd93d; color: #1a1a2e; border: none; font-weight: bold; }

  .category-select { padding: 4px 8px; background: #0f1629; color: #e0e0e0; border: 1px solid #555; border-radius: 4px; font-family: Georgia, serif; font-size: 0.8em; }

  .export-section { margin-top: 40px; padding: 20px; background: #0f1629; border-radius: 8px; border: 1px solid #333; }
  .export-section h2 { color: #FBBF24; margin-bottom: 10px; }
  .export-btn { padding: 10px 24px; background: #4ecca3; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif; font-size: 1em; font-weight: bold; }
  .export-btn:hover { background: #3dbb92; }
  .export-output { margin-top: 12px; }
  .export-output pre { background: #1a1a2e; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 0.8em; white-space: pre-wrap; color: #4ecca3; max-height: 400px; overflow-y: auto; }
  .copy-btn { margin-top: 8px; padding: 6px 16px; background: #FBBF24; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif; font-weight: bold; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Mixed Fridges Batch Review</h1>
  <div class="subtitle">4 agents: Drag reads + Corporate/luxury + Professional jargon + Inappropriate heartfelt</div>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="keep-count">0</span></span>
    <span class="stat-cut">CUT: <span id="cut-count">0</span></span>
    <span class="stat-edit">EDIT: <span id="edit-count">0</span></span>
    <span class="stat-pending">PENDING: <span id="pending-count">0</span></span>
  </div>
</div>

<div id="items-container"></div>

<div class="export-section">
  <h2>Export Keepers</h2>
  <button class="export-btn" onclick="exportKeepers()">Generate JSON</button>
  <div class="export-output" id="export-output"></div>
</div>

<script>
const CATEGORIES = [
  'mystical', 'nurturing', 'poetic', 'cold', 'angry', 'heartfelt',
  'judgy', 'chaotic', 'wise', 'existential', 'demanding', 'meta'
];

const items = [
  // ═══════════════════════════════════════════════
  // AGENT 1: DRAG QUEENS READ YOU
  // ═══════════════════════════════════════════════
  { text: "Your confidence is a recent installation.", section: "Drag Queens Read You", category: "judgy" },
  { text: "I see you. Not correctly, but I see you.", section: "Drag Queens Read You", category: "heartfelt" },
  { text: "Your energy is decorative. Not load-bearing.", section: "Drag Queens Read You", category: "judgy" },
  { text: "I believe in you. Wrong, but sincere.", section: "Drag Queens Read You", category: "heartfelt" },
  { text: "You REEK of good intentions and zero follow-through.", section: "Drag Queens Read You", category: "cold" },
  { text: "You're not wrong. You're just aerodynamically poorly designed.", section: "Drag Queens Read You", category: "judgy" },
  { text: "Grocery store sushi realness.", section: "Drag Queens Read You", category: "cold" },
  { text: "Your decision-making is ornamental at best.", section: "Drag Queens Read You", category: "judgy" },
  { text: "You're trying so hard I almost feel sad.", section: "Drag Queens Read You", category: "heartfelt" },
  { text: "Your whole situation is just vibes masquerading as a personality.", section: "Drag Queens Read You", category: "judgy" },
  { text: "You're doing your best. It's not enough, but I'm rooting for it.", section: "Drag Queens Read You", category: "heartfelt" },
  { text: "I root for you like a houseplant I keep forgetting to water.", section: "Drag Queens Read You", category: "heartfelt" },
  { text: "Your confidence is borrowed and overdue.", section: "Drag Queens Read You", category: "judgy" },
  { text: "You asked me like I was gonna lie. I love that for you.", section: "Drag Queens Read You", category: "heartfelt" },
  { text: "Detention. Think about what you've done here.", section: "Drag Queens Read You", category: "angry" },
  { text: "Your taste is just vibes and regret in a trench coat.", section: "Drag Queens Read You", category: "judgy" },
  { text: "One decision away from a personality crisis.", section: "Drag Queens Read You", category: "cold" },
  { text: "Come back when you've developed a personality that isn't rented.", section: "Drag Queens Read You", category: "angry" },
  { text: "Dressed like a spreadsheet came to life.", section: "Drag Queens Read You", category: "chaotic" },

  // ═══════════════════════════════════════════════
  // AGENT 2: RICH & POWERFUL THROUGH DRAG VOICE
  // ═══════════════════════════════════════════════
  { text: "The market has spoken. It said no.", section: "Rich/Powerful + Drag", category: "judgy" },
  { text: "Bespoke disappointment, artisanally crafted.", section: "Rich/Powerful + Drag", category: "cold" },
  { text: "We're pivoting away from you entirely.", section: "Rich/Powerful + Drag", category: "chaotic" },
  { text: "Diamond hands on a cubic zirconia heart.", section: "Rich/Powerful + Drag", category: "chaotic" },
  { text: "This merger lacks synergy. On every level.", section: "Rich/Powerful + Drag", category: "cold" },
  { text: "Meticulous finishes throughout this disaster.", section: "Rich/Powerful + Drag", category: "judgy" },
  { text: "Estate planning? Start with your dignity.", section: "Rich/Powerful + Drag", category: "demanding" },
  { text: "Disrupt the paradigm: leave them first.", section: "Rich/Powerful + Drag", category: "wise" },
  { text: "Refined finishes on a fundamentally flawed plan.", section: "Rich/Powerful + Drag", category: "cold" },
  { text: "Cost synergies: you minus them equals peace.", section: "Rich/Powerful + Drag", category: "wise" },
  { text: "Execution risk on every word you text.", section: "Rich/Powerful + Drag", category: "demanding" },
  { text: "Your thesis doesn't hold under scrutiny.", section: "Rich/Powerful + Drag", category: "cold" },
  { text: "Mise en place your life before you call.", section: "Rich/Powerful + Drag", category: "demanding" },
  { text: "Consensus building would help. Start with yourself.", section: "Rich/Powerful + Drag", category: "wise" },
  { text: "Better to ask forgiveness? No, just leave.", section: "Rich/Powerful + Drag", category: "demanding" },
  { text: "You're a black swan event nobody wanted.", section: "Rich/Powerful + Drag", category: "cold" },
  { text: "Paradigm shift: accepting you're not their priority.", section: "Rich/Powerful + Drag", category: "existential" },

  // ═══════════════════════════════════════════════
  // AGENT 3: PROFESSIONAL JARGON THROUGH CAT
  // ═══════════════════════════════════════════════
  { text: "Prognosis guarded.", section: "Professional Jargon", category: "cold" },
  { text: "Conditions deteriorating. A watch has been issued.", section: "Professional Jargon", category: "existential" },
  { text: "The court finds no merit.", section: "Professional Jargon", category: "cold" },
  { text: "Final approach. Time to commit.", section: "Professional Jargon", category: "demanding" },
  { text: "Exhibit A speaks for itself.", section: "Professional Jargon", category: "judgy" },
  { text: "The creature, sensing danger, freezes.", section: "Professional Jargon", category: "chaotic" },
  { text: "A display meant to attract a mate.", section: "Professional Jargon", category: "judgy" },
  { text: "An unforced error.", section: "Professional Jargon", category: "judgy" },
  { text: "Partly cloudy with a chance of regret.", section: "Professional Jargon", category: "cold" },
  { text: "We're going in a different direction. So is everyone.", section: "Professional Jargon", category: "existential" },
  { text: "Your feelings are valid but irrelevant.", section: "Professional Jargon", category: "cold" },
  { text: "This one's been dead for months.", section: "Professional Jargon", category: "angry" },
  { text: "Favorable winds at altitude. You can reach that.", section: "Professional Jargon", category: "heartfelt" },
  { text: "Severe thunderstorm warning for your decision-making.", section: "Professional Jargon", category: "chaotic" },
  { text: "The property shows potential but requires extensive renovation.", section: "Professional Jargon", category: "wise" },
  { text: "Your body already knows you're lying.", section: "Professional Jargon", category: "judgy" },
  { text: "Seismic activity detected. Something's about to shift.", section: "Professional Jargon", category: "mystical" },
  { text: "Cloud cover persistent. The sun's still there though.", section: "Professional Jargon", category: "heartfelt" },
  { text: "Flight plan denied.", section: "Professional Jargon", category: "cold" },
  { text: "Not clinically significant.", section: "Professional Jargon", category: "cold" },
  { text: "Health inspection found critical violations.", section: "Professional Jargon", category: "angry" },
  { text: "And the crowd goes silent.", section: "Professional Jargon", category: "mystical" },
  { text: "Personal foul. Unnecessary roughness.", section: "Professional Jargon", category: "angry" },
  { text: "Vitals are stable. Past the critical phase.", section: "Professional Jargon", category: "heartfelt" },

  // ═══════════════════════════════════════════════
  // AGENT 4: INAPPROPRIATE HEARTFELT + WEIRD
  // ═══════════════════════════════════════════════
  { text: "Deserve is free.", section: "Inappropriate Heartfelt", category: "heartfelt" },
  { text: "Cry about it. But somewhere with good acoustics.", section: "Inappropriate Heartfelt", category: "wise" },
  { text: "You've survived every bad day so far. Odds are decent.", section: "Inappropriate Heartfelt", category: "heartfelt" },
  { text: "I'm rooting for you. Quietly. From another room.", section: "Inappropriate Heartfelt", category: "heartfelt" },
  { text: "The answer lives in your stomach, not your head.", section: "Inappropriate Heartfelt", category: "wise" },
  { text: "You came this far being weird. Don't start making sense now.", section: "Inappropriate Heartfelt", category: "chaotic" },
  { text: "They don't see you. That's information, not a verdict.", section: "Inappropriate Heartfelt", category: "existential" },
  { text: "Regret is just wisdom you paid for early.", section: "Inappropriate Heartfelt", category: "wise" },
  { text: "You're scared of the wrong thing.", section: "Inappropriate Heartfelt", category: "existential" },
  { text: "Your shame is just shame. It's not prophecy.", section: "Inappropriate Heartfelt", category: "existential" },
  { text: "Stop waiting for permission. Permission doesn't exist.", section: "Inappropriate Heartfelt", category: "cold" },
  { text: "The person you were would be proud of this mess.", section: "Inappropriate Heartfelt", category: "heartfelt" },
  { text: "Small chaos now prevents large chaos later.", section: "Inappropriate Heartfelt", category: "chaotic" },
  { text: "You're allowed to want things badly. That's not shameful.", section: "Inappropriate Heartfelt", category: "heartfelt" },
  { text: "Stop being gentle with people who wouldn't for you.", section: "Inappropriate Heartfelt", category: "cold" },
  { text: "You're allowed to be wrong. Not allowed to be boring.", section: "Inappropriate Heartfelt", category: "judgy" },
  { text: "You know what you need to do. You're hoping I'll say don't.", section: "Inappropriate Heartfelt", category: "meta" },
  { text: "Do it badly first.", section: "Inappropriate Heartfelt", category: "wise" },
  { text: "You'll figure it out in the shower at 2 AM.", section: "Inappropriate Heartfelt", category: "chaotic" },
  { text: "The ending was written the moment you hoped for it.", section: "Inappropriate Heartfelt", category: "existential" },
  { text: "Send the apology. Worse things have happened.", section: "Inappropriate Heartfelt", category: "wise" },
  { text: "You're not lost. You're in the middle of becoming.", section: "Inappropriate Heartfelt", category: "heartfelt" },
];

const decisions = new Map();

function updateStats() {
  let keep = 0, cut = 0, edit = 0;
  decisions.forEach(d => {
    if (d.status === 'keep') keep++;
    else if (d.status === 'cut') cut++;
    else if (d.status === 'edit') edit++;
  });
  document.getElementById('keep-count').textContent = keep;
  document.getElementById('cut-count').textContent = cut;
  document.getElementById('edit-count').textContent = edit;
  document.getElementById('pending-count').textContent = items.length - keep - cut - edit;
}

function renderItems() {
  const container = document.getElementById('items-container');
  let currentSection = '';
  let html = '';

  const sectionDescs = {
    "Drag Queens Read You": "Confessional read energy relocated to describe the person asking.",
    "Rich/Powerful + Drag": "CEO/luxury/finance language through drag queen delivery.",
    "Professional Jargon": "Medical, legal, aviation, weather, nature doc, sports — wrong expert, wrong situation.",
    "Inappropriate Heartfelt": "The Katya zone. Tender but wrong. Kind from the wrong angle.",
  };

  items.forEach((item, i) => {
    if (item.section !== currentSection) {
      currentSection = item.section;
      html += `<h2 class="section-header">${currentSection}</h2>`;
      if (sectionDescs[currentSection]) {
        html += `<p class="section-desc">${sectionDescs[currentSection]}</p>`;
      }
    }

    const decision = decisions.get(i);
    const statusClass = decision ? decision.status === 'keep' ? 'kept' : decision.status === 'cut' ? 'cut' : 'edited' : '';
    const wordCount = item.text.split(/\s+/).length;
    const tooLong = wordCount > 15;

    html += `
      <div class="item ${statusClass}" id="item-${i}">
        <div class="item-text">"${item.text}"</div>
        ${tooLong ? `<div class="item-warning">${wordCount} words — over 15 limit, needs trim</div>` : ''}
        <div class="item-source">${item.section} · ${item.category} · ${wordCount}w</div>
        <div class="actions">
          <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
          <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
          <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
          <select class="category-select" id="cat-${i}" onchange="updateCategory(${i})">
            ${CATEGORIES.map(c => `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="edit-area" id="edit-${i}">
          <textarea id="textarea-${i}">${item.text}</textarea>
          <button class="btn btn-save" onclick="saveEdit(${i})">Save Edit</button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  updateStats();
}

function decide(i, status) {
  const cat = document.getElementById(`cat-${i}`).value;
  const text = decisions.has(i) && decisions.get(i).editedText ? decisions.get(i).editedText : items[i].text;
  decisions.set(i, { status, text, category: cat });
  const el = document.getElementById(`item-${i}`);
  el.className = 'item ' + (status === 'keep' ? 'kept' : status === 'cut' ? 'cut' : 'edited');
  updateStats();
}

function toggleEdit(i) {
  const el = document.getElementById(`edit-${i}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function saveEdit(i) {
  const text = document.getElementById(`textarea-${i}`).value.trim();
  const cat = document.getElementById(`cat-${i}`).value;
  decisions.set(i, { status: 'edit', text, editedText: text, category: cat });
  const el = document.getElementById(`item-${i}`);
  el.className = 'item edited';
  document.getElementById(`edit-${i}`).style.display = 'none';
  el.querySelector('.item-text').textContent = `"${text}"`;
  updateStats();
}

function updateCategory(i) {
  if (decisions.has(i)) {
    decisions.get(i).category = document.getElementById(`cat-${i}`).value;
  }
}

function exportKeepers() {
  const keepers = [];
  decisions.forEach((d, i) => {
    if (d.status === 'keep' || d.status === 'edit') {
      keepers.push({
        text: d.editedText || d.text || items[i].text,
        category: d.category || items[i].category
      });
    }
  });
  const json = JSON.stringify(keepers, null, 2);
  const output = document.getElementById('export-output');
  output.innerHTML = `<pre>${escapeHtml(json)}</pre><button class="copy-btn" onclick="copyJson()">Copy JSON</button>`;
  window._exportJson = json;
}

function copyJson() {
  navigator.clipboard.writeText(window._exportJson).then(() => {
    document.querySelector('.copy-btn').textContent = 'Copied!';
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderItems();
</script>

</body>
</html>
