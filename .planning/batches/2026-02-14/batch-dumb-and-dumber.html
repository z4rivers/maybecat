<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaybeCat Batch Review: Dumb and Dumber</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
    padding-top: 140px;
  }
  .sticky-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #16213e;
    padding: 16px 24px;
    z-index: 100;
    border-bottom: 2px solid #0f3460;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .sticky-header h1 {
    font-size: 1.3rem;
    color: #e94560;
    margin-bottom: 4px;
  }
  .sticky-header .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 10px;
  }
  .stats {
    display: flex;
    gap: 24px;
    font-size: 0.95rem;
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }
  .stat-dot.keep { background: #4ecca3; }
  .stat-dot.cut { background: #e94560; }
  .stat-dot.edit { background: #ffd93d; }
  .stat-dot.pending { background: #555; }
  .stat-count { font-weight: bold; font-size: 1.1rem; }

  .response-card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 14px;
    transition: border-color 0.3s;
  }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }

  .response-number {
    font-size: 0.75rem;
    color: #555;
    margin-bottom: 6px;
  }
  .response-text {
    font-size: 1.25rem;
    line-height: 1.5;
    color: #fff;
    margin-bottom: 6px;
    font-style: italic;
  }
  .response-category {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 14px;
  }
  .response-meta {
    font-size: 0.75rem;
    color: #555;
    margin-bottom: 12px;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .btn {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn:hover { transform: scale(1.05); }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }

  .edit-area {
    display: none;
    margin-top: 10px;
    width: 100%;
  }
  .edit-area textarea {
    width: 100%;
    background: #0f3460;
    color: #fff;
    border: 1px solid #4ecca3;
    border-radius: 6px;
    padding: 10px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }
  .edit-area .save-edit {
    margin-top: 6px;
    padding: 4px 12px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
  }

  .export-section {
    margin-top: 40px;
    padding: 20px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 10px;
  }
  .export-section h2 {
    color: #4ecca3;
    margin-bottom: 10px;
    font-size: 1.1rem;
  }
  .export-section textarea {
    width: 100%;
    min-height: 300px;
    background: #0f3460;
    color: #4ecca3;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85rem;
    resize: vertical;
  }
  .copy-btn {
    margin-top: 8px;
    padding: 8px 20px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .copy-btn:hover { background: #3dbb91; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Dumb and Dumber</h1>
  <div class="subtitle">Total confidence, zero information. Delusional optimism. Sideways logic that accidentally works. Lloyd and Harry energy filtered through 31 cats.</div>
  <div class="stats">
    <div class="stat"><span class="stat-dot keep"></span> Keep: <span class="stat-count" id="keep-count">0</span></div>
    <div class="stat"><span class="stat-dot cut"></span> Cut: <span class="stat-count" id="cut-count">0</span></div>
    <div class="stat"><span class="stat-dot edit"></span> Edit: <span class="stat-count" id="edit-count">0</span></div>
    <div class="stat"><span class="stat-dot pending"></span> Pending: <span class="stat-count" id="pending-count">30</span></div>
  </div>
</div>

<div id="cards"></div>

<div class="export-section">
  <h2>Export JSON (kept + edited only)</h2>
  <textarea id="export-json" readonly></textarea>
  <br>
  <button class="copy-btn" onclick="copyExport()">Copy JSON</button>
</div>

<script>
const responses = [
  // --- DELUSIONAL OPTIMISM ---
  // 1. Chaos Cat: Lloyd's "one in a million" logic. Pure constitutional optimism. Works for any question about odds or chances.
  { text: "So there's a chance. That's all I needed.", category: "chaotic", voice: "Chaos Cat", energy: "crescendo" },

  // 2. Competitive Cat: Treating the wrong direction as a minor detour. Radical self-forgiveness. Disaster nonchalance.
  { text: "So we backtracked a tad.", category: "dismissive", voice: "Competitive Cat", energy: "rhythm" },

  // 3. Badass Cat: Lloyd's motivational speaker energy. He caused the crisis. Now he's coaching you through it.
  { text: "We're in a hole. Start digging.", category: "demanding", voice: "Badass Cat", energy: "crescendo" },

  // 4. Stoner Cat: The IOU as real currency. Delusional confidence in your own system. Dream logic meets financial planning.
  { text: "I wrote you an IOU. That's basically money.", category: "playful", voice: "Stoner Cat", energy: "rhythm" },

  // 5. Internet Cat: The optimism engine at full blast. Beer flowing like wine, salmon of Capistrano. Every detail wrong, dream perfect.
  { text: "Somewhere warm. Where the vibes flow like wine.", category: "unhinged", voice: "Internet Cat", energy: "rhythm" },

  // --- DISASTER NONCHALANCE ---
  // 6. Unimpressed Cat: Harry's nonchalant acceptance of Petey's decapitation. Total calm about catastrophe.
  { text: "Yeah, that fell off. It was pretty old.", category: "cold", voice: "Unimpressed Cat", energy: "rhythm" },

  // 7. Street Cat: The Gas Man note energy. Cheerful irresponsibility. Smiley face on a disaster.
  { text: "Left a note. Put a smiley face on it. Covered.", category: "chaotic", voice: "Street Cat", energy: "rhythm" },

  // 8. Sleepy Cat: "According to the map, we've only gone four inches." Not understanding the scale of the problem. Dream logic.
  { text: "Mmm... by my math we barely moved.", category: "dismissive", voice: "Sleepy Cat", energy: "quiet" },

  // 9. Realist Cat: Lloyd's "they always freak out when you leave the scene." Treating consequences as other people overreacting.
  { text: "People overreact when you leave the scene.", category: "cold", voice: "Realist Cat", energy: "rhythm" },

  // 10. Reluctant Therapist Cat: Petey's head taped back on. The duct tape approach to problems. It holds. Don't inspect it.
  { text: "Taped it back together. Don't look too close.", category: "wise", voice: "Reluctant Therapist Cat", energy: "rhythm" },

  // --- SIDEWAYS LOGIC ---
  // 11. Conspiracy Cat: Austria/Australia confusion. Confident wrong connections. The map makes sense if you don't check.
  { text: "Close enough. Same first three letters.", category: "chaotic", voice: "Conspiracy Cat", energy: "rhythm" },

  // 12. Philosopher Cat: Lloyd's "life's a fragile thing." Accidentally philosophical. The burger-to-dead-meat pipeline.
  { text: "One minute you're eating. Next minute you're the meal.", category: "cryptic", voice: "Philosopher Cat", energy: "crescendo" },

  // 13. Doubt Cat: The extra gloves logic. Having what you need but sharing never occurring to you. Pure cat.
  { text: "I had a spare the whole time. Didn't occur to me.", category: "reluctant", voice: "Doubt Cat", energy: "rhythm" },

  // 14. Condescending Parent Cat: Lloyd reading the newspaper and discovering the moon landing decades late. It's never too late to be excited.
  { text: "Did you know about this? This is huge.", category: "playful", voice: "Condescending Parent Cat", energy: "rhythm" },

  // 15. Karen Cat: "Our pets' heads are falling off!" Escalating from normal problems to surreal catastrophe. All equally weighted.
  { text: "No money, no food, and NOW this? Unbelievable.", category: "unhinged", voice: "Karen Cat", energy: "crescendo" },

  // --- ACCIDENTAL WISDOM ---
  // 16. Old Soul Cat: The bikini bus ending. Not getting on the bus. Not interested in your agenda. Accidentally noble through obliviousness.
  { text: "The opportunity left. I gave it directions.", category: "wise", voice: "Old Soul Cat", energy: "crescendo" },

  // 17. Barncat Cat: "Just when I think you couldn't be any dumber... you totally redeem yourself!" Validation for terrible decisions.
  { text: "Terrible idea. I'm kind of impressed, actually.", category: "judgy", voice: "Barncat", energy: "rhythm" },

  // 18. Loving Cat: "No, none taken." Harry genuinely not being offended by brutal honesty. Unshakeable because there's nothing to shake.
  { text: "That didn't hurt. Nothing does when you're this sure.", category: "loving", voice: "Loving Cat", energy: "quiet" },

  // 19. Flirt Cat: "I'm going to hang by the bar. Put out the vibe." Unearned confidence as dating strategy. Just... vibe.
  { text: "I'm just gonna stand here and put out the vibe.", category: "playful", voice: "Flirt Cat", energy: "crescendo" },

  // 20. Grudging Virtue Cat: "That's a risk we were willing to take." Other people calculating YOUR risk. Their face, their willingness.
  { text: "That's a risk I was willing to let you take.", category: "cold", voice: "Grudging Virtue Cat", energy: "rhythm" },

  // --- MOTIVATIONAL SPEAKER ENERGY FROM SOMEONE WITH NO CREDENTIALS ---
  // 21. Diva Cat: Lloyd as the person who caused the problem pivoting to solution mode. Classic cat energy.
  { text: "Stop whining. I caused it and I'm fine.", category: "demanding", voice: "Diva Cat", energy: "rhythm" },

  // 22. Feral Cat: "Go all the way with it." Carrey's actual advice to Daniels. Total commitment to disaster.
  { text: "Commit. All the way. Even if it's wrong.", category: "demanding", voice: "Feral Cat", energy: "crescendo" },

  // 23. Backhanded Support Cat: Samsonite! Wrong the whole time but found the answer anyway.
  { text: "Wrong about everything. Still got there.", category: "wise", voice: "Backhanded Support Cat", energy: "rhythm" },

  // 24. Accidental Poet Cat: "Water under the fridge." Mangled wisdom that somehow still carries the sentiment.
  { text: "Water under the fridge now.", category: "poetic", voice: "Accidental Poet Cat", energy: "quiet" },

  // 25. Elder Cat: The mockingbird deconstruction. Language becomes rhythm. Meaning is irrelevant; the beat is everything.
  { text: "Mock. Yeah. Ing. Yeah. Bird. Yeah. Yeah. Yeah.", category: "unhinged", voice: "Elder Cat", energy: "crescendo" },

  // --- THE GENUINELY STRANGE ---
  // 26. Contradiction Cat: Faking catatonic for 20 years. Admiring commitment to a terrible bit.
  { text: "Twenty years on one bit. That's commitment.", category: "wise", voice: "Contradiction Cat", energy: "quiet" },

  // 27. Prophet Cat: "Nothing rhymes with August." Its own kind of logic. Confident wrong math.
  { text: "The math doesn't add up. Never did. Proceed.", category: "cryptic", voice: "Prophet Cat", energy: "rhythm" },

  // 28. Detective Cat: "I got robbed by a sweet old lady on a motorized cart." The threats you don't see coming.
  { text: "Didn't see it coming. Sweet old lady. Motorized.", category: "chaotic", voice: "Detective Cat", energy: "rhythm" },

  // 29. Dark Comedian Cat: Blaming John Denver. When reality disappoints, blame the hype man.
  { text: "Blame whoever sold you on it.", category: "judgy", voice: "Dark Comedian Cat", energy: "rhythm" },

  // 30. Attention Cat: "I got worms!" Leading with your worst pitch at the fanciest table. Total commitment.
  { text: "Lead with the worst thing about you. Own it.", category: "demanding", voice: "Attention Cat", energy: "rhythm" }
];

const decisions = new Array(responses.length).fill(null); // null = pending, 'keep', 'cut', 'edit'
const editedTexts = new Array(responses.length).fill(null);

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  responses.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'response-card' + (decisions[i] === 'keep' ? ' kept' : decisions[i] === 'cut' ? ' cut' : decisions[i] === 'edit' ? ' edited' : '');
    card.id = 'card-' + i;

    const displayText = editedTexts[i] || r.text;
    const wordCount = displayText.split(/\s+/).length;

    card.innerHTML = `
      <div class="response-number">#${i + 1} of ${responses.length}</div>
      <div class="response-text">"${displayText}"</div>
      <div class="response-category">${r.category} &middot; ${r.voice} &middot; ${r.energy} &middot; ${wordCount} words</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-area-${i}">
        <textarea id="edit-text-${i}">${displayText}</textarea>
        <button class="save-edit" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    container.appendChild(card);
  });
  updateStats();
  updateExport();
}

function decide(i, decision) {
  decisions[i] = decision;
  render();
}

function toggleEdit(i) {
  const area = document.getElementById('edit-area-' + i);
  area.style.display = area.style.display === 'block' ? 'none' : 'block';
}

function saveEdit(i) {
  const textarea = document.getElementById('edit-text-' + i);
  editedTexts[i] = textarea.value;
  decisions[i] = 'edit';
  render();
}

function updateStats() {
  const keep = decisions.filter(d => d === 'keep').length;
  const cut = decisions.filter(d => d === 'cut').length;
  const edit = decisions.filter(d => d === 'edit').length;
  const pending = decisions.filter(d => d === null).length;
  document.getElementById('keep-count').textContent = keep;
  document.getElementById('cut-count').textContent = cut;
  document.getElementById('edit-count').textContent = edit;
  document.getElementById('pending-count').textContent = pending;
}

function updateExport() {
  const kept = [];
  responses.forEach((r, i) => {
    if (decisions[i] === 'keep') {
      kept.push({ text: r.text, category: r.category });
    } else if (decisions[i] === 'edit' && editedTexts[i]) {
      kept.push({ text: editedTexts[i], category: r.category });
    }
  });
  document.getElementById('export-json').value = JSON.stringify(kept, null, 2);
}

function copyExport() {
  const textarea = document.getElementById('export-json');
  textarea.select();
  document.execCommand('copy');
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy JSON', 1500);
}

render();
</script>

</body>
</html>
