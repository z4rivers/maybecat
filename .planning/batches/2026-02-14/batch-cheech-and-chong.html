<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaybeCat Batch Review: Cheech &amp; Chong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
      padding-top: 140px;
    }
    .sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      padding: 16px 24px;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .sticky-header h1 {
      font-size: 1.2rem;
      color: #e94560;
      flex-shrink: 0;
    }
    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stat {
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 600;
    }
    .stat-total { background: #0f3460; color: #e0e0e0; }
    .stat-keep { background: rgba(78, 204, 163, 0.2); color: #4ecca3; }
    .stat-cut { background: rgba(233, 69, 96, 0.2); color: #e94560; }
    .stat-edit { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
    .stat-pending { background: rgba(255, 255, 255, 0.1); color: #888; }
    .batch-info {
      font-size: 0.8rem;
      color: #888;
      width: 100%;
      margin-top: 4px;
    }
    .response-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      transition: border-color 0.3s;
    }
    .response-card.kept { border-color: #4ecca3; }
    .response-card.cut { border-color: #e94560; opacity: 0.5; }
    .response-card.edited { border-color: #ffd93d; }
    .response-number {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 6px;
    }
    .response-text {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-bottom: 8px;
      color: #fff;
      font-style: italic;
    }
    .response-category {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-keep { background: #4ecca3; color: #1a1a2e; }
    .btn-keep:hover { background: #3dbb92; }
    .btn-keep.active { box-shadow: 0 0 0 2px #4ecca3; }
    .btn-cut { background: #e94560; color: #fff; }
    .btn-cut:hover { background: #d63851; }
    .btn-cut.active { box-shadow: 0 0 0 2px #e94560; }
    .btn-edit { background: #ffd93d; color: #1a1a2e; }
    .btn-edit:hover { background: #ecc82c; }
    .btn-edit.active { box-shadow: 0 0 0 2px #ffd93d; }
    .edit-area {
      display: none;
      margin-top: 12px;
    }
    .edit-area.visible { display: block; }
    .edit-area textarea {
      width: 100%;
      background: #0f3460;
      color: #fff;
      border: 1px solid #4ecca3;
      border-radius: 6px;
      padding: 10px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
    }
    .edit-area .btn-save {
      margin-top: 8px;
      background: #4ecca3;
      color: #1a1a2e;
      padding: 4px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .export-section {
      max-width: 700px;
      margin: 40px auto;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 20px;
    }
    .export-section h2 {
      color: #4ecca3;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
    .export-section textarea {
      width: 100%;
      min-height: 300px;
      background: #0a0a1a;
      color: #4ecca3;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85rem;
      resize: vertical;
    }
    .copy-btn {
      margin-top: 8px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .copy-btn:hover { background: #3dbb92; }
  </style>
</head>
<body>
  <div class="sticky-header">
    <h1>Cheech &amp; Chong Batch</h1>
    <div class="stats">
      <span class="stat stat-total" id="stat-total">Total: 30</span>
      <span class="stat stat-keep" id="stat-keep">Keep: 0</span>
      <span class="stat stat-cut" id="stat-cut">Cut: 0</span>
      <span class="stat stat-edit" id="stat-edit">Edit: 0</span>
      <span class="stat stat-pending" id="stat-pending">Pending: 30</span>
    </div>
    <div class="batch-info">
      Stoner wisdom, catnip philosophy, meandering logic. Cheech's street smarts + Chong's philosopher energy. | 2026-02-14
    </div>
  </div>

  <div id="cards-container"></div>

  <div class="export-section">
    <h2>Export JSON (kept + edited only)</h2>
    <textarea id="export-json" readonly></textarea>
    <button class="copy-btn" onclick="copyExport()">Copy to Clipboard</button>
  </div>

  <script>
    const responses = [
      { text: "I think we're parked.", category: "wise" },
      { text: "Gets ya high, don't it?", category: "wise" },
      { text: "Forgot what I was chasing. Still purring.", category: "chaotic" },
      { text: "The answer was here the whole time. I sat on it.", category: "cryptic" },
      { text: "You don't need the official version.", category: "wise" },
      { text: "If you knew, it'd ruin it.", category: "cryptic" },
      { text: "Mellow out.", category: "cold" },
      { text: "Better buckle up.", category: "cold" },
      { text: "Dave's not here.", category: "cold" },
      { text: "The pearl needs the irritation.", category: "wise" },
      { text: "Forgive yourself already.", category: "heartfelt" },
      { text: "The universe doesn't make mistakes. You, though...", category: "judgy" },
      { text: "*stares at nothing for a full minute* ...beautiful.", category: "chaotic" },
      { text: "Wrong question. Beautiful question. But wrong.", category: "wise" },
      { text: "I had the answer but I forgot. You didn't need it.", category: "wise" },
      { text: "Everything makes sense if you stop trying.", category: "existential" },
      { text: "Mmm. What were we talking about?", category: "chaotic" },
      { text: "Takes one to know one. I don't know one.", category: "chaotic" },
      { text: "You're overthinking it. I'm underthinking it. Meet me somewhere.", category: "wise" },
      { text: "The whole thing is a scavenger hunt. Enjoy the hunt.", category: "wise" },
      { text: "Follow the smoke.", category: "mystical" },
      { text: "That's the key to the universe, man.", category: "mystical" },
      { text: "Results over methods. Always.", category: "demanding" },
      { text: "Doesn't need to be good. Needs to be yours.", category: "heartfelt" },
      { text: "I'm not lost. I'm exploring without a destination.", category: "chaotic" },
      { text: "Everybody wants to be the joint. Nobody wants to be the ash.", category: "existential" },
      { text: "Some things you gotta follow around for three days.", category: "wise" },
      { text: "The slow road gets there too.", category: "poetic" },
      { text: "Not sure that was the plan. Don't care. Worked.", category: "chaotic" },
      { text: "Enjoy the pain. It means the good part's loading.", category: "wise" }
    ];

    // Map non-standard categories to codebase categories for export
    const categoryMap = {
      "cryptic": "mystical",
      "dismissive": "cold",
      "loving": "heartfelt",
      "playful": "chaotic",
      "reluctant": "cold",
      "unhinged": "chaotic"
    };

    function exportCategory(cat) {
      return categoryMap[cat] || cat;
    }

    const state = responses.map((r, i) => ({
      ...r,
      id: i,
      decision: null, // 'keep', 'cut', 'edit'
      editedText: null
    }));

    function render() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      state.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'response-card' +
          (item.decision === 'keep' ? ' kept' : '') +
          (item.decision === 'cut' ? ' cut' : '') +
          (item.decision === 'edit' ? ' edited' : '');
        card.innerHTML = `
          <div class="response-number">#${i + 1}</div>
          <div class="response-text">"${item.editedText || item.text}"</div>
          <div class="response-category">${item.category}</div>
          <div class="actions">
            <button class="btn btn-keep ${item.decision === 'keep' ? 'active' : ''}" onclick="decide(${i}, 'keep')">KEEP</button>
            <button class="btn btn-cut ${item.decision === 'cut' ? 'active' : ''}" onclick="decide(${i}, 'cut')">CUT</button>
            <button class="btn btn-edit ${item.decision === 'edit' ? 'active' : ''}" onclick="toggleEdit(${i})">EDIT</button>
          </div>
          <div class="edit-area" id="edit-area-${i}">
            <textarea id="edit-text-${i}">${item.editedText || item.text}</textarea>
            <button class="btn-save" onclick="saveEdit(${i})">Save Edit</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateStats();
      updateExport();
    }

    function decide(index, decision) {
      if (state[index].decision === decision) {
        state[index].decision = null; // toggle off
      } else {
        state[index].decision = decision;
      }
      render();
    }

    function toggleEdit(index) {
      const area = document.getElementById(`edit-area-${index}`);
      if (area.classList.contains('visible')) {
        area.classList.remove('visible');
      } else {
        // Close all others
        document.querySelectorAll('.edit-area').forEach(el => el.classList.remove('visible'));
        area.classList.add('visible');
        document.getElementById(`edit-text-${index}`).focus();
      }
    }

    function saveEdit(index) {
      const text = document.getElementById(`edit-text-${index}`).value.trim();
      if (text) {
        state[index].editedText = text;
        state[index].decision = 'edit';
      }
      render();
    }

    function updateStats() {
      const keep = state.filter(s => s.decision === 'keep').length;
      const cut = state.filter(s => s.decision === 'cut').length;
      const edit = state.filter(s => s.decision === 'edit').length;
      const pending = state.length - keep - cut - edit;
      document.getElementById('stat-keep').textContent = `Keep: ${keep}`;
      document.getElementById('stat-cut').textContent = `Cut: ${cut}`;
      document.getElementById('stat-edit').textContent = `Edit: ${edit}`;
      document.getElementById('stat-pending').textContent = `Pending: ${pending}`;
    }

    function updateExport() {
      const kept = state
        .filter(s => s.decision === 'keep' || s.decision === 'edit')
        .map(s => ({
          text: s.editedText || s.text,
          category: exportCategory(s.category)
        }));
      document.getElementById('export-json').value = JSON.stringify(kept, null, 2);
    }

    function copyExport() {
      const textarea = document.getElementById('export-json');
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
      });
    }

    render();
  </script>
</body>
</html>
