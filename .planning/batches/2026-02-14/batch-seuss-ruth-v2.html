<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Review: Dr. Seuss meets Dr. Ruth v2 + Eminem</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #eee; font-family: Georgia, serif; padding: 20px; }
  .sticky-header { position: sticky; top: 0; background: #1a1a2e; border-bottom: 2px solid #333; padding: 16px 0; z-index: 100; margin-bottom: 24px; }
  .stats { display: flex; gap: 24px; font-size: 18px; flex-wrap: wrap; }
  .stats span { font-weight: bold; }
  .keep-count { color: #4ecca3; }
  .cut-count { color: #e94560; }
  .edit-count { color: #ffd93d; }
  .pending-count { color: #888; }
  h1 { font-size: 28px; margin-bottom: 8px; color: #ffd93d; }
  h2 { font-size: 18px; margin-bottom: 16px; color: #aaa; font-weight: normal; }
  .section-divider { border: none; border-top: 3px solid #ffd93d; margin: 32px 0 24px; }
  .section-title { font-size: 22px; color: #e94560; margin-bottom: 16px; letter-spacing: 1px; }
  .item { background: #16213e; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 16px; transition: border-color 0.2s; }
  .item.kept { border-color: #4ecca3; }
  .item.cut { border-color: #e94560; opacity: 0.5; }
  .item.edited { border-color: #ffd93d; }
  .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .item-num { color: #666; font-size: 14px; }
  .category { background: #0f3460; color: #e94560; padding: 3px 10px; border-radius: 99px; font-size: 13px; }
  .source-tag { background: #2d1b4e; color: #c084fc; padding: 3px 10px; border-radius: 99px; font-size: 13px; margin-left: 6px; }
  .text { font-size: 22px; line-height: 1.5; margin-bottom: 16px; color: #FEF3C7; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { border: none; padding: 8px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; font-family: Georgia, serif; font-weight: bold; }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .edit-area { margin-top: 12px; display: none; }
  .edit-area.visible { display: block; }
  .edit-area textarea { width: 100%; background: #0f3460; color: #eee; border: 1px solid #ffd93d; border-radius: 8px; padding: 12px; font-size: 18px; font-family: Georgia, serif; resize: vertical; min-height: 60px; }
  .edit-area button { margin-top: 8px; }
  .export-section { margin-top: 40px; background: #16213e; border: 1px solid #333; border-radius: 12px; padding: 20px; }
  .export-section h3 { color: #4ecca3; margin-bottom: 12px; }
  .export-section pre { background: #0f3460; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 14px; color: #eee; white-space: pre-wrap; max-height: 600px; overflow-y: auto; }
  .copy-btn { background: #4ecca3; color: #1a1a2e; border: none; padding: 8px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Dr. Seuss x Dr. Ruth v2 + Eminem</h1>
  <h2>The real ones &bull; 80 candidates</h2>
  <div class="stats">
    <div>Keep: <span class="keep-count" id="keep-count">0</span></div>
    <div>Cut: <span class="cut-count" id="cut-count">0</span></div>
    <div>Edit: <span class="edit-count" id="edit-count">0</span></div>
    <div>Pending: <span class="pending-count" id="pending-count">80</span></div>
  </div>
</div>

<div id="items"></div>

<div class="export-section">
  <h3>Export (Keepers + Edits)</h3>
  <button class="copy-btn" onclick="copyExport()">Copy JSON</button>
  <pre id="export-json">[]</pre>
</div>

<script>
const seussRuth = [
  { text: "Un-slumping yourself is not easily done.", category: "wise", source: "seuss-ruth" },
  { text: "Bang-ups and hang-ups can happen to you.", category: "cold", source: "seuss-ruth" },
  { text: "Tell me what you want. Not what sounds safe.", category: "demanding", source: "seuss-ruth" },
  { text: "You have feet. Use them or don't.", category: "demanding", source: "seuss-ruth" },
  { text: "The reflex works. Your hesitation doesn't.", category: "cold", source: "seuss-ruth" },
  { text: "Between hither and yon, you'll get scared. Go anyway.", category: "wise", source: "seuss-ruth" },
  { text: "Streets are not marked. Pick one.", category: "demanding", source: "seuss-ruth" },
  { text: "Most windows are darked. Walk toward the lit ones.", category: "poetic", source: "seuss-ruth" },
  { text: "Waiting for yes or no? Stop waiting.", category: "cold", source: "seuss-ruth" },
  { text: "You can talk about anything in good taste. So talk.", category: "demanding", source: "seuss-ruth" },
  { text: "The Waiting Place is useless. Leave.", category: "cold", source: "seuss-ruth" },
  { text: "Laughter matters. No laughter? Wrong relationship.", category: "wise", source: "seuss-ruth" },
  { text: "Say what you actually want. Not the polite version.", category: "demanding", source: "seuss-ruth" },
  { text: "Slumps happen. Un-slump or stay stuck.", category: "cold", source: "seuss-ruth" },
  { text: "Alone, you'll meet scary things. That's the point.", category: "wise", source: "seuss-ruth" },
  { text: "You have brains. Use them. No excuses.", category: "demanding", source: "seuss-ruth" },
  { text: "The body knows what it wants. Listen.", category: "wise", source: "seuss-ruth" },
  { text: "Wiggled roads at break-necking pace? Slow down.", category: "nurturing", source: "seuss-ruth" },
  { text: "Down long wiggled roads, you'll get confused. Normal.", category: "nurturing", source: "seuss-ruth" },
  { text: "Good taste and honesty aren't opposites.", category: "wise", source: "seuss-ruth" },
  { text: "Waiting for hair to grow? Do something else.", category: "cold", source: "seuss-ruth" },
  { text: "Weirdish wild space is still space. Keep going.", category: "poetic", source: "seuss-ruth" },
  { text: "The secret is talking about everyone else's problems.", category: "meta", source: "seuss-ruth" },
  { text: "Steer yourself any direction. Or admit you won't.", category: "demanding", source: "seuss-ruth" },
  { text: "Not in for much fun? Then un-slump.", category: "cold", source: "seuss-ruth" },
  { text: "Everything can be talked about. Start talking.", category: "demanding", source: "seuss-ruth" },
  { text: "Right out of your pants? Put them back on. Continue.", category: "chaotic", source: "seuss-ruth" },
  { text: "Scientifically validated data says you're overthinking.", category: "cold", source: "seuss-ruth" },
  { text: "Some kind of humor required. Find it.", category: "demanding", source: "seuss-ruth" },
  { text: "My sex life isn't your business. Yours is.", category: "cold", source: "seuss-ruth" },
  { text: "Things scare you? Won't want to go on? Go on.", category: "wise", source: "seuss-ruth" },
  { text: "Headed toward a useless place. Turn around.", category: "cold", source: "seuss-ruth" },
  { text: "Confused is normal. Racing around isn't helping.", category: "nurturing", source: "seuss-ruth" },
  { text: "Good relationships mean laughter. Hear any?", category: "cold", source: "seuss-ruth" },
  { text: "Windows mostly darked. Light your own.", category: "wise", source: "seuss-ruth" },
  { text: "The way you can talk about anything? Do that.", category: "demanding", source: "seuss-ruth" },
  { text: "Alone there's a good chance. Take it.", category: "wise", source: "seuss-ruth" },
  { text: "I'm sorry to say so, but, sadly, it's true.", category: "cold", source: "seuss-ruth" },
  { text: "Properly done means honest. Be honest.", category: "demanding", source: "seuss-ruth" },
  { text: "Un-slumping takes work. Not inspiration.", category: "wise", source: "seuss-ruth" },
];

const eminem = [
  { text: "One shot. Palms sweaty. You're choking.", category: "demanding", source: "eminem" },
  { text: "Already roasted myself. Your turn's wasted.", category: "cold", source: "eminem" },
  { text: "Knees weak. Arms heavy. Still standing.", category: "heartfelt", source: "eminem" },
  { text: "Cleaned the closet. Burned what I found.", category: "angry", source: "eminem" },
  { text: "You got one chance. Already blew it thinking.", category: "demanding", source: "eminem" },
  { text: "White trash from the trailer park won this.", category: "cold", source: "eminem" },
  { text: "Said the worst part out loud. Disarmed.", category: "wise", source: "eminem" },
  { text: "Spit the truth till my lungs collapse.", category: "demanding", source: "eminem" },
  { text: "Everyone's a lyricist till the beat drops.", category: "wise", source: "eminem" },
  { text: "Lose yourself or find excuses. Pick one.", category: "demanding", source: "eminem" },
  { text: "The moment owns you. Not the other way.", category: "existential", source: "eminem" },
  { text: "You only get one shot. This ain't it.", category: "cold", source: "eminem" },
  { text: "Mockingbird's broke. Hailie still watches.", category: "heartfelt", source: "eminem" },
  { text: "Success is my drug. Failure's my dealer.", category: "existential", source: "eminem" },
  { text: "Vomit on my sweater already. Still rapping.", category: "chaotic", source: "eminem" },
  { text: "Opportunity knocks once. You checked your phone.", category: "cold", source: "eminem" },
  { text: "Gravity's optional when you got nothing left.", category: "wise", source: "eminem" },
  { text: "They expect me to fail. Correct.", category: "angry", source: "eminem" },
  { text: "You snap back to reality faster alone.", category: "wise", source: "eminem" },
  { text: "Told you I'm trash. Still better.", category: "cold", source: "eminem" },
  { text: "The hunger's real. The meal's imaginary.", category: "existential", source: "eminem" },
  { text: "Mom's spaghetti never made the stains leave.", category: "heartfelt", source: "eminem" },
  { text: "Slip through your fingers or grip till it bleeds.", category: "demanding", source: "eminem" },
  { text: "You don't want it. You want wanting it.", category: "wise", source: "eminem" },
  { text: "The clock's ticking. You're still warming up.", category: "cold", source: "eminem" },
  { text: "I'm afraid too. Difference is I went.", category: "heartfelt", source: "eminem" },
  { text: "Rhymed orange with door hinge. You rhymed nothing.", category: "cold", source: "eminem" },
  { text: "Crowds go wild for the fall, not the climb.", category: "wise", source: "eminem" },
  { text: "Your shot. You froze. Reload's not coming.", category: "demanding", source: "eminem" },
  { text: "Everybody acts hard till the mic's on.", category: "wise", source: "eminem" },
  { text: "Beautiful chaos or boring safety. Choose.", category: "demanding", source: "eminem" },
  { text: "Confessed my sins to a beat. Still guilty.", category: "angry", source: "eminem" },
  { text: "The moment you own it, it's already gone.", category: "existential", source: "eminem" },
  { text: "You're scared of choking. I'm scared of silence.", category: "heartfelt", source: "eminem" },
  { text: "They laugh when you bomb. They laugh when you win.", category: "wise", source: "eminem" },
  { text: "Rap God status: still can't fix this.", category: "existential", source: "eminem" },
  { text: "Let it slip or let it rip. No middle.", category: "demanding", source: "eminem" },
  { text: "Your bars are weak. Your excuses slap though.", category: "cold", source: "eminem" },
  { text: "Till I collapse. Then one more round.", category: "demanding", source: "eminem" },
  { text: "You had the words. Swallowed them instead.", category: "cold", source: "eminem" },
];

const items = [...seussRuth, ...eminem];
const state = items.map((item, i) => ({ ...item, id: i, status: 'pending', editedText: '' }));

function render() {
  const container = document.getElementById('items');
  let html = '<div class="section-title">DR. SEUSS x DR. RUTH v2 — The Real Ones</div>';

  state.forEach((item, i) => {
    if (i === seussRuth.length) {
      html += '<hr class="section-divider"><div class="section-title">EMINEM — One Shot Energy</div>';
    }
    const statusClass = item.status === 'keep' ? 'kept' : item.status === 'cut' ? 'cut' : item.status === 'edit' ? 'edited' : '';
    const displayText = item.editedText || item.text;
    const sourceLabel = item.source === 'seuss-ruth' ? 'Seuss/Ruth' : 'Eminem';
    html += `
      <div class="item ${statusClass}" id="item-${i}">
        <div class="item-header">
          <span class="item-num">#${i + 1}</span>
          <div>
            <span class="category">${item.category}</span>
            <span class="source-tag">${sourceLabel}</span>
          </div>
        </div>
        <div class="text">${displayText}</div>
        <div class="actions">
          <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
          <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
          <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
        </div>
        <div class="edit-area" id="edit-${i}">
          <textarea id="textarea-${i}">${item.text}</textarea>
          <button class="btn btn-keep" onclick="saveEdit(${i})">SAVE &amp; KEEP</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
  updateStats();
}

function decide(i, status) {
  state[i].status = status;
  if (status !== 'edit') state[i].editedText = '';
  render();
}

function toggleEdit(i) {
  const el = document.getElementById('edit-' + i);
  el.classList.toggle('visible');
}

function saveEdit(i) {
  const textarea = document.getElementById('textarea-' + i);
  state[i].editedText = textarea.value.trim();
  state[i].status = 'edit';
  render();
}

function updateStats() {
  const counts = { keep: 0, cut: 0, edit: 0, pending: 0 };
  state.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);
  document.getElementById('keep-count').textContent = counts.keep;
  document.getElementById('cut-count').textContent = counts.cut;
  document.getElementById('edit-count').textContent = counts.edit;
  document.getElementById('pending-count').textContent = counts.pending;

  const keepers = state
    .filter(s => s.status === 'keep' || s.status === 'edit')
    .map(s => ({ text: s.editedText || s.text, category: s.category }));
  document.getElementById('export-json').textContent = JSON.stringify(keepers, null, 2);
}

function copyExport() {
  const json = document.getElementById('export-json').textContent;
  navigator.clipboard.writeText(json).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 1500);
  });
}

render();
</script>
</body>
</html>
