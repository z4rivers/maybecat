<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaybeCat Batch Review — Shoelace Fascination</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
    padding-top: 160px;
  }
  .sticky-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
    padding: 16px 24px;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .header-title {
    font-size: 1.4em;
    font-weight: 700;
    color: #e94560;
    margin-bottom: 4px;
  }
  .header-subtitle {
    font-size: 0.85em;
    color: #888;
    margin-bottom: 12px;
  }
  .stats {
    display: flex;
    gap: 24px;
    font-size: 0.95em;
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .stat-dot.keep { background: #4ecca3; }
  .stat-dot.cut { background: #e94560; }
  .stat-dot.edit { background: #ffd93d; }
  .stat-dot.pending { background: #555; }
  .stat-count { font-weight: 700; font-size: 1.1em; }

  .response-card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    transition: border-color 0.3s;
  }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut-card { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }

  .response-number {
    font-size: 0.75em;
    color: #555;
    margin-bottom: 6px;
  }
  .response-text {
    font-size: 1.25em;
    line-height: 1.5;
    color: #fff;
    margin-bottom: 8px;
    font-style: italic;
  }
  .response-category {
    font-size: 0.8em;
    color: #4ecca3;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .response-voice {
    font-size: 0.75em;
    color: #666;
    margin-bottom: 14px;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 0.85em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.15); }
  .btn:active { transform: translateY(0); }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .btn-reset { background: #333; color: #aaa; font-size: 0.75em; padding: 6px 12px; }

  .edit-area {
    display: none;
    margin-top: 10px;
    width: 100%;
  }
  .edit-area.visible { display: block; }
  .edit-area textarea {
    width: 100%;
    background: #0f3460;
    color: #fff;
    border: 1px solid #4ecca3;
    border-radius: 6px;
    padding: 10px;
    font-size: 1em;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }
  .edit-area .btn-save {
    margin-top: 8px;
    background: #4ecca3;
    color: #1a1a2e;
    padding: 6px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
  }
  .edit-area select {
    margin-top: 8px;
    margin-right: 8px;
    background: #0f3460;
    color: #fff;
    border: 1px solid #4ecca3;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.85em;
  }

  .export-section {
    max-width: 800px;
    margin: 40px auto;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 20px;
  }
  .export-title {
    font-size: 1.1em;
    font-weight: 700;
    color: #4ecca3;
    margin-bottom: 12px;
  }
  .export-textarea {
    width: 100%;
    min-height: 300px;
    background: #0a0a1a;
    color: #4ecca3;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.85em;
    resize: vertical;
  }
  .copy-btn {
    margin-top: 10px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9em;
  }
  .copy-btn:hover { filter: brightness(1.15); }
</style>
</head>
<body>

<div class="sticky-header">
  <div class="header-title">Shoelace Fascination</div>
  <div class="header-subtitle">30 responses — Cat x shoelace obsession. Disproportion is the engine. Academic jargon, real facts, total conviction.</div>
  <div class="stats">
    <div class="stat"><div class="stat-dot keep"></div> Kept: <span class="stat-count" id="kept-count">0</span></div>
    <div class="stat"><div class="stat-dot cut"></div> Cut: <span class="stat-count" id="cut-count">0</span></div>
    <div class="stat"><div class="stat-dot edit"></div> Edited: <span class="stat-count" id="edit-count">0</span></div>
    <div class="stat"><div class="stat-dot pending"></div> Pending: <span class="stat-count" id="pending-count">30</span></div>
  </div>
</div>

<div id="responses-container"></div>

<div class="export-section">
  <div class="export-title">Export JSON (kept + edited only)</div>
  <textarea class="export-textarea" id="export-json" readonly></textarea>
  <br>
  <button class="copy-btn" onclick="copyExport()">Copy to Clipboard</button>
</div>

<script>
const responses = [
  {
    id: 1,
    text: "Your problem isn't the knot. It's the handedness.",
    category: "wise",
    voice: "Philosopher Cat",
    note: "RHYTHM. Academic jargon (lace crossings of same/opposite handedness) relocated as life advice. Works for relationships, decisions, anything where the approach matters more than the effort."
  },
  {
    id: 2,
    text: "Catastrophic failure in two strides. I've seen it.",
    category: "cold",
    voice: "Elder Cat",
    note: "CRESCENDO. Direct quote from the Berkeley paper — 'sudden and catastrophic, happening in as few as two strides.' The cat has witnessed civilizations and shoelace collapses with equal gravity."
  },
  {
    id: 3,
    text: "Two trillion ways to lace up and you picked THAT.",
    category: "judgy",
    voice: "Judge Cat",
    note: "RHYTHM. Real stat (1.96 trillion lacing combinations). The judgment isn't about shoelaces — it's about every choice you've ever made. Dual-read: lacing up = committing to something."
  },
  {
    id: 4,
    text: "The aglet survives. Everything else is negotiable.",
    category: "wise",
    voice: "Badass Cat",
    note: "CRESCENDO. The aglet — that tiny plastic tip — outlasted the 5,500-year-old Areni-1 shoe. The smallest, most overlooked part is what endures. Steel-spine energy."
  },
  {
    id: 5,
    text: "*pupils dilate* Is that... waxed cotton?",
    category: "chaotic",
    voice: "Flirt Cat",
    note: "RHYTHM. The luxury shoelace world (Saphir, Fort Belvedere) uses waxed cotton. The cat reacts to premium lace material the way humans react to a crush walking in. Dual-read obvious."
  },
  {
    id: 6,
    text: "Loose on the left means someone's talking. I'm listening.",
    category: "mystical",
    voice: "Prophet Cat",
    note: "RHYTHM. Real superstition: left shoelace untied = someone gossiping about you. The cat treats this as intelligence gathering, not folklore."
  },
  {
    id: 7,
    text: "You're doing crisscross in a Straight European situation.",
    category: "judgy",
    voice: "Condescending Parent Cat",
    note: "CRESCENDO. Real lacing methods. Crisscross is basic. Straight European is formal, clean, elevated. The cat is reading your entire approach to life through your lacing choice."
  },
  {
    id: 8,
    text: "Some eyelets aren't worth threading.",
    category: "cold",
    voice: "Boundaries Cat",
    note: "CRESCENDO. Eyelet = the hole the lace passes through. As life advice: some openings aren't worth entering. Some people aren't worth connecting with. Sharp, clean, dual-read."
  },
  {
    id: 9,
    text: "*tail tip flicks* The tension is uneven. I can feel it.",
    category: "mystical",
    voice: "Pensive Cat",
    note: "QUIET. Real lacing concept — uneven tension causes knot failure. The cat senses the tension in YOUR situation the way it senses lace tension. Physical, present, watching."
  },
  {
    id: 10,
    text: "A man published in Nature about this. NATURE. Respect the lace.",
    category: "demanding",
    voice: "Karen Cat",
    note: "RHYTHM. Real fact — Burkard Polster published his shoelace math in Nature. The cat is OUTRAGED you don't take laces seriously when a mathematician got into the most prestigious journal on earth for them."
  },
  {
    id: 11,
    text: "Every morning you perform the same knot and expect different results.",
    category: "wise",
    voice: "Reluctant Therapist Cat",
    note: "CRESCENDO. The daily ritual of tying shoes reframed as the definition of insanity. Accidentally devastating life observation from a cat who was just thinking about knots."
  },
  {
    id: 12,
    text: "The Romans put gold on their aglets. Know your worth.",
    category: "demanding",
    voice: "Diva Cat",
    note: "RHYTHM. Real history — Roman aglets were gold, silver, precious stones. The cat uses historical shoelace luxury to demand you stop underselling yourself. Miss Piggy energy."
  },
  {
    id: 13,
    text: "Cyclic impact loading. That's all walking is. That's all anything is.",
    category: "existential",
    voice: "Philosopher Cat",
    note: "QUIET. Academic term for walking, from the Berkeley paper. The cat has stared into the void and found... a physics description of putting one foot in front of the other. Bleak. True."
  },
  {
    id: 14,
    text: "Untie it. The first thing you do when you get home. Listen to that.",
    category: "heartfelt",
    voice: "Loving Cat",
    note: "CRESCENDO. The research notes that untying = the first act of arriving home, of release, of safety. The cat isn't talking about shoes. Warm, genuine, lands soft."
  },
  {
    id: 15,
    text: "Lesser brands overlook the aglet. I see who you are.",
    category: "judgy",
    voice: "Detective Cat",
    note: "RHYTHM. Direct quote from Fort Belvedere: 'the aglets, often overlooked by lesser brands.' The cat judges your entire character by the detail you think nobody notices."
  },
  {
    id: 16,
    text: "An invisible hand loosening things. Sound familiar?",
    category: "mystical",
    voice: "Conspiracy Cat",
    note: "RHYTHM. Direct from the paper: 'an invisible hand, loosening the knot and then tugging on the free ends.' The cat sees forces at work. In your laces. In your life. Same thing."
  },
  {
    id: 17,
    text: "I don't chase the lace. I position myself where the lace will be.",
    category: "wise",
    voice: "Barncat",
    note: "RHYTHM. The cat's predatory relationship with shoelaces reframed as strategic life advice. Barncat patience meets string obsession. Works for careers, love, everything."
  },
  {
    id: 18,
    text: "Five thousand years. The laces survived. You'll be fine.",
    category: "nurturing",
    voice: "Old Soul Cat",
    note: "QUIET. The Areni-1 shoe — 5,500 years old, laces intact. Perspective delivered through shoelace history. Genuinely comforting from a cat who measures time in millennia."
  },
  {
    id: 19,
    text: "You tied a false knot. On purpose. Don't act surprised.",
    category: "cold",
    voice: "Realist Cat",
    note: "CRESCENDO. Real knot science — the false/granny knot is the weak version. You chose the easy tie and now it's falling apart. The cat isn't judging. The cat is reporting."
  },
  {
    id: 20,
    text: "*kneads the air* The structural integrity of this knot is... mmm.",
    category: "chaotic",
    voice: "Stoner Cat",
    note: "RHYTHM. Academic language ('structural integrity of the knot') delivered mid-knead, trailing off into bliss. The cat is having a moment with the concept of knots."
  },
  {
    id: 21,
    text: "Pentagram lacing exists. For when you're done being polite.",
    category: "chaotic",
    voice: "Dark Comedian Cat",
    note: "RHYTHM. Real lacing method. The cat drops this like a weapons recommendation. Dual-read: the escalation from crisscross to pentagram mirrors going from patient to unhinged."
  },
  {
    id: 22,
    text: "The throat is where the laces cross. Guard yours.",
    category: "cold",
    voice: "Feral Cat",
    note: "CRESCENDO. Real shoe anatomy — the throat is the opening where laces cross. The cat means the shoe part. Or does it. Primal, protective, double-edged."
  },
  {
    id: 23,
    text: "I think so? My research is ongoing. Don't quote me.",
    category: "wise",
    voice: "Doubt Cat",
    note: "QUIET. The cat has been studying this (shoelaces, your question, everything) and still can't commit to an answer. Hilarious uncertainty from a cat treating your problem like a doctoral thesis."
  },
  {
    id: 24,
    text: "Barrel lacing. Look it up. Then look at your life.",
    category: "judgy",
    voice: "Internet Cat",
    note: "RHYTHM. Real lacing method. The cat prescribes a Google search as both practical advice and existential homework. Modern, sharp, the judgment is in the pause between sentences."
  },
  {
    id: 25,
    text: "The bow holds two things together with one thread. Or it doesn't.",
    category: "poetic",
    voice: "Accidental Poet Cat",
    note: "CRESCENDO. Connection, commitment, the single thread between two sides. The cat stumbled into something beautiful while examining shoe mechanics. Would be insulted if you noticed."
  },
  {
    id: 26,
    text: "Impulsive force at the base. That's where it starts. Always.",
    category: "mystical",
    voice: "Prophet Cat",
    note: "RHYTHM. Academic term from the Berkeley study — the force of your foot hitting the ground. The cat uses physics to describe how everything unravels: from the foundation."
  },
  {
    id: 27,
    text: "Someone in Spain can tie three pairs in 9.3 seconds. What's your excuse?",
    category: "demanding",
    voice: "Competitive Cat",
    note: "RHYTHM. Real world record — Alvaro Martin Mendieta, 9.30 seconds for 3 pairs. The cat holds you to the standard of competitive shoelace athletics. Absurd but delivered with total conviction."
  },
  {
    id: 28,
    text: "The avalanche starts with one little bit of motion. *watches you*",
    category: "mystical",
    voice: "Pensive Cat",
    note: "QUIET. Christine Gregg's quote about the 'avalanche effect' in knot failure. The cat observes you the way a scientist observes the first sign of loosening. Patient. Knowing."
  },
  {
    id: 29,
    text: "Loop, wrap, pull. Every morning. And you think YOU'RE committed.",
    category: "judgy",
    voice: "Unimpressed Cat",
    note: "RHYTHM. The daily shoe-tying ritual that billions perform without thinking. The cat performs it with INTENTION and finds your version of commitment laughable by comparison."
  },
  {
    id: 30,
    text: "The lace and the eyelet need each other. Neither will say it first.",
    category: "heartfelt",
    voice: "Old Soul Cat",
    note: "CRESCENDO. Shoe anatomy as love story. The lace threads through the eyelet — they're nothing without each other, but the connection requires someone to make the first move. Quiet devastation."
  }
];

const categories = ['mystical','nurturing','poetic','cold','angry','heartfelt','judgy','chaotic','wise','existential','demanding','meta'];
let decisions = {};

function renderResponses() {
  const container = document.getElementById('responses-container');
  container.innerHTML = responses.map(r => `
    <div class="response-card" id="card-${r.id}" data-id="${r.id}">
      <div class="response-number">#${r.id}</div>
      <div class="response-category">${decisions[r.id]?.category || r.category}</div>
      <div class="response-text">"${decisions[r.id]?.editedText || r.text}"</div>
      <div class="response-voice">${r.voice} — ${r.note}</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${r.id}, 'keep')">Keep</button>
        <button class="btn btn-cut" onclick="decide(${r.id}, 'cut')">Cut</button>
        <button class="btn btn-edit" onclick="toggleEdit(${r.id})">Edit</button>
        ${decisions[r.id] ? '<button class="btn btn-reset" onclick="resetDecision(' + r.id + ')">Reset</button>' : ''}
      </div>
      <div class="edit-area" id="edit-${r.id}">
        <textarea id="textarea-${r.id}">${decisions[r.id]?.editedText || r.text}</textarea>
        <div>
          <select id="cat-select-${r.id}">
            ${categories.map(c => `<option value="${c}" ${(decisions[r.id]?.category || r.category) === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
          <button class="btn-save" onclick="saveEdit(${r.id})">Save Edit</button>
        </div>
      </div>
    </div>
  `).join('');
}

function decide(id, action) {
  const r = responses.find(x => x.id === id);
  if (action === 'keep') {
    decisions[id] = { ...decisions[id], action: 'keep', text: r.text, category: decisions[id]?.category || r.category, editedText: decisions[id]?.editedText || null };
  } else if (action === 'cut') {
    decisions[id] = { ...decisions[id], action: 'cut', text: r.text, category: r.category };
  }
  updateUI();
}

function toggleEdit(id) {
  const el = document.getElementById('edit-' + id);
  el.classList.toggle('visible');
}

function saveEdit(id) {
  const r = responses.find(x => x.id === id);
  const newText = document.getElementById('textarea-' + id).value.trim();
  const newCat = document.getElementById('cat-select-' + id).value;
  decisions[id] = { action: 'edit', text: r.text, editedText: newText, category: newCat };
  document.getElementById('edit-' + id).classList.remove('visible');
  updateUI();
}

function resetDecision(id) {
  delete decisions[id];
  updateUI();
}

function updateUI() {
  let kept = 0, cut = 0, edited = 0;
  Object.values(decisions).forEach(d => {
    if (d.action === 'keep') kept++;
    else if (d.action === 'cut') cut++;
    else if (d.action === 'edit') edited++;
  });
  document.getElementById('kept-count').textContent = kept;
  document.getElementById('cut-count').textContent = cut;
  document.getElementById('edit-count').textContent = edited;
  document.getElementById('pending-count').textContent = responses.length - kept - cut - edited;

  // Update card styles
  responses.forEach(r => {
    const card = document.getElementById('card-' + r.id);
    card.className = 'response-card';
    if (decisions[r.id]?.action === 'keep') card.classList.add('kept');
    else if (decisions[r.id]?.action === 'cut') card.classList.add('cut-card');
    else if (decisions[r.id]?.action === 'edit') card.classList.add('edited');
  });

  // Update export JSON
  const exportData = [];
  responses.forEach(r => {
    const d = decisions[r.id];
    if (d && (d.action === 'keep' || d.action === 'edit')) {
      exportData.push({
        text: d.editedText || d.text || r.text,
        category: d.category || r.category
      });
    }
  });
  document.getElementById('export-json').value = JSON.stringify(exportData, null, 2);

  renderResponses();
}

function copyExport() {
  const textarea = document.getElementById('export-json');
  textarea.select();
  document.execCommand('copy');
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
}

// Initial render
renderResponses();
updateUI();
</script>

</body>
</html>
