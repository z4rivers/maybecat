<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Review: Spock Teaches Yoga</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 20px;
    padding-top: 140px;
  }

  .sticky-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
    padding: 15px 20px;
    z-index: 100;
  }

  .sticky-header h1 {
    font-size: 1.3rem;
    color: #e94560;
    margin-bottom: 4px;
  }

  .sticky-header .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 10px;
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.95rem;
    flex-wrap: wrap;
  }

  .stats .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }

  .item {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }

  .item.kept { border-color: #4ecca3; }
  .item.cut { border-color: #e94560; opacity: 0.5; }
  .item.edited { border-color: #ffd93d; }

  .item-number {
    font-size: 0.75rem;
    color: #555;
    margin-bottom: 6px;
  }

  .item-text {
    font-size: 1.25rem;
    line-height: 1.5;
    margin-bottom: 6px;
    font-style: italic;
    color: #fff;
  }

  .item-category {
    font-size: 0.75rem;
    color: #0f3460;
    background: #1a1a2e;
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .item-note {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 12px;
  }

  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 6px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .btn:hover { transform: scale(1.05); }
  .btn.active { outline: 3px solid #fff; }

  .edit-area {
    display: none;
    margin-top: 10px;
  }

  .edit-area.visible {
    display: block;
  }

  .edit-area textarea {
    width: 100%;
    background: #1a1a2e;
    color: #fff;
    border: 1px solid #ffd93d;
    border-radius: 4px;
    padding: 10px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }

  .edit-area .save-edit {
    margin-top: 6px;
    background: #ffd93d;
    color: #1a1a2e;
    border: none;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
  }

  .export-section {
    margin-top: 40px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 20px;
  }

  .export-section h2 {
    color: #4ecca3;
    margin-bottom: 10px;
  }

  .export-section pre {
    background: #1a1a2e;
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 15px;
    overflow-x: auto;
    font-size: 0.85rem;
    color: #e0e0e0;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 600px;
    overflow-y: auto;
  }

  .copy-btn {
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .copy-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Spock Teaches Yoga</h1>
  <div class="subtitle">Yoga instruction language delivered through Spock's voice. Vulcan precision meets physical cues. 30 responses.</div>
  <div class="stats">
    <div class="stat stat-keep">KEEP: <span id="keep-count">0</span></div>
    <div class="stat stat-cut">CUT: <span id="cut-count">0</span></div>
    <div class="stat stat-edit">EDIT: <span id="edit-count">0</span></div>
    <div class="stat stat-pending">PENDING: <span id="pending-count">30</span></div>
    <div class="stat" style="color:#555">TOTAL: 30</div>
  </div>
</div>

<div id="items-container"></div>

<div class="export-section">
  <h2>Export (KEPT + EDITED only)</h2>
  <button class="copy-btn" onclick="copyExport()">Copy JSON</button>
  <pre id="export-json">[]</pre>
</div>

<script>
const items = [
  {
    text: "Your aversion is diagnostically useful.",
    category: "wise",
    note: "Yoga: 'The pose you hate most is the one you need.' Spock reframe. Works for avoidance of any kind."
  },
  {
    text: "Unclench your jaw. It serves no tactical purpose.",
    category: "demanding",
    note: "Yoga tension release cue. Spock can't fathom why you'd hold tension that accomplishes nothing."
  },
  {
    text: "The trembling indicates progress. Continue.",
    category: "cold",
    note: "Yoga: 'If you're shaking, you're working.' Clinical Spock encouragement."
  },
  {
    text: "Fascinating. You're resisting yourself.",
    category: "wise",
    note: "Yoga: 'Don't fight the pose.' Spock as reluctant therapist. Double meaning: self-sabotage."
  },
  {
    text: "Your foundation is misaligned. Everything above it will be.",
    category: "judgy",
    note: "Yoga: 'If the foundation is off, everything above it is off.' Devastating life assessment."
  },
  {
    text: "Soften what is not required for survival.",
    category: "poetic",
    note: "Yoga: 'Soften what you don't need.' Spock's Vulcan filter makes it about efficiency. Quietly beautiful."
  },
  {
    text: "You chose to be here. Noted.",
    category: "cold",
    note: "Yoga: 'You chose to be here.' Spock's dry observation. Works for any bad situation."
  },
  {
    text: "Your discomfort is not a malfunction.",
    category: "wise",
    note: "Yoga: 'This is supposed to be uncomfortable.' Spock normalizing difficulty. Warm disguised as data."
  },
  {
    text: "Breathe through it. Not around it.",
    category: "demanding",
    note: "Direct yoga cue. Already Spock-adjacent in its precision. Confrontation over avoidance."
  },
  {
    text: "I fail to see how clenching improves outcomes.",
    category: "judgy",
    note: "Yoga: 'Unclench your fists / release your grip.' Spock baffled by human tension habits."
  },
  {
    text: "You are attempting to force flexibility. Illogical.",
    category: "judgy",
    note: "Yoga: 'You can't force flexibility.' Spock verdict. Double meaning: relationships, outcomes."
  },
  {
    text: "Root down before you reach.",
    category: "wise",
    note: "Yoga alignment cue. Already Spock-clean. Works as life advice about preparation."
  },
  {
    text: "The stillness is the difficult part. I am aware.",
    category: "poetic",
    note: "Yoga: savasana is the hardest pose. Spock acknowledging difficulty with Vulcan restraint. Genuine warmth."
  },
  {
    text: "Modification is not failure. It is data.",
    category: "wise",
    note: "Yoga: 'Modify without apology.' Spock reframe. Permission-giving disguised as logic."
  },
  {
    text: "Your exhale carries more than your inhale. Use it.",
    category: "mystical",
    note: "Yoga: 'Let each exhale carry tension away.' Spock treats breath as engineering."
  },
  {
    text: "Stay on your own mat.",
    category: "cold",
    note: "Classic yoga anti-comparison cue. Already a Spock-level dismissal. Clean, final."
  },
  {
    text: "Lengthen before you deepen. In all things.",
    category: "wise",
    note: "Yoga alignment cue. The 'in all things' is pure Spock addendum. Patience advice."
  },
  {
    text: "You are holding tension in locations you have not yet identified.",
    category: "mystical",
    note: "Yoga body scan language. Spock's clinical precision makes it eerily accurate about emotions."
  },
  {
    text: "The wobble is not the problem. The rigidity was.",
    category: "wise",
    note: "Yoga: tree pose balance, 'it's okay to wobble.' Spock inverts the concern. Life reframe."
  },
  {
    text: "Your resistance has been noted. Proceed anyway.",
    category: "demanding",
    note: "Yoga: 'Don't run from the sensation.' Spock logs the objection, overrules it."
  },
  {
    text: "Effort without strain. That is the assignment.",
    category: "poetic",
    note: "Yoga paradox cue. Spock delivers the impossible instruction with total calm."
  },
  {
    text: "Let the ground hold you. It is qualified.",
    category: "poetic",
    note: "Yoga: 'Let the floor hold you.' Spock vouching for gravity. Tender disguised as assessment."
  },
  {
    text: "You lost your breath. You went too far.",
    category: "cold",
    note: "Yoga: 'If you lost your breath, you went too far.' Spock as diagnostician. Works for burnout, overcommitment."
  },
  {
    text: "Fascinating. The hips appear to store data the mind refuses to process.",
    category: "mystical",
    note: "Yoga: pigeon pose emotional release. Spock discovering human bodies have feelings stored in them."
  },
  {
    text: "Stack your joints. Then your priorities.",
    category: "demanding",
    note: "Yoga alignment cue extended. Spock's logical sequence. Physical then metaphorical."
  },
  {
    text: "This is not something to solve. Observe it.",
    category: "wise",
    note: "Yin yoga: 'This isn't something to solve. Just feel it.' Spock as scientist. Permission to not fix."
  },
  {
    text: "Your capacity today is not yesterday's. Adjust.",
    category: "cold",
    note: "Yoga: 'Your body is different today.' Spock recalibrating without sentimentality. Grace in clinical form."
  },
  {
    text: "Lean forward until you have no choice but to fly.",
    category: "poetic",
    note: "Yoga: crow pose instruction. Already cinematic. Spock delivering commitment advice through physics."
  },
  {
    text: "You appear to be gripping the outcome. Release your toes.",
    category: "judgy",
    note: "Yoga: 'Release the grip in your toes.' Spock connects physical tension to control issues. Double reading."
  },
  {
    text: "Nothing to do. Nowhere to go. This is optimal.",
    category: "poetic",
    note: "Yoga savasana cue. Spock declaring peak efficiency is doing absolutely nothing. Cat energy meets Vulcan logic."
  }
];

const states = new Array(items.length).fill(null); // null = pending, 'keep', 'cut', 'edit'
const editedTexts = new Array(items.length).fill(null);

function render() {
  const container = document.getElementById('items-container');
  container.innerHTML = '';

  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = `item ${states[i] === 'keep' ? 'kept' : states[i] === 'cut' ? 'cut' : states[i] === 'edit' ? 'edited' : ''}`;

    const displayText = editedTexts[i] || item.text;

    div.innerHTML = `
      <div class="item-number">#${i + 1}</div>
      <div class="item-text">"${displayText}"</div>
      <div class="item-category">${item.category}</div>
      <div class="item-note">${item.note}</div>
      <div class="actions">
        <button class="btn btn-keep ${states[i] === 'keep' ? 'active' : ''}" onclick="setState(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut ${states[i] === 'cut' ? 'active' : ''}" onclick="setState(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${i}">
        <textarea id="textarea-${i}">${displayText}</textarea>
        <button class="save-edit" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    container.appendChild(div);
  });

  updateStats();
  updateExport();
}

function setState(i, state) {
  states[i] = states[i] === state ? null : state;
  render();
}

function toggleEdit(i) {
  const el = document.getElementById(`edit-${i}`);
  el.classList.toggle('visible');
}

function saveEdit(i) {
  const textarea = document.getElementById(`textarea-${i}`);
  editedTexts[i] = textarea.value;
  states[i] = 'edit';
  render();
}

function updateStats() {
  const keep = states.filter(s => s === 'keep').length;
  const cut = states.filter(s => s === 'cut').length;
  const edit = states.filter(s => s === 'edit').length;
  const pending = states.filter(s => s === null).length;
  document.getElementById('keep-count').textContent = keep;
  document.getElementById('cut-count').textContent = cut;
  document.getElementById('edit-count').textContent = edit;
  document.getElementById('pending-count').textContent = pending;
}

function updateExport() {
  const exported = items
    .map((item, i) => {
      if (states[i] === 'keep') return { text: item.text, category: item.category };
      if (states[i] === 'edit') return { text: editedTexts[i], category: item.category };
      return null;
    })
    .filter(Boolean);

  document.getElementById('export-json').textContent = JSON.stringify(exported, null, 2);
}

function copyExport() {
  const text = document.getElementById('export-json').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 1500);
  });
}

render();
</script>

</body>
</html>
