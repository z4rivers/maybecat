<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaybeCat Batch Review — Synth/Pedal Language</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
    padding-top: 140px;
  }
  .sticky-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
    padding: 16px 24px;
    z-index: 1000;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
  }
  .sticky-header h1 {
    font-size: 1.2rem;
    color: #e94560;
    flex-shrink: 0;
  }
  .sticky-header .subtitle {
    font-size: 0.85rem;
    color: #888;
    flex-basis: 100%;
    margin-top: -8px;
  }
  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stat {
    font-size: 0.9rem;
    font-weight: 600;
  }
  .stat-total { color: #e0e0e0; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }

  .response-card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    transition: border-color 0.3s;
  }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }

  .response-text {
    font-size: 1.3rem;
    line-height: 1.5;
    margin-bottom: 8px;
    font-style: italic;
    color: #fff;
  }
  .response-category {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .response-number {
    font-size: 0.75rem;
    color: #555;
    float: right;
  }
  .response-note {
    font-size: 0.75rem;
    color: #666;
    margin-bottom: 10px;
    font-style: italic;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-keep:hover { background: #3db892; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-cut:hover { background: #d63851; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .btn-edit:hover { background: #eec82a; }
  .btn-reset { background: #333; color: #aaa; }
  .btn-reset:hover { background: #444; }

  .edit-area {
    display: none;
    margin-top: 10px;
  }
  .edit-area.visible { display: block; }
  .edit-area textarea {
    width: 100%;
    background: #0f3460;
    color: #e0e0e0;
    border: 1px solid #4ecca3;
    border-radius: 6px;
    padding: 10px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }
  .edit-area .btn {
    margin-top: 8px;
  }

  .export-section {
    max-width: 800px;
    margin: 40px auto;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 20px;
  }
  .export-section h2 {
    color: #4ecca3;
    margin-bottom: 12px;
    font-size: 1.1rem;
  }
  .export-section textarea {
    width: 100%;
    background: #0a0a1a;
    color: #4ecca3;
    border: 1px solid #0f3460;
    border-radius: 6px;
    padding: 14px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.85rem;
    min-height: 300px;
    resize: vertical;
  }
  .copy-btn {
    margin-top: 10px;
    padding: 8px 20px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .copy-btn:hover { background: #3db892; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Synth/Pedal Language Batch</h1>
  <div class="subtitle">Motivational Analogue Synthesizer — gear language relocated as life advice. 30 responses.</div>
  <div class="stats">
    <span class="stat stat-total">Total: <span id="total">30</span></span>
    <span class="stat stat-keep">Keep: <span id="kept">0</span></span>
    <span class="stat stat-cut">Cut: <span id="cuts">0</span></span>
    <span class="stat stat-edit">Edit: <span id="edits">0</span></span>
    <span class="stat stat-pending">Pending: <span id="pending">30</span></span>
  </div>
</div>

<div id="cards"></div>

<div class="export-section">
  <h2>Export JSON (kept + edited only)</h2>
  <textarea id="exportJson" readonly></textarea>
  <br>
  <button class="copy-btn" onclick="copyExport()">Copy to Clipboard</button>
</div>

<script>
const responses = [
  // --- MOTIVATIONAL (pushed to the edge, dial it up) ---
  {
    text: "Crank it past clean.",
    category: "demanding",
    note: "Overdrive language. 'Clean' = the undriven signal / your comfort zone. Dual read: turn it up AND stop playing it safe."
  },
  {
    text: "You break up beautifully.",
    category: "loving",
    note: "Overdrive 'breaks up' = warm distortion when pushed. Dual read: your falling apart is gorgeous. Lewd third reading too."
  },
  {
    text: "Pushed just past clean headroom. That's where it gets warm.",
    category: "wise",
    note: "Headroom = space before distortion. The warmth only comes AFTER the clean limit. Applies to: vulnerability, risk, growth."
  },
  {
    text: "Some things only sound right saturated.",
    category: "poetic",
    note: "Tape/tube saturation = warm compression from being pushed. Dual read: some feelings need to be FULL to work."
  },
  // --- CALMING (reverb fills the space, let the trails fade) ---
  {
    text: "Let the trails decay.",
    category: "poetic",
    note: "Reverb/delay trails = the echoes that continue after you stop playing. Life read: let it fade naturally. Don't cut it short."
  },
  {
    text: "Fills the space around your notes. Not the notes themselves.",
    category: "wise",
    note: "Literal reverb description. Life read: support doesn't replace what you do. It frames it."
  },
  {
    text: "Repeats fade naturally. Let them.",
    category: "reluctant",
    note: "Analog delay repeats soften over time. Life read: the echoes of what happened will quiet on their own."
  },
  {
    text: "Starts soft and gradually deepens. Like breathing.",
    category: "poetic",
    note: "Tremolo waveform description. Life read: ease into it. The depth comes."
  },
  // --- PRACTICAL (gain staging, signal chain order matters) ---
  {
    text: "What comes first affects everything after.",
    category: "wise",
    note: "Signal chain order = pedal placement matters. Life read: sequence matters. What you deal with first colors the rest."
  },
  {
    text: "Smooth out the dynamics before they get colored.",
    category: "wise",
    note: "Compressor early in signal chain advice. Life read: get centered before you add complexity."
  },
  {
    text: "You're being affected even when it's off.",
    category: "cryptic",
    note: "Buffered bypass = the circuit colors your signal even when 'bypassed.' Life read: that thing you think you turned off is still shaping you."
  },
  {
    text: "Stacks well with others.",
    category: "playful",
    note: "Pedal review praise = plays nice in a chain. Life read: you complement people. Also: innuendo."
  },
  // --- DESTRUCTIVE (fuzz obliterates, beautiful chaos) ---
  {
    text: "Beautiful destruction is still beautiful.",
    category: "demanding",
    note: "Fuzz pedal philosophy. The obliteration of the clean signal creates something new and gorgeous."
  },
  {
    text: "Takes your input and brutally amplifies it.",
    category: "chaotic",
    note: "Fuzz circuit description (Data Corrupter). Life read: whatever you bring, this will make it LOUDER."
  },
  {
    text: "Self-oscillation. The feedback becomes its own instrument.",
    category: "cryptic",
    note: "Delay self-oscillation = signal feeds back until it generates its own sound. Life read: the spiral creates something new."
  },
  {
    text: "Thick like an old forest. Articulate.",
    category: "poetic",
    note: "EQD Hoof fuzz description. Life read: you can be dense AND clear. Complex AND understood."
  },
  // --- PHILOSOPHICAL (no presets, every patch is temporary) ---
  {
    text: "No presets. Only decisions.",
    category: "demanding",
    note: "Modular synths have no presets — every sound is built from scratch. Life read: nobody saved this for you. You build it."
  },
  {
    text: "Every patch is temporary.",
    category: "wise",
    note: "Modular synth patches = cable connections that create a sound. Unplug and it's gone. Life read: impermanence isn't loss."
  },
  {
    text: "It's all just voltage.",
    category: "wise",
    note: "Eurorack philosophy — audio and control are the same thing. Life read: it's all the same energy. Stop categorizing."
  },
  {
    text: "A filter removes what you don't need.",
    category: "cold",
    note: "Synth filter = subtractive synthesis. Life read: cut frequencies. Cut people. Cut noise."
  },
  // --- MIXED VOICES ---
  {
    text: "Bypass the drama. Keep your signal clean.",
    category: "dismissive",
    note: "True bypass = signal passes through unaffected. Life read: skip it entirely. Protect your tone."
  },
  {
    text: "Clipping is just the sound of hitting your limit.",
    category: "wise",
    note: "Clipping = signal exceeding circuit capacity. Life read: that distortion you're feeling? It means you're full."
  },
  {
    text: "Dial it back. Find the sweet spot.",
    category: "reluctant",
    note: "'Dial it back' = turn the knob down. Universal gear advice AND universal life advice. Dual read: calm down / find balance."
  },
  {
    text: "Making the soft parts louder and the loud parts softer.",
    category: "loving",
    note: "Literal compressor definition. Life read: amplify what's quiet in you. Tame what's screaming."
  },
  {
    text: "Honour thy error as a hidden intention.",
    category: "wise",
    note: "Brian Eno's Oblique Strategies. Relocated: the mistake WAS the move."
  },
  {
    text: "Touch sensitive. Play lighter.",
    category: "poetic",
    note: "Touch-sensitive overdrive responds to how hard you play. Life read: be gentler. It responds."
  },
  {
    text: "Warm, chaotic, and full of beautiful imperfections.",
    category: "loving",
    note: "Tape echo / lo-fi pedal language. Life read: that's not a flaw description. That's a love letter."
  },
  {
    text: "The wobble is a feature.",
    category: "playful",
    note: "Wow & flutter in tape machines — pitch imperfections that sound GOOD. Life read: your instability is the charm."
  },
  {
    text: "Do nothing for as long as possible.",
    category: "cold",
    note: "Brian Eno's Oblique Strategies. Deadpan. Perfect as a 2 AM answer to 'should I text them.'"
  },
  {
    text: "Surrender is an active choice.",
    category: "wise",
    note: "Brian Eno on control vs. letting go. Life read: giving in isn't giving up. It's a move."
  }
];

const decisions = new Array(responses.length).fill(null); // null = pending, 'keep', 'cut', 'edit'
const editTexts = new Array(responses.length).fill('');

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  responses.forEach((r, i) => {
    const status = decisions[i];
    const statusClass = status === 'keep' ? 'kept' : status === 'cut' ? 'cut' : status === 'edit' ? 'edited' : '';

    const card = document.createElement('div');
    card.className = `response-card ${statusClass}`;
    card.innerHTML = `
      <span class="response-number">#${i + 1}</span>
      <div class="response-text">"${editTexts[i] || r.text}"</div>
      <div class="response-category">${r.category}</div>
      <div class="response-note">${r.note}</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
        ${status ? `<button class="btn btn-reset" onclick="decide(${i}, null)">RESET</button>` : ''}
      </div>
      <div class="edit-area" id="edit-${i}">
        <textarea id="edittext-${i}" placeholder="Edit the response text...">${editTexts[i] || r.text}</textarea>
        <button class="btn btn-edit" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    container.appendChild(card);
  });

  updateStats();
  updateExport();
}

function decide(index, status) {
  decisions[index] = status;
  if (status !== 'edit') {
    editTexts[index] = '';
  }
  render();
}

function toggleEdit(index) {
  const el = document.getElementById(`edit-${index}`);
  el.classList.toggle('visible');
}

function saveEdit(index) {
  const textarea = document.getElementById(`edittext-${index}`);
  editTexts[index] = textarea.value;
  decisions[index] = 'edit';
  render();
}

function updateStats() {
  const kept = decisions.filter(d => d === 'keep').length;
  const cut = decisions.filter(d => d === 'cut').length;
  const edited = decisions.filter(d => d === 'edit').length;
  const pending = decisions.filter(d => d === null).length;

  document.getElementById('kept').textContent = kept;
  document.getElementById('cuts').textContent = cut;
  document.getElementById('edits').textContent = edited;
  document.getElementById('pending').textContent = pending;
}

function updateExport() {
  const exported = [];
  responses.forEach((r, i) => {
    if (decisions[i] === 'keep') {
      exported.push({ text: r.text, category: r.category });
    } else if (decisions[i] === 'edit') {
      exported.push({ text: editTexts[i] || r.text, category: r.category });
    }
  });
  document.getElementById('exportJson').value = JSON.stringify(exported, null, 2);
}

function copyExport() {
  const textarea = document.getElementById('exportJson');
  textarea.select();
  document.execCommand('copy');
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
}

render();
</script>
</body>
</html>
