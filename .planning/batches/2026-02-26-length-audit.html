// Filter out skipped items
const activeItems = items.filter(i => !i.skip);
const decisions = {};
let totalItems = activeItems.length;

function render() {
  const container = document.getElementById('items');
  container.innerHTML = '';

  // Section: 100+ chars
  let html = '<div class="section-divider">100+ characters (' + activeItems.filter(i => i.chars >= 100).length + ' responses)</div>';
  activeItems.filter(i => i.chars >= 100).forEach((item, idx) => {
    html += renderItem(item, 'a' + idx);
  });

  html += '<div class="section-divider">80-99 characters (' + activeItems.filter(i => i.chars >= 80 && i.chars < 100).length + ' responses)</div>';
  activeItems.filter(i => i.chars >= 80 && i.chars < 100).forEach((item, idx) => {
    html += renderItem(item, 'b' + idx);
  });

  html += '<div class="section-divider">60-79 characters (' + activeItems.filter(i => i.chars >= 60 && i.chars < 80).length + ' responses)</div>';
  activeItems.filter(i => i.chars >= 60 && i.chars < 80).forEach((item, idx) => {
    html += renderItem(item, 'c' + idx);
  });

  html += '<div class="section-divider">Under 60 characters (' + activeItems.filter(i => i.chars < 60).length + ' responses)</div>';
  activeItems.filter(i => i.chars < 60).forEach((item, idx) => {
    html += renderItem(item, 'd' + idx);
  });

  container.innerHTML = html;
  updateStats();
}

function renderItem(item, id) {
  const status = decisions[id] || '';
  const cls = status === 'keep' ? 'kept' : status === 'cut' ? 'cut' : status === 'edit' ? 'edited' : '';
  const saved = item.chars - item.trimChars;
  return `
    <div class="item ${cls}" id="item-${id}">
      <span class="category-badge">${item.category}</span>
      <div class="original">"${escHtml(item.original)}"</div>
      <div class="char-count">${item.chars} chars</div>
      <div class="issue">${escHtml(item.issue)}</div>
      <div class="suggested">"${escHtml(item.suggested)}"</div>
      <div class="trim-count">${item.trimChars} chars (saves ${saved})</div>
      <div class="actions">
        <button class="btn-keep-original" onclick="decide('${id}','keep-original')">KEEP ORIGINAL</button>
        <button class="btn-use-trim" onclick="decide('${id}','use-trim')">USE TRIM</button>
        <button class="btn-cut" onclick="decide('${id}','cut')">CUT</button>
        <button class="btn-edit" onclick="toggleEdit('${id}')">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${id}">
        <textarea id="textarea-${id}" oninput="updateCharCount('${id}')">${escHtml(item.suggested)}</textarea>
        <div class="char-live" id="charlive-${id}">${item.trimChars} chars</div>
        <button class="save-edit" onclick="saveEdit('${id}')">Save Edit</button>
      </div>
    </div>
  `;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function decide(id, type) {
  decisions[id] = type;
  const el = document.getElementById('item-' + id);
  const cls = type === 'keep-original' ? 'kept-original' : type === 'use-trim' ? 'use-trim' : type === 'cut' ? 'cut' : 'edited';
  el.className = 'item ' + cls;
  updateStats();
  updateExport();
}

function toggleEdit(id) {
  const el = document.getElementById('edit-' + id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function updateCharCount(id) {
  const ta = document.getElementById('textarea-' + id);
  document.getElementById('charlive-' + id).textContent = ta.value.length + ' chars';
}

function saveEdit(id) {
  decisions[id] = 'edit';
  const el = document.getElementById('item-' + id);
  el.className = 'item edited';
  updateStats();
  updateExport();
}

function updateStats() {
  let keepOrigC = 0, useTrimC = 0, cutC = 0, editC = 0, saved = 0;
  const allIds = getAllIds();
  allIds.forEach(id => {
    const d = decisions[id];
    if (d === 'keep-original') { keepOrigC++; }
    else if (d === 'use-trim') { useTrimC++; saved += getCharsSaved(id); }
    else if (d === 'cut') { cutC++; saved += getOrigChars(id); }
    else if (d === 'edit') { editC++; saved += getEditCharsSaved(id); }
  });
  document.getElementById('keepOrigCount').textContent = keepOrigC;
  document.getElementById('useTrimCount').textContent = useTrimC;
  document.getElementById('cutCount').textContent = cutC;
  document.getElementById('editCount').textContent = editC;
  document.getElementById('pendingCount').textContent = allIds.length - keepOrigC - useTrimC - cutC - editC;
  document.getElementById('charsSaved').textContent = saved;
}

function getAllIds() {
  const ids = [];
  activeItems.filter(i => i.chars >= 100).forEach((_, idx) => ids.push('a' + idx));
  activeItems.filter(i => i.chars >= 80 && i.chars < 100).forEach((_, idx) => ids.push('b' + idx));
  activeItems.filter(i => i.chars >= 60 && i.chars < 80).forEach((_, idx) => ids.push('c' + idx));
  activeItems.filter(i => i.chars < 60).forEach((_, idx) => ids.push('d' + idx));
  return ids;
}

function getItemByBucket(id) {
  const prefix = id[0];
  const idx = parseInt(id.slice(1));
  if (prefix === 'a') return activeItems.filter(i => i.chars >= 100)[idx];
  if (prefix === 'b') return activeItems.filter(i => i.chars >= 80 && i.chars < 100)[idx];
  if (prefix === 'c') return activeItems.filter(i => i.chars >= 60 && i.chars < 80)[idx];
  if (prefix === 'd') return activeItems.filter(i => i.chars < 60)[idx];
}

function getCharsSaved(id) {
  const item = getItemByBucket(id);
  return item ? item.chars - item.trimChars : 0;
}

function getOrigChars(id) {
  const item = getItemByBucket(id);
  return item ? item.chars : 0;
}

function getEditCharsSaved(id) {
  const item = getItemByBucket(id);
  const ta = document.getElementById('textarea-' + id);
  if (!item || !ta) return 0;
  return item.chars - ta.value.length;
}

function updateExport() {
  const result = [];
  const allIds = getAllIds();
  allIds.forEach(id => {
    const d = decisions[id];
    const item = getItemByBucket(id);
    if (!item) return;
    if (d === 'keep-original') {
      result.push({ text: item.original, category: item.category, action: 'kept' });
    } else if (d === 'use-trim') {
      result.push({ text: item.suggested, category: item.category, action: 'trimmed' });
    } else if (d === 'edit') {
      const ta = document.getElementById('textarea-' + id);
      if (ta) result.push({ text: ta.value, category: item.category, action: 'edited' });
    } else if (d === 'cut') {
      result.push({ text: item.original, category: item.category, action: 'cut' });
    }
  });
  document.getElementById('exportJson').textContent = JSON.stringify(result, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportJson').textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert('Copied!');
  });
}

render();
</script>
