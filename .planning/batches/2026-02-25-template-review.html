// ============================================
// PRE-COMPUTED EXAMPLES — 5 per template
// Hand-picked to show range: best, mediocre, worst combos
// ============================================
function generateExamples(t, idx) {
  // Seeded pseudo-random based on template index for reproducibility
  function seeded(seed) {
    let x = Math.sin(seed * 9301 + 49297) * 49297;
    return x - Math.floor(x);
  }

  function pick(arr, seed) {
    return arr[Math.floor(seeded(seed) * arr.length)];
  }

  function compose(template, seedBase) {
    let text = template.pattern;
    const slotKeys = Object.keys(template.slots);
    for (let i = 0; i < slotKeys.length; i++) {
      const key = slotKeys[i];
      const val = pick(template.slots[key], seedBase + i * 7.3);
      text = text.replace('{' + key + '}', val);
    }
    return text;
  }

  // Generate 5 diverse examples using spread-out seeds
  const results = [];
  const seeds = [idx * 100 + 1, idx * 100 + 23, idx * 100 + 47, idx * 100 + 71, idx * 100 + 93];

  for (const s of seeds) {
    results.push(compose(t, s));
  }

  // Deduplicate — if any match, shift seed
  const unique = new Set();
  const final = [];
  for (let i = 0; i < results.length; i++) {
    if (!unique.has(results[i])) {
      unique.add(results[i]);
      final.push(results[i]);
    } else {
      // Try alternate seed
      const alt = compose(t, idx * 100 + i * 13 + 200);
      if (!unique.has(alt)) {
        unique.add(alt);
        final.push(alt);
      }
    }
  }

  return final.slice(0, 5);
}

// ============================================
// STATE
// ============================================
const decisions = {};
let currentExportMode = 'all';

function updateStats() {
  const total = templates.length;
  let kept = 0, cut = 0;
  for (const d of Object.values(decisions)) {
    if (d === 'keep') kept++;
    if (d === 'cut') cut++;
  }
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDecided').textContent = kept + cut;
  document.getElementById('statKept').textContent = kept;
  document.getElementById('statCut').textContent = cut;
  document.getElementById('statRemaining').textContent = total - kept - cut;
  updateExport();
}

function decide(idx, action) {
  decisions[idx] = action;
  const card = document.getElementById('card-' + idx);
  card.classList.remove('kept', 'cut');
  card.classList.add('decided');
  card.classList.add(action === 'keep' ? 'kept' : 'cut');
  updateStats();
}

function undoDecision(idx) {
  delete decisions[idx];
  const card = document.getElementById('card-' + idx);
  card.classList.remove('kept', 'cut', 'decided');
  updateStats();
}

function toggleSlots(idx) {
  const section = document.getElementById('slots-' + idx);
  section.classList.toggle('visible');
}

function showExport(mode) {
  currentExportMode = mode;
  document.querySelectorAll('.export-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  updateExport();
}

function updateExport() {
  const output = [];
  for (let i = 0; i < templates.length; i++) {
    const d = decisions[i];
    if (currentExportMode === 'all' && d) {
      output.push({ pattern: templates[i].pattern, category: templates[i].category, decision: d });
    } else if (currentExportMode === 'keep' && d === 'keep') {
      output.push({ pattern: templates[i].pattern, category: templates[i].category });
    } else if (currentExportMode === 'cut' && d === 'cut') {
      output.push({ pattern: templates[i].pattern, category: templates[i].category });
    }
  }
  document.getElementById('exportBlock').textContent = JSON.stringify(output, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportBlock').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy to Clipboard';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function computeCombinations(t) {
  const slotKeys = Object.keys(t.slots);
  let total = 1;
  for (const key of slotKeys) {
    total *= t.slots[key].length;
  }
  return total;
}

// ============================================
// RENDER
// ============================================
function render() {
  const container = document.getElementById('templates');
  let html = '';

  for (let i = 0; i < templates.length; i++) {
    const t = templates[i];
    const examples = generateExamples(t, i);
    const combos = computeCombinations(t);
    const slotKeys = Object.keys(t.slots);

    // Highlight slot markers in pattern
    let patternHtml = t.pattern
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\{(\w+)\}/g, '<span class="slot-marker">{$1}</span>');

    html += '<div class="template-card" id="card-' + i + '">';
    html += '  <div class="template-number">Template ' + (i + 1) + ' of ' + templates.length + '</div>';
    html += '  <div class="template-pattern">' + patternHtml + '</div>';
    html += '  <span class="category-badge">' + t.category + '</span>';
    html += '  <div class="combo-count">' + combos.toLocaleString() + ' possible combinations &middot; ' + slotKeys.length + ' slot' + (slotKeys.length > 1 ? 's' : '') + '</div>';

    // Slot toggle
    html += '  <button class="slots-toggle" onclick="toggleSlots(' + i + ')">Show/Hide Slot Options</button>';
    html += '  <div class="slots-section" id="slots-' + i + '">';
    for (const key of slotKeys) {
      html += '    <div class="slot-group">';
      html += '      <div class="slot-name">{' + key + '}</div>';
      html += '      <div class="slot-options">';
      for (const opt of t.slots[key]) {
        html += '        <span class="slot-option">' + opt.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>';
      }
      html += '      </div>';
      html += '    </div>';
    }
    html += '  </div>';

    // Examples
    html += '  <div class="examples-section">';
    html += '    <div class="examples-label">Sample Outputs</div>';
    for (let e = 0; e < examples.length; e++) {
      html += '    <div class="example">' + examples[e].replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
    }
    html += '  </div>';

    // Actions
    html += '  <div class="actions">';
    html += '    <button class="btn btn-keep" onclick="decide(' + i + ', \'keep\')">Keep</button>';
    html += '    <button class="btn btn-cut" onclick="decide(' + i + ', \'cut\')">Cut</button>';
    html += '    <button class="btn btn-undo" onclick="undoDecision(' + i + ')">Undo</button>';
    html += '    <span class="decision-label keep-label">KEPT</span>';
    html += '    <span class="decision-label cut-label">CUT</span>';
    html += '  </div>';

    html += '</div>';
  }

  container.innerHTML = html;
  updateStats();
}

render();
