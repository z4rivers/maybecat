// Build DOM
const content = document.getElementById('content');
let itemId = 0;
const allItems = [];

groups.forEach((group, gi) => {
  const header = document.createElement('div');
  header.className = 'group-header';
  header.innerHTML = `
    <h2>Pattern: ${group.name} &mdash; ${group.items.length} responses</h2>
    <div class="group-desc">${group.desc}</div>
  `;
  content.appendChild(header);

  group.items.forEach((item, ii) => {
    const id = itemId++;
    allItems.push({ id, ...item, status: 'undecided', editedText: '' });

    const div = document.createElement('div');
    div.className = 'item';
    div.id = `item-${id}`;
    div.innerHTML = `
      <div class="item-text">${escapeHtml(item.text)}</div>
      <div class="item-meta">
        <span>Line <strong>${item.line}</strong></span>
        <span class="cat-label">${item.category}</span>
        <span>Group ${gi + 1} / Item ${ii + 1}</span>
      </div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${id}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${id}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${id})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${id}">
        <textarea id="textarea-${id}" oninput="saveState()">${escapeHtml(item.text)}</textarea>
        <button class="btn btn-save" onclick="saveEdit(${id})">Save Edit</button>
      </div>
    `;
    content.appendChild(div);
  });
});

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function saveState() {
  const state = {
    decisions: allItems.map(i => ({
      id: i.id,
      status: i.status,
      editedText: i.editedText
    }))
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;

  try {
    const state = JSON.parse(saved);
    state.decisions.forEach(dec => {
      const item = allItems.find(i => i.id === dec.id);
      if (item) {
        item.status = dec.status;
        item.editedText = dec.editedText;

        // Restore visual state
        const el = document.getElementById(`item-${dec.id}`);
        el.className = 'item ' + (dec.status === 'keep' ? 'kept' : dec.status === 'cut' ? 'cut' : dec.status === 'edited' ? 'edited' : '');

        // Restore edit textarea if edited
        if (dec.status === 'edited' && dec.editedText) {
          const textarea = document.getElementById(`textarea-${dec.id}`);
          textarea.value = dec.editedText;
        }
      }
    });
    updateStats();
    updateExport();
  } catch (e) {
    console.error('Failed to load state:', e);
  }
}

function decide(id, status) {
  const item = allItems[id];
  item.status = status;
  const el = document.getElementById(`item-${id}`);
  el.className = 'item ' + (status === 'keep' ? 'kept' : status === 'cut' ? 'cut' : '');
  updateStats();
  updateExport();
  saveState();
}

function toggleEdit(id) {
  const el = document.getElementById(`edit-${id}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function saveEdit(id) {
  const textarea = document.getElementById(`textarea-${id}`);
  const item = allItems[id];
  item.editedText = textarea.value;
  item.status = 'edited';
  const el = document.getElementById(`item-${id}`);
  el.className = 'item edited';
  document.getElementById(`edit-${id}`).style.display = 'none';
  updateStats();
  updateExport();
  saveState();
}

function updateStats() {
  const total = allItems.length;
  const keep = allItems.filter(i => i.status === 'keep').length;
  const cut = allItems.filter(i => i.status === 'cut').length;
  const edit = allItems.filter(i => i.status === 'edited').length;
  document.getElementById('total-count').textContent = total;
  document.getElementById('keep-count').textContent = keep;
  document.getElementById('cut-count').textContent = cut;
  document.getElementById('edit-count').textContent = edit;
  document.getElementById('undecided-count').textContent = total - keep - cut - edit;
}

function updateExport() {
  const cuts = allItems
    .filter(i => i.status === 'cut')
    .map(i => i.text);

  const edits = allItems
    .filter(i => i.status === 'edited')
    .map(i => ({
      original: i.text,
      edited: i.editedText,
      category: i.category,
      line: i.line
    }));

  const total = allItems.length;
  const cutCount = cuts.length;
  const editCount = edits.length;
  const keepCount = total - cutCount - editCount - allItems.filter(i => i.status === 'undecided').length;

  const exportObj = {
    cuts: cuts,
    edits: edits,
    summary: `${cutCount} cut, ${editCount} edited, ${keepCount} kept (untouched)`
  };

  document.getElementById('export-json').value = JSON.stringify(exportObj, null, 2);
}

function copyExport() {
  const el = document.getElementById('export-json');
  navigator.clipboard.writeText(el.value).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 2000);
  });
}

loadState();
updateStats();
updateExport();
</script>
</body>
</html>
