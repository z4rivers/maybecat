<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 28: Wild Animal Descriptions — Found Language for Relocation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; padding-top: 120px; }

.stats-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #16213e; padding: 15px 20px; border-bottom: 2px solid #0f3460;
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.stat { font-size: 14px; }
.stat-keep { color: #4ecca3; }
.stat-cut { color: #e94560; }
.stat-edit { color: #ffd93d; }
.stat-pending { color: #888; }
.batch-title { font-size: 18px; font-weight: bold; color: #fff; margin-right: auto; }

.card {
  background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 16px;
  border: 1px solid #0f3460; transition: border-color 0.3s;
}
.card.kept { border-color: #4ecca3; }
.card.cut { border-color: #e94560; opacity: 0.5; }
.card.edited { border-color: #ffd93d; }

.response-text { font-size: 20px; line-height: 1.5; margin-bottom: 8px; color: #fff; }
.response-category { font-size: 12px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.response-source { font-size: 11px; color: #9b59b6; margin-bottom: 12px; font-style: italic; }

.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 600; font-size: 13px; transition: all 0.2s;
}
.btn-keep { background: #4ecca3; color: #1a1a2e; }
.btn-cut { background: #e94560; color: #fff; }
.btn-edit { background: #ffd93d; color: #1a1a2e; }
.btn:hover { transform: scale(1.05); }
.btn.active { outline: 3px solid #fff; }

.edit-area {
  width: 100%; margin-top: 10px; padding: 10px; background: #0f3460;
  color: #fff; border: 1px solid #ffd93d; border-radius: 6px;
  font-size: 16px; display: none; resize: vertical; min-height: 60px;
}
.edit-area.visible { display: block; }

.export-section {
  margin-top: 40px; padding: 20px; background: #16213e;
  border-radius: 12px; border: 1px solid #0f3460;
}
.export-section h2 { color: #4ecca3; margin-bottom: 10px; }
.export-block {
  background: #0f3460; padding: 15px; border-radius: 8px;
  font-family: monospace; font-size: 13px; white-space: pre-wrap;
  max-height: 400px; overflow-y: auto; cursor: pointer; color: #e0e0e0;
}
.copy-btn {
  margin-top: 10px; padding: 10px 20px; background: #4ecca3;
  color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="stats-header">
  <div class="batch-title">Batch 28: Wild Animal Descriptions (75)</div>
  <div class="stat stat-keep">KEEP: <span id="keep-count">0</span></div>
  <div class="stat stat-cut">CUT: <span id="cut-count">0</span></div>
  <div class="stat stat-edit">EDIT: <span id="edit-count">0</span></div>
  <div class="stat stat-pending">PENDING: <span id="pending-count">75</span></div>
</div>

<div id="cards"></div>

<div class="export-section">
  <h2>Export JSON (Keepers Only)</h2>
  <div class="export-block" id="export-json">[]</div>
  <button class="copy-btn" onclick="copyExport()">Copy JSON</button>
</div>

<script>
const items = [
  // === WORLD'S UGLIEST DOG CONTEST ===
  { text: "A line of warts marches down his snout.", category: "judgy", source: "AP description of Sam, 3x Ugliest Dog champion (Chinese Crested)" },

  { text: "Everyone calls them zombie eyes.", category: "cold", source: "Sam's owner on his blind milky-white eyes" },
  { text: "A fleshy flap of skin hangs from his withered neck.", category: "cold", source: "AP on Sam the Ugliest Dog" },
  { text: "Epitomizes excellence in ugliness.", category: "judgy", source: "Judge on Quasi Modo, 2015 Ugliest Dog (mistaken for a hyena)" },
  { text: "Grown men jumped on top of their cars to get away.", category: "chaotic", source: "Quasi Modo's backstory — people fleeing from the dog" },
  { text: "A mix between Yoda, a hippo, and a bat.", category: "chaotic", source: "Judge on Petunia, 2025 Ugliest Dog winner" },
  { text: "A total creature.", category: "cold", source: "Handler describing Petunia" },
  { text: "Snoring, gassy, and 125 pounds of loose jowl.", category: "judgy", source: "Description of Martha, 2017 Ugliest Dog (Neapolitan Mastiff)" },
  { text: "Resembles the bitter beer face from those nineties ads.", category: "judgy", source: "Why Pabst the dog was named after Pabst Blue Ribbon" },
  { text: "His tongue protrudes because his teeth never grew in.", category: "cold", source: "Wild Thang, 2024 Ugliest Dog winner" },
  { text: "The face suggests a long series of unfortunate decisions.", category: "judgy", source: "Ugly dog contest commentary" },
  { text: "Built like a ottoman that learned to walk.", category: "chaotic", source: "Ugly dog contest commentary on a low-slung entry" },
  { text: "Somehow less attractive from every new angle.", category: "cold", source: "Ugly dog contest commentary" },
  { text: "The kind of face that haunts a very specific type of dream.", category: "mystical", source: "Ugly dog contest commentary" },

  // === VIRAL SHELTER ADOPTION LISTINGS — Mr. Biggles ===
  { text: "An utter, utter bastard.", category: "cold", source: "RSPCA Australia — Mr. Biggles adoption listing" },
  { text: "A despot and a dictator.", category: "demanding", source: "Mr. Biggles adoption listing" },
  { text: "Things are often just not up to his high standards.", category: "judgy", source: "Mr. Biggles adoption listing" },
  { text: "Permits kisses on his shiny black head if he's feeling mellow.", category: "demanding", source: "Mr. Biggles adoption listing" },

  // === Perdita "World's Worst Cat" ===
  { text: "Likes: staring into your soul until you may never be cheerful again.", category: "cold", source: "Perdita adoption listing, Mitchell County NC" },
  { text: "We thought she was sick. Turns out she's just a jerk.", category: "cold", source: "Perdita adoption listing" },
  { text: "Single and ready to be socially awkward with a socially awkward human.", category: "heartfelt", source: "Perdita adoption listing" },

  // === Quinn ===
  { text: "Do you crave the feeling of being judged in your own home?", category: "judgy", source: "Quinn adoption listing, Baltimore County MD" },
  { text: "Cannot be owned. She will own you, your house, and everything you hold dear.", category: "demanding", source: "Quinn adoption listing" },
  { text: "Essentially a more lively houseplant.", category: "cold", source: "Quinn adoption listing" },

  // === Prancer ===
  { text: "Not a real dog. More like a vessel for a traumatized Victorian child.", category: "existential", source: "Prancer adoption listing, Second Chance NJ" },
  { text: "A Chucky doll in a dog's body.", category: "chaotic", source: "Prancer adoption listing" },
  { text: "Terrified, untouchable, and severely overweight.", category: "cold", source: "Prancer adoption listing" },

  // === Eddie the Terrible ===
  { text: "Goes from zero to Cujo in point-oh-five seconds.", category: "chaotic", source: "Eddie the Terrible adoption listing" },
  { text: "Has never actually attacked. But has made it clear he hasn't ruled out the possibility.", category: "cold", source: "Eddie the Terrible adoption listing" },

  // === Ralphie "Fire-Breathing Demon" ===
  { text: "If you show a moment of weakness, prepare to be exploited.", category: "cold", source: "Ralphie adoption listing, NY" },
  { text: "The ideal home is the Mother of Dragons.", category: "demanding", source: "Ralphie adoption listing" },

  // === Catcade Chicago + Other Shelter Listings ===
  { text: "Made of 60% trash and 40% prom king energy.", category: "chaotic", source: "Catcade Chicago adoption listing" },
  { text: "Always running for the door like he just robbed a bank.", category: "chaotic", source: "Catcade Chicago" },
  { text: "A 100% pure breed outdoor trash cat.", category: "judgy", source: "Catcade Chicago" },
  { text: "Former garbage animal masquerading as imported Scandinavian opulence.", category: "cold", source: "Catcade Chicago" },
  { text: "Will bite you and then ask for a belly rub. In that order.", category: "chaotic", source: "Shelter adoption listing" },
  { text: "Not mean. Just honest.", category: "cold", source: "Shelter worker on a difficult cat" },
  { text: "Loves aggressively. Boundaries are a suggestion.", category: "chaotic", source: "Shelter adoption listing" },
  { text: "Has opinions. Will share them. Did not ask for yours.", category: "demanding", source: "Shelter adoption listing" },
  { text: "Thriving in captivity.", category: "cold", source: "Shelter adoption listing" },
  { text: "Tolerates affection on a case-by-case basis.", category: "cold", source: "Shelter adoption listing" },

  // === LIVESTOCK JUDGING / CATTLE TERMINOLOGY ===
  { text: "Soggy. Deep. A lot of meat in there.", category: "judgy", source: "Livestock judging terminology — cattle evaluation" },
  { text: "Jug-headed and raw-boned.", category: "cold", source: "Livestock judging slang — cattle faults" },
  { text: "Pencil-butted.", category: "judgy", source: "Livestock judging term — insufficient muscling in the hindquarter" },
  { text: "Slab-sided, lighter muscled, and narrow based.", category: "cold", source: "Livestock judging — body composition faults" },
  { text: "The most restricted. The shallowest bodied. I left her last.", category: "cold", source: "Livestock judging oral reasons" },
  { text: "Good enough. Can walk, talk, and play the piano.", category: "judgy", source: "Iowa State livestock judging professor on a middle-ranked animal" },
  { text: "Look at the poop chute on that one.", category: "chaotic", source: "Iowa State livestock judging colleague" },
  { text: "They all cut up red.", category: "existential", source: "County fair exhibitor on expensive show steers" },
  { text: "Put the obvious ones in the obvious places and sort the rest.", category: "wise", source: "Livestock judging coach advice" },
  { text: "Wasty through the middle.", category: "judgy", source: "Livestock judging — excessive fat in the midsection" },
  { text: "Lacking condition but structurally correct.", category: "cold", source: "Livestock judging — thin but well-built" },

  // === MICHAEL WRONA — HORSE RACING CALLS ===
  { text: "Stays like a mother-in-law.", category: "cold", source: "Michael Wrona, horse racing announcer — on a horse that won't quit" },
  { text: "Moving like a daughter with daddy's credit card.", category: "judgy", source: "Michael Wrona race call" },
  { text: "Looking like a loose shopping cart.", category: "chaotic", source: "Michael Wrona race call — uncoordinated horse" },
  { text: "Covering more ground than Lewis and Clark.", category: "chaotic", source: "Michael Wrona race call" },
  { text: "Going as fast as last week's wages.", category: "cold", source: "Michael Wrona race call" },

  // === BREED / ANIMAL APPEARANCE DESCRIPTIONS ===
  { text: "A walking, barking mop.", category: "judgy", source: "Common description of the Puli dog breed" },
  { text: "Looks like it's been riding with the top down on a really windy day.", category: "chaotic", source: "Description of the Frizzle chicken breed" },
  { text: "Covered with fur instead of feathers. Nobody told her.", category: "chaotic", source: "Description of the Silkie chicken" },
  { text: "Downturned, disappointed lips. Like pulled from a nap and made to pose.", category: "cold", source: "Description of the blobfish" },
  { text: "A marine Jabba the Hutt.", category: "judgy", source: "The Guardian on the blobfish" },
  { text: "A cartoon character brought to life. Egg-shaped head.", category: "chaotic", source: "Description of the Bull Terrier" },

  // === NATURE DOCUMENTARY / WILDLIFE ===
  { text: "The youngling is frightened and out of his element. He retreats.", category: "nurturing", source: "Nature documentary narration style" },
  { text: "Youth and inexperience play against him.", category: "cold", source: "Nature documentary narration" },
  { text: "It's extraordinary how self-obsessed human beings are.", category: "judgy", source: "David Attenborough" },

  // === DOG/CAT SHOW COMMENTARY ===
  { text: "He went after her like she was made of ham.", category: "chaotic", source: "Fred Willard, Best in Show (movie)" },
  { text: "That one was just terrified.", category: "cold", source: "CFA judge after cat slapped her at a show" },
  { text: "She broke the number one rule. She had on ears.", category: "chaotic", source: "Online commenter on cat show slapping incident" },

  // === RODEO ===
  { text: "Look at the strut of a champion right there.", category: "demanding", source: "Rodeo announcer commentary" },
  { text: "We may be seeing a world champion in the future right here tonight.", category: "heartfelt", source: "Rodeo announcer commentary" },
];

const decisions = new Array(items.length).fill(null);
const editedTexts = new Array(items.length).fill(null);

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = items.map((item, i) => `
    <div class="card" id="card-${i}">
      <div class="response-text">${editedTexts[i] || item.text}</div>
      <div class="response-category">${item.category}</div>
      <div class="response-source">${item.source}</div>
      <div class="actions">
        <button class="btn btn-keep ${decisions[i]==='keep'?'active':''}" onclick="decide(${i},'keep')">KEEP</button>
        <button class="btn btn-cut ${decisions[i]==='cut'?'active':''}" onclick="decide(${i},'cut')">CUT</button>
        <button class="btn btn-edit ${decisions[i]==='edit'?'active':''}" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <textarea class="edit-area ${decisions[i]==='edit'?'visible':''}" id="edit-${i}"
        oninput="updateEdit(${i}, this.value)"
        placeholder="Edit the text...">${editedTexts[i] || item.text}</textarea>
    </div>
  `).join('');
}

function decide(i, status) {
  if (decisions[i] === status) { decisions[i] = null; }
  else { decisions[i] = status; }
  if (status === 'edit') {
    const area = document.getElementById(`edit-${i}`);
    if (area) { area.classList.toggle('visible'); }
  }
  updateStats(); updateCardStyles(); updateExport();
}
function toggleEdit(i) { decide(i, 'edit'); }
function updateEdit(i, val) { editedTexts[i] = val; updateExport(); }

function updateStats() {
  document.getElementById('keep-count').textContent = decisions.filter(d => d==='keep').length;
  document.getElementById('cut-count').textContent = decisions.filter(d => d==='cut').length;
  document.getElementById('edit-count').textContent = decisions.filter(d => d==='edit').length;
  document.getElementById('pending-count').textContent = decisions.filter(d => d===null).length;
}

function updateCardStyles() {
  items.forEach((_, i) => {
    const card = document.getElementById(`card-${i}`);
    card.className = 'card';
    if (decisions[i] === 'keep') card.classList.add('kept');
    if (decisions[i] === 'cut') card.classList.add('cut');
    if (decisions[i] === 'edit') card.classList.add('edited');
  });
}

function updateExport() {
  const keepers = items.map((item, i) => {
    if (decisions[i] === 'keep') return { text: item.text, category: item.category };
    if (decisions[i] === 'edit' && editedTexts[i]) return { text: editedTexts[i], category: item.category };
    return null;
  }).filter(Boolean);
  document.getElementById('export-json').textContent = JSON.stringify(keepers, null, 2);
}

function copyExport() {
  const text = document.getElementById('export-json').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 2000);
  });
}

renderCards();
</script>
</body>
</html>
