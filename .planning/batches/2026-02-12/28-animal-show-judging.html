<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 28: Animal Show Judging — Formal Language (Filter Hard)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; padding-top: 120px; }

.stats-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #16213e; padding: 15px 20px; border-bottom: 2px solid #0f3460;
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.stat { font-size: 14px; }
.stat-keep { color: #4ecca3; }
.stat-cut { color: #e94560; }
.stat-edit { color: #ffd93d; }
.stat-pending { color: #888; }
.batch-title { font-size: 18px; font-weight: bold; color: #fff; margin-right: auto; }
.batch-warning { font-size: 12px; color: #e94560; }

.card {
  background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 16px;
  border: 1px solid #0f3460; transition: border-color 0.3s;
}
.card.kept { border-color: #4ecca3; }
.card.cut { border-color: #e94560; opacity: 0.5; }
.card.edited { border-color: #ffd93d; }

.response-text { font-size: 20px; line-height: 1.5; margin-bottom: 8px; color: #fff; }
.response-category { font-size: 12px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.response-source { font-size: 11px; color: #9b59b6; margin-bottom: 12px; font-style: italic; }

.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 600; font-size: 13px; transition: all 0.2s;
}
.btn-keep { background: #4ecca3; color: #1a1a2e; }
.btn-cut { background: #e94560; color: #fff; }
.btn-edit { background: #ffd93d; color: #1a1a2e; }
.btn:hover { transform: scale(1.05); }
.btn.active { outline: 3px solid #fff; }

.edit-area {
  width: 100%; margin-top: 10px; padding: 10px; background: #0f3460;
  color: #fff; border: 1px solid #ffd93d; border-radius: 6px;
  font-size: 16px; display: none; resize: vertical; min-height: 60px;
}
.edit-area.visible { display: block; }

.export-section {
  margin-top: 40px; padding: 20px; background: #16213e;
  border-radius: 12px; border: 1px solid #0f3460;
}
.export-section h2 { color: #4ecca3; margin-bottom: 10px; }
.export-block {
  background: #0f3460; padding: 15px; border-radius: 8px;
  font-family: monospace; font-size: 13px; white-space: pre-wrap;
  max-height: 400px; overflow-y: auto; cursor: pointer; color: #e0e0e0;
}
.copy-btn {
  margin-top: 10px; padding: 10px 20px; background: #4ecca3;
  color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="stats-header">
  <div class="batch-title">Batch 28: Animal Show Judging (100)</div>
  <div class="batch-warning">WARNING: Lots of stuffy AKC stuff — filter HARD for the ones that land about a person</div>
  <div class="stat stat-keep">KEEP: <span id="keep-count">0</span></div>
  <div class="stat stat-cut">CUT: <span id="cut-count">0</span></div>
  <div class="stat stat-edit">EDIT: <span id="edit-count">0</span></div>
  <div class="stat stat-pending">PENDING: <span id="pending-count">100</span></div>
</div>

<div id="cards"></div>

<div class="export-section">
  <h2>Export JSON (Keepers Only)</h2>
  <div class="export-block" id="export-json">[]</div>
  <button class="copy-btn" onclick="copyExport()">Copy JSON</button>
</div>

<script>

  // === POULTRY SHOWS ===
  { text: "Specimen lacking breed characteristics.", category: "cold", source: "Poultry show general disqualification" },

  // === RABBIT SHOWS ===
  { text: "Firm in flesh. Neither too fat with soft, flabby flesh nor too thin creating a bony effect.", category: "judgy", source: "ARBA rabbit breed standard" },
  { text: "Full and meaty from shoulder to loin.", category: "demanding", source: "ARBA rabbit breed standard" },
  { text: "Snaky.", category: "cold", source: "Rabbit show fault — long, narrow body" },
  { text: "Chopped off in the hindquarters.", category: "cold", source: "Rabbit show fault — rear drops off too sharply" },

  // === CROSS-SPECIES GEMS ===
  { text: "Quality without coarseness. Substance without cloddiness.", category: "wise", source: "General conformation ideal — multiple species" },
  { text: "Its image is lionlike, implying courage, dignity, boldness, and self-esteem rather than daintiness or delicacy.", category: "demanding", source: "AKC Chow Chow breed standard" },
  { text: "Must give the impression of being a well-balanced, substantial dog.", category: "cold", source: "AKC general breed standard language" },
  { text: "Overall balance is more important than any individual feature.", category: "wise", source: "General judging principle across species" },
  { text: "The whole is greater than the sum of the parts.", category: "mystical", source: "Show judging philosophy" },
  { text: "Disqualified for aggression or extreme shyness.", category: "cold", source: "Multiple breed standards — temperament DQ" },
];

const decisions = new Array(items.length).fill(null);
const editedTexts = new Array(items.length).fill(null);

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = items.map((item, i) => `
    <div class="card" id="card-${i}">
      <div class="response-text">${editedTexts[i] || item.text}</div>
      <div class="response-category">${item.category}</div>
      <div class="response-source">${item.source}</div>
      <div class="actions">
        <button class="btn btn-keep ${decisions[i]==='keep'?'active':''}" onclick="decide(${i},'keep')">KEEP</button>
        <button class="btn btn-cut ${decisions[i]==='cut'?'active':''}" onclick="decide(${i},'cut')">CUT</button>
        <button class="btn btn-edit ${decisions[i]==='edit'?'active':''}" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <textarea class="edit-area ${decisions[i]==='edit'?'visible':''}" id="edit-${i}"
        oninput="updateEdit(${i}, this.value)"
        placeholder="Edit the text...">${editedTexts[i] || item.text}</textarea>
    </div>
  `).join('');
}

function decide(i, status) {
  if (decisions[i] === status) { decisions[i] = null; }
  else { decisions[i] = status; }
  if (status === 'edit') {
    const area = document.getElementById(`edit-${i}`);
    if (area) { area.classList.toggle('visible'); }
  }
  updateStats(); updateCardStyles(); updateExport();
}
function toggleEdit(i) { decide(i, 'edit'); }
function updateEdit(i, val) { editedTexts[i] = val; updateExport(); }

function updateStats() {
  document.getElementById('keep-count').textContent = decisions.filter(d => d==='keep').length;
  document.getElementById('cut-count').textContent = decisions.filter(d => d==='cut').length;
  document.getElementById('edit-count').textContent = decisions.filter(d => d==='edit').length;
  document.getElementById('pending-count').textContent = decisions.filter(d => d===null).length;
}

function updateCardStyles() {
  items.forEach((_, i) => {
    const card = document.getElementById(`card-${i}`);
    card.className = 'card';
    if (decisions[i] === 'keep') card.classList.add('kept');
    if (decisions[i] === 'cut') card.classList.add('cut');
    if (decisions[i] === 'edit') card.classList.add('edited');
  });
}

function updateExport() {
  const keepers = items.map((item, i) => {
    if (decisions[i] === 'keep') return { text: item.text, category: item.category };
    if (decisions[i] === 'edit' && editedTexts[i]) return { text: editedTexts[i], category: item.category };
    return null;
  }).filter(Boolean);
  document.getElementById('export-json').textContent = JSON.stringify(keepers, null, 2);
}

function copyExport() {
  const text = document.getElementById('export-json').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 2000);
  });
}

renderCards();
</script>
</body>
</html>
