<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 28: Pirate Cat — 50 Responses</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; padding-top: 120px; }

.stats-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #16213e; padding: 15px 20px; border-bottom: 2px solid #0f3460;
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.stat { font-size: 14px; }
.stat-keep { color: #4ecca3; }
.stat-cut { color: #e94560; }
.stat-edit { color: #ffd93d; }
.stat-pending { color: #888; }
.batch-title { font-size: 18px; font-weight: bold; color: #fff; margin-right: auto; }

.card {
  background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 16px;
  border: 1px solid #0f3460; transition: border-color 0.3s;
}
.card.kept { border-color: #4ecca3; }
.card.cut { border-color: #e94560; opacity: 0.5; }
.card.edited { border-color: #ffd93d; }

.response-text { font-size: 20px; line-height: 1.5; margin-bottom: 8px; color: #fff; }
.response-category { font-size: 12px; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.response-energy { font-size: 11px; color: #666; margin-bottom: 12px; font-style: italic; }

.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 600; font-size: 13px; transition: all 0.2s;
}
.btn-keep { background: #4ecca3; color: #1a1a2e; }
.btn-cut { background: #e94560; color: #fff; }
.btn-edit { background: #ffd93d; color: #1a1a2e; }
.btn:hover { transform: scale(1.05); }
.btn.active { outline: 3px solid #fff; }

.edit-area {
  width: 100%; margin-top: 10px; padding: 10px; background: #0f3460;
  color: #fff; border: 1px solid #ffd93d; border-radius: 6px;
  font-size: 16px; display: none; resize: vertical; min-height: 60px;
}
.edit-area.visible { display: block; }

.export-section {
  margin-top: 40px; padding: 20px; background: #16213e;
  border-radius: 12px; border: 1px solid #0f3460;
}
.export-section h2 { color: #4ecca3; margin-bottom: 10px; }
.export-block {
  background: #0f3460; padding: 15px; border-radius: 8px;
  font-family: monospace; font-size: 13px; white-space: pre-wrap;
  max-height: 400px; overflow-y: auto; cursor: pointer; color: #e0e0e0;
}
.copy-btn {
  margin-top: 10px; padding: 10px 20px; background: #4ecca3;
  color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="stats-header">
  <div class="batch-title">Batch 28: Pirate Cat (50)</div>
  <div class="stat stat-keep">KEEP: <span id="keep-count">0</span></div>
  <div class="stat stat-cut">CUT: <span id="cut-count">0</span></div>
  <div class="stat stat-edit">EDIT: <span id="edit-count">0</span></div>
  <div class="stat stat-pending">PENDING: <span id="pending-count">50</span></div>
</div>

<div id="cards"></div>

<div class="export-section">
  <h2>Export JSON (Keepers Only)</h2>
  <div class="export-block" id="export-json">[]</div>
  <button class="copy-btn" onclick="copyExport()">Copy JSON</button>
</div>

<script>
const items = [
  { text: "The storm doesn't care what you packed for.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "A good crew forgives one storm. Not the same storm twice.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "Loyalty earned in calm seas isn't loyalty.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "The best flag is the one they don't recognize until too late.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "Mutiny isn't betrayal. Sometimes the captain's wrong.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "The next wave is the only one that matters.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "Some treasure isn't worth the kraken guarding it.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "Some anchors look like people.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "I've seen storms end marriages and marriages end storms.", category: "wise", energy: "Hard pirate wisdom" },
  { text: "Dawn means you survived. That's the whole answer.", category: "heartfelt", energy: "Surprisingly tender" },
  { text: "Every scar is a story you survived telling.", category: "heartfelt", energy: "Surprisingly tender" },
  { text: "Some nights the stars are enough.", category: "heartfelt", energy: "Surprisingly tender" },
  { text: "The wreckage builds the next ship. Always has.", category: "heartfelt", energy: "Surprisingly tender" },
  { text: "Some shores you only see once. Look harder.", category: "heartfelt", energy: "Surprisingly tender" },
  { text: "You're not lost. You're in unfamiliar water.", category: "nurturing", energy: "Surprisingly tender" },
  { text: "Burn the ship. You won't need a way back.", category: "chaotic", energy: "Chaotic pirate energy" },
  { text: "The sea takes what it wants. So should you.", category: "chaotic", energy: "Chaotic pirate energy" },
  { text: "The plank is shorter than you think. Just step.", category: "chaotic", energy: "Chaotic pirate energy" },
  { text: "Stolen things taste better. Go take it.", category: "chaotic", energy: "Chaotic pirate energy" },
  { text: "Drink the rum. Plot at sunrise.", category: "chaotic", energy: "Chaotic pirate energy" },
  { text: "Port is for cowards who forgot what they wanted.", category: "chaotic", energy: "Chaotic pirate energy" },
  { text: "Every port felt permanent. None were.", category: "existential", energy: "Philosophical pirate" },
  { text: "Not every voyage has a destination. Some just have away.", category: "poetic", energy: "Philosophical pirate" },
  { text: "The horizon never lied to anyone.", category: "poetic", energy: "Philosophical pirate" },
  { text: "The treasure was never on the map. It was past the edge.", category: "mystical", energy: "Philosophical pirate" },
  { text: "The sea forgives nothing. That's why I respect it.", category: "existential", energy: "Philosophical pirate" },
  { text: "Dead calm is worse than any storm. Storms move.", category: "existential", energy: "Philosophical pirate" },
  { text: "That crew was dead weight. Sail lighter.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "I've sailed worse on less.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "The wind changed. You didn't.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "I've watched better ships sink from indecision.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "You're negotiating with a tide.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "You're patching a hull that wants to sink.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "That's not an alliance. That's a hostage situation.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "I'd mutiny too.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "You're guarding an empty chest.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "That flag you're flying? Nobody salutes it but you.", category: "cold", energy: "Cold pirate dismissal" },
  { text: "You keep circling the same island.", category: "judgy", energy: "Funny / judgy pirate" },
  { text: "You're flying a white flag at a ship that isn't firing.", category: "judgy", energy: "Funny / judgy pirate" },
  { text: "Cargo hold full of things you should've thrown overboard years ago.", category: "judgy", energy: "Funny / judgy pirate" },
  { text: "Seventeen captains. One sinking ship. Sound familiar?", category: "judgy", energy: "Funny / judgy pirate" },
  { text: "You've been in port too long. I can smell it.", category: "judgy", energy: "Funny / judgy pirate" },
  { text: "You're sending a bottle to someone standing right there.", category: "judgy", energy: "Funny / judgy pirate" },
  { text: "You didn't come this far to drop anchor.", category: "demanding", energy: "Demanding pirate" },
  { text: "Your compass points wherever they point. Stop following.", category: "demanding", energy: "Demanding pirate" },
  { text: "You don't need a map. You need nerve.", category: "demanding", energy: "Demanding pirate" },
  { text: "I didn't ask the ocean for permission. Neither should you.", category: "demanding", energy: "Demanding pirate" },
  { text: "Cut the rope. The dock isn't going anywhere but you should be.", category: "demanding", energy: "Demanding pirate" },
  { text: "Your cannons are loaded. Why are you still talking?", category: "demanding", energy: "Demanding pirate" },
  { text: "Sink or sail. Floating isn't a third option.", category: "demanding", energy: "Demanding pirate" },
];

const decisions = new Array(items.length).fill(null);
const editedTexts = new Array(items.length).fill(null);

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = items.map((item, i) => `
    <div class="card" id="card-${i}" data-status="${decisions[i] || 'pending'}">
      <div class="response-text">${editedTexts[i] || item.text}</div>
      <div class="response-category">${item.category}</div>
      <div class="response-energy">${item.energy}</div>
      <div class="actions">
        <button class="btn btn-keep ${decisions[i]==='keep'?'active':''}" onclick="decide(${i},'keep')">KEEP</button>
        <button class="btn btn-cut ${decisions[i]==='cut'?'active':''}" onclick="decide(${i},'cut')">CUT</button>
        <button class="btn btn-edit ${decisions[i]==='edit'?'active':''}" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <textarea class="edit-area ${decisions[i]==='edit'?'visible':''}" id="edit-${i}"
        oninput="updateEdit(${i}, this.value)"
        placeholder="Edit the text...">${editedTexts[i] || item.text}</textarea>
    </div>
  `).join('');
}

function decide(i, status) {
  if (decisions[i] === status) { decisions[i] = null; }
  else { decisions[i] = status; }
  if (status === 'edit') {
    const area = document.getElementById(`edit-${i}`);
    if (area) { area.classList.toggle('visible'); }
  }
  updateStats();
  updateCardStyles();
  updateExport();
}

function toggleEdit(i) {
  decide(i, 'edit');
}

function updateEdit(i, val) {
  editedTexts[i] = val;
  updateExport();
}

function updateStats() {
  document.getElementById('keep-count').textContent = decisions.filter(d => d==='keep').length;
  document.getElementById('cut-count').textContent = decisions.filter(d => d==='cut').length;
  document.getElementById('edit-count').textContent = decisions.filter(d => d==='edit').length;
  document.getElementById('pending-count').textContent = decisions.filter(d => d===null).length;
}

function updateCardStyles() {
  items.forEach((_, i) => {
    const card = document.getElementById(`card-${i}`);
    card.className = 'card';
    if (decisions[i] === 'keep') card.classList.add('kept');
    if (decisions[i] === 'cut') card.classList.add('cut');
    if (decisions[i] === 'edit') card.classList.add('edited');
  });
}

function updateExport() {
  const keepers = items.map((item, i) => {
    if (decisions[i] === 'keep') return { text: item.text, category: item.category };
    if (decisions[i] === 'edit' && editedTexts[i]) return { text: editedTexts[i], category: item.category };
    return null;
  }).filter(Boolean);
  document.getElementById('export-json').textContent = JSON.stringify(keepers, null, 2);
}

function copyExport() {
  const text = document.getElementById('export-json').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 2000);
  });
}

renderCards();
</script>
</body>
</html>
