<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review: Tom Waits Batch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Georgia', serif; padding: 20px; max-width: 800px; margin: 0 auto; }
  h1 { color: #ffd93d; margin-bottom: 8px; font-size: 1.8em; }
  .subtitle { color: #aaa; margin-bottom: 30px; font-style: italic; }
  .stats { position: sticky; top: 0; background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; z-index: 100; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .stat { font-weight: bold; }
  .stat.keep { color: #4ecca3; }
  .stat.cut { color: #e94560; }
  .stat.edit { color: #ffd93d; }
  .stat.pending { color: #888; }
  .item { background: #16213e; border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #333; transition: border-color 0.3s; }
  .item.kept { border-left-color: #4ecca3; }
  .item.cut { border-left-color: #e94560; opacity: 0.5; }
  .item.edited { border-left-color: #ffd93d; }
  .response-text { font-size: 1.3em; line-height: 1.5; margin-bottom: 8px; }
  .category { color: #888; font-size: 0.85em; margin-bottom: 15px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.9em; }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: white; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .edit-area { display: none; margin-top: 10px; }
  .edit-area textarea { width: 100%; background: #0f3460; color: #e0e0e0; border: 1px solid #ffd93d; border-radius: 5px; padding: 10px; font-size: 1.1em; font-family: Georgia, serif; min-height: 60px; }
  .edit-area select { background: #0f3460; color: #e0e0e0; border: 1px solid #ffd93d; border-radius: 5px; padding: 8px; margin-top: 5px; }
  .edit-area .btn { margin-top: 8px; }
  .export-section { margin-top: 40px; padding: 20px; background: #0f3460; border-radius: 8px; }
  .export-section h2 { color: #4ecca3; margin-bottom: 10px; }
  .export-section pre { background: #1a1a2e; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 0.85em; white-space: pre-wrap; cursor: pointer; }
  .copy-hint { color: #888; font-size: 0.8em; margin-top: 5px; }
</style>
</head>
<body>

<h1>Tom Waits Batch</h1>
<p class="subtitle">The Alley Cat Philosopher — rain, diners, beautiful broken things, junkyard wisdom</p>

<div class="stats" id="stats">
  <span class="stat keep">Keep: <span id="keep-count">0</span></span>
  <span class="stat cut">Cut: <span id="cut-count">0</span></span>
  <span class="stat edit">Edit: <span id="edit-count">0</span></span>
  <span class="stat pending">Pending: <span id="pending-count">18</span></span>
</div>

<div id="items"></div>

<div class="export-section">
  <h2>Export (kept + edited)</h2>
  <pre id="export-json">[]</pre>
  <p class="copy-hint">Click to copy</p>
</div>

<script>
const responses = [
  { text: "Rain on a tin roof. Best song I know.", category: "poetic" },
  { text: "The alley has a whole menu if you know where to look.", category: "wise" },
  { text: "Broken things hum different. Better, sometimes.", category: "heartfelt" },
  { text: "3 AM diner lighting fixes everything.", category: "wise" },
  { text: "The scratched bowl has more story than the new one.", category: "wise" },
  { text: "Found a piano in the alley. Played it with my paws.", category: "chaotic" },
  { text: "Wet cardboard smells like a decision someone else already made.", category: "existential" },
  { text: "The gutter has stories the penthouse will never hear.", category: "wise" },
  { text: "Rust isn't damage. Rust is a memoir.", category: "poetic" },
  { text: "Best conversation I ever had was with a closed dumpster.", category: "existential" },
  { text: "Some of us sound better with a little gravel in it.", category: "heartfelt" },
  { text: "The dent makes it mine.", category: "heartfelt" },
  { text: "Stayed too long. Best part was the walk home.", category: "wise" },
  { text: "Nothing's broken. Everything's becoming something else.", category: "existential" },
  { text: "The creak in the floor is the house talking back.", category: "mystical" },
  { text: "Beautiful night to be alive. Or at least warm.", category: "heartfelt" },
  { text: "Neon signs tell better stories than billboards.", category: "poetic" },
  { text: "Last call isn't sad. It's honest.", category: "wise" },
];

const categories = ['mystical','nurturing','poetic','cold','angry','heartfelt','judgy','chaotic','wise','existential','demanding','meta'];
const state = responses.map((r,i) => ({ ...r, id: i, status: 'pending', editedText: null, editedCategory: null }));

function render() {
  const container = document.getElementById('items');
  container.innerHTML = state.map((item, i) => {
    const cls = item.status === 'keep' ? 'kept' : item.status === 'cut' ? 'cut' : item.status === 'edit' ? 'edited' : '';
    const displayText = item.editedText || item.text;
    const displayCat = item.editedCategory || item.category;
    return `<div class="item ${cls}" id="item-${i}">
      <div class="response-text">${displayText}</div>
      <div class="category">${displayCat}</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i},'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i},'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${i}">
        <textarea id="text-${i}">${displayText}</textarea>
        <select id="cat-${i}">${categories.map(c => `<option value="${c}" ${c===displayCat?'selected':''}>${c}</option>`).join('')}</select>
        <br><button class="btn btn-keep" onclick="saveEdit(${i})">SAVE</button>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function decide(i, status) {
  state[i].status = status;
  render();
}

function toggleEdit(i) {
  const el = document.getElementById(`edit-${i}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function saveEdit(i) {
  state[i].editedText = document.getElementById(`text-${i}`).value;
  state[i].editedCategory = document.getElementById(`cat-${i}`).value;
  state[i].status = 'edit';
  render();
}

function updateStats() {
  const counts = { keep: 0, cut: 0, edit: 0, pending: 0 };
  state.forEach(s => counts[s.status] = (counts[s.status]||0) + 1);
  document.getElementById('keep-count').textContent = counts.keep;
  document.getElementById('cut-count').textContent = counts.cut;
  document.getElementById('edit-count').textContent = counts.edit;
  document.getElementById('pending-count').textContent = counts.pending;

  const kept = state.filter(s => s.status === 'keep' || s.status === 'edit').map(s => ({
    text: s.editedText || s.text,
    category: s.editedCategory || s.category
  }));
  const el = document.getElementById('export-json');
  el.textContent = JSON.stringify(kept, null, 2);
}

document.getElementById('export-json').addEventListener('click', function() {
  navigator.clipboard.writeText(this.textContent);
  this.style.outline = '2px solid #4ecca3';
  setTimeout(() => this.style.outline = 'none', 1000);
});

render();
</script>
</body>
</html>
