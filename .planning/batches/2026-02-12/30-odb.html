<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 30: ODB Energy | MaybeCat Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Georgia', serif; padding: 20px; max-width: 900px; margin: 0 auto; }
  .header { position: sticky; top: 0; background: #1a1a2e; padding: 15px 0; border-bottom: 2px solid #333; z-index: 100; margin-bottom: 30px; }
  .header h1 { font-size: 1.4em; color: #fff; margin-bottom: 5px; }
  .header .subtitle { color: #888; font-size: 0.85em; margin-bottom: 10px; }
  .stats { display: flex; gap: 20px; font-size: 0.9em; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }
  .response-card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 15px; transition: border-color 0.2s; }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }
  .response-number { color: #666; font-size: 0.75em; margin-bottom: 8px; }
  .response-text { font-size: 1.15em; line-height: 1.5; color: #fff; margin-bottom: 5px; }
  .response-meta { font-size: 0.75em; color: #666; margin-bottom: 12px; }
  .actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .btn { border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .edit-area { display: none; width: 100%; margin-top: 10px; }
  .edit-area textarea { width: 100%; background: #0f1629; color: #fff; border: 1px solid #ffd93d; border-radius: 5px; padding: 10px; font-family: Georgia, serif; font-size: 1em; resize: vertical; min-height: 60px; }
  .edit-area .btn { margin-top: 8px; }
  .export-section { margin-top: 40px; padding: 20px; background: #16213e; border: 1px solid #333; border-radius: 8px; }
  .export-section h2 { margin-bottom: 10px; font-size: 1.1em; }
  .export-section pre { background: #0f1629; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 0.8em; max-height: 500px; overflow-y: auto; white-space: pre-wrap; }
  .btn-copy { background: #4ecca3; color: #1a1a2e; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>Batch 30: ODB Energy</h1>
  <div class="subtitle">50 responses | Pure id. No filter. Shameless. Unpredictable. Tender AND unhinged. Limousine to the welfare office. Everything is loud.</div>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="keepCount">0</span></span>
    <span class="stat-cut">CUT: <span id="cutCount">0</span></span>
    <span class="stat-edit">EDIT: <span id="editCount">0</span></span>
    <span class="stat-pending">PENDING: <span id="pendingCount">50</span>/50</span>
  </div>
</div>
<div id="responses"></div>
<div class="export-section">
  <h2>Export (kept + edited responses)</h2>
  <button class="btn-copy" onclick="copyExport()">Copy JSON</button>
  <pre id="exportJson">[]</pre>
</div>
<script>
const responses = [
  { text: "Yes. And I need everybody to know.", category: "chaotic" },
  { text: "You already did it. Why are you asking.", category: "judgy" },
  { text: "I love you and I'm not even done eating.", category: "heartfelt" },
  { text: "There is no father to your style. Go.", category: "wise" },
  { text: "Do it broke. Do it loud. Do it now.", category: "demanding" },
  { text: "Your plan is terrible and I support it fully.", category: "chaotic" },
  { text: "Baby I got forty-seven reasons and none of them make sense.", category: "chaotic" },
  { text: "You deserve better but you won't take it.", category: "cold" },
  { text: "I showed up. That IS the answer.", category: "demanding" },
  { text: "Nobody asked you to be reasonable.", category: "wise" },
  { text: "The audacity is the qualification.", category: "wise" },
  { text: "Tell them your government name and walk in.", category: "demanding" },
  { text: "You're scared of the wrong things.", category: "cold" },
  { text: "I just ate and I'd fight for you right now.", category: "heartfelt" },
  { text: "Dignity is a costume. Take it off.", category: "existential" },
  { text: "Why are you whispering. Say it to their face.", category: "demanding" },
  { text: "I changed my mind three times writing this.", category: "chaotic" },
  { text: "You owe yourself an apology and a meal.", category: "nurturing" },
  { text: "That wasn't a contradiction. That was range.", category: "wise" },
  { text: "I'm loyal to you and also to chaos.", category: "chaotic" },
  { text: "Your quiet is suspicious. Be louder.", category: "demanding" },
  { text: "Pick up your crown. With both hands. In public.", category: "demanding" },
  { text: "You keep explaining yourself to people who can't hear.", category: "cold" },
  { text: "The mess IS the method.", category: "wise" },
  { text: "I would cry about this but I'm busy.", category: "heartfelt" },
  { text: "You brought logic to a feelings fight.", category: "judgy" },
  { text: "I need you to understand I meant every word including the wrong ones.", category: "heartfelt" },
  { text: "Shame is a hobby and you need a new one.", category: "judgy" },
  { text: "You're not confused. You're just polite.", category: "cold" },
  { text: "I contain multitudes and none of them agree.", category: "existential" },
  { text: "Walk in like they owe you money.", category: "demanding" },
  { text: "The answer is yes but I need you to yell it.", category: "chaotic" },
  { text: "Your caution offends me personally.", category: "judgy" },
  { text: "Nobody is coming. Go get it yourself. Loudly.", category: "demanding" },
  { text: "I forgive you. Now feed me.", category: "nurturing" },
  { text: "You played it safe and it still went wrong. Noted.", category: "cold" },
  { text: "The situation requires more you, not less.", category: "wise" },
  { text: "That rule was for somebody else.", category: "chaotic" },
  { text: "I don't have a plan. I have momentum.", category: "chaotic" },
  { text: "Your heart is right. Your volume is wrong.", category: "nurturing" },
  { text: "They're not ready for you. Go anyway.", category: "wise" },
  { text: "Everything I just said was true at the time.", category: "chaotic" },
  { text: "You need to stop making sense. It's limiting you.", category: "existential" },
  { text: "Collect what's yours. Even if it's weird.", category: "wise" },
  { text: "I will love you through this and also judge you.", category: "heartfelt" },
  { text: "The vibes shifted. I shifted harder.", category: "cold" },
  { text: "You're overthinking it and I'm under-thinking it. Meet me.", category: "nurturing" },
  { text: "Announce yourself. Every room. Every time.", category: "demanding" },
  { text: "I don't owe consistency. I owe presence.", category: "existential" },
  { text: "You held back and called it maturity. It wasn't.", category: "cold" }
];

const decisions = new Array(responses.length).fill(null);
const editedTexts = new Array(responses.length).fill(null);

function render() {
  const container = document.getElementById('responses');
  container.innerHTML = responses.map((r, i) => {
    const status = decisions[i];
    const cardClass = status === 'keep' ? 'kept' : status === 'cut' ? 'cut' : status === 'edit' ? 'edited' : '';
    const displayText = editedTexts[i] || r.text;
    return `
      <div class="response-card ${cardClass}" id="card-${i}">
        <div class="response-number">#${i + 1}</div>
        <div class="response-text">${displayText}</div>
        <div class="response-meta">${r.category} | ${displayText.split(/\s+/).length} words</div>
        <div class="actions">
          <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
          <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
          <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
        </div>
        <div class="edit-area" id="edit-${i}">
          <textarea id="textarea-${i}">${displayText}</textarea>
          <button class="btn btn-keep" onclick="saveEdit(${i})">SAVE & KEEP</button>
        </div>
      </div>`;
  }).join('');
  updateStats();
  updateExport();
}

function decide(i, decision) {
  decisions[i] = decision;
  render();
}

function toggleEdit(i) {
  const el = document.getElementById(`edit-${i}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function saveEdit(i) {
  const textarea = document.getElementById(`textarea-${i}`);
  editedTexts[i] = textarea.value;
  decisions[i] = 'edit';
  render();
}

function updateStats() {
  const keep = decisions.filter(d => d === 'keep').length;
  const cut = decisions.filter(d => d === 'cut').length;
  const edit = decisions.filter(d => d === 'edit').length;
  const pending = decisions.filter(d => d === null).length;
  document.getElementById('keepCount').textContent = keep;
  document.getElementById('cutCount').textContent = cut;
  document.getElementById('editCount').textContent = edit;
  document.getElementById('pendingCount').textContent = pending;
}

function updateExport() {
  const exported = responses.map((r, i) => {
    if (decisions[i] === 'keep') return { text: r.text, category: r.category };
    if (decisions[i] === 'edit') return { text: editedTexts[i], category: r.category };
    return null;
  }).filter(Boolean);
  document.getElementById('exportJson').textContent = JSON.stringify(exported, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportJson').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 1500);
  });
}

render();
</script>
</body>
</html>
