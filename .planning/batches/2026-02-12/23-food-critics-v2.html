<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 23: Food Critics v2 | MaybeCat Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Georgia', serif; padding: 20px; max-width: 900px; margin: 0 auto; }
  .header { position: sticky; top: 0; background: #1a1a2e; padding: 15px 0; border-bottom: 2px solid #333; z-index: 100; margin-bottom: 30px; }
  .header h1 { font-size: 1.4em; color: #fff; margin-bottom: 5px; }
  .header .subtitle { color: #888; font-size: 0.85em; margin-bottom: 10px; }
  .stats { display: flex; gap: 20px; font-size: 0.9em; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }
  .response-card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 15px; transition: border-color 0.2s; }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }
  .response-number { color: #666; font-size: 0.75em; margin-bottom: 8px; }
  .response-text { font-size: 1.15em; line-height: 1.5; color: #fff; margin-bottom: 5px; }
  .response-meta { font-size: 0.75em; color: #666; margin-bottom: 12px; }
  .actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .btn { border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .edit-area { display: none; width: 100%; margin-top: 10px; }
  .edit-area textarea { width: 100%; background: #0f1629; color: #fff; border: 1px solid #ffd93d; border-radius: 5px; padding: 10px; font-family: Georgia, serif; font-size: 1em; resize: vertical; min-height: 60px; }
  .edit-area .btn { margin-top: 8px; }
  .export-section { margin-top: 40px; padding: 20px; background: #16213e; border: 1px solid #333; border-radius: 8px; }
  .export-section h2 { margin-bottom: 10px; font-size: 1.1em; }
  .export-section pre { background: #0f1629; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 0.8em; max-height: 500px; overflow-y: auto; white-space: pre-wrap; }
  .btn-copy { background: #4ecca3; color: #1a1a2e; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>Batch 23: Food Critics v2</h1>
  <div class="subtitle">50 responses | Fermented, molecular, Bourdain, Gill — the weird corners of food language relocated to your life</div>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="keepCount">0</span></span>
    <span class="stat-cut">CUT: <span id="cutCount">0</span></span>
    <span class="stat-edit">EDIT: <span id="editCount">0</span></span>
    <span class="stat-pending">PENDING: <span id="pendingCount">50</span>/50</span>
  </div>
</div>
<div id="responses"></div>
<div class="export-section">
  <h2>Export (kept + edited responses)</h2>
  <button class="btn-copy" onclick="copyExport()">Copy JSON</button>
  <pre id="exportJson">[]</pre>
</div>
<script>
const responses = [
  { text: "You're eating ice cream in an outhouse. Sweet thing, wrong place.", category: "wise" },
  { text: "Cold as a dagger. Mist as a warning. Yeah, that's you.", category: "cold" },
  { text: "Solid, dark, brutal. Alcohol turned into memory.", category: "poetic" },
  { text: "Your situation is Niagara Falls through a coffee straw.", category: "judgy" },
  { text: "Sweet, nutty, and only faintly catastrophic.", category: "nurturing" },
  { text: "Golden amber fading to translucent black. Beautiful rot.", category: "poetic" },
  { text: "You smell fine. Your decisions have the aftertaste.", category: "judgy" },
  { text: "Four horsemen just stampeded through your composure.", category: "chaotic" },
  { text: "Rich custard, onion sauce, and sherry all at once. That's your week.", category: "chaotic" },
  { text: "A jellied cube of bad judgment.", category: "cold" },
  { text: "The challenge is not reacting before you've finished hearing it.", category: "wise" },
  { text: "Earthy, pungent, and completely yours.", category: "heartfelt" },
  { text: "Fat and buttery at first. Then a weird vegetal honesty.", category: "wise" },
  { text: "Bowls and dishes dribble to the table. That's how you enter rooms.", category: "cold" },
  { text: "Picked with the tenderness of a child and the precision of an eagle.", category: "heartfelt" },
  { text: "Wrist-slashingly ghastly. But you survived it.", category: "demanding" },
  { text: "Your energy has volcanic minerals and musk.", category: "mystical" },
  { text: "Intriguingly bad. Like a traffic accident for the soul.", category: "existential" },
  { text: "Someone buried that feeling for a hundred days. Now it's translucent.", category: "poetic" },
  { text: "All hell will break loose. It already knows when.", category: "mystical" },
  { text: "You have the yawning lassitude of a dish that gave up arriving.", category: "cold" },
  { text: "Cramps, sweating, bloating. That's just how growth feels sometimes.", category: "wise" },
  { text: "Your courage has the mouthfeel of rubbing alcohol.", category: "judgy" },
  { text: "Good. Blood and organs, cruelty and decay. That's how real things taste.", category: "demanding" },
  { text: "Prepared with tepid whimsy. You can do worse than that. You can also do better.", category: "cold" },
  { text: "Hops, musk, and something unnamed. Keep it.", category: "heartfelt" },
  { text: "You're uncoordinated. Like a young untamed horse. Give it time.", category: "nurturing" },
  { text: "As cold as a proctologist's finger. But accurate.", category: "cold" },
  { text: "A mouthful ready to attack. Respect the mouthful.", category: "demanding" },
  { text: "Your movements through time seem trivial compared to what you carry.", category: "existential" },
  { text: "Cardboard shavings. That's the texture of this excuse.", category: "angry" },
  { text: "The nose says run. The taste says stay. Listen to the taste.", category: "wise" },
  { text: "You fermented into something nobody expected. Including you.", category: "mystical" },
  { text: "That flat sports drink note? That's you settling.", category: "judgy" },
  { text: "A mix of rotten eggs and ambition. Hard to love. Harder to forget.", category: "existential" },
  { text: "You opened beautifully. The finish was funereal.", category: "cold" },
  { text: "Merging rings of green, yellow, and gray. That's not a warning. That's depth.", category: "poetic" },
  { text: "Like kissing the dead. But you're alive, and that's the part that matters.", category: "heartfelt" },
  { text: "Your plan has the structural integrity of century egg.", category: "judgy" },
  { text: "Effete. Depressing. Culinary. Those three words explain a lot.", category: "cold" },
  { text: "You're the rubbing alcohol under the medicine cabinet of someone's night.", category: "chaotic" },
  { text: "Trivial compared to a heap of boiled meat in broth. So is everything.", category: "existential" },
  { text: "Whatever this is, it's fermenting. That's not a problem. That's a process.", category: "wise" },
  { text: "The biggest challenge is not vomiting before the first bite. Take the bite.", category: "demanding" },
  { text: "Something sweet is happening in the wrong room. Go anyway.", category: "nurturing" },
  { text: "You arrived like mist. Cold, low, deliberate. Stay that way.", category: "demanding" },
  { text: "Pungent cheese and week-old truth. Nobody wants to sit near it. Doesn't make it wrong.", category: "wise" },
  { text: "Every good thing starts with blood and organs. Don't skip the ugly part.", category: "demanding" },
  { text: "Your vibe is a vain, empty ennui. But the bones are good.", category: "nurturing" },
  { text: "Fishy on the surface. Almond custard underneath. Trust the underneath.", category: "wise" }
];
const state = responses.map((r, i) => ({ ...r, id: i, status: 'pending', editedText: '' }));
function render() {
  const container = document.getElementById('responses');
  container.innerHTML = state.map((r, i) => `
    <div class="response-card ${r.status === 'keep' ? 'kept' : r.status === 'cut' ? 'cut' : r.status === 'edit' ? 'edited' : ''}" id="card-${i}">
      <div class="response-number">#${i + 1} / 50</div>
      <div class="response-text">${r.status === 'edit' && r.editedText ? r.editedText : r.text}</div>
      <div class="response-meta">${r.category} &middot; ${countWords(r.text)}w</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${i}">
        <textarea id="textarea-${i}">${r.editedText || r.text}</textarea>
        <select id="cat-${i}" style="margin-top:5px;background:#0f1629;color:#fff;border:1px solid #ffd93d;padding:5px;border-radius:4px;">
          ${['mystical','nurturing','poetic','cold','angry','heartfelt','judgy','chaotic','wise','existential','demanding','meta'].map(c => `<option value="${c}" ${c === r.category ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <button class="btn btn-keep" onclick="saveEdit(${i})" style="margin-left:8px;">SAVE</button>
      </div>
    </div>
  `).join('');
  updateStats(); updateExport();
}
function countWords(text) { return text.replace(/[*]/g, '').split(/\s+/).filter(w => w.length > 0).length; }
function decide(i, status) { state[i].status = status; render(); }
function toggleEdit(i) { const el = document.getElementById(`edit-${i}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
function saveEdit(i) { state[i].editedText = document.getElementById(`textarea-${i}`).value; state[i].category = document.getElementById(`cat-${i}`).value; state[i].status = 'edit'; render(); }
function updateStats() { const counts = { keep: 0, cut: 0, edit: 0, pending: 0 }; state.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1); document.getElementById('keepCount').textContent = counts.keep; document.getElementById('cutCount').textContent = counts.cut; document.getElementById('editCount').textContent = counts.edit; document.getElementById('pendingCount').textContent = counts.pending; }
function updateExport() { const kept = state.filter(r => r.status === 'keep' || r.status === 'edit').map(r => ({ text: r.status === 'edit' && r.editedText ? r.editedText : r.text, category: r.category })); document.getElementById('exportJson').textContent = JSON.stringify(kept, null, 2); }
function copyExport() { const text = document.getElementById('exportJson').textContent; navigator.clipboard.writeText(text).then(() => { const btn = document.querySelector('.btn-copy'); btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy JSON', 1500); }); }
render();
</script>
</body>
</html>
