<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 19: Food Language | MaybeCat Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Georgia', serif; padding: 20px; max-width: 900px; margin: 0 auto; }

  .header { position: sticky; top: 0; background: #1a1a2e; padding: 15px 0; border-bottom: 2px solid #333; z-index: 100; margin-bottom: 30px; }
  .header h1 { font-size: 1.4em; color: #fff; margin-bottom: 5px; }
  .header .subtitle { color: #888; font-size: 0.85em; margin-bottom: 10px; }
  .stats { display: flex; gap: 20px; font-size: 0.9em; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }

  .response-card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 15px; transition: border-color 0.2s; }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }

  .response-number { color: #666; font-size: 0.75em; margin-bottom: 8px; }
  .response-text { font-size: 1.15em; line-height: 1.5; color: #fff; margin-bottom: 5px; }
  .response-meta { font-size: 0.75em; color: #666; margin-bottom: 12px; }

  .actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .btn { border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }

  .edit-area { display: none; width: 100%; margin-top: 10px; }
  .edit-area textarea { width: 100%; background: #0f1629; color: #fff; border: 1px solid #ffd93d; border-radius: 5px; padding: 10px; font-family: Georgia, serif; font-size: 1em; resize: vertical; min-height: 60px; }
  .edit-area .btn { margin-top: 8px; }

  .export-section { margin-top: 40px; padding: 20px; background: #16213e; border: 1px solid #333; border-radius: 8px; }
  .export-section h2 { margin-bottom: 10px; font-size: 1.1em; }
  .export-section pre { background: #0f1629; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 0.8em; max-height: 500px; overflow-y: auto; white-space: pre-wrap; }
  .btn-copy { background: #4ecca3; color: #1a1a2e; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="header">
  <h1>Batch 19: Food Language Relocated</h1>
  <div class="subtitle">50 responses | Wine tasting, kitchen, cheese, coffee language — applied to you</div>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="keepCount">0</span></span>
    <span class="stat-cut">CUT: <span id="cutCount">0</span></span>
    <span class="stat-edit">EDIT: <span id="editCount">0</span></span>
    <span class="stat-pending">PENDING: <span id="pendingCount">50</span>/50</span>
  </div>
</div>

<div id="responses"></div>

<div class="export-section">
  <h2>Export (kept + edited responses)</h2>
  <button class="btn-copy" onclick="copyExport()">Copy JSON</button>
  <pre id="exportJson">[]</pre>
</div>

<script>
const responses = [
  { text: "Challenging flavor profile.", category: "cold" },
  { text: "Notes of desperation. Hint of cologne.", category: "judgy" },
  { text: "Needs to breathe.", category: "wise" },
  { text: "This needed salt forty minutes ago.", category: "cold" },
  { text: "Pairs well with silence.", category: "cold" },
  { text: "Rustic.", category: "judgy" },
  { text: "The recipe called for restraint. You added more.", category: "judgy" },
  { text: "Aged poorly.", category: "cold" },
  { text: "Room temperature when it should be chilled.", category: "cold" },
  { text: "Reduce by half.", category: "wise" },
  { text: "Presentation immaculate. Flavor absent.", category: "judgy" },
  { text: "Overproofed.", category: "cold" },
  { text: "The finish has notes of regret.", category: "cold" },
  { text: "Acquired taste. Still acquiring.", category: "judgy" },
  { text: "Al dente on the outside. Raw in the middle.", category: "cold" },
  { text: "Sweaty but attractive.", category: "judgy" },
  { text: "You brought a microwave to a soufflé fight.", category: "chaotic" },
  { text: "Deceptively simple.", category: "wise" },
  { text: "Over-seasoned.", category: "judgy" },
  { text: "You linger like an aftertaste nobody asked for.", category: "cold" },
  { text: "Slow-cooked. Worth the wait.", category: "heartfelt" },
  { text: "There's a lot happening on the plate and none of it is working.", category: "judgy" },
  { text: "Bold. No finish.", category: "cold" },
  { text: "Your energy has petrol notes.", category: "cold" },
  { text: "Pairs well with poor decisions.", category: "chaotic" },
  { text: "Flat. Needs more time.", category: "cold" },
  { text: "Never burned, always charred.", category: "wise" },
  { text: "The base is good. You panicked at the garnish.", category: "judgy" },
  { text: "Comfort food.", category: "heartfelt" },
  { text: "The acidity cuts through everything you're pretending.", category: "cold" },
  { text: "Unfiltered.", category: "cold" },
  { text: "Still fermenting.", category: "wise" },
  { text: "You've over-whipped it. Now it's just noise.", category: "judgy" },
  { text: "Interesting mouth feel.", category: "cold" },
  { text: "Home-cooked.", category: "heartfelt" },
  { text: "Full-bodied. No follow-through.", category: "cold" },
  { text: "Your vibe has notes of wet cardboard.", category: "judgy" },
  { text: "Pungent but in a good way.", category: "heartfelt" },
  { text: "Sous vide your expectations.", category: "wise" },
  { text: "The menu promised more than the kitchen delivered.", category: "cold" },
  { text: "You peaked at the appetizer.", category: "judgy" },
  { text: "Missing an ingredient you won't name.", category: "wise" },
  { text: "You have a very short finish.", category: "cold" },
  { text: "Structural complexity of a rice cake.", category: "judgy" },
  { text: "Expired but still in the fridge.", category: "cold" },
  { text: "Left out overnight.", category: "cold" },
  { text: "Garnish on an empty plate.", category: "judgy" },
  { text: "The good stuff is never instant.", category: "wise" },
  { text: "Umami.", category: "mystical" },
  { text: "Complex on the nose. Simple on the finish.", category: "cold" }
];

const state = responses.map((r, i) => ({ ...r, id: i, status: 'pending', editedText: '' }));

function render() {
  const container = document.getElementById('responses');
  container.innerHTML = state.map((r, i) => `
    <div class="response-card ${r.status === 'keep' ? 'kept' : r.status === 'cut' ? 'cut' : r.status === 'edit' ? 'edited' : ''}" id="card-${i}">
      <div class="response-number">#${i + 1} / 50</div>
      <div class="response-text">${r.status === 'edit' && r.editedText ? r.editedText : r.text}</div>
      <div class="response-meta">${r.category} &middot; ${countWords(r.text)}w</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${i}">
        <textarea id="textarea-${i}">${r.editedText || r.text}</textarea>
        <select id="cat-${i}" style="margin-top:5px;background:#0f1629;color:#fff;border:1px solid #ffd93d;padding:5px;border-radius:4px;">
          ${['mystical','nurturing','poetic','cold','angry','heartfelt','judgy','chaotic','wise','existential','demanding','meta'].map(c => `<option value="${c}" ${c === r.category ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <button class="btn btn-keep" onclick="saveEdit(${i})" style="margin-left:8px;">SAVE</button>
      </div>
    </div>
  `).join('');
  updateStats();
  updateExport();
}

function countWords(text) {
  return text.replace(/[*]/g, '').split(/\s+/).filter(w => w.length > 0).length;
}

function decide(i, status) {
  state[i].status = status;
  render();
}

function toggleEdit(i) {
  const el = document.getElementById(`edit-${i}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function saveEdit(i) {
  state[i].editedText = document.getElementById(`textarea-${i}`).value;
  state[i].category = document.getElementById(`cat-${i}`).value;
  state[i].status = 'edit';
  render();
}

function updateStats() {
  const counts = { keep: 0, cut: 0, edit: 0, pending: 0 };
  state.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
  document.getElementById('keepCount').textContent = counts.keep;
  document.getElementById('cutCount').textContent = counts.cut;
  document.getElementById('editCount').textContent = counts.edit;
  document.getElementById('pendingCount').textContent = counts.pending;
}

function updateExport() {
  const kept = state
    .filter(r => r.status === 'keep' || r.status === 'edit')
    .map(r => ({
      text: r.status === 'edit' && r.editedText ? r.editedText : r.text,
      category: r.category
    }));
  document.getElementById('exportJson').textContent = JSON.stringify(kept, null, 2);
}

function copyExport() {
  const text = document.getElementById('exportJson').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy JSON', 1500);
  });
}

render();
</script>
</body>
</html>
