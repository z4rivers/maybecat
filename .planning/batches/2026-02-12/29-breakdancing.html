<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch 29: Breakdancing Instruction | MaybeCat Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Georgia', serif; padding: 20px; max-width: 900px; margin: 0 auto; }
  .header { position: sticky; top: 0; background: #1a1a2e; padding: 15px 0; border-bottom: 2px solid #333; z-index: 100; margin-bottom: 30px; }
  .header h1 { font-size: 1.4em; color: #fff; margin-bottom: 5px; }
  .header .subtitle { color: #888; font-size: 0.85em; margin-bottom: 10px; }
  .stats { display: flex; gap: 20px; font-size: 0.9em; }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }
  .response-card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 15px; transition: border-color 0.2s; }
  .response-card.kept { border-color: #4ecca3; }
  .response-card.cut { border-color: #e94560; opacity: 0.5; }
  .response-card.edited { border-color: #ffd93d; }
  .response-number { color: #666; font-size: 0.75em; margin-bottom: 8px; }
  .response-text { font-size: 1.15em; line-height: 1.5; color: #fff; margin-bottom: 5px; }
  .response-meta { font-size: 0.75em; color: #666; margin-bottom: 12px; font-style: italic; }
  .source-context { font-size: 0.7em; color: #4a6fa5; margin-bottom: 10px; }
  .actions { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .btn { border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .edit-area { display: none; width: 100%; margin-top: 10px; }
  .edit-area textarea { width: 100%; background: #0f1629; color: #fff; border: 1px solid #ffd93d; border-radius: 5px; padding: 10px; font-family: Georgia, serif; font-size: 1em; resize: vertical; min-height: 60px; }
  .edit-area .btn { margin-top: 8px; }
  .export-section { margin-top: 40px; padding: 20px; background: #16213e; border: 1px solid #333; border-radius: 8px; }
  .export-section h2 { margin-bottom: 10px; font-size: 1.1em; }
  .export-section pre { background: #0f1629; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 0.8em; max-height: 500px; overflow-y: auto; white-space: pre-wrap; }
  .btn-copy { background: #4ecca3; color: #1a1a2e; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>Batch 29: Breakdancing Instruction</h1>
  <div class="subtitle">88 responses | Found language from real breaking tutorials, coaching cues, competition judging, physics of movement, and bboy wisdom. Relocated as cat answers to life questions at 2 AM.</div>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="keepCount">0</span></span>
    <span class="stat-cut">CUT: <span id="cutCount">0</span></span>
    <span class="stat-edit">EDIT: <span id="editCount">0</span></span>
    <span class="stat-pending">PENDING: <span id="pendingCount">88</span>/88</span>
  </div>
</div>
<div id="responses"></div>
<div class="export-section">
  <h2>Export (kept + edited responses)</h2>
  <button class="btn-copy" onclick="copyExport()">Copy JSON</button>
  <pre id="exportJson">[]</pre>
</div>
<script>
const responses = [
  // === WINDMILL TUTORIALS ===
  { text: "It is ALL legs.", category: "demanding", source: "Windmill tutorial (BBoy Dojo) -- primary driver of windmill momentum" },
  { text: "The faster you kick, the more momentum you have.", category: "demanding", source: "Windmill technique (BBoy Dojo) -- generating speed in windmills" },
  { text: "Bent legs sap your momentum.", category: "cold", source: "Windmill tutorial (BBoy Dojo) -- common mistake, legs must stay straight" },
  { text: "If you cross your legs you will spin faster for a brief moment but then lose all of your momentum.", category: "wise", source: "Windmill technique (BBoy Dojo) -- leg position and angular momentum" },
  { text: "The wider you open, the more power you drive.", category: "demanding", source: "Windmill tutorial -- V-shape leg position generates power" },
  { text: "Allow your legs to move ahead of your upper body.", category: "wise", source: "Windmill tutorial (BBoy Dojo) -- legs lead, body follows for momentum" },
  { text: "Keep your hips high and your back straight.", category: "demanding", source: "Windmill technique -- form for rolling across shoulders" },
  { text: "The key is to keep the motion controlled and consistent, with no stopping.", category: "wise", source: "Windmill tutorial -- continuous spin technique" },
  { text: "Forty to one hundred hours. That is what this takes.", category: "cold", source: "Windmill tutorial (BBoy Dojo) -- estimated training time to achieve windmill" },

  // === HEADSPIN TUTORIALS ===
  { text: "The goal is to get comfortable being upside down.", category: "existential", source: "Headspin tutorial (BBoy Dojo) -- first step in learning headspins" },
  { text: "Find that spot where it feels comfortable and stable.", category: "nurturing", source: "Headspin tutorial -- finding balance point on your head" },
  { text: "Your head is the foundation. Everything else follows.", category: "wise", source: "Headspin technique -- headstand balance principle" },
  { text: "Tap lightly with your fingertips. It gives you a sense of weightlessness.", category: "poetic", source: "Headspin tutorial -- fingertip tapping for smooth spin control" },
  { text: "Your hips should lead the way.", category: "demanding", source: "Headspin technique -- rotation instruction, hips initiate the turn" },
  { text: "When your upper body turns, your head turns too.", category: "wise", source: "Headspin tutorial -- torso and head must move together in sync" },
  { text: "Sit still. Knees in front. Heels up.", category: "demanding", source: "Headspin tips (Generation BBoy) -- three rules for better headspins" },
  { text: "If you start to wobble, use your hands to steady yourself.", category: "nurturing", source: "Headspin tutorial -- recovering from instability during spin" },

  // === FLARE TUTORIALS ===
  { text: "Kick towards your ear.", category: "chaotic", source: "Flare tutorial (Red Bull) -- leg swing technique for oscillatory motion" },
  { text: "Kicking out rather than around will throw you off balance.", category: "wise", source: "Flare common mistakes (BreakDance Decoded) -- directional error" },
  { text: "Your master leg is swinging too far to the side.", category: "judgy", source: "Flare mistakes (BreakDance Decoded) -- circular momentum thrown off course" },
  { text: "Keep your legs and your hips up towards the sky.", category: "poetic", source: "Air flare tutorial (BBoy Dojo) -- maintaining elevation during rotation" },
  { text: "Bringing your legs down will only stop your momentum.", category: "wise", source: "Air flare technique (BBoy Dojo) -- common mistake of dropping too early" },
  { text: "Bad flexibility can be compensated with great strength. But it does not look good.", category: "judgy", source: "Flare technique (BreakDance Decoded) -- flexibility vs. brute force" },

  // === FREEZE TUTORIALS ===
  { text: "Stab your elbow into your side.", category: "cold", source: "Baby freeze tutorial -- the 'stab' technique for elbow placement in abs" },
  { text: "All of your weight will now be on one arm.", category: "existential", source: "Baby freeze tutorial (Instructables) -- final balance position" },
  { text: "Hold the position without any movement.", category: "demanding", source: "Freeze technique -- definition of a freeze, complete stillness" },
  { text: "A freeze is halting all motion, as if freezing into ice.", category: "mystical", source: "Freeze definition (Wikipedia/MyGrooveGuide) -- the concept of the freeze" },
  { text: "Practice stabbing in different places until it feels stable.", category: "cold", source: "Freeze tutorial -- finding comfortable elbow stab position, varies by body" },
  { text: "Everybody is built differently.", category: "nurturing", source: "Freeze technique -- why the stab position varies person to person" },
  { text: "Finding your balance point is a matter of frequent repetition.", category: "wise", source: "Freeze overview (MyGrooveGuide) -- how body and brain learn balance" },
  { text: "Without the right technique, you might never find your sweet spot.", category: "cold", source: "Freeze tips (MyGrooveGuide) -- importance of correct form for balance" },

  // === BACKSPIN TUTORIALS ===
  { text: "The tighter you tuck, the faster you spin.", category: "wise", source: "Backspin tutorial -- conservation of angular momentum, legs closer = faster" },
  { text: "Extend your arms straight out. Spread your weight evenly.", category: "demanding", source: "Backspin technique -- arm position for balance during spin" },
  { text: "This move is about fluidity and balance.", category: "poetic", source: "Backspin tutorial (DanceWithCeech) -- understanding body mechanics" },

  // === TOPROCK / FOOTWORK ===
  { text: "Always be on your toes.", category: "demanding", source: "Footwork technique (6-step) -- toes and fingertips for best form and speed" },
  { text: "Infuse your movements with emotion and personality.", category: "heartfelt", source: "Toprock tutorial (MyGrooveGuide) -- self-expression in standing dance" },
  { text: "Plugging into the music and focusing on yourself.", category: "poetic", source: "Toprock tutorial -- toprocking is about connecting with the music" },
  { text: "The fundamentals are not the moves. The fundamentals are the music.", category: "wise", source: "BBoy Dojo -- core philosophy of breaking, music first" },
  { text: "A relaxed, flexible upper body is critical.", category: "wise", source: "Toprock technique -- maintaining fluidity in standing dance" },
  { text: "Think of the groove as bouncing between two points.", category: "poetic", source: "Toprock tutorial -- the groove vs. the rock, flow vs. stick" },

  // === SUICIDE / DROPS ===
  { text: "A sudden drop to the back.", category: "cold", source: "Suicide move definition (Wikipedia) -- the suicide is a dramatic fall" },
  { text: "Designed to look painful. Techniques are used to minimize the pain.", category: "cold", source: "Suicide move (Wikipedia) -- flashy and painful-looking but controlled" },
  { text: "The breaker ends perfectly still, enhancing the image that they have injured themselves.", category: "mystical", source: "Suicide move description -- stillness after dramatic fall" },
  { text: "It should look like you kicked yourself and fell.", category: "chaotic", source: "Knee drop tutorial -- the illusion of self-sabotage" },

  // === BATTLE STRATEGY ===
  { text: "The first one to go out sets the level.", category: "demanding", source: "Red Bull Art of Battle -- strategy of going first in competition" },
  { text: "If your opponent crashes, you can choose to take a risk or play it safe.", category: "wise", source: "Red Bull battle strategy -- responding to opponent mistakes" },
  { text: "Make them doubt their skills before they even step on the floor.", category: "cold", source: "Breaking battle psychology -- getting in your opponent's head" },
  { text: "If the connection is found, it is a lot harder for your opponent to find a new approach.", category: "wise", source: "Red Bull battle strategy -- musicality advantage when you connect first" },
  { text: "Crashes are just a part of this. Allow yourself to crash.", category: "nurturing", source: "BBoy training philosophy -- falling is how you learn" },
  { text: "You cannot leave winning to fate.", category: "demanding", source: "BreakDance Decoded -- on mastering moves to 10/10 before competition" },
  { text: "Go first. Quell the overthinking.", category: "demanding", source: "Battle strategy (BBoy Dojo) -- leading off to prevent nerves" },

  // === TRAINING PHILOSOPHY / BBOY WISDOM ===
  { text: "Stop thinking of why you cannot do it.", category: "demanding", source: "Breakdancing Ninja -- the right attitude for learning" },
  { text: "The first and most important thing you need is the right attitude.", category: "wise", source: "Breakdancing Ninja -- mindset before technique" },
  { text: "With patience and commitment, progress is not only possible but guaranteed.", category: "heartfelt", source: "BBoy Dojo -- beginner encouragement" },
  { text: "Every small success builds confidence and competence.", category: "nurturing", source: "BBoy Dojo beginner guide -- on incremental progress" },
  { text: "Throw aside what you are already good at.", category: "demanding", source: "BreakDance Decoded -- stop repeating comfort moves in practice" },
  { text: "Listen to your body. In the long run, you will go further.", category: "wise", source: "BBoy Factory injury prevention -- training longevity" },
  { text: "Some of my best progress came after weeks of not training.", category: "mystical", source: "BBoy Factory -- rest as secret weapon, recovery produces breakthroughs" },
  { text: "When part of you is in pain, that is when you should head for assistance.", category: "nurturing", source: "BBoy Factory injury guide -- knowing when to stop" },
  { text: "Believe in your art. Nothing in life comes easy.", category: "heartfelt", source: "B-Boy Neguin interview (Red Bull) -- dedication and discipline" },
  { text: "Get rid of the fear and trauma.", category: "demanding", source: "B-Boy Neguin advice -- mental preparation for battles" },
  { text: "Train your mind for the conversation.", category: "wise", source: "B-Boy Neguin (Red Bull) -- breaking as conversation, mental prep" },
  { text: "Learn the culture to get the comprehension of yourself.", category: "existential", source: "B-Boy Neguin advice -- understanding hip-hop to understand yourself" },

  // === PHYSICS OF BREAKING ===
  { text: "Pull everything inward. You will accelerate.", category: "wise", source: "Physics of breaking -- conservation of angular momentum in headspins" },
  { text: "A spinning object maintains its state of rotation.", category: "mystical", source: "Headspin physics (Scientific American) -- gyroscopic stability principle" },
  { text: "Gravity does not act to slow you down when you spin about a vertical axis.", category: "mystical", source: "Headspin physics -- gyroscopic stability, gravity irrelevant to spin" },
  { text: "The linear turns into the angular.", category: "poetic", source: "Backspin physics -- leg momentum converts to rotational momentum" },
  { text: "Distribute your weight evenly throughout the rotation.", category: "wise", source: "Windmill physics -- body weight distribution for constant angular velocity" },

  // === JUDGING CRITERIA ===
  { text: "The moves should flow together but not blend together.", category: "wise", source: "Olympic breaking judging -- execution criteria, distinct but connected" },
  { text: "Even basic moves can impress, delivered in a fresh way.", category: "heartfelt", source: "Olympic breaking judging -- originality criteria, creativity over difficulty" },
  { text: "Technique, vocabulary, originality, execution, musicality.", category: "demanding", source: "Olympic breaking (Paris 2024) -- the five judging criteria" },
  { text: "Crashes, slips and falls are penalized.", category: "cold", source: "Olympic breaking judging -- execution scoring, clean performance" },
  { text: "The capacity for improvisation, creativity, and maintaining spontaneity with style.", category: "poetic", source: "Olympic breaking judging -- originality criteria definition" },
  { text: "Personality and character are the first priority.", category: "wise", source: "Red Bull BC One judging -- Judge Sick on what matters most" },
  { text: "Loss of self-confidence is what I watch for.", category: "cold", source: "Red Bull BC One judging -- FaBGirl on what loses battles" },

  // === SPECIFIC MOVE DESCRIPTIONS ===
  { text: "Shift your weight from one hand to the other. Keep nothing on the ground.", category: "existential", source: "Air flare technique -- hopping between hands while fully inverted" },
  { text: "Support your entire body on your elbows while tucking into your abdomen.", category: "demanding", source: "Turtle freeze description -- weight balanced on stabbed elbows" },
  { text: "One hand as a pivot. The other creates a hopping motion.", category: "wise", source: "Cricket move description -- rhythmic bouncing on one hand" },
  { text: "A rippling of the body along the ground.", category: "poetic", source: "The Worm -- move description from breakdance move list" },
  { text: "Swing your legs under your body and return to the start.", category: "wise", source: "Flare technique -- maintaining circular momentum in legs" },
  { text: "Keep your body entirely inverted and vertical.", category: "demanding", source: "Air flare definition -- body position during rotation" },

  // === INJURY / PAIN / RECOVERY ===
  { text: "Dancing through pain became normal.", category: "existential", source: "BBoy Factory -- bboy injury reflection on bruised shoulders and jammed fingers" },
  { text: "Your wrists, your shoulders, your knees. That is where it breaks.", category: "cold", source: "Breakdancing injury data -- 69% wrists, 62% fingers, 62% knees, 52% shoulders" },

  // === SWIPE TUTORIALS ===
  { text: "Follow the twisty power from your hips.", category: "poetic", source: "Swipe tutorial (LearnBreakdance) -- hip-driven rotation technique" },
  { text: "Shifting weight to your hands transforms a heavy motion into a floating one.", category: "mystical", source: "Swipe tutorial -- weight shift makes swipe light and aerial" },
  { text: "Keep your legs straight. Maintain elevated hips. Shift your weight.", category: "demanding", source: "Swipe tutorial -- three key tips for clean swipes" },

  // === MENNO / ADVANCED PHILOSOPHY ===
  { text: "Memorize it so concretely you can execute on demand.", category: "cold", source: "B-Boy Menno battle prep -- memory castle technique for moves under pressure" },
  { text: "Practice with the same intensity as competition.", category: "demanding", source: "B-Boy Menno advice -- training at battle intensity, not casual reps" },
];

const TOTAL = responses.length;
const state = responses.map((r, i) => ({ ...r, id: i, status: 'pending', editedText: '' }));

function render() {
  const container = document.getElementById('responses');
  container.innerHTML = state.map((r, i) => `
    <div class="response-card ${r.status === 'keep' ? 'kept' : r.status === 'cut' ? 'cut' : r.status === 'edit' ? 'edited' : ''}" id="card-${i}">
      <div class="response-number">#${i + 1} / ${TOTAL}</div>
      <div class="response-text">${r.status === 'edit' && r.editedText ? r.editedText : r.text}</div>
      <div class="source-context">${r.source}</div>
      <div class="response-meta">${r.category} &middot; ${countWords(r.text)}w</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-${i}">
        <textarea id="textarea-${i}">${r.editedText || r.text}</textarea>
        <select id="cat-${i}" style="margin-top:5px;background:#0f1629;color:#fff;border:1px solid #ffd93d;padding:5px;border-radius:4px;">
          ${['mystical','nurturing','poetic','cold','angry','heartfelt','judgy','chaotic','wise','existential','demanding','meta'].map(c => `<option value="${c}" ${c === r.category ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <button class="btn btn-keep" onclick="saveEdit(${i})" style="margin-left:8px;">SAVE</button>
      </div>
    </div>
  `).join('');
  updateStats(); updateExport();
}

function countWords(text) { return text.replace(/[*]/g, '').split(/\s+/).filter(w => w.length > 0).length; }
function decide(i, status) { state[i].status = status; render(); }
function toggleEdit(i) { const el = document.getElementById(`edit-${i}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
function saveEdit(i) { state[i].editedText = document.getElementById(`textarea-${i}`).value; state[i].category = document.getElementById(`cat-${i}`).value; state[i].status = 'edit'; render(); }
function updateStats() { const counts = { keep: 0, cut: 0, edit: 0, pending: 0 }; state.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1); document.getElementById('keepCount').textContent = counts.keep; document.getElementById('cutCount').textContent = counts.cut; document.getElementById('editCount').textContent = counts.edit; document.getElementById('pendingCount').textContent = counts.pending; }
function updateExport() { const kept = state.filter(r => r.status === 'keep' || r.status === 'edit').map(r => ({ text: r.status === 'edit' && r.editedText ? r.editedText : r.text, category: r.category })); document.getElementById('exportJson').textContent = JSON.stringify(kept, null, 2); }
function copyExport() { const text = document.getElementById('exportJson').textContent; navigator.clipboard.writeText(text).then(() => { const btn = document.querySelector('.btn-copy'); btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy JSON', 1500); }); }
render();
</script>
</body>
</html>
