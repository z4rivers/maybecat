<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch: Fierce Conversations (Peanuts Filter)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; padding-top: 120px; }

.sticky-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #16213e; padding: 16px 24px; border-bottom: 2px solid #0f3460;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.sticky-header h1 { font-size: 1.3rem; color: #e94560; }
.stats { display: flex; gap: 16px; font-size: 0.9rem; }
.stat-keep { color: #4ecca3; } .stat-cut { color: #e94560; } .stat-edit { color: #ffd93d; } .stat-pending { color: #aaa; }

.card {
  background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 16px;
  border-left: 4px solid #0f3460; transition: border-color 0.3s;
}
.card.kept { border-left-color: #4ecca3; } .card.cut { border-left-color: #e94560; } .card.edited { border-left-color: #ffd93d; }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card-number { color: #666; font-size: 0.8rem; }
.category-badge {
  background: #0f3460; color: #e94560; padding: 3px 10px; border-radius: 20px;
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
}

.response-text { font-size: 1.15rem; line-height: 1.6; color: #fff; margin-bottom: 16px; font-style: italic; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
}
.btn-keep { background: #4ecca3; color: #1a1a2e; } .btn-keep:hover { background: #3db891; }
.btn-cut { background: #e94560; color: #fff; } .btn-cut:hover { background: #d63851; }
.btn-edit { background: #ffd93d; color: #1a1a2e; } .btn-edit:hover { background: #f0ca2e; }
.btn-reset { background: #333; color: #aaa; font-size: 0.75rem; } .btn-reset:hover { background: #444; }

.edit-area {
  width: 100%; margin-top: 10px; padding: 12px; background: #0d1b2a; color: #fff;
  border: 1px solid #ffd93d; border-radius: 6px; font-size: 1rem; resize: vertical;
  font-family: inherit; display: none; min-height: 60px;
}
.card.editing .edit-area { display: block; }

.export-section {
  margin-top: 40px; padding: 24px; background: #0d1b2a; border-radius: 12px; border: 1px solid #0f3460;
}
.export-section h2 { color: #4ecca3; margin-bottom: 12px; }
.export-json {
  width: 100%; min-height: 200px; padding: 12px; background: #1a1a2e; color: #4ecca3;
  border: 1px solid #0f3460; border-radius: 6px; font-family: monospace; font-size: 0.85rem;
}
.btn-copy {
  margin-top: 10px; padding: 10px 24px; background: #4ecca3; color: #1a1a2e;
  border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
}
.btn-copy:hover { background: #3db891; }
.copy-feedback { color: #4ecca3; margin-left: 12px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; }
</style>
</head>
<body>

<div class="sticky-header">
  <h1>Batch: Fierce Conversations (Peanuts Filter)</h1>
  <div class="stats">
    <span class="stat-keep">KEEP: <span id="count-keep">0</span></span>
    <span class="stat-cut">CUT: <span id="count-cut">0</span></span>
    <span class="stat-edit">EDIT: <span id="count-edit">0</span></span>
    <span class="stat-pending">PENDING: <span id="count-pending">0</span></span>
    <span style="color:#666">TOTAL: <span id="count-total">0</span></span>
  </div>
</div>

<div id="cards-container"></div>

<div class="export-section">
  <h2>Export (Kept + Edited)</h2>
  <textarea class="export-json" id="export-json" readonly></textarea>
  <br>
  <button class="btn-copy" onclick="copyExport()">Copy to Clipboard</button>
  <span class="copy-feedback" id="copy-feedback">Copied!</span>
</div>

<script>
const responses = [
  { text: "You keep having the conversation about the conversation instead of the conversation.", category: "wise" },
  { text: "Name it or feed it. Those are the only two options.", category: "demanding" },
  { text: "*slow blink* The silence isn't keeping the peace. The silence IS the war.", category: "cold" },
  { text: "You're not avoiding conflict. You're just having it alone, in your head, at 2 AM.", category: "judgy" },
  { text: "The thing you won't say out loud is the thing running everything.", category: "wise" },
  { text: "You rehearsed that conversation forty times and then said 'it's fine' again.", category: "judgy" },
  { text: "Being nice to someone's face while resenting them in private. That's not kindness. That's storage.", category: "demanding" },
  { text: "*one ear rotates* You think you're protecting the relationship. You're composting it.", category: "cold" },
  { text: "Every relationship you've lost died in the quiet part. Not the fight.", category: "wise" },
  { text: "You keep solving this. It keeps being unsolved. Maybe the problem isn't the one you named.", category: "existential" },
  { text: "The truth doesn't actually hurt. It's the distance between the truth and what you've been pretending.", category: "wise" },
  { text: "*tail tip flicks* You tolerate it. So it stays. That's the whole equation.", category: "cold" },
  { text: "You said 'we need to talk' to yourself six months ago and then didn't.", category: "judgy" },
  { text: "Gradually. Then suddenly. That's how everything ends that you refused to look at.", category: "wise" },
  { text: "The scariest conversation is never the loud one. It's the one that starts with 'I need to tell you something real.'", category: "heartfelt" },
  { text: "*makes biscuits* You don't need more time. You need fewer scripts.", category: "demanding" },
  { text: "Your politeness is so loud nobody can hear you.", category: "cold" },
  { text: "You've been editing yourself down to fit a space that was never your shape.", category: "heartfelt" },
  { text: "The surface keeps looking fine. The surface always looks fine. That's what surface means.", category: "existential" },
  { text: "*pupils dilate* You know exactly what you'd say if it couldn't hurt you. Say that.", category: "demanding" },
  { text: "There's a version of this where you stop performing okay and actually check.", category: "heartfelt" },
  { text: "Being understood and being managed are not the same thing. You can feel which one this is.", category: "wise" },
  { text: "You keep bringing snacks to a house that's on fire.", category: "judgy" },
  { text: "*headbutts your hand* The apology that would fix this isn't complicated. It's just expensive.", category: "heartfelt" },
  { text: "Nobody changed from a hint. Nobody ever changed from a hint.", category: "cold" },
  { text: "What you're calling patience, they're calling permission.", category: "wise" },
  { text: "The real conversation is four sentences. Everything else is the moat you built around it.", category: "demanding" },
  { text: "You don't have a communication problem. You have a courage problem wearing a communication costume.", category: "judgy" },
  { text: "*slow blink* The exhaustion isn't from the work. It's from pretending you're fine with how the work is going.", category: "existential" },
  { text: "Some silence is peace. Yours has a pulse.", category: "cold" },
  { text: "You're waiting for them to notice. They're waiting for you to say it. The room is just... waiting.", category: "existential" },
  { text: "Stop interviewing someone for a position they already showed you they can't fill.", category: "demanding" },
  { text: "*reaches one paw without getting up* The conversation you're dreading is smaller than the weight of not having it.", category: "heartfelt" },
  { text: "Nice leaves the room feeling good about itself. Kind leaves the room having said the thing.", category: "wise" },
  { text: "You're not keeping the peace. You're keeping the arrangement.", category: "cold" },
  { text: "Every time you swallow that sentence, your chest gets a little smaller.", category: "heartfelt" },
  { text: "*ears flatten* You already left. Your body just hasn't caught up to your silence.", category: "existential" },
  { text: "The problem isn't unnamed. You named it Tuesday. You just named it to the wrong room.", category: "judgy" },
  { text: "One real sentence would replace the last nine months of subtext.", category: "demanding" }
];

const STORAGE_KEY = 'batch-fierce-conversations-decisions';

function loadDecisions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
}
function saveDecisions(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

function renderCards() {
  const container = document.getElementById('cards-container');
  const decisions = loadDecisions();
  container.innerHTML = '';

  responses.forEach((r, i) => {
    const d = decisions[i] || {};
    const status = d.status || 'pending';
    const editedText = d.editedText || r.text;

    const card = document.createElement('div');
    card.className = `card ${status === 'keep' ? 'kept' : status === 'cut' ? 'cut' : status === 'edit' ? 'edited editing' : ''}`;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-number">#${i + 1}</span>
        <span class="category-badge">${r.category}</span>
      </div>
      <div class="response-text">"${status === 'edit' ? editedText : r.text}"</div>
      <div class="actions">
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit" onclick="startEdit(${i})">EDIT</button>
        ${status !== 'pending' ? `<button class="btn btn-reset" onclick="decide(${i}, 'pending')">RESET</button>` : ''}
      </div>
      <textarea class="edit-area" id="edit-${i}" onblur="saveEdit(${i})">${editedText}</textarea>
    `;
    container.appendChild(card);
  });

  updateStats();
  updateExport();
}

function decide(i, status) {
  const decisions = loadDecisions();
  if (status === 'pending') { delete decisions[i]; }
  else {
    decisions[i] = decisions[i] || {};
    decisions[i].status = status;
    if (status === 'edit') {
      decisions[i].editedText = decisions[i].editedText || responses[i].text;
    }
  }
  saveDecisions(decisions);
  renderCards();
  if (status === 'edit') {
    const ta = document.getElementById(`edit-${i}`);
    if (ta) { ta.style.display = 'block'; ta.focus(); }
  }
}

function startEdit(i) {
  decide(i, 'edit');
}

function saveEdit(i) {
  const ta = document.getElementById(`edit-${i}`);
  if (!ta) return;
  const decisions = loadDecisions();
  if (!decisions[i]) decisions[i] = { status: 'edit' };
  decisions[i].editedText = ta.value;
  decisions[i].status = 'edit';
  saveDecisions(decisions);
  updateExport();
}

function updateStats() {
  const decisions = loadDecisions();
  let keep = 0, cut = 0, edit = 0;
  Object.values(decisions).forEach(d => {
    if (d.status === 'keep') keep++;
    else if (d.status === 'cut') cut++;
    else if (d.status === 'edit') edit++;
  });
  document.getElementById('count-keep').textContent = keep;
  document.getElementById('count-cut').textContent = cut;
  document.getElementById('count-edit').textContent = edit;
  document.getElementById('count-pending').textContent = responses.length - keep - cut - edit;
  document.getElementById('count-total').textContent = responses.length;
}

function updateExport() {
  const decisions = loadDecisions();
  const exported = [];
  responses.forEach((r, i) => {
    const d = decisions[i];
    if (d && d.status === 'keep') {
      exported.push({ text: r.text, category: r.category });
    } else if (d && d.status === 'edit') {
      exported.push({ text: d.editedText || r.text, category: r.category });
    }
  });
  document.getElementById('export-json').value = JSON.stringify(exported, null, 2);
}

function copyExport() {
  const ta = document.getElementById('export-json');
  navigator.clipboard.writeText(ta.value).then(() => {
    const fb = document.getElementById('copy-feedback');
    fb.style.opacity = '1';
    setTimeout(() => fb.style.opacity = '0', 2000);
  });
}

renderCards();
</script>
</body>
</html>
