  { id: 101, theme: "They Were In My Spot",              text: "Unapproved modifications to a shared space will not be tolerated.",                                                  category: "angry" },
  { id: 102, theme: "They Were In My Spot",              text: "Claimed it before you wanted it. That's just good timing.",                                                          category: "chaotic" },
  { id: 103, theme: "They Were In My Spot",              text: "A violation has been noted.",                                                                                        category: "judgy" },
];

// State per card: null = undecided, 'kept', 'cut', 'edited'
const state = {};
const editedText = {};

DATA.forEach(item => {
  state[item.id] = null;
  editedText[item.id] = item.text;
});

// ── Helpers ──
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderText(text) {
  // *...* becomes a muted italic span
  return escapeHtml(text).replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

function badgeClass(cat) {
  return 'badge badge-' + cat;
}

// ── Build DOM ──
const themes = [...new Set(DATA.map(d => d.theme))];
const root = document.getElementById('cards-root');

themes.forEach(theme => {
  const items = DATA.filter(d => d.theme === theme);

  const section = document.createElement('div');
  section.className = 'theme-section';
  section.id = 'theme-' + theme.replace(/[^a-z0-9]/gi, '-');

  const header = document.createElement('div');
  header.className = 'theme-header';
  header.innerHTML =
    '<h2>' + escapeHtml(theme) + '</h2>' +
    '<span class="theme-count">' + items.length + ' responses</span>';
  section.appendChild(header);

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + item.id;

    card.innerHTML =
      '<div class="card-body">' +
        '<div class="card-meta">' +
          '<span class="card-index">#' + item.id + '</span>' +
          '<span class="' + badgeClass(item.category) + '">' + item.category + '</span>' +
        '</div>' +
        '<div class="card-text" id="text-display-' + item.id + '">' + renderText(item.text) + '</div>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button class="btn btn-keep"  onclick="decide(' + item.id + ',\'kept\')">Keep</button>' +
        '<button class="btn btn-cut"   onclick="decide(' + item.id + ',\'cut\')">Cut</button>' +
        '<button class="btn btn-edit"  onclick="toggleEdit(' + item.id + ')">Edit</button>' +
        '<button class="btn btn-undo"  onclick="decide(' + item.id + ',null)" id="undo-' + item.id + '" style="display:none">Undo</button>' +
      '</div>' +
      '<div class="edit-area" id="edit-area-' + item.id + '">' +
        '<textarea id="edit-ta-' + item.id + '" rows="3">' + escapeHtml(item.text) + '</textarea>' +
        '<button class="save-edit" onclick="saveEdit(' + item.id + ')">Save Edit</button>' +
      '</div>';

    section.appendChild(card);
  });

  root.appendChild(section);
});

// ── Decision logic ──
function decide(id, decision) {
  state[id] = decision;

  const card = document.getElementById('card-' + id);
  card.classList.remove('kept', 'cut', 'edited');
  if (decision) card.classList.add(decision);

  // Undo button visibility
  const undoBtn = document.getElementById('undo-' + id);
  undoBtn.style.display = decision ? 'inline-block' : 'none';

  // Active button highlights
  const keep = card.querySelector('.btn-keep');
  const cut  = card.querySelector('.btn-cut');
  const edit = card.querySelector('.btn-edit');
  keep.classList.remove('active-keep');
  cut.classList.remove('active-cut');
  edit.classList.remove('active-edit');
  if (decision === 'kept')   keep.classList.add('active-keep');
  if (decision === 'cut')    cut.classList.add('active-cut');
  if (decision === 'edited') edit.classList.add('active-edit');

  // Collapse edit area unless editing
  if (decision !== 'edited') {
    document.getElementById('edit-area-' + id).classList.remove('visible');
  }

  updateStats();
  updateExport();
}

function toggleEdit(id) {
  const area = document.getElementById('edit-area-' + id);
  const nowVisible = !area.classList.contains('visible');
  area.classList.toggle('visible', nowVisible);
  if (nowVisible) {
    document.getElementById('edit-ta-' + id).focus();
  }
}

function saveEdit(id) {
  const ta = document.getElementById('edit-ta-' + id);
  const newText = ta.value.trim();
  if (!newText) return;
  editedText[id] = newText;
  document.getElementById('text-display-' + id).innerHTML = renderText(newText);
  decide(id, 'edited');
  document.getElementById('edit-area-' + id).classList.remove('visible');
}

// ── Stats ──
function updateStats() {
  const kept   = Object.values(state).filter(v => v === 'kept').length;
  const cut    = Object.values(state).filter(v => v === 'cut').length;
  const edited = Object.values(state).filter(v => v === 'edited').length;
  const total  = DATA.length;
  const remain = total - kept - cut - edited;

  document.getElementById('s-kept').textContent   = kept;
  document.getElementById('s-cut').textContent    = cut;
  document.getElementById('s-edited').textContent = edited;
  document.getElementById('s-remain').textContent = remain;

  const decided = kept + cut + edited;
  document.getElementById('progress-bar').style.width = ((decided / total) * 100) + '%';
}

// ── Export ──
function updateExport() {
  const results = DATA
    .filter(item => state[item.id] === 'kept' || state[item.id] === 'edited')
    .map(item => ({ text: editedText[item.id], category: item.category }));

  document.getElementById('export-count').textContent = results.length;
  document.getElementById('json-output').textContent  = JSON.stringify(results, null, 2);
}

// ── Copy button ──
document.getElementById('copy-btn').addEventListener('click', function () {
  const text = document.getElementById('json-output').textContent;
  const btn  = this;

  function flash() {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy JSON';
      btn.classList.remove('copied');
    }, 2000);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash).catch(() => fallbackCopy(text, flash));
  } else {
    fallbackCopy(text, flash);
  }
});

function fallbackCopy(text, callback) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity  = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  callback();
}

// ── Init ──
updateStats();
updateExport();
</script>
</body>
</html>
