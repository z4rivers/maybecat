  {"text": "You scratched the surface. Literally. You have to go deeper to get to the stuffing.", "category": "demanding", "line": 2606},
  {"text": "Not every problem requires boom boom pow. Some just need a shimmy shimmy ya.", "category": "wise", "line": 2651},

];

const STORAGE_KEY = 'maybecat-cull-r5-verbose-v1';

// State
let decisions = {};  // index -> { action: 'cut'|'trim'|'keep', trimmedText?: string }
let activeIndex = 0;
let activeTab = 'cuts';

// Load state
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) decisions = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  } catch(e) {}
}

// Render cards
function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  DATA.forEach((item, i) => {
    const d = decisions[i];
    const decidedClass = d ? `decided-${d.action}` : '';
    const activeClass = i === activeIndex ? 'active' : '';

    const card = document.createElement('div');
    card.className = `card ${decidedClass} ${activeClass}`;
    card.id = `card-${i}`;
    card.dataset.index = i;
    card.onclick = (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
      setActive(i);
    };

    card.innerHTML = `
      <div class="card-top">
        <span class="card-index">#${i + 1} &middot; L${item.line}</span>
        <span class="decision-badge badge-cut">CUT</span>
        <span class="decision-badge badge-trim">TRIMMED</span>
        <span class="decision-badge badge-keep">KEEP</span>
        <span class="card-badge">${item.category}</span>
      </div>
      <div class="card-text">${escapeHtml(item.text)}</div>
      ${d && d.action === 'trim' && d.trimmedText ? `
        <div class="trimmed-preview">
          <span class="trim-label">Trimmed to:</span>
          ${escapeHtml(d.trimmedText)}
        </div>
      ` : ''}
      <div class="card-actions">
        <button class="btn btn-cut" onclick="decide(${i}, 'cut')">Cut</button>
        <button class="btn btn-trim" onclick="openTrim(${i})">Trim</button>
        <button class="btn btn-keep" onclick="decide(${i}, 'keep')">Keep</button>
        ${d ? `<button class="btn btn-undo" onclick="undo(${i})">Undo</button>` : ''}
      </div>
      <div class="trim-area" id="trim-area-${i}">
        <textarea id="trim-text-${i}">${escapeHtml(d && d.action === 'trim' && d.trimmedText ? d.trimmedText : item.text)}</textarea>
        <div class="trim-actions">
          <button class="btn-apply" onclick="applyTrim(${i})">Apply Trim</button>
          <button class="btn-cancel-trim" onclick="closeTrim(${i})">Cancel</button>
          <span class="trim-hint">Edit down to just the punch line</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function setActive(i) {
  const prev = document.getElementById(`card-${activeIndex}`);
  if (prev) prev.classList.remove('active');
  activeIndex = Math.max(0, Math.min(DATA.length - 1, i));
  const curr = document.getElementById(`card-${activeIndex}`);
  if (curr) {
    curr.classList.add('active');
    // Scroll into view, accounting for sticky header
    const headerH = document.getElementById('header').offsetHeight;
    const rect = curr.getBoundingClientRect();
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (rect.top < headerH + 10 || rect.bottom > window.innerHeight - 20) {
      window.scrollTo({ top: scrollTop + rect.top - headerH - 16, behavior: 'smooth' });
    }
  }
}

function decide(i, action) {
  decisions[i] = { action };
  saveState();
  updateCard(i);
  updateStats();
  updateExport();
}

function openTrim(i) {
  // Show trim area
  const area = document.getElementById(`trim-area-${i}`);
  area.classList.add('visible');
  const ta = document.getElementById(`trim-text-${i}`);
  // Pre-fill with existing trim or original
  if (decisions[i] && decisions[i].trimmedText) {
    ta.value = decisions[i].trimmedText;
  } else {
    ta.value = DATA[i].text;
  }
  ta.focus();
  ta.select();
  setActive(i);
}

function closeTrim(i) {
  document.getElementById(`trim-area-${i}`).classList.remove('visible');
}

function applyTrim(i) {
  const ta = document.getElementById(`trim-text-${i}`);
  const trimmed = ta.value.trim();
  if (!trimmed) return;
  decisions[i] = { action: 'trim', trimmedText: trimmed };
  saveState();
  closeTrim(i);
  updateCard(i);
  updateStats();
  updateExport();
}

function undo(i) {
  delete decisions[i];
  saveState();
  updateCard(i);
  updateStats();
  updateExport();
}

function updateCard(i) {
  // Re-render just this card
  const old = document.getElementById(`card-${i}`);
  const d = decisions[i];
  const item = DATA[i];
  const decidedClass = d ? `decided-${d.action}` : '';
  const activeClass = i === activeIndex ? 'active' : '';

  const card = document.createElement('div');
  card.className = `card ${decidedClass} ${activeClass}`;
  card.id = `card-${i}`;
  card.dataset.index = i;
  card.onclick = (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
    setActive(i);
  };

  card.innerHTML = `
    <div class="card-top">
      <span class="card-index">#${i + 1} &middot; L${item.line}</span>
      <span class="decision-badge badge-cut">CUT</span>
      <span class="decision-badge badge-trim">TRIMMED</span>
      <span class="decision-badge badge-keep">KEEP</span>
      <span class="card-badge">${item.category}</span>
    </div>
    <div class="card-text">${escapeHtml(item.text)}</div>
    ${d && d.action === 'trim' && d.trimmedText ? `
      <div class="trimmed-preview">
        <span class="trim-label">Trimmed to:</span>
        ${escapeHtml(d.trimmedText)}
      </div>
    ` : ''}
    <div class="card-actions">
      <button class="btn btn-cut" onclick="decide(${i}, 'cut')">Cut</button>
      <button class="btn btn-trim" onclick="openTrim(${i})">Trim</button>
      <button class="btn btn-keep" onclick="decide(${i}, 'keep')">Keep</button>
      ${d ? `<button class="btn btn-undo" onclick="undo(${i})">Undo</button>` : ''}
    </div>
    <div class="trim-area" id="trim-area-${i}">
      <textarea id="trim-text-${i}">${escapeHtml(d && d.action === 'trim' && d.trimmedText ? d.trimmedText : item.text)}</textarea>
      <div class="trim-actions">
        <button class="btn-apply" onclick="applyTrim(${i})">Apply Trim</button>
        <button class="btn-cancel-trim" onclick="closeTrim(${i})">Cancel</button>
        <span class="trim-hint">Edit down to just the punch line</span>
      </div>
    </div>
  `;
  old.replaceWith(card);
}

function updateStats() {
  let cuts = 0, trims = 0, keeps = 0;
  Object.values(decisions).forEach(d => {
    if (d.action === 'cut') cuts++;
    else if (d.action === 'trim') trims++;
    else if (d.action === 'keep') keeps++;
  });
  const reviewed = cuts + trims + keeps;
  const pending = DATA.length - reviewed;

  document.getElementById('stat-cut').textContent = cuts;
  document.getElementById('stat-trim').textContent = trims;
  document.getElementById('stat-keep').textContent = keeps;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('progress-text').textContent = `${reviewed} / ${DATA.length} reviewed`;
  document.getElementById('progress-fill').style.width = `${(reviewed / DATA.length) * 100}%`;
}

function jumpToNext() {
  for (let i = 0; i < DATA.length; i++) {
    if (!decisions[i]) {
      setActive(i);
      return;
    }
  }
  // All reviewed
  alert('All items reviewed!');
}

// Export
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.export-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  updateExport();
}

function getExportData() {
  const cuts = [];
  const trims = [];

  DATA.forEach((item, i) => {
    const d = decisions[i];
    if (!d) return;
    if (d.action === 'cut') {
      cuts.push({ text: item.text, category: item.category });
    } else if (d.action === 'trim') {
      trims.push({
        original_text: item.text,
        trimmed_text: d.trimmedText,
        category: item.category
      });
    }
  });

  return { cuts, trims };
}

function updateExport() {
  const { cuts, trims } = getExportData();
  const el = document.getElementById('export-content');

  if (activeTab === 'cuts') {
    if (cuts.length === 0) {
      el.innerHTML = '<div class="export-empty">No cuts yet.</div>';
    } else {
      el.textContent = JSON.stringify(cuts, null, 2);
    }
  } else if (activeTab === 'trims') {
    if (trims.length === 0) {
      el.innerHTML = '<div class="export-empty">No trims yet.</div>';
    } else {
      el.textContent = JSON.stringify(trims, null, 2);
    }
  } else {
    // All summary
    let reviewed = 0, cutCount = 0, trimCount = 0, keepCount = 0;
    Object.values(decisions).forEach(d => {
      reviewed++;
      if (d.action === 'cut') cutCount++;
      else if (d.action === 'trim') trimCount++;
      else if (d.action === 'keep') keepCount++;
    });

    const summary = {
      summary: {
        total: DATA.length,
        reviewed,
        pending: DATA.length - reviewed,
        cuts: cutCount,
        trims: trimCount,
        keeps: keepCount
      },
      cuts: cuts,
      trims: trims
    };
    el.textContent = JSON.stringify(summary, null, 2);
  }
}

function copyExport() {
  const el = document.getElementById('export-content');
  const text = el.textContent;
  if (!text || el.querySelector('.export-empty')) return;

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  // Don't capture keys if typing in textarea
  if (e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') {
      closeTrim(activeIndex);
      e.target.blur();
    }
    return;
  }

  switch(e.key) {
    case 'ArrowDown':
    case 'j':
      e.preventDefault();
      setActive(activeIndex + 1);
      break;
    case 'ArrowUp':
    case 'k':
      e.preventDefault();
      setActive(activeIndex - 1);
      break;
    case 'n':
    case 'N':
      e.preventDefault();
      decide(activeIndex, 'cut');
      break;
    case 't':
    case 'T':
      e.preventDefault();
      openTrim(activeIndex);
      break;
    case 'y':
    case 'Y':
      e.preventDefault();
      decide(activeIndex, 'keep');
      break;
  }
});

// Init
loadState();
renderCards();
updateStats();
updateExport();
</script>
</body>
</html>
