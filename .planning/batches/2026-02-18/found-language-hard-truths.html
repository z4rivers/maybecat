// Flatten all quotes with section info
let allQuotes = [];
quotes.forEach(section => {
  section.quotes.forEach(q => {
    allQuotes.push({
      ...q,
      sectionName: section.section,
      sectionDesc: section.sectionDesc,
      starred: false
    });
  });
});

// Load starred state from localStorage
const storageKey = 'hard-truths-starred';
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
  allQuotes.forEach((q, i) => {
    if (saved[i]) q.starred = true;
  });
} catch(e) {}

function saveState() {
  const state = {};
  allQuotes.forEach((q, i) => {
    if (q.starred) state[i] = true;
  });
  localStorage.setItem(storageKey, JSON.stringify(state));
}

function render() {
  const container = document.getElementById('cards-container');
  let html = '';
  let currentSection = '';
  let totalCount = 0;
  let starredCount = 0;

  allQuotes.forEach((q, i) => {
    if (q.sectionName !== currentSection) {
      currentSection = q.sectionName;
      html += `<div class="section-header">${currentSection}</div>`;
      html += `<div class="section-desc">${q.sectionDesc}</div>`;
    }

    totalCount++;
    if (q.starred) starredCount++;

    const starClass = q.starred ? 'active' : '';
    const cardClass = q.starred ? 'starred' : '';

    html += `
      <div class="card ${cardClass}" id="card-${i}">
        <button class="star-btn ${starClass}" onclick="toggleStar(${i})">
          ${q.starred ? '&#9733; STARRED' : '&#9734; STAR'}
        </button>
        <div class="quote-text">"${q.text}"</div>
        <div class="quote-source"><strong>Source:</strong> ${q.source}</div>
        <span class="energy-tag energy-${q.energy}">${q.energy.replace(/-/g, ' ')}</span>
      </div>
    `;
  });

  container.innerHTML = html;
  document.getElementById('totalCount').textContent = totalCount;
  document.getElementById('starredCount').textContent = starredCount;

  updateExport();
}

function toggleStar(index) {
  allQuotes[index].starred = !allQuotes[index].starred;
  saveState();
  render();
}

function updateExport() {
  const starred = allQuotes.filter(q => q.starred);
  const exportEl = document.getElementById('exportContent');

  if (starred.length === 0) {
    exportEl.textContent = 'Star items above to see them here.';
    return;
  }

  let output = 'STARRED FOUND LANGUAGE: HARD TRUTHS FRIENDS TELL FRIENDS\n';
  output += '='.repeat(55) + '\n\n';

  starred.forEach((q, i) => {
    output += `${i + 1}. "${q.text}"\n`;
    output += `   Source: ${q.source}\n`;
    output += `   Energy: ${q.energy.replace(/-/g, ' ')}\n\n`;
  });

  exportEl.textContent = output;
}

function copyExport() {
  const text = document.getElementById('exportContent').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'COPIED!';
    setTimeout(() => btn.textContent = 'COPY TO CLIPBOARD', 2000);
  });
}

render();
</script>
