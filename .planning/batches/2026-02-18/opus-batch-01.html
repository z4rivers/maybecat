        <button class="btn btn-keep" id="btn-keep-${item.id}" onclick="decide(${item.id},'kept')">Keep</button>
        <button class="btn btn-cut"  id="btn-cut-${item.id}"  onclick="decide(${item.id},'cut')">Cut</button>
        <button class="btn btn-edit" id="btn-edit-${item.id}" onclick="toggleEdit(${item.id})">Edit</button>
      </div>
      <div class="edit-area" id="edit-area-${item.id}">
        <textarea class="edit-textarea" id="edit-textarea-${item.id}"
          oninput="onEditInput(${item.id})"
          placeholder="Edit response text...">${escapeHtml(item.text)}</textarea>
        <div class="edit-hint">Changes auto-save to JSON export.</div>
      </div>
    </div>`;
}

function buildTheme(theme) {
  const count = theme.items.length;
  const cards = theme.items.map(buildCard).join('');
  return `
    <div class="theme-header">
      <span class="theme-title">${escapeHtml(theme.name)}</span>
      <span class="theme-count">${count}</span>
      <span class="theme-line"></span>
    </div>
    ${cards}`;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

document.getElementById('content').innerHTML = THEMES.map(buildTheme).join('');

// ── DECISIONS ──
function decide(id, state) {
  const item = findItem(id);
  const prev = decisions[id] ? decisions[id].state : null;

  if (prev === state) {
    // Toggle off
    delete decisions[id];
  } else {
    const text = (decisions[id] && decisions[id].state === 'edited')
      ? decisions[id].text
      : item.text;
    decisions[id] = { state, text };
  }

  renderCard(id);
  updateStats();
  updateExport();
}

function toggleEdit(id) {
  const item = findItem(id);
  const prev = decisions[id] ? decisions[id].state : null;
  const editArea = document.getElementById(`edit-area-${id}`);
  const textarea = document.getElementById(`edit-textarea-${id}`);

  if (prev === 'edited') {
    // Close edit — revert to plain kept or nothing
    decisions[id] = { state: 'kept', text: textarea.value.trim() || item.text };
    editArea.classList.remove('visible');
  } else {
    // Open edit
    const currentText = (decisions[id] && decisions[id].text) ? decisions[id].text : item.text;
    textarea.value = currentText;
    decisions[id] = { state: 'edited', text: currentText };
    editArea.classList.add('visible');
  }

  renderCard(id);
  updateStats();
  updateExport();
}

function onEditInput(id) {
  const textarea = document.getElementById(`edit-textarea-${id}`);
  const val = textarea.value;
  if (!decisions[id]) decisions[id] = { state: 'edited', text: val };
  decisions[id].state = 'edited';
  decisions[id].text = val;
  updateStats();
  updateExport();
}

function renderCard(id) {
  const card = document.getElementById(`card-${id}`);
  const d = decisions[id];
  const state = d ? d.state : null;

  card.className = 'card' + (state ? ` state-${state}` : '');

  ['keep','cut','edit'].forEach(action => {
    const btn = document.getElementById(`btn-${action}-${id}`);
    btn.className = `btn btn-${action}`;
    if (state === 'kept'   && action === 'keep') btn.classList.add('active-keep');
    if (state === 'cut'    && action === 'cut')  btn.classList.add('active-cut');
    if (state === 'edited' && action === 'edit') btn.classList.add('active-edit');
  });

  const editArea = document.getElementById(`edit-area-${id}`);
  if (state === 'edited') {
    editArea.classList.add('visible');
  } else if (state !== 'edited') {
    editArea.classList.remove('visible');
  }
}

function findItem(id) {
  for (const theme of THEMES) {
    const item = theme.items.find(i => i.id === id);
    if (item) return item;
  }
  return null;
}

// ── STATS ──
function updateStats() {
  const vals = Object.values(decisions);
  const kept   = vals.filter(d => d.state === 'kept').length;
  const cut    = vals.filter(d => d.state === 'cut').length;
  const edited = vals.filter(d => d.state === 'edited').length;
  const decided = kept + cut + edited;
  const total  = 110;
  const remaining = total - decided;

  document.getElementById('s-kept').textContent      = kept;
  document.getElementById('s-cut').textContent       = cut;
  document.getElementById('s-edited').textContent    = edited;
  document.getElementById('s-remaining').textContent = remaining;

  const pct = Math.round((decided / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── EXPORT ──
function getExportItems() {
  const out = [];
  for (const theme of THEMES) {
    for (const item of theme.items) {
      const d = decisions[item.id];
      if (!d) continue;
      if (d.state === 'cut') continue;
      const text = (d.state === 'edited') ? d.text : item.text;
      out.push({ text, category: item.category });
    }
  }
  return out;
}

function updateExport() {
  const items = getExportItems();
  const box = document.getElementById('json-output');
  const countEl = document.getElementById('export-count');

  countEl.textContent = items.length + ' response' + (items.length !== 1 ? 's' : '');

  if (items.length === 0) {
    box.innerHTML = '<span class="empty-export">// No responses kept or edited yet.</span>';
    return;
  }

  const json = JSON.stringify(items, null, 2);
  box.textContent = json;
}

function copyJSON() {
  const items = getExportItems();
  if (items.length === 0) return;
  const json = JSON.stringify(items, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy JSON';
      btn.classList.remove('copied');
    }, 2000);
  });
}
</script>
</body>
</html>
