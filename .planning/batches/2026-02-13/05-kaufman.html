<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Review: Kaufman Energy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
    padding-top: 120px;
  }
  .sticky-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #16213e;
    padding: 15px 20px;
    z-index: 100;
    border-bottom: 2px solid #0f3460;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .batch-title {
    font-size: 1.3em;
    font-weight: bold;
    color: #fff;
  }
  .batch-subtitle {
    font-size: 0.85em;
    color: #888;
  }
  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.95em;
  }
  .stat-keep { color: #4ecca3; }
  .stat-cut { color: #e94560; }
  .stat-edit { color: #ffd93d; }
  .stat-pending { color: #888; }
  .card {
    background: #16213e;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    border-left: 4px solid #0f3460;
    transition: border-color 0.3s;
  }
  .card.kept { border-left-color: #4ecca3; }
  .card.cut { border-left-color: #e94560; opacity: 0.5; }
  .card.edited { border-left-color: #ffd93d; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .card-number {
    font-size: 0.8em;
    color: #555;
  }
  .card-category {
    font-size: 0.75em;
    padding: 3px 10px;
    border-radius: 12px;
    background: #0f3460;
    color: #aaa;
  }
  .card-text {
    font-size: 1.25em;
    line-height: 1.5;
    margin-bottom: 15px;
    color: #fff;
  }
  .card-text.original-cut {
    text-decoration: line-through;
    opacity: 0.5;
  }
  .edited-text {
    font-size: 1.25em;
    line-height: 1.5;
    color: #ffd93d;
    margin-bottom: 15px;
  }
  .word-count {
    font-size: 0.75em;
    color: #555;
    margin-bottom: 10px;
  }
  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9em;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-keep { background: #4ecca3; color: #1a1a2e; }
  .btn-cut { background: #e94560; color: #fff; }
  .btn-edit { background: #ffd93d; color: #1a1a2e; }
  .btn:hover { transform: scale(1.05); }
  .btn.active { box-shadow: 0 0 0 3px #fff; }
  .edit-area {
    display: none;
    margin-top: 12px;
  }
  .edit-area.visible {
    display: block;
  }
  .edit-area textarea {
    width: 100%;
    background: #0f3460;
    color: #ffd93d;
    border: 1px solid #ffd93d;
    border-radius: 6px;
    padding: 10px;
    font-size: 1.1em;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }
  .edit-area .btn-save {
    margin-top: 8px;
    background: #ffd93d;
    color: #1a1a2e;
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  .export-section {
    margin-top: 40px;
    background: #16213e;
    border-radius: 10px;
    padding: 20px;
  }
  .export-section h2 {
    margin-bottom: 15px;
    color: #4ecca3;
  }
  .export-section textarea {
    width: 100%;
    min-height: 300px;
    background: #0f3460;
    color: #4ecca3;
    border: 1px solid #4ecca3;
    border-radius: 6px;
    padding: 15px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85em;
    resize: vertical;
  }
  .copy-btn {
    margin-top: 10px;
    background: #4ecca3;
    color: #1a1a2e;
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 1em;
  }
  .copy-btn:hover { transform: scale(1.02); }
  .voice-tag {
    font-size: 0.7em;
    color: #666;
    margin-left: 8px;
  }
</style>
</head>
<body>

<div class="sticky-header">
  <div>
    <div class="batch-title">Batch: Kaufman Energy</div>
    <div class="batch-subtitle">Andy Kaufman performance philosophy relocated through cat voice &mdash; 40 responses</div>
  </div>
  <div class="stats">
    <span class="stat-keep">Keep: <strong id="keepCount">0</strong></span>
    <span class="stat-cut">Cut: <strong id="cutCount">0</strong></span>
    <span class="stat-edit">Edit: <strong id="editCount">0</strong></span>
    <span class="stat-pending">Pending: <strong id="pendingCount">40</strong></span>
  </div>
</div>

<div id="cards"></div>

<div class="export-section">
  <h2>Export JSON (kept + edited only)</h2>
  <textarea id="exportArea" readonly></textarea>
  <br>
  <button class="copy-btn" onclick="copyExport()">Copy to Clipboard</button>
</div>

<script>
const responses = [
  // --- COMMITTED TO THE BIT (the cat will not break character) ---
  {
    text: "This is not a bit. *maintains exact same expression*",
    category: "chaotic",
    voice: "Chaos Cat",
    note: "The Kaufman move: deny the performance while performing. The asterisk action IS the tell."
  },
  {
    text: "I'm going to give you the truth whether you want it or not.",
    category: "demanding",
    voice: "Badass Cat",
    note: "Relocated from 'I'm going to give you culture, whether you want it or not.' The Great Gatsby reading as life advice."
  },
  {
    text: "*reads your question aloud in a British accent*",
    category: "chaotic",
    voice: "Chaos Cat",
    note: "Direct relocation of the Great Gatsby reading bit. The absurdity of treating the question with theatrical reverence."
  },
  {
    text: "I started this and I will finish it. Even if nobody's watching.",
    category: "wise",
    voice: "Competitive Cat",
    note: "99 Bottles energy — the commitment that outlasts the audience. Works as permission to keep going."
  },

  // --- IS THIS REAL? (you never know with the cat) ---
  {
    text: "That was a test. You passed. Or failed. I'm not saying.",
    category: "meta",
    voice: "Prophet Cat",
    note: "The Kaufman paradox: was it real? You'll never know. Works as answer to anything."
  },
  {
    text: "Everything I just said was true. Including the parts that weren't.",
    category: "mystical",
    voice: "Conspiracy Cat",
    note: "The is-it-real engine. Both readings work simultaneously."
  },
  {
    text: "*stares at you with complete sincerity* I'm kidding. Or not.",
    category: "chaotic",
    voice: "Doubt Cat",
    note: "Sweet then pulls the rug. The Foreign Man energy — you can't tell which layer is real."
  },
  {
    text: "What's real? What's not? *slow blink* Next question.",
    category: "meta",
    voice: "Chaos Cat",
    note: "Direct Kaufman quote relocated — 'What's real? What's not? That's what I do.' The slow blink IS the maybe."
  },
  {
    text: "I planned that. *licks paw* All of it.",
    category: "cold",
    voice: "Competitive Cat",
    note: "The Fridays incident — was it staged? The cat claiming credit for chaos."
  },

  // --- SWEET THEN TERRIFYING (Foreign Man into Elvis) ---
  {
    text: "*purrs softly* Now. Where were we.",
    category: "cold",
    voice: "Feral Cat",
    note: "The Foreign Man/Elvis switch. Gentle sound, menacing turn. The period instead of question mark is deliberate."
  },
  {
    text: "I was being nice. That part is over.",
    category: "cold",
    voice: "Badass Cat",
    note: "Foreign Man drops the accent. The sweetness was a setup. You're in the real conversation now."
  },
  {
    text: "Oh, you thought I was gentle? *ears flatten* Continue.",
    category: "cold",
    voice: "Dark Comedian Cat",
    note: "The reveal of hidden competence/danger behind softness. Ears flatten = you already know."
  },
  {
    text: "*kneads your chest* I could stop anytime. *doesn't stop*",
    category: "chaotic",
    voice: "Contradiction Cat",
    note: "The 99 Bottles energy — the thing you can't tell if it's comfort or threat. Commitment past the breaking point."
  },
  {
    text: "T'ank you veddy much.",
    category: "chaotic",
    voice: "Chaos Cat",
    note: "Foreign Man's signature line. Out of context it reads as oddly sweet, slightly menacing gratitude. The misspelling IS the voice."
  },

  // --- HIDDEN COMPETENCE (the cat seems dumb then brilliant) ---
  {
    text: "*falls off table* That was the first move.",
    category: "chaotic",
    voice: "Competitive Cat",
    note: "The terrible impressions before the Elvis reveal. What looked like failure was choreography."
  },
  {
    text: "You underestimated me. That was the plan.",
    category: "cold",
    voice: "Badass Cat",
    note: "Foreign Man energy — the meekness was strategic. Every cat owner has experienced this."
  },
  {
    text: "I've been watching you for longer than you think.",
    category: "mystical",
    voice: "Prophet Cat",
    note: "The 4-year-old performing to the wall. The audience doesn't know it's being studied."
  },
  {
    text: "*does something extraordinary* What? I do that.",
    category: "cold",
    voice: "Unimpressed Cat",
    note: "Elvis erupts from Foreign Man. The cat lands perfectly from an impossible height and acts like it's nothing."
  },
  {
    text: "I'm not the one on trial here.",
    category: "cold",
    voice: "Badass Cat",
    note: "Kaufman to Lawler, to Letterman, to everyone. The flip from defensive to offensive."
  },

  // --- THE ULTIMATE MAYBE (is the cat serious? nobody knows) ---
  {
    text: "Won't they be surprised.",
    category: "mystical",
    voice: "Prophet Cat",
    note: "From 'Won't people hate me when they find out I'm still alive?' Relocated into pure forward-looking menace/promise."
  },
  {
    text: "I'll come back. Or I won't. Either way, think of me.",
    category: "mystical",
    voice: "Old Soul Cat",
    note: "The death hoax as cat energy — leaving the room and making you wonder. The appointment was never for your benefit."
  },
  {
    text: "The appointment was never for your benefit.",
    category: "cold",
    voice: "Reluctant Therapist Cat",
    note: "Relocated from the Christmas Eve 1999 essay. Michael went to the restaurant. Andy didn't show. That's the answer."
  },
  {
    text: "Maybe I'm still here. Maybe I left hours ago.",
    category: "meta",
    voice: "Doubt Cat",
    note: "Is Andy alive? Is the cat in the room? The ultimate maybe — the answer to every question."
  },
  {
    text: "I wrote instructions. You won't follow them.",
    category: "cold",
    voice: "Prophet Cat",
    note: "The essay with instructions to meet him at a restaurant. Knowing the instructions will be found but not obeyed — or obeyed but the meeting won't happen."
  },

  // --- REFUSAL TO EXPLAIN (the cat owes you nothing) ---
  {
    text: "I never confirmed anything. I never denied anything.",
    category: "cold",
    voice: "Feral Cat",
    note: "Kaufman never confirmed Fridays was staged. Never acknowledged being Clifton. The perfect non-answer."
  },
  {
    text: "You want the real answer or the one I'm giving you?",
    category: "meta",
    voice: "Reluctant Therapist Cat",
    note: "The Kaufman fork — there's always two layers and you don't get to pick which one is real."
  },
  {
    text: "If I told you it was a joke, would that help? *doesn't tell you*",
    category: "chaotic",
    voice: "Dark Comedian Cat",
    note: "The Kaufman refusal — offering the possibility of comfort, then withholding it."
  },
  {
    text: "I don't break character. This IS my character.",
    category: "meta",
    voice: "Chaos Cat",
    note: "Tony Clifton was never acknowledged as Kaufman. The cat is always the cat — there's nothing underneath."
  },
  {
    text: "*stares at wall for 45 minutes* Anyway. Yes.",
    category: "chaotic",
    voice: "Sleepy Cat",
    note: "The Great Gatsby reading — committed stillness that outlasts your patience, then a casual answer as if nothing happened."
  },

  // --- TESTING REALITY (pushing to see what happens) ---
  {
    text: "I wonder what would happen if I just did it.",
    category: "chaotic",
    voice: "Chaos Cat",
    note: "Direct relocation of 'I wonder what would happen if you just hauled off and slugged me?' — the Lawler whisper. Pure impulse."
  },
  {
    text: "They said I was too dangerous. They were right.",
    category: "cold",
    voice: "Feral Cat",
    note: "From 'Every time my manager approached big network executives, they told him I was too dangerous.' Relocated as cat confidence."
  },
  {
    text: "I just want to see what you do next.",
    category: "meta",
    voice: "Reluctant Therapist Cat",
    note: "From 'I just want real reactions. I want people to laugh from the gut, be sad from the gut.' The cat as audience to YOUR performance."
  },
  {
    text: "That was never about you. It was about what you'd do.",
    category: "wise",
    voice: "Pensive Cat",
    note: "Kaufman testing reality — the experiment was always the human's reaction, not the performance."
  },
  {
    text: "Vote if you want. I already know the answer.",
    category: "cold",
    voice: "Competitive Cat",
    note: "The SNL vote-off. 195,544 voted to dump Andy. He and Ebersol planned the whole thing. The vote was the show."
  },

  // --- PERFORMING FOR AN AUDIENCE OF ONE (the wall) ---
  {
    text: "The show started before you sat down.",
    category: "mystical",
    voice: "Prophet Cat",
    note: "The 4-year-old broadcasting to the wall. The performance doesn't need the audience — the audience arrived late."
  },
  {
    text: "I wasn't waiting for you. You arrived during something.",
    category: "cold",
    voice: "Feral Cat",
    note: "Kaufman performing to his bedroom wall at age 4. The cat's life was already in progress when you showed up."
  },
  {
    text: "It's not the thing. It's the story about the thing.",
    category: "wise",
    voice: "Reluctant Therapist Cat",
    note: "Alex Braverman on Kaufman: 'It's not the thing, it's the story about the thing.' Works as advice about literally anything someone is going through."
  },

  // --- THE SWEET UNDERNEATH (serenity and chaos in the same body) ---
  {
    text: "I never left an audience as I found it.",
    category: "wise",
    voice: "Dark Comedian Cat",
    note: "Frieze on Kaufman, relocated. Works as a cat's mission statement AND as life advice: you shouldn't leave things as you found them either."
  },
  {
    text: "I'm not trying to be funny. I'm trying to play with your head.",
    category: "meta",
    voice: "Chaos Cat",
    note: "From 'I'm not trying to be funny. I just want to play with their heads.' The cat confessing its real purpose."
  },
  {
    text: "He knew how to fail and when. That takes everything.",
    category: "wise",
    voice: "Old Soul Cat",
    note: "Frieze: 'He knew how to bomb and when.' Relocated as advice — knowing when to let something fail is mastery."
  }
];

const decisions = new Array(responses.length).fill(null);
const editedTexts = new Array(responses.length).fill(null);

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  responses.forEach((r, i) => {
    const wordCount = r.text.replace(/\*[^*]+\*/g, '').trim().split(/\s+/).length;
    const card = document.createElement('div');
    card.className = 'card' + (decisions[i] === 'keep' ? ' kept' : decisions[i] === 'cut' ? ' cut' : decisions[i] === 'edit' ? ' edited' : '');
    card.id = 'card-' + i;
    card.innerHTML = `
      <div class="card-header">
        <span class="card-number">#${i + 1}</span>
        <span><span class="card-category">${r.category}</span><span class="voice-tag">${r.voice}</span></span>
      </div>
      <div class="card-text ${editedTexts[i] ? 'original-cut' : ''}">${r.text}</div>
      ${editedTexts[i] ? '<div class="edited-text">' + editedTexts[i] + '</div>' : ''}
      <div class="word-count">${wordCount} words</div>
      <div class="buttons">
        <button class="btn btn-keep ${decisions[i] === 'keep' ? 'active' : ''}" onclick="decide(${i}, 'keep')">KEEP</button>
        <button class="btn btn-cut ${decisions[i] === 'cut' ? 'active' : ''}" onclick="decide(${i}, 'cut')">CUT</button>
        <button class="btn btn-edit ${decisions[i] === 'edit' ? 'active' : ''}" onclick="toggleEdit(${i})">EDIT</button>
      </div>
      <div class="edit-area" id="edit-area-${i}">
        <textarea id="edit-text-${i}">${editedTexts[i] || r.text}</textarea>
        <button class="btn-save" onclick="saveEdit(${i})">Save Edit</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function decide(i, decision) {
  if (decisions[i] === decision) {
    decisions[i] = null;
  } else {
    decisions[i] = decision;
  }
  updateStats();
  renderCards();
  updateExport();
}

function toggleEdit(i) {
  const area = document.getElementById('edit-area-' + i);
  if (area) {
    area.classList.toggle('visible');
  }
}

function saveEdit(i) {
  const textarea = document.getElementById('edit-text-' + i);
  if (textarea && textarea.value.trim() !== responses[i].text) {
    editedTexts[i] = textarea.value.trim();
    decisions[i] = 'edit';
  }
  updateStats();
  renderCards();
  updateExport();
}

function updateStats() {
  let keep = 0, cut = 0, edit = 0;
  decisions.forEach(d => {
    if (d === 'keep') keep++;
    else if (d === 'cut') cut++;
    else if (d === 'edit') edit++;
  });
  document.getElementById('keepCount').textContent = keep;
  document.getElementById('cutCount').textContent = cut;
  document.getElementById('editCount').textContent = edit;
  document.getElementById('pendingCount').textContent = responses.length - keep - cut - edit;
}

function updateExport() {
  const exported = [];
  responses.forEach((r, i) => {
    if (decisions[i] === 'keep') {
      exported.push({ text: r.text, category: r.category });
    } else if (decisions[i] === 'edit' && editedTexts[i]) {
      exported.push({ text: editedTexts[i], category: r.category });
    }
  });
  document.getElementById('exportArea').value = JSON.stringify(exported, null, 2);
}

function copyExport() {
  const area = document.getElementById('exportArea');
  area.select();
  document.execCommand('copy');
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
}

renderCards();
updateStats();
updateExport();
</script>

</body>
</html>
